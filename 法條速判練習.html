  {a:"貪污治罪條例§6Ⅰ③", q:"消防局承辦人A職務上代為保管廠商送驗之私有消防器材樣品，於驗收流程結束後，竟將其中數件高單價樣品占為己有，並私下變賣得款。", problem:"問：A將職務上保管之廠商送驗樣品占為己有並變賣之行為該當何罪？", body:"依貪污治罪條例§6Ⅰ③，竊取或侵占職務上持有之非公用私有器材、財物者，處五年以上有期徒刑，得併科新臺幣三千萬元以下罰金，本款所規範之客體為非公用私有之器材財物，與§4Ⅰ①所規範公用或公有財物之客體有本質區別，前者係指雖非機關公有或供公務使用，然因公務員職務上之緣故而合法持有保管之私人所有財物，例如扣押物、送驗樣品等，行為人利用其職務上持有保管之機會，將該等私有財物竊取或侵占入己，即該當本款；構成要件核心在於職務上持有與非公用私有兩項要素之結合，缺一即應改論其他條款或普通刑法罪名。本案消防局承辦人A職務上代為保管廠商送驗之私有消防器材樣品，該等樣品性質上屬廠商所有之私有財物，僅因送驗程序而暫由A職務上持有保管，並非消防局公有或公用之財物，核與本款職務上持有之非公用私有器材、財物要件相符；A於驗收流程結束後，竟將其中數件高單價樣品占為己有，此一將自己持有他人之物變易為所有之意思予以侵占之行為，並私下變賣得款，益證其確有不法所有意圖，核與§6Ⅰ③侵占要件完全相符，應論以本款之罪。此與§4Ⅰ①竊取侵占公用或公有財物罪之區辨，關鍵即在於財物之所有權歸屬。\n\n結語：A利用職務上持有保管之機會，將廠商送驗之私有樣品占為己有並變賣，該當貪污治罪條例§6Ⅰ③竊取或侵占職務上持有非公用私有財物罪。"},
  {a:"貪污治罪條例§11Ⅳ", q:"一般民眾A（不具公務員身分）為使親友之工程順利驗收，代為向承辦公務員B行求交付賄賂。", problem:"問：不具公務員身分之民眾A代為行求賄賂是否成立行賄罪？", body:"依貪污治罪條例§11Ⅳ，不具第2條人員之身分而犯前三項之罪者，亦同，此一規定明文將行賄罪之處罰主體擴及不具公務員身分之一般人民，蓋行賄罪本質上原即以非公務員之相對人向公務員行求、期約或交付賄賂為典型構成方式，行賄者通常本非公務員，故本項特別澄清，縱行為人不具貪污治罪條例第2條所定公務員身分，亦不影響其成立§11Ⅰ至Ⅲ各項行賄罪之可能，避免有論者誤認行賄罪僅公務員間或具特定身分者始能成立。本案A為一般民眾，不具公務員身分，其為使親友之工程順利驗收，代為向承辦公務員B行求交付賄賂，此一行求賄賂之行為態樣，依其行求內容究係要求B為違背職務之行為，或僅要求B加速或從優辦理原應通過之驗收，而分別適用§11Ⅰ或§11Ⅱ之規定，惟不論適用何款，因A不具公務員身分，依§11Ⅳ規定，仍應同依前三項規定處斷，不因其欠缺公務員身分而免責或改論較輕之其他罪名，其行求賄賂之行為一經提出即屬既遂，不以B是否收受、亦不以親友之工程是否果真驗收通過為必要。又倘A之行求行為經查明尚未及交付、B亦未收受，A仍成立行求賄賂罪之既遂，蓋行求本身即係獨立之既遂行為態樣。\n\n結語：民眾A雖不具公務員身分，依貪污治罪條例§11Ⅳ規定，其代為行求賄賂之行為仍應依§11Ⅰ或Ⅱ規定論以行賄罪，不因欠缺公務員身分而免責。"},
  {a:"刑法§122Ⅲ、貪污治罪條例§11Ⅰ", q:"廠商負責人A、C分別向不同機關之承辦人員行求交付賄賂，要求違背職務違法核准案件；其中承辦人員B具貪污治罪條例第2條所定公務員身分，另一承辦人員D則不具該特別身分要件。", problem:"問：A、C向B、D行求賄賂之行為應各適用何一法條？", body:"就行賄罪之法律適用而言，須先確認收賄之相對人是否具備貪污治罪條例第2條所定公務員身分，此一身分判斷直接決定行賄者應適用貪污治罪條例或刑法之相關規定。依貪污治罪條例§11Ⅰ，對於第2條人員，關於違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金，此為貪污治罪條例對違背職務行賄罪之特別規定，適用對象限於行賄相對人具備該條例第2條所定公務員身分者；而依刑法§122Ⅲ，對於公務員或仲裁人關於違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處三年以下有期徒刑，得併科三十萬元以下罰金，此為刑法上違背職務行賄罪之基礎規定，於相對人雖具刑法上公務員身分，惟不具貪污治罪條例第2條之特別身分要件時，即應回歸適用此一較輕之刑法規定，二者之刑度差距甚鉅。本案廠商負責人A向具貪污治罪條例第2條所定公務員身分之承辦人員B行求交付賄賂，要求B違背職務違法核准案件，應依貪污治罪條例§11Ⅰ論以違背職務行賄罪；廠商負責人C則向不具該特別身分要件之承辦人員D行求交付賄賂，要求D違背職務違法核准案件，因D非屬貪污治罪條例第2條之公務員，應改依刑法§122Ⅲ論以違背職務行賄罪，二者刑度明顯有別。\n\n結語：A對具特別身分之B行求賄賂，應論以貪污治罪條例§11Ⅰ；C對不具該身分之D行求賄賂，則應論以刑度較輕之刑法§122Ⅲ，二者依相對人身分而分別適用不同法條。"},
  {a:"貪污治罪條例§4Ⅰ④", q:"公用貨運單位承辦人員A明知某批以公務名義申請通關之貨物內夾帶違禁物品，仍協助以公用運輸工具裝運進出，未依規定查驗及舉發。", problem:"問：A明知貨物夾帶違禁品仍協助裝運通關之行為該當何罪？", body:"依貪污治罪條例§4Ⅰ④，以公用運輸工具裝運違禁物品或漏稅物品者，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，本款構成要件為行為人須利用其職務上得支配運用之公用運輸工具，裝運違禁物品或漏稅物品，其規範重點在於防止公務員憑藉其掌控公用運輸工具之職務地位，淪為不法物品流通之管道，此一行為本身即具高度公共危險性及對公務廉潔性之嚴重侵害，故列為貪污治罪條例中刑度最重之§4所規範之行為態樣之一。本案公用貨運單位承辦人員A明知某批以公務名義申請通關之貨物內夾帶違禁物品，其主觀上已具備明知之直接故意，客觀上仍協助以公用運輸工具裝運進出，且未依規定查驗及舉發，此一未依規定查驗舉發之消極不作為，正足以印證A明知違禁物品夾藏其中卻仍配合放行之積極作為，二者結合，A之行為完全該當§4Ⅰ④以公用運輸工具裝運違禁物品之構成要件。又依§4Ⅱ，第一項第一款至第四款之未遂犯罰之，本款既在未遂處罰範圍之內，倘A僅已著手協助裝運而尚未完成通關進出程序，仍應論以未遂犯，惟本案A已完成裝運進出之行為，應論以既遂犯，依§4Ⅰ④之法定刑處斷。\n\n結語：A明知貨物夾帶違禁物品仍協助以公用運輸工具裝運通關，該當貪污治罪條例§4Ⅰ④以公用運輸工具裝運違禁物品罪，處無期徒刑或十年以上有期徒刑。"},
  {a:"刑法§130", q:"工務課課長A及堤防維護人員B明知轄內堤防年久失修、防洪功能不佳，仍不予理會，未於颱風季來臨前積極檢修，致颱風豪雨來襲時潰堤，造成嚴重淹水及財產損失。", problem:"問：A、B對堤防年久失修不予理會致潰堤之行為該當何罪？", body:"依刑法§130，公務員廢弛職務釀成災害者，處三年以上十年以下有期徒刑，此為廢弛職務釀災罪，其構成要件為行為人須具公務員身分、對其職務上應執行之事務消極廢弛不為、且因該廢弛職務之不作為而釀成災害，行為與結果間須具相當因果關係；本罪最重要之考點在於其限於故意犯，亦即公務員須明知怠於執行職務將致生災害之風險，卻仍消極不予理會，若行為人僅係單純疏忽未注意、未預見有致災之可能，性質上屬過失而非故意，因本罪並未如刑法§132般設有過失犯之處罰規定，僅能論以行政責任，不構成本罪，此一明知卻不予為意與單純過失疏忽未察覺之區辨，係本罪成立與否之核心關鍵。本案工務課課長A及堤防維護人員B均為負責堤防維護管理職務之公務員，二人明知轄內堤防年久失修、防洪功能不佳，此已足證其主觀上對於潛在災害風險具有認識，卻仍不予理會，未於颱風季來臨前積極檢修，此一消極不作為核屬故意廢弛職務，其後颱風豪雨來襲時果因堤防年久失修而潰堤，造成嚴重淹水及財產損失，二人廢弛職務之不作為與潰堤致災之結果間具相當因果關係，核與§130構成要件完全相符，A、B應共同或分別論以本罪。\n\n結語：A、B明知堤防年久失修有致災之虞仍消極不予理會，因而釀成潰堤淹水災害，均該當刑法§130廢弛職務釀成災害罪，處三年以上十年以下有期徒刑。"},
  {a:"貪污治罪條例§15、§6Ⅰ④", q:"公務員A違背招標程序圖利友人B經營之公司，B明知該筆生意係A違法圖利所生之不法利益，仍收受該筆業務並支付「感謝費」予A之親友C，C明知該款項來源不法仍予以收受。", problem:"問：A、B、C三人之行為應各如何論罪？", body:"依貪污治罪條例§6Ⅰ④，對於主管或監督之事務，明知違背法令，直接或間接圖自己或其他私人不法利益，因而獲得利益者，處五年以上有期徒刑，本案公務員A違背招標程序，明知違背法令仍圖利友人B經營之公司，使B公司因而獲得承攬業務之不法利益，核與本款主管圖利罪之構成要件相符，A應論以本罪；B身為受圖利之對象，其收受該筆業務並支付感謝費予A之親友C，因其明知該筆生意係A違法圖利所生之不法利益仍予收受，惟依題示情節並無事前與A犯意聯絡、共同計畫圖利之情事，尚難逕論以圖利罪之共犯，其單純受領不法利益之行為，本身尚非貪污治罪條例所另設之獨立罪名。至於C部分，依貪污治罪條例§15，明知因犯第四條至第六條之罪所得之財物，故為收受、搬運、隱匿、寄藏或故買者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金，此為貪污贓物罪，處罰明知係貪污犯罪所得財物仍予收受寄藏等行為之人，不限於公務員始能觸犯。本案C明知所收受之感謝費款項來源，係B因受A違法圖利所生不法利益中撥付之對價，屬因犯§6Ⅰ④之罪所得之財物，C明知此情仍予收受，核與§15貪污贓物罪之構成要件相符，應論以本罪，其罪責與A、B之圖利犯行各自獨立。\n\n結語：A成立貪污治罪條例§6Ⅰ④主管圖利罪；C明知感謝費款項係貪污犯罪所得仍予收受，另成立§15貪污贓物罪，三人罪責各自獨立分論。"},
  {a:"貪污治罪條例§6Ⅰ②", q:"某社區發展協會理事長A身兼公務員身分，於協會辦理防災物資募款活動時，利用職務之便，將部分募得之款項未依用途使用，從中舞弊侵吞。", problem:"問：A利用職務之便將募款款項挪作他用之行為該當何罪？", body:"依貪污治罪條例§6Ⅰ②，募集款項或徵用土地、財物，從中舞弊者，處五年以上有期徒刑，得併科新臺幣三千萬元以下罰金，本款構成要件為行為人須有募集款項或徵用土地財物之職務或機會，並於募集或徵用過程中從中舞弊，所謂舞弊，泛指一切違背募集或徵用款項財物本旨、藉機圖利自己或他人之不正當行為，其態樣不以侵占入己為限，尚包括虛報數額、挪用移作他用、中飽私囊等各種變相取利行為，凡與募集徵用之公務目的產生本質性之偏離，即該當本款所稱之舞弊。本案A身兼公務員身分，於協會辦理防災物資募款活動時，此屬其身分或職務所生募集款項之機會；A利用職務之便，將部分募得之款項未依用途使用，從中舞弊侵吞，此一未依用途使用、從中舞弊侵吞之行為，正是本款所欲規範之核心態樣，蓋防災物資募款款項本應依募款目的全數用於防災物資之購置或發放，A卻將部分款項挪作他用甚至侵吞入己，已使該款項之運用背離募集本旨，核與§6Ⅰ②募集款項從中舞弊之構成要件完全相符，應論以本款之罪。應注意者，若A另有明確之侵占入己意思而非僅係挪用舞弊，實務上仍應以本款募集舞弊罪為優先適用，蓋本款已涵蓋侵占之態樣於其中，無庸另論其他罪名。\n\n結語：A利用其身兼公務員身分辦理防災物資募款之機會，將款項未依用途使用而從中舞弊侵吞，該當貪污治罪條例§6Ⅰ②募集款項從中舞弊罪，處五年以上有期徒刑。"},
  {a:"刑法§131", q:"某公務員A對於主管事務，明知違背法令，圖利特定對象並使其獲得利益，惟A所屬機關性質特殊，該行為並不符合貪污治罪條例特別法之全部構成要件。", problem:"問：A所屬機關性質特殊致不符貪污治罪條例要件時應如何論罪？", body:"依刑法§131，公務員對於主管或監督之事務，明知違背法令，直接或間接圖自己或他人不法利益，因而獲得利益者，處一年以上七年以下有期徒刑，得併科一百萬元以下罰金，此為刑法上圖利罪之基礎規定，其構成要件與貪污治罪條例§6Ⅰ④主管圖利罪大致相同，均須具備明知違背法令、圖自己或他人不法利益、因而獲得利益三項要素，二者屬普通法與特別法之關係，實務上若行為人同時該當貪污治罪條例之要件，依特別法優於普通法原則，應優先適用貪污治罪條例§6Ⅰ④，五年以上，刑度較重，僅於行為人不符合貪污治罪條例特別法所要求之全部構成要件時，始退而適用刑法本條之基礎規定，一年以上七年以下，刑度較輕。本案某公務員A對於主管事務，明知違背法令，圖利特定對象並使其獲得利益，其行為態樣本身已具備圖利罪之核心構成要件；惟依題示，A所屬機關性質特殊，致該行為並不符合貪污治罪條例特別法之全部構成要件，例如可能欠缺該條例特別規範所要求之特定身分或事務範圍要件，此時即不能牽強適用貪污治罪條例之加重規定，而應回歸適用刑法§131作為圖利行為之基礎規範，A之行為核與本條各項構成要件相符，應論以刑法§131圖利罪。\n\n結語：A雖有明知違背法令圖利特定對象之行為，惟因不符貪污治罪條例特別法之全部要件，應逕依刑法§131圖利罪之基礎規定論處，刑度較貪污治罪條例為輕。"},
  {a:"貪污治罪條例§4Ⅰ⑤", q:"移民署科員A收受外籍人士家屬交付之現金50萬元後，明知該外籍人士已逾期居留、依法應予查處遣返，卻故意不予舉發，並利用職務之便偽造訪談紀錄，記載其已合法補件，放行其自行出境。", problem:"問：移民署科員A收賄放行逾期居留外籍人士之行為該當何罪？", body:"依貪污治罪條例§4Ⅰ⑤，對於違背職務之行為，要求、期約或收受賄賂或其他不正利益者，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，本款構成要件核心在於公務員針對違背職務之行為收受賄賂，本案A為移民署科員，其法定職務本應對逾期居留之外籍人士依法查處遣返，A卻收受該外籍人士家屬交付之現金50萬元後，明知依法應予查處遣返，故意不予舉發，此一應為而不為之消極不作為，核屬違背職務之典型型態，與收受賄賂之對價關係明確，已完全該當§4Ⅰ⑤之構成要件，應論以違背職務收受賄賂罪。又A利用職務之便偽造訪談紀錄，記載其已合法補件，此一在職務上所掌之公文書登載不實之行為，另涉刑法§213，公務員明知為不實之事項，而登載於其職務上所掌之公文書，足以生損害於公眾或他人者，處一年以上七年以下有期徒刑，此罪保護法益為公文書之公共信用，與圖利、收賄罪保護公務廉潔性及國家財產之法益不同，二者應分別評價、數罪併罰，不能因收賄罪已成立即忽略登載不實文書罪之另行成立。A之收賄違背職務行為與登載不實文書行為，雖時空密接、目的一貫，惟行為態樣可分，應分論併罰。\n\n結語：A成立貪污治罪條例§4Ⅰ⑤違背職務收受賄賂罪，另因偽造訪談紀錄成立刑法§213登載不實文書罪，二罪保護法益不同，應分別論罪、數罪併罰。"},
  {a:"貪污治罪條例§14", q:"警局督察A查知局長B洩漏臨檢訊息、包庇酒店業者違規營業，A身為負責犯罪調查之督察人員，因擔心舉發B會影響自己升遷，隱匿不向上陳報。", problem:"問：A之行為該當何罪？", body:"貪污治罪條例§14規定：「有調查、追訴或審判職務之人員，明知貪污瀆職犯罪事實而予以包庇或不為舉發者」，依其所包庇或不為舉發之貪污瀆職各罪之刑度分別加重其刑至二分之一，此係就特定身分人員課予積極舉發義務之特別規定。本案A身為警局督察，依其職掌內容屬「有調查職務之人員」，對於其他人員涉犯貪污瀆職犯罪具有調查及陳報之法定職責。A業已查知局長B涉有洩漏臨檢訊息、包庇酒店業者違規營業等貪污瀆職犯罪事實，主觀上已具備明知要件；A卻因憂心舉發B將影響自身升遷，選擇隱匿不向上級機關陳報，核屬明知犯罪事實而消極不予舉發之不作為，此與B本身直接實施包庇酒店業者之違法行為性質有別，A係就他人（B）之貪污瀆職行為另負「不為舉發」之特別身分犯責任，二人應分別論罪。又A身為督察人員知情不報，倘其消極縱容行為對B之貪污瀆職行為續行發生實質助益，情節重大時，實務上尚應審酌是否有另涉共犯或幫助犯之可能，惟本案題示僅止於單純隱匿不報，應僅論以§14不為舉發罪為已足。\n\n結語：A成立貪污治罪條例§14不為舉發罪，應依B所涉貪污瀆職各罪之法定刑度分別加重其刑至二分之一論處。"},
  {a:"刑法§132Ⅲ", q:"外聘之採購稽核委員C（非公務員身分）因參與審查而知悉某工程底價，故意將該底價洩漏予其友人所經營之廠商。", problem:"問：非公務員身分之採購稽核委員C洩漏底價之行為該當何罪？", body:"依刑法§132Ⅲ，非公務員因職務或業務知悉或持有第一項之文書、圖畫、消息或物品，而洩漏或交付之者，處一年以下有期徒刑、拘役或九千元以下罰金，此為第132條洩密罪體系中專門處理非公務員洩密之特別規定，其構成要件為行為人本身不具公務員身分，惟因參與特定職務或業務而知悉或持有應秘密之公務文書、消息或物品，其後故意洩漏或交付予他人者，即該當本項，此一規定將洩密罪之處罰主體由公務員本身擴及因職務業務接觸機密之外部人員，避免公務機密因委外辦理或外聘專業人士參與而形成保護漏洞；惟應特別注意者，本項僅處罰故意洩漏之非公務員，並未如§132Ⅱ就公務員本人另設過失犯之處罰規定，故非公務員縱因過失不慎洩漏，亦不成立本罪。本案C為外聘之採購稽核委員，其本身不具公務員身分，惟因參與審查而知悉某工程底價，此一底價依§132Ⅰ之意旨核屬國防以外應秘密之消息，C明知該底價應予保密，卻故意將該底價洩漏予其友人所經營之廠商，其主觀上具備洩漏之故意，客觀上亦有洩漏行為，核與§132Ⅲ非公務員因職務或業務知悉持有應秘密消息而故意洩漏之構成要件完全相符，應論以本項之罪。\n\n結語：C雖不具公務員身分，惟因參與審查職務知悉工程底價，故意洩漏予友人廠商，該當刑法§132Ⅲ非公務員洩密罪，處一年以下有期徒刑、拘役或罰金。"},
  {a:"刑法§318", q:"承辦人員A因職務知悉某廠商申請專利過程中提出之工商機密技術資料，無故將該資料洩漏予競爭同業。", problem:"問：A將職務上知悉之廠商工商機密洩漏予競爭同業之行為該當何罪？", body:"依刑法§318，公務員或曾任公務員之人，無故洩漏因職務知悉或持有他人之工商秘密者，處二年以下有期徒刑、拘役或六萬元以下罰金，此罪與同法§132洩密罪保護之法益並不相同，§132保護的是國防以外之公務機密，即機關內部之行政秘密，而§318保護的則是公務員因執行職務而接觸到之他人民間工商秘密，例如廠商提交之配方、專利技術規格、成本明細等營業機密，二者規範對象及保護客體均有本質區別，本罪亦不在刑法瀆職罪章第4章，而係規定於妨害秘密罪章，惟因與公務員執行職務密切相關，仍屬本科目應予掌握之條文；本罪之構成要件為行為人須具公務員或曾任公務員身分、因職務知悉或持有他人工商秘密、且無正當理由而洩漏之，其中曾任公務員亦在處罰範圍，縱行為人已離職退休，仍可能因洩漏任職期間因職務知悉之工商秘密而成立本罪。本案A為承辦人員，因職務知悉某廠商申請專利過程中提出之工商機密技術資料，此一技術資料核屬該廠商之工商秘密，A無故將該資料洩漏予競爭同業，使該廠商之營業秘密外流予競爭對手，其行為核與§318公務員無故洩漏因職務知悉之工商秘密構成要件完全相符，應論以本罪。\n\n結語：A將職務上知悉之廠商專利技術工商秘密無故洩漏予競爭同業，該當刑法§318洩漏工商秘密罪，處二年以下有期徒刑、拘役或罰金。"},
  {a:"刑法§122Ⅱ", q:"某公務員A對於應依法審核駁回之申請案，向申請人要求給付對價，於收受對價後，果真違背應予駁回之法定義務，逕行核准該申請案。", problem:"問：A收受對價後果真違法核准申請案之行為該當何罪？", body:"依刑法§122Ⅰ，公務員或仲裁人對於違背職務之行為，要求、期約或收受賄賂或其他不正利益者，處三年以上十年以下有期徒刑，此為違背職務受賄罪之基本構成要件，A對於應依法審核駁回之申請案要求對價，已如前述於要求之時即該當本項而屬既遂；惟本案A進一步於收受對價後，果真違背應予駁回之法定義務，逕行核准該申請案，此一情形應進一步檢視§122Ⅱ，因而為違背職務之行為者，處無期徒刑或五年以上有期徒刑，得併科四百萬元以下罰金，此為加重結果之規定，其構成要件在於行為人不僅要求期約或收受賄賂，且因而即基於收賄之對價關係確實實施了違背職務之行為，此一果真違背職務之要素，使犯罪情節較單純之要求期約收受更為嚴重，故法定刑大幅提升至無期徒刑或五年以上有期徒刑，遠高於§122Ⅰ之三年以上十年以下。本案A向申請人要求給付對價，作為將案件違法核准之交換條件，此部分已該當§122Ⅰ；A復於收受對價後，果真違背應予駁回之法定義務，逕行核准該申請案，其違法核准行為與先前收受對價之要求具有對價關聯性，核與§122Ⅱ因而為違背職務之行為要件相符，應優先適用刑度較重之§122Ⅱ，而非僅論以§122Ⅰ，二者屬同一構成要件之遞進關係，非併罰。\n\n結語：A收受對價後果真違法核准原應駁回之申請案，其行為已由單純要求收賄進階至因而為違背職務之行為，應論以刑法§122Ⅱ，處無期徒刑或五年以上有期徒刑。"},
  {a:"貪污治罪條例§5Ⅰ③", q:"殯儀館公務員A、B於正常辦理遺體洗身、化妝、火化等業務之餘，向配合之葬儀業者按每具遺體收取600元至1,000元不等之紅包，業務辦理過程經查並無違法放水或延誤情事，純屬職務上行為之對價。", problem:"問：A、B之行為該當何罪？", body:"貪污治罪條例§5Ⅰ③規定：「對於職務上之行為，要求、期約或收受賄賂或其他不正利益者」，處七年以上有期徒刑，其構成要件核心在於「對於職務上之行為」收賄，亦即該行為本身仍在其法定職務範圍內、依法應為，僅係收受不當對價。本案A、B為殯儀館公務員，其辦理遺體洗身、化妝、火化等業務本屬其法定職務範圍內應為之事項；A、B向配合之葬儀業者按每具遺體收取600元至1,000元不等之紅包，經查其業務辦理過程並無違法放水、故意延誤或其他違背職務之情事，純屬依法應為之職務行為收受對價，核與§5Ⅰ③「對於職務上之行為」收賄之構成要件相符，而與§4Ⅰ⑤「對於違背職務之行為」要求期約收受賄賂之情形有別——後者係利用違背職務作為對價交換，法定刑度亦遠較前者為重。又本案倘查得A、B另有因收受紅包而對特定業者放寬檢查標準或給予優先受理等差別待遇之情事，則其行為性質即轉化為違背職務之範疇，應改論以刑度更重之貪污治罪條例§4Ⅰ⑤，二者區辨關鍵在於收賄後之職務行為有無違背法令或裁量基準。\n\n結語：A、B成立貪污治罪條例§5Ⅰ③對於職務上行為收受賄賂罪，因非違背職務收賄，應適用較輕之§5而非重罪之§4規定。"},
  {a:"刑法§121Ⅱ", q:"某非屬貪污治罪條例特別要件範圍之公務員A，於辦理一般行政作業之職務上行為過程中，收受相對人贈與之財物作為對價，其後進一步因而變更原應依法辦理之作業方式，改為違背職務之處理方式。", problem:"問：A收受財物後變更為違背職務處理方式之行為該當何罪？", body:"依刑法§121Ⅰ，公務員或仲裁人對於職務上之行為，要求、期約或收受賄賂或其他不正利益者，處七年以下有期徒刑，本案A於辦理一般行政作業之職務上行為過程中，收受相對人贈與之財物作為對價，此部分核屬對於職務上之行為收受對價，已該當§121Ⅰ不違背職務受賄罪之構成要件；惟本案A其後進一步因而變更原應依法辦理之作業方式，改為違背職務之處理方式，此一情節應進一步適用§121Ⅱ，犯前項之罪，因而為違背職務之行為者，處一年以上七年以下有期徒刑，得併科一百萬元以下罰金，此為加重結果之規定，其構成要件在於行為人原僅係針對職務上之行為收受對價，其後卻因而實際將該職務行為之處理方式，由原應依法辦理者改為違背職務之處理，此一情節較單純收受對價而未變更處理方式者更為嚴重，故法定刑由§121Ⅰ之七年以下提升至§121Ⅱ之一年以上七年以下有期徒刑。本案A之情形核與§121Ⅱ因而為違背職務之行為要件相符，應優先適用§121Ⅱ，而非僅論以§121Ⅰ，二者屬同一構成要件之遞進加重關係，非分論併罰。因A不具貪污治罪條例特別身分要件，無從優先適用該條例相對應之加重規定，僅得逕依刑法本條論處。\n\n結語：A收受對價後因而變更原應依法辦理之作業方式為違背職務之處理，該當刑法§121Ⅱ，因不具貪污治罪條例特別身分要件，應逕依本條論處其刑責。"},
  {a:"貪污治罪條例§15", q:"出納C將侵占之公款分裝為多筆封口費，交予知情之同事D，D明知該款項係C侵占公款所得，仍予以收受。", problem:"問：同事D明知款項來源不法仍予收受之行為該當何罪？", body:"出納C將其職務上經手保管之公款侵占入己，其行為核屬貪污治罪條例§4Ⅰ①竊取或侵占公用或公有器材、財物罪之構成要件範疇，應由C就此部分負相應之貪污罪責。就同事D部分，依貪污治罪條例§15，明知因犯第四條至第六條之罪所得之財物，故為收受、搬運、隱匿、寄藏或故買者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金，此為貪污贓物罪，其構成要件為行為人須明知該財物係他人犯貪污治罪條例第四條至第六條之罪所得之贓款贓物，仍予以收受、搬運、隱匿、寄藏或故買，本罪之處罰主體不限於公務員，任何人明知係貪污犯罪所得財物仍予收受寄藏，均可能該當本罪，此係一般刑法贓物罪在貪污治罪條例底下之特別規定，用以杜絕貪污所得財物透過分贓、封口費等方式在體制內外流通滋長，斷絕貪污行為之經濟誘因。本案C將其侵占公款所得之贓款分裝為多筆封口費，交予知情之同事D，此一交付行為之目的顯在使D知情不報、掩蓋C之侵占犯行；D明知該款項係C侵占公款所得，仍予以收受，其主觀上具備明知贓物之認識，客觀上亦有收受之行為，核與§15構成要件完全相符，應論以貪污贓物罪。C、D二人所犯罪名各自不同，C應論以§4Ⅰ①，D則應論以§15，二人罪責分別獨立。\n\n結語：D明知C所交付之封口費係侵占公款所得贓款仍予收受，該當貪污治罪條例§15貪污贓物罪，其罪責與C所犯之侵占公有財物罪各自獨立分論。"},
  {a:"貪污治罪條例§11Ⅰ", q:"廠商負責人A為使某違規工程得以矇混通過驗收，親自前往承辦人B辦公室，當面提出「若能放寬標準，事後必有重謝」，並取出現金20萬元欲交付予B，惟遭B當場婉拒退回。", problem:"問：A之行為該當何罪？既遂或未遂？", body:"貪污治罪條例§11Ⅰ規定：「對於第2條人員，關於違背職務之行為，行求、期約或交付賄賂或其他不正利益者」，處一年以上七年以下有期徒刑；行求、期約、交付三者為本罪並列之獨立犯罪態樣，各自即可成立本罪，不以三者均具備為必要。本案A為使違規工程矇混通過驗收（此屬要求承辦人B違背職務為之之行為），親自前往B辦公室當面提出「必有重謝」之意思表示並取出現金20萬元欲交付予B，其「行求」賄賂之行為（單方提出賄賂之意思表示並提示財物予對方）已屬完足，行求本身即屬本罪之犯罪既遂態樣之一，不以B允諾、期約或實際收受為必要條件；縱B當場婉拒退回、未予收受，並不影響A行求行為之既遂認定，僅係B之收賄行為未成立而已。又倘B事後改變心意主動收受該筆款項，則另構成貪污治罪條例§4Ⅰ⑤對於違背職務行為收受賄賂罪，與A之行求賄賂罪雖屬對向犯關係，仍應分別依各自之行為時點及主觀犯意論罪科刑，不生共犯關係。\n\n結語：A成立貪污治罪條例§11Ⅰ行求賄賂罪（既遂），B當場拒絕收受，故B不成立收賄罪責，雙方責任應分別以觀。"},
  {a:"貪污治罪條例§9", q:"甲於貪污治罪條例某次修正施行前，曾犯該條例第5條之罪，惟長期未被察覺；於該次修正施行後一年內，甲主動向檢察機關自首並繳交全部所得財物。", problem:"問：甲於修正施行後一年內自首之情形應如何適用減免規定？", body:"依貪污治罪條例§9，本條例修正施行前，犯第四條至第六條之罪，於修正施行後一年內自首者，準用前條第一項之規定，此為過渡性條文，其適用範圍限定於條例某次修正施行前所犯之罪，且僅給予修正施行後一年內這段限定期間內自首者，得準用§8Ⅰ自首並繳回全部所得而減輕或免除其刑之優惠效果，逾此一年之限定期間即不再適用本條，此一設計係考量法律修正之際往往伴隨刑度調整或構成要件變動，立法者特設此一過渡期間之特別自首窗口，鼓勵行為人在條例修正之際主動出面自新，兼顧法安定性與鼓勵自新之政策目的。本案甲於貪污治罪條例某次修正施行前，曾犯該條例第5條之罪，此一犯罪時點核屬修正施行前；甲之犯行長期未被察覺，於該次修正施行後一年內，甲主動向檢察機關自首並繳交全部所得財物，其自首時點正落於§9所定修正施行後一年內之限定期間，核與§9之要件完全相符，應準用§8Ⅰ自首並繳回全部所得財物之規定，得減輕或免除其刑；倘因而查獲其他正犯或共犯者，依§8Ⅰ後段，更應直接免除其刑。本條僅具過渡期間之時效性，於該一年期間屆滿後，即無再適用之餘地，僅能改依§8之一般規定判斷。\n\n結語：甲於修正施行前犯罪、修正施行後一年內自首並繳回全部所得，依貪污治罪條例§9準用§8Ⅰ規定，得減輕或免除其刑，如因而查獲其他正犯共犯，更應免除其刑。"},
  {a:"貪污治罪條例§6Ⅰ①、刑法§129Ⅱ", q:"承辦人員A明知應發給員工之年終獎金業已核定完畢，竟意圖從中得利，故意以各種理由拖延數月不予撥發，實則將該筆款項暫時挪為己用生息，事後始補發原額；同機關另一承辦人員B則單純因作業怠惰，無故拖延撥付廠商已核定之採購貨款達3個月，惟查無任何從中得利之具體事證。", problem:"問：A、B二人拖延撥付款項之行為應分別如何論罪？", body:"貪污治罪條例§6Ⅰ①與刑法§129Ⅱ二條文之區辨，關鍵完全在於行為人主觀上是否具備意圖得利之要件：依貪污治罪條例§6Ⅰ①，意圖得利，抑留不發職務上應發之財物者，處五年以上有期徒刑，得併科新臺幣三千萬元以下罰金；依刑法§129Ⅱ，公務員對於職務上發給之款項物品，明知應發給而抑留不發或剋扣者，處一年以上七年以下有期徒刑，得併科二十一萬元以下罰金，二者客觀構成要件明知應發而抑留不發大致相同，惟前者另須具備意圖得利之加重主觀要件，若有具體事證證明行為人確有藉抑留款項從中獲利之意圖，即應優先適用貪污治罪條例之重罪；反之若查無得利事證，僅能論以刑法之基礎規定，刑度差距懸殊。本案承辦人員A明知應發之年終獎金業已核定完畢，竟意圖從中得利，故意以各種理由拖延數月不予撥發，實則將該筆款項暫時挪為己用生息，事後始補發原額，此一挪為己用生息之具體行為足證A確有意圖得利之主觀犯意，核與§6Ⅰ①構成要件相符，應論以本款之罪；另一承辦人員B則單純因作業怠惰，無故拖延撥付廠商已核定之採購貨款達3個月，惟查無任何從中得利之具體事證，其主觀上僅具明知應發仍抑留不發之故意，欠缺意圖得利之加重要件，應逕依刑法§129Ⅱ論處，二人雖行為態樣相似，惟因主觀犯意不同而應適用不同法條、負擔輕重懸殊之刑責。\n\n結語：A因具意圖得利之主觀要件，應論以貪污治罪條例§6Ⅰ①重罪；B單純怠惰拖延且查無得利事證，應逕依刑法§129Ⅱ論以較輕之罪，二人所犯法條依主觀犯意而異。"},
  {a:"貪污治罪條例§12、§8", q:"消防小隊長甲於執行複查業務時，收受業者致贈之紅包3萬6千元，金額低於新臺幣5萬元；甲事後遭檢舉，於偵查中主動坦承收賄犯行，並自動繳交全部所得財物。", problem:"問：甲收受紅包後於偵查中坦承並繳回對其罪責有何影響？", body:"甲身為消防小隊長，於執行複查業務時收受業者致贈之紅包3萬6千元，其複查業務本屬應依法執行之職務上行為，若未經違法放水，僅係針對職務上行為收受對價，核與貪污治罪條例§5Ⅰ③不違背職務受賄罪之構成要件相符，應論以該罪，處七年以上有期徒刑。就減刑事由而言，依§12Ⅰ，犯第四條至第六條之罪，情節輕微，而其所得或所圖得財物或不正利益在新臺幣五萬元以下者，減輕其刑，本案甲所收受之紅包金額為3萬6千元，未逾新臺幣五萬元之情節輕微門檻，得依§12Ⅰ主張減輕其刑。另就犯後態度部分，依§8Ⅱ，犯第四條至第六條之罪，在偵查中自白，如有所得並自動繳交全部所得財物者，減輕其刑；因而查獲其他正犯或共犯者，減輕或免除其刑，本案甲於遭檢舉後、偵查中主動坦承收賄犯行，並自動繳交全部所得財物，其時點已在案發之後、偵查程序進行中，核屬§8Ⅱ偵查中自白而非案發前自首，應依§8Ⅱ規定減輕其刑。應注意者，§8Ⅱ偵查中自白之減刑與§12Ⅰ情節輕微減刑二者要件各自獨立、判斷基礎不同，前者著眼犯後態度、後者著眼所得金額多寡，得同時併予主張、重複適用，並非二擇一，甲之刑責因此得依二項減刑事由分別遞減，量刑上將顯著趨輕。\n\n結語：甲成立貪污治罪條例§5Ⅰ③不違背職務受賄罪，因所得3萬6千元符合§12情節輕微門檻，且偵查中自白繳回全部所得符合§8規定，二項減刑事由得併同適用。"},
  {a:"貪污治罪條例§4Ⅰ①、§15", q:"機關出納人員A利用保管公款之機會侵占入己，並將部分侵占所得分裝為封口費，交予知情同事D；D明知該款項係A侵占公款所得，仍予以收受並代為保管。", problem:"問：出納A及同事D之行為應各如何論罪？", body:"依貪污治罪條例§4Ⅰ①，竊取或侵占公用或公有器材、財物者，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，本款所稱侵占，係指公務員將自己職務上保管或持有之公用公有財物變易為己有之意思予以侵占，本案機關出納人員A之職務本係保管公款，其利用此一保管公款之職務機會，將公款侵占入己，客體核屬公有財物，核與§4Ⅰ①侵占公有財物構成要件完全相符，應論以本罪，此為貪污治罪條例刑度最重之罪名之一。另就同事D部分，依§15，明知因犯第四條至第六條之罪所得之財物，故為收受、搬運、隱匿、寄藏或故買者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金，此為貪污贓物罪，其處罰對象不限公務員，凡明知係貪污犯罪所得財物仍予收受、搬運、隱匿、寄藏或故買者均屬之。本案A將部分侵占所得分裝為封口費，交予知情同事D，D明知該款項係A侵占公款所得，即§4Ⅰ①之犯罪所得，仍予以收受並代為保管，此一收受並代為保管之行為，同時該當§15所列收受及隱匿二種行為態樣，核與貪污贓物罪之構成要件完全相符，應論以本罪。A、D二人所犯罪名各自獨立，A應論以刑度最重之§4Ⅰ①侵占公有財物罪，D則論以§15貪污贓物罪，二人分別依其罪責科刑，不生共犯關係。\n\n結語：A利用保管公款機會侵占入己，成立貪污治罪條例§4Ⅰ①侵占公有財物罪；D明知款項係贓款仍收受並代為保管，另成立§15貪污贓物罪，二人應分別論罪科刑。"},
  {a:"貪污治罪條例§2", q:"某信用合作社行員A，其日常業務單純為社員存款、放款等內部金融事務，並不具公務員身分；某次法務部委託該信用合作社代為承辦某項政府短期紓困貸款之審核撥款業務，A經指派負責該項委辦貸款案件之資格審核與撥款作業。A於審核過程中，明知申請人B之資格文件不符規定，仍違法核准撥貸，並收受B致贈之現金6萬元。", problem:"問：A受委託承辦貸款違法核准並收賄是否適用貪污治罪條例？", body:"依貪污治罪條例§2，公務員犯本條例之罪者，依本條例處斷，本條例本身並未另行定義公務員，而係援用刑法第10條第2項之公務員定義，其中第2款受國家、地方自治團體所屬機關依法委託，從事與委託機關權限有關之公共事務者，即為學理上所稱之委託公務員，其判斷關鍵在於是否依法委託、從事與委託機關權限有關之公共事務，此一身分之取得係事的性質，而非人的固定身分，同一自然人可能就其本職業務不具公務員身分，卻因承辦特定委辦事務而於該事務範圍內被評價為委託公務員，此即看事不看人之判斷方法。本案A為信用合作社行員，其日常業務單純為社員存款、放款等內部金融事務，性質上屬私法上之金融服務契約關係，並不具公務員身分；惟法務部委託該信用合作社代為承辦某項政府短期紓困貸款之審核撥款業務，此一委辦事務核屬依法委託、與委託機關法務部權限有關之公共事務，A經指派負責該項委辦貸款案件之資格審核與撥款作業，即於此一委辦事務範圍內取得委託公務員之身分。A於審核過程中，明知申請人B之資格文件不符規定，仍違法核准撥貸，並收受B致贈之現金6萬元，其行為同時該當違背職務收賄之要件，因A於本件委辦事務範圍內具委託公務員身分，依§2規定，自應依貪污治罪條例論處，不能以其本職非公務員為由規避適用。\n\n結語：A雖本職不具公務員身分，惟就受委託辦理之紓困貸款審核撥款事務範圍內，依貪污治罪條例§2準用刑法第10條第2項規定，屬委託公務員，其違法核准並收賄之行為應依貪污治罪條例論處。"},
  {a:"貪污治罪條例§3", q:"戶政事務所主任A與友人即地政士B共謀，由A利用職務上機會，違法提前核發原應歷經完整審查程序始能核發之戶籍謄本供B之客戶使用，B則自始參與整體計畫之謀劃，並負責招攬客戶、收取加急費用後與A朋分。案發後，B辯稱自己並非公務員，主張僅能論以較輕之普通刑法罪責，不應適用貪污治罪條例。", problem:"問：不具公務員身分之B得否僅論以較輕之普通刑法罪責？", body:"依貪污治罪條例§3，與前條人員共犯本條例之罪者，亦依本條例處斷，此一規定將處罰範圍擴大至與公務員共犯之非公務員，貪污治罪條例本應限於具公務員身分者始能觸犯，屬身分犯之範疇，惟若一般民眾與公務員事前有犯意聯絡、行為分擔而成立共犯，即使自己不具公務員身分，依本條規定仍應依本條例處斷，而非退回論以較輕之普通刑法罪名，此即因身分成立之罪、共犯從重之具體展現，與刑法第31條第1項因身分成立之罪、其無特定關係之人仍以共犯論之法理相呼應。本案戶政事務所主任A身為公務員，利用其職務上核發戶籍謄本之權限，違法提前核發原應歷經完整審查程序始能核發之戶籍謄本，其行為核屬明知違背法令、圖利特定對象之圖利行為，應論以貪污治罪條例§6Ⅰ④主管圖利罪；地政士B雖不具公務員身分，惟其自始參與整體計畫之謀劃，並負責招攬客戶、收取加急費用後與A朋分，其與A間顯有事前犯意聯絡及行為分擔，成立圖利罪之共同正犯，依§3規定，B雖不具公務員身分，仍應與A同依貪污治罪條例論以圖利罪之共犯，B所辯僅能論以較輕之普通刑法罪責之主張，於法無據，不足採信。\n\n結語：B雖非公務員，惟其與具公務員身分之A就本件圖利行為有事前犯意聯絡及分工，依貪污治罪條例§3規定仍應與A同依本條例論以共犯，其主張適用較輕普通刑法罪責並無理由。"},
  {a:"貪污治罪條例§4Ⅰ①", q:"消防分隊裝備保管人員A負責保管分隊之緊急救護器材與破壞器材，明知該批器材均屬公有財物，竟利用保管職務之便，將其中3台原裝進口之液壓破壞器攜出分隊，轉售予資源回收業者換取現金8萬元，並於裝備盤點紀錄上塗改數量矇混過關。", problem:"問：A將職務上保管之公有破壞器材攜出轉售之行為該當何罪？", body:"依貪污治罪條例§4Ⅰ①，竊取或侵占公用或公有器材、財物者，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，本款構成要件之客體區分為公有公家所有之財物與公用供公務使用、不以公有為限，二者範圍略有不同，惟本案破壞器材既屬消防分隊所有並供救災使用，核屬公有兼公用財物，構成要件並無疑義；至於行為態樣則區分侵占將自己保管持有之物變為己有與竊取非自己保管之財物以偷竊方式取得，二者擇一該當即可。本案A係消防分隊裝備保管人員，負責保管分隊之緊急救護器材與破壞器材，該等器材屬其職務上合法保管持有之公有財物，A明知該批器材均屬公有財物，竟利用保管職務之便，將其中3台液壓破壞器攜出分隊、轉售予資源回收業者換取現金8萬元，此一將自己職務上保管之公有財物變易為己有並處分之行為，核屬侵占而非竊取，蓋器材本即由A合法保管持有，核與§4Ⅰ①構成要件完全相符，應論以本罪。A復於裝備盤點紀錄上塗改數量矇混過關，此一行為目的在掩飾侵占之事實，若該盤點紀錄具公文書性質，尚應審酌是否另涉刑法偽造文書相關罪責，惟本案核心罪責仍在於§4Ⅰ①侵占公有財物罪，其法定刑高達無期徒刑或十年以上有期徒刑。\n\n結語：A利用職務上保管公有破壞器材之機會，將器材攜出轉售牟利，該當貪污治罪條例§4Ⅰ①侵占公有財物罪，處無期徒刑或十年以上有期徒刑，得併科鉅額罰金。"},
  {a:"貪污治罪條例§4Ⅰ②", q:"違章建築查報人員A於例行稽查中，發現店家負責人B所經營之小吃店有部分違建增建情形，A竟以「若不表示誠意，將立即函報拆除大隊強制拆除違建」為由，暗示B需交付紅包始願通融，B心生畏懼，於稽查後將現金3萬元交予A。", problem:"問：A暗示B須交付紅包始願通融違建之行為該當何罪？", body:"依貪污治罪條例§4Ⅰ②，藉勢或藉端勒索、勒徵、強占或強募財物者，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，本款所稱藉勢或藉端勒索，係指行為人為自己或第三人不法所有之意圖，憑藉其職務上之權威、勢力或假借事由施行恫嚇，使人心生恐懼而交付財物，其構成要件核心在於行為人利用其職務上足以使相對人畏懼之權勢地位，以言詞或舉動暗示不從將生不利後果，藉此索取財物，此與單純之受賄罪最大差異在於，受賄罪相對人係出於主動或自願之對價關係而交付財物，勒索罪則係相對人因心生畏懼、擔憂遭受職務上不利處分而被迫交付，二者主觀上之自願程度有別，惟均侵害公務廉潔性及人民財產法益。本案A為違章建築查報人員，其職務上具有查報違建、決定是否函報拆除大隊強制拆除之權限，A於例行稽查中發現B店家有違建增建情形，竟以若不表示誠意，將立即函報拆除大隊強制拆除違建為由，此一言詞明顯係憑藉其查報職務上之權勢，假借依法應予查報拆除之事由，對B施以精神上之恫嚇，使B心生畏懼、擔憂店面遭強制拆除而蒙受重大財產損失，B因而心生畏懼交付現金3萬元，A之行為核與§4Ⅰ②藉勢藉端勒索財物構成要件完全相符，應論以本罪，其法定刑遠重於單純受賄罪。\n\n結語：A利用查報違建之職務權勢，以函報拆除相要挾使B心生畏懼交付現金，該當貪污治罪條例§4Ⅰ②藉勢藉端勒索財物罪，處無期徒刑或十年以上有期徒刑。"},
  {a:"貪污治罪條例§4Ⅰ③", q:"自來水廠汰換老舊水管工程之監造人員A，於工程施作期間，明知承包商B實際更換之新管線僅涵蓋原設計里程之七成，其餘三成仍使用舊管線僅做外觀翻修，A仍在估驗計價單上記載已依圖說全數更換完成，並向B收取估驗金額一成之回扣，合計120萬元。", problem:"問：監造人員A明知施工不實仍照實估驗並收取回扣之行為該當何罪？", body:"依貪污治罪條例§4Ⅰ③，建築或經辦公用工程或購辦公用器材、物品，浮報價額、數量、收取回扣或有其他舞弊情事者，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，本款所稱之舞弊情事，除浮報價額數量、收取回扣二種典型態樣外，尚包含一切利用經辦公用工程或購辦器材物品之機會所為之舞弊行為，例如明知未依圖說施作卻仍記載已依約完成，此一明知不實仍照實估驗登載之行為，本質上即屬浮報數量或其他舞弊情事之延伸態樣，蓋施工數量未達契約約定卻仍全額估驗計價，實與浮報數量無異，均使機關溢付不應支付之工程款，同時損及公共工程之品質與安全。本案A身為自來水廠汰換老舊水管工程之監造人員，其職務本應確實監督查核工程施作是否依圖說及契約內容完成，A明知承包商B實際更換之新管線僅涵蓋原設計里程之七成，其餘三成仍使用舊管線僅做外觀翻修，此一施工不實之情形已達重大瑕疵之程度，A仍在估驗計價單上記載已依圖說全數更換完成，此一虛偽估驗登載之行為核屬浮報數量及其他舞弊情事之結合態樣；A復向B收取估驗金額一成之回扣，合計120萬元，收賄與放水估驗二行為緊密結合、互為對價，均應併入同一§4Ⅰ③罪名評價，不應割裂論罪。\n\n結語：A明知工程施作不實仍虛偽登載估驗合格並收取回扣，該當貪污治罪條例§4Ⅰ③經辦公用工程收取回扣及舞弊罪，處無期徒刑或十年以上有期徒刑。"},
  {a:"貪污治罪條例§4Ⅰ④", q:"海巡查緝艇艇長A利用執行公務駕駛公務快艇巡邏之機會，暗中協助走私集團以該公務快艇載運未稅洋菸一批進入國內港口，事後A收取走私集團給付之報酬15萬元。", problem:"問：海巡艇長A利用公務快艇協助走私漏稅物品之行為該當何罪？", body:"依貪污治罪條例§4Ⅰ④，以公用運輸工具裝運違禁物品或漏稅物品者，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，本款所稱漏稅物品，係指依法應課徵關稅、菸酒稅等稅捐而未經完稅之物品，行為人須利用其職務上得支配運用之公用運輸工具，實際裝運該等違禁或漏稅物品，其規範重點在於防杜公務員憑藉其掌控公務船艦、車輛等運輸工具之職務地位，反淪為不法物品走私流通之管道，此對公務廉潔性及國家關稅稽徵制度之侵害至為嚴重，故列為貪污治罪條例刑度最重之§4所規範行為態樣之一。本案A為海巡查緝艇艇長，其職務本應執行查緝走私、維護海域安全之公務，A卻利用執行公務駕駛公務快艇巡邏之機會，暗中協助走私集團以該公務快艇載運未稅洋菸一批進入國內港口，此一利用公務快艇裝運未稅洋菸之行為，核屬以公用運輸工具裝運漏稅物品之典型態樣，已完全該當§4Ⅰ④構成要件，應論以本罪，其法定刑高達無期徒刑或十年以上有期徒刑；A事後收取走私集團給付之報酬15萬元，此一報酬應認係其協助走私裝運行為之對價，屬同一犯罪事實之一部，不另論以其他收賄罪名，應依§4Ⅰ④之法定刑處斷，並依相關規定追徵沒收其犯罪所得。\n\n結語：A利用執行公務駕駛快艇之機會協助走私集團裝運未稅洋菸，該當貪污治罪條例§4Ⅰ④以公用運輸工具裝運漏稅物品罪，處無期徒刑或十年以上有期徒刑。"},
  {a:"貪污治罪條例§5Ⅰ①", q:"地方稅務局代收稅款人員A每日負責將民眾繳納之稅款彙整解庫，A意圖獲取資金運用之利益，連續數週將應解庫之稅款延後入帳，先行挪用於個人資金調度，待有進帳後始補足解繳，帳面上未曾發現短少。", problem:"問：A將應解庫稅款延後入帳供己資金調度之行為該當何罪？", body:"依貪污治罪條例§5Ⅰ①，意圖得利，擅提或截留公款或違背法令收募稅捐或公債者，處七年以上有期徒刑，得併科新臺幣六千萬元以下罰金，本款所稱截留，係指以非法方法截取抑留應行解繳之公款，使其未依法定程序及時解繳入庫，其可責性並不以最終帳面是否短少為斷，蓋公款一經徵起，即應依規定期限解繳國庫或相關公庫，行為人縱嗣後全數補足，仍無解於其於截留期間擅自運用公款之違法性，此與挪用公款供己資金調度之期間長短、金額大小僅為量刑輕重之考量，尚非阻卻犯罪成立之事由。本案A為地方稅務局代收稅款人員，其職務為每日負責將民眾繳納之稅款彙整解庫，此為其法定之及時解繳義務；A意圖獲取資金運用之利益，此一意圖獲取資金運用利益即為§5Ⅰ①所稱意圖得利之主觀要件，連續數週將應解庫之稅款延後入帳，先行挪用於個人資金調度，此一延後入帳、先行挪用之行為核屬截留應行解繳之公款，待有進帳後始補足解繳，雖帳面上未曾發現短少，惟此僅係其犯罪手法縝密、事後填補之結果，不影響其截留公款行為於挪用當下即已既遂之認定，A之行為完全該當§5Ⅰ①擅提截留公款罪之構成要件。\n\n結語：A意圖獲取資金運用利益而連續截留應解庫稅款供己周轉，縱事後補足解繳，仍該當貪污治罪條例§5Ⅰ①擅提截留公款罪，處七年以上有期徒刑。"},
  {a:"貪污治罪條例§5Ⅰ②", q:"區公所里幹事A利用執行社會救助業務之機會，明知某低收入戶已於半年前遷離該區、不再符合資格，仍虛偽製作訪視紀錄，持續為其申請並具領生活扶助款項，將溢領之扶助費共12萬元據為己有。", problem:"問：里幹事A虛偽製作訪視紀錄詐領社會救助款之行為該當何罪？", body:"依貪污治罪條例§5Ⅰ②，利用職務上之機會，以詐術使人將本人之物或第三人之物交付者，處七年以上有期徒刑，得併科新臺幣六千萬元以下罰金，本款性質上為刑法普通詐欺罪之特別規定，構成要件為公務員利用其職務上之機會，施用詐術使機關陷於錯誤而交付財物，凡以虛偽製作文件、隱匿真實狀況等方式使機關就核發款項之事實基礎產生錯誤認識，進而據以核發原不應發給之款項者，均屬本款規範範疇。本案A為區公所里幹事，其職務為執行社會救助業務，包括查核受助對象是否持續符合請領資格，此為其法定之查核義務；A明知某低收入戶已於半年前遷離該區、依規定已不再符合原轄區之低收入戶資格、不應再具領生活扶助款項，A卻仍虛偽製作訪視紀錄，記載受助人仍居住原址、資格未變，此一虛偽製作訪視紀錄之行為，即屬利用其查核職務之機會實施詐術，使區公所陷於錯誤而誤信該受助人仍符合資格，因而持續核發生活扶助款項，A並將溢領之扶助費共12萬元據為己有，核與§5Ⅰ②利用職務機會詐術使人交付財物構成要件完全相符，應論以利用職務機會詐取財物罪，其所詐得之12萬元亦應依法追徵沒收發還。\n\n結語：A利用查核低收入戶資格之職務機會，虛偽製作訪視紀錄使區公所陷於錯誤而溢發扶助費並據為己有，該當貪污治罪條例§5Ⅰ②利用職務機會詐取財物罪。"},
  {a:"貪污治罪條例§6Ⅰ②", q:"區公所辦理某道路拓寬工程，承辦人A負責受理沿線土地徵收補償作業，A明知土地所有權人B實際使用面積僅80平方公尺，竟與土地代書C勾結，於徵收清冊上虛列為120平方公尺，使B溢領徵收補償款，事後B將溢領款項之半數回饋予A、C朋分。", problem:"問：承辦人A與代書C勾結虛列徵收面積之行為該當何罪？", body:"依貪污治罪條例§6Ⅰ②，募集款項或徵用土地、財物，從中舞弊者，處五年以上有期徒刑，得併科新臺幣三千萬元以下罰金，本款所稱徵用土地財物從中舞弊，係指行為人於辦理徵收、徵用土地或財物之職務過程中，利用其職務上之機會，以虛報面積、數量或其他不正當方式，使徵收補償金額與實際情形產生落差，藉以圖利自己或他人，此一虛列面積使溢額補償之行為，正是本款所欲規範之核心舞弊態樣。本案A為區公所承辦人，負責受理道路拓寬工程沿線土地徵收補償作業，此為其職務上辦理徵收土地之機會；A明知土地所有權人B實際使用面積僅80平方公尺，竟與土地代書C勾結，於徵收清冊上虛列為120平方公尺，此一虛列面積之行為核屬募集或徵用土地從中舞弊之典型態樣，使B溢領徵收補償款，A、C二人並因此獲得B事後回饋之半數溢領款項，足證A確有圖自己不法利益之犯意，核與§6Ⅰ②構成要件完全相符，應論以本罪；C雖非公務員，惟其與A就本件舞弊行為事前謀議、共同分工，依貪污治罪條例§3規定，仍應與A同依本條例論以共犯，不因其非公務員身分而免責。\n\n結語：A利用徵收承辦職務與代書C勾結虛列面積使B溢領補償款並朋分，該當貪污治罪條例§6Ⅰ②募集徵用土地從中舞弊罪；C依§3規定應與A同論共犯。"},
  {a:"貪污治罪條例§6Ⅰ③", q:"警察分局扣押物保管人員A職務上保管一批因案扣押之私人所有名貴手錶及珠寶，該等物品雖經扣押保管，仍屬案關被告私人所有之非公用財物；A利用職務上持有保管之機會，將其中2只手錶取出變賣，得款共18萬元。", problem:"問：扣押物保管人員A將扣押物取出變賣之行為該當何罪？", body:"依貪污治罪條例§6Ⅰ③，竊取或侵占職務上持有之非公用私有器材、財物者，處五年以上有期徒刑，得併科新臺幣三千萬元以下罰金，本款規範之客體限於非公用私有財物，亦即該財物雖因公務員職務上之緣故而合法持有保管，惟其所有權仍屬私人所有、非供公務使用，典型例證即為刑事案件之扣押物，扣押物雖經機關依法扣押保管，其所有權仍歸屬案關當事人所有，並未因扣押而變更為公有或公用財物，此與§4Ⅰ①所規範公用或公有財物之客體有本質區別，二者之區辨關鍵完全在於財物之所有權歸屬，而非機關是否持有保管。本案A為警察分局扣押物保管人員，職務上保管一批因案扣押之私人所有名貴手錶及珠寶，該等物品雖經扣押保管，其所有權仍屬案關被告私人所有，核屬非公用私有財物，與A職務上持有保管之要件相符；A利用職務上持有保管之機會，將其中2只手錶取出變賣，得款共18萬元，此一將自己職務上持有他人所有之物變易為己有並處分之行為，核屬侵占，與§6Ⅰ③構成要件完全相符，應論以本罪，而非適用刑度更重、規範公有公用財物之§4Ⅰ①。\n\n結語：A利用職務上保管扣押物之機會，將被告私人所有之手錶取出變賣牟利，該當貪污治罪條例§6Ⅰ③侵占職務上持有非公用私有財物罪，處五年以上有期徒刑。"},
  {a:"貪污治罪條例§6Ⅰ⑤", q:"監理站甲僅負責汽車新領牌照業務，與換發車牌無關；某日甲利用同事出差、代為看管換牌櫃檯之機會，明知申請人之車輛已逾期未換發、依規定應加徵滯納金2,000元，仍主動略去加徵程序、免除申請人應繳之滯納金，逕行換發新牌；甲之目的僅是為討好該申請人（其女友之父親），甲本身並未從中收取任何金錢。", problem:"問：甲免除申請人應繳滯納金之行為該當何罪？", body:"依貪污治罪條例§6Ⅰ⑤，對於非主管或監督之事務，明知違背前款規定，利用職權機會或身分圖自己或其他私人不法利益，因而獲得利益者，處五年以上有期徒刑，得併科新臺幣三千萬元以下罰金，本款之成立不以行為人自己自不法利益中獲利為必要，條文明文為圖自己或其他私人不法利益，故縱行為人自己一毛未取，只要其違法行為使他人獲得不法利益，一樣成立本罪，此為圖利罪常被誤解之處，考生應特別留意公務員自己不用獲利此一構成要件細節。本案甲僅負責汽車新領牌照業務，與換發車牌並非其主管或監督之事務，甲利用同事出差、代為看管換牌櫃檯之機會，此即利用職權機會或身分之情形，明知申請人之車輛已逾期未換發、依規定應加徵滯納金2,000元，仍主動略去加徵程序、免除申請人應繳之滯納金，逕行換發新牌，此一明知違背徵收滯納金規定仍免除之行為，核屬明知違背法令；甲之目的僅是為討好該申請人其女友之父親，雖甲本身並未從中收取任何金錢，惟其違法行為已使申請人因而獲得免繳2,000元滯納金之不法利益，核與§6Ⅰ⑤圖他人不法利益、因而獲得利益之構成要件完全相符，應論以本罪，甲不得以自己未獲利為由主張不成立犯罪。\n\n結語：甲雖未自行獲利，惟其明知違背規定而免除申請人應繳滯納金，使申請人因而獲得不法利益，仍該當貪污治罪條例§6Ⅰ⑤非主管圖利罪。"},
  {a:"貪污治罪條例§6-1", q:"建管處建照審查人員A因涉嫌違法核准建照及包庇廠商施工違規遭檢察官分案偵辦；偵查期間查得A名下除固定薪資收入外，另於其配偶及未成年子女名下合計新臺幣350萬元不明存款，且該等存款均係於A涉嫌犯罪後之1年內陸續存入。檢察官命A就上開財產來源提出說明，A僅泛稱「多年儲蓄所得」，卻無法提出任何薪資、投資或借貸憑證佐證。", problem:"問：A就配偶子女名下不明存款無法提出憑證應如何論罪？", body:"依貪污治罪條例§6-1Ⅰ，公務員犯本條所列各款罪嫌之一，檢察官於偵查中，發現公務員本人及其配偶、未成年子女自公務員涉嫌犯罪時及其後三年內，有財產增加與收入顯不相當時，得命本人就來源可疑之財產提出說明，無正當理由未為說明、無法提出合理說明或說明不實者，處五年以下有期徒刑、拘役或科或併科不明來源財產額度以下之罰金，此一規定明文將命本人說明之財產範圍，擴及登記於配偶及未成年子女名下之財產，用以防杜公務員以人頭方式將不法所得移轉登記於配偶子女名下、規避財產申報及查核之脫法行為，構成要件核心在於財產增加與收入顯不相當、且發生於涉嫌犯罪時及其後三年之特定期間內。本案建管處建照審查人員A因涉嫌違法核准建照及包庇廠商施工違規遭檢察官分案偵辦，此核屬§6-1Ⅰ所列罪嫌範圍；偵查期間查得A名下除固定薪資收入外，另於其配偶及未成年子女名下合計新臺幣350萬元不明存款，且該等存款均係於A涉嫌犯罪後之1年內陸續存入，此一財產增加與A之合法薪資收入顯不相當，核屬§6-1Ⅰ所定財產異常增加之情形，檢察官依法命A就上開財產來源提出說明，A僅泛稱多年儲蓄所得，卻無法提出任何薪資、投資或借貸憑證佐證，核屬無法提出合理說明，應論以財產來源不明罪。\n\n結語：A就其配偶及未成年子女名下與涉嫌犯罪時序密接之異常增加財產無法提出合理說明，該當貪污治罪條例§6-1財產來源不明罪。"},
  {a:"貪污治罪條例§11Ⅴ", q:"廠商負責人A曾於2年前對機關承辦人B行求現金30萬元，要求B違法放寬其工程履約期限，B當場拒絕收受。A事後心生悔意，於案件尚未被任何人發覺前，即主動向調查局說明上情並坦承全部經過。", problem:"問：A主動向調查局說明其行求賄賂經過對其罪責有何影響？", body:"依貪污治罪條例§11Ⅰ，對於第2條人員，關於違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金，本案A為使承辦人員B違法放寬其工程履約期限，此屬要求B為違背職務之行為，A向B行求交付現金30萬元，其行求賄賂之行為一經提出即屬既遂，不以B是否收受為必要，B雖當場拒絕收受，仍無解於A行求賄賂罪之成立，核與§11Ⅰ構成要件相符，A應論以違背職務行賄罪。就其後續犯後態度而言，依§11Ⅴ，犯前四項之罪而自首者，免除其刑；在偵查或審判中自白者，減輕或免除其刑，此一自首效果較貪污治罪條例其他條文更為優惠，蓋自首者直接免除其刑而非僅減輕或免除，立法者藉此鼓勵行賄者主動出面說明，以利查緝收賄之公務員，展現污點證人政策之立法意旨。本案A於案件尚未被任何人發覺前，即主動向調查局具偵查權之機關說明上情並坦承全部經過，其時點在犯罪未經發覺前、對象為有偵查權之機關，核屬§11Ⅴ所稱之自首，應直接免除其刑，而非僅減輕其刑，此為行賄自首與一般自首效果之重要差異，作答時應予辨明。\n\n結語：A行求賄賂之行為已該當貪污治罪條例§11Ⅰ違背職務行賄罪，惟因其於案發前主動向有偵查權機關自首並坦承全部經過，依§11Ⅴ規定應免除其刑。"},
  {a:"貪污治罪條例§12Ⅱ", q:"廠商負責人A為求工程驗收順利，交付現金2萬元予驗收人員B，請求B對於工程中一處不影響結構安全之極輕微瑕疵不予記載扣分。", problem:"問：A交付現金2萬元請求B不予記載瑕疵之行為是否適用減刑規定？", body:"本案廠商負責人A為求工程驗收順利，交付現金2萬元予驗收人員B，請求B對於工程中一處不影響結構安全之極輕微瑕疵不予記載扣分，其要求B為原不應如此處理之驗收放水行為，核屬要求B為違背職務之行為，A應論以貪污治罪條例§11Ⅰ違背職務行賄罪，處一年以上七年以下有期徒刑；惟就本案是否有減刑空間，應審酌§12Ⅱ，犯前條第一項至第四項之罪，情節輕微，而其行求、期約或交付之財物或不正利益在新臺幣五萬元以下者，亦同，此係將§12Ⅰ情節輕微減刑規定，同步適用於行賄罪之情形，構成要件為所行求期約或交付之財物金額須在新臺幣五萬元以下，且情節輕微，二者須同時具備，其中情節輕微之判斷，應綜合考量行賄目的之嚴重性、對公共利益之危害程度等因素，非僅以金額多寡為唯一標準。本案A交付予B之現金金額為2萬元，未逾新臺幣五萬元之門檻；且其行賄之目的僅在請求B對於一處不影響結構安全之極輕微瑕疵不予記載扣分，其所欲換取之違背職務內容本身即屬輕微，對公共安全及工程品質之實質危害甚微，堪認同時具備金額及情節二項輕微要件，應依§12Ⅱ規定減輕其刑，此一減刑事由與A嗣後如另符合§11Ⅴ自首或自白之要件，尚得一併主張，二者不相排斥。\n\n結語：A交付現金2萬元請求B對極輕微瑕疵不予記載，因金額未逾五萬元且情節輕微，除成立貪污治罪條例§11Ⅰ違背職務行賄罪外，並得依§12Ⅱ規定減輕其刑。"},
  {a:"貪污治罪條例§16Ⅰ", q:"民眾A因土地重劃補償金額與地政局承辦人員B協調未果心生不滿，明知B從未向自己索取任何財物或不正利益，竟仍具狀向監察院檢舉B於重劃過程中收受其行賄之現金50萬元，企圖使B遭移送懲戒並負刑事責任；監察院調查後查無實據簽結。", problem:"問：A明知B未收賄仍具狀向監察院誣指之行為該當何罪？", body:"依貪污治罪條例§16Ⅰ，誣告他人犯本條例之罪者，依刑法規定加重其刑至二分之一，此為誣告罪之加重規定，其構成要件建立於刑法誣告罪之基礎上，須行為人明知所訴事實為虛偽，仍向該管公務員申告，不限於檢察官或司法警察，凡有權受理該類申告之機關，如監察院受理陳情檢舉，均屬適格對象，意圖使他人受刑事或懲戒處分，且誣指之內容係指摘他人涉犯貪污治罪條例之罪者，即應在刑法誣告罪之基礎法定刑之上依本條加重其刑至二分之一。本案民眾A因土地重劃補償金額與地政局承辦人員B協調未果心生不滿，明知B從未向自己索取任何財物或不正利益，此即明知所訴事實為虛偽，竟仍具狀向監察院檢舉B於重劃過程中收受其行賄之現金50萬元，企圖使B遭移送懲戒並負刑事責任，此一具狀誣指之行為，兼具使他人受刑事訴追及行政懲戒處分之雙重意圖，核與誣告罪構成要件相符；又其誣指之內容係B涉犯貪污治罪條例收受賄賂罪，核屬§16Ⅰ所稱誣指他人犯本條例之罪，應依刑法誣告罪規定加重其刑至二分之一。至於監察院嗣後調查結果查無實據簽結，此僅係誣告事實經查證不實之結果，並不影響A誣告行為於具狀申告時即已成立既遂之認定。\n\n結語：A明知B未曾收賄仍具狀向監察院誣指其涉犯貪污治罪條例收賄罪，該當貪污治罪條例§16Ⅰ誣告罪，應依刑法誣告罪規定加重其刑至二分之一。"},
  {a:"貪污治罪條例§18Ⅰ", q:"某機關約僱人員A發現同事B涉嫌於採購案中收受廠商賄賂，A擔心檢舉後遭受職場報復或人事考核不利，猶豫是否具名檢舉，欲了解是否有相關法令保障檢舉人身分並給予適當之獎勵。", problem:"問：A檢舉同事B涉貪是否受有法令上之獎勵及保護？", body:"依貪污治罪條例§18Ⅰ，貪污瀆職案件之檢舉人應予獎勵及保護；其辦法由行政院定之，此為檢舉人獎勵保護之原則性宣示規定，明文揭示對於貪污瀆職案件之檢舉人，國家負有應予獎勵及保護之義務，其規範意旨在於貪污瀆職案件多具高度隱密性，多仰賴機關內部知情人員挺身檢舉始能查獲，若欠缺完善之獎勵保護機制，檢舉人恐因擔憂遭受職場報復、人事考核不利甚至人身安全威脅而不敢出面，將嚴重削弱貪污治罪條例之查緝效能，故立法者特於本條明文課予國家應予獎勵及保護之義務；惟本條本身僅為原則性之授權規定，具體之檢舉獎金金額、保護措施內容及機關應採取之防貪機制，依§18Ⅱ及本條規定，均授權由行政院另定辦法加以落實，本條原文並不直接規定獎金數額或保護措施之具體內容。本案某機關約僱人員A發現同事B涉嫌於採購案中收受廠商賄賂，A之身分雖僅為約僱人員，惟依§18Ⅰ規定，凡屬貪污瀆職案件之檢舉人，不分身分別，均應受法定之獎勵及保護，A就其檢舉行為，得依行政院所定辦法請求身分保密及相關保護措施，並得依規定請領檢舉獎金，不因其擔憂職場報復而喪失檢舉之法律保障。\n\n結語：A身為檢舉人，依貪污治罪條例§18Ⅰ規定，應受行政院所定辦法之獎勵及保護，其檢舉同事B涉貪之行為，於法有據亦受制度保障，不應因憂慮報復而卻步。"},
  {a:"貪污治罪條例§4Ⅰ⑤、§11Ⅰ", q:"某餐飲業者A經營之店面因未經合法變更用途，遭建管處認定違規使用，屆期未改善將遭勒令停業。A乃私下拜訪承辦科員B，於B辦公室內提出現金15萬元，要求B將本案分類為「已補正」並不再列管稽查；B收下款項後，明知該店面仍屬違規使用，仍將稽查案件逕行結案並移除列管。", problem:"問：業者A與收賄科員B之行為各該當何罪？", body:"依貪污治罪條例§4Ⅰ⑤，對於違背職務之行為，要求、期約或收受賄賂或其他不正利益者，處無期徒刑或十年以上有期徒刑，本案承辦科員B收下A交付之現金15萬元後，明知該店面仍屬違規使用、依規定應繼續列管並依法裁處，B卻將稽查案件逕行結案並移除列管，此一明知違規仍為結案除列之行為核屬不應為而為之違背職務型態，與收受賄賂之對價關係緊密結合，核與§4Ⅰ⑤構成要件完全相符，B應論以違背職務收受賄賂罪。另依§11Ⅰ，對於第2條人員，關於違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處一年以上七年以下有期徒刑，本案業者A為避免其違規店面遭勒令停業，私下拜訪承辦科員B，於B辦公室內提出現金15萬元，要求B將本案分類為已補正並不再列管稽查，其要求B為原應繼續列管稽查卻改為除列結案之違背職務行為，核與§11Ⅰ構成要件相符，A應論以違背職務行賄罪。A、B二人一收一送，行為互相對應，各自成立獨立之對向犯，應分別論罪科刑，不生共犯關係；又本案賄款達15萬元，已逾§12情節輕微減刑門檻新臺幣五萬元，尚無適用減刑規定之空間。\n\n結語：B收賄後違法將違規店面除列結案，成立貪污治罪條例§4Ⅰ⑤違背職務收受賄賂罪；A行求該賄賂則成立§11Ⅰ違背職務行賄罪，二人應分別論罪。"},
  {a:"貪污治罪條例§5Ⅰ③、§11Ⅱ", q:"KTV業者負責人A為求消防安全檢查程序順利進行、避免久候，於檢查前主動包了紅包2千元交給消防局承辦安檢人員B；B依規定正常檢查，該場所原本即完全符合各項消防安全設備標準，B遂依實際檢查結果開立合格證明。", problem:"問：業者A與安檢人員B之行為各該當何罪？", body:"依貪污治罪條例§5Ⅰ③，對於職務上之行為，要求、期約或收受賄賂或其他不正利益者，處七年以上有期徒刑，本款構成要件核心在於公務員針對其本來就應為之職務行為收受對價，行為本身未違法放水。本案消防局承辦安檢人員B收受業者A交付之紅包2千元，惟B仍依規定正常檢查，該場所原本即完全符合各項消防安全設備標準，B係依實際檢查結果開立合格證明，並無任何放寬標準或違法核發之情事，其職務行為本身完全合法，僅係於執行職務過程中收受對價，核與§5Ⅰ③對於職務上之行為收受賄賂之構成要件相符，B應論以不違背職務受賄罪，而非刑度更重之§4Ⅰ⑤違背職務收賄罪。另依§11Ⅱ，對於第2條人員，關於不違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處三年以下有期徒刑、拘役或科或併科新臺幣五十萬元以下罰金，本案A交付紅包之目的僅在求檢查程序順利進行、避免久候，並非要求B違法放寬標準或違法核發合格證明，其要求B所為者仍屬依規定應為之職務行為，核與§11Ⅱ不違背職務行賄罪之構成要件相符，A應論以本罪，其刑度遠較違背職務行賄罪為輕。又因本案賄款僅2千元，金額甚微，亦得依§12Ⅱ主張情節輕微減刑。\n\n結語：B收受紅包但仍依規定正常檢查合格，成立貪污治罪條例§5Ⅰ③不違背職務受賄罪；A交付紅包則成立§11Ⅱ不違背職務行賄罪，因金額甚微並得依§12Ⅱ減輕其刑。"},
  {a:"貪污治罪條例§6Ⅰ④、§8Ⅱ", q:"廢棄物清運標案承辦人A明知應依法定期限公開招標，竟違反規定以隨機比價方式，將標案發包予由其配偶掛名經營之清運公司，A並自該公司分得紅利15萬元。案經人檢舉後，A於偵查中坦承違法發包及收受紅利之事實，並主動將15萬元全數繳回。", problem:"問：A違法發包圖利配偶公司並於偵查中坦承繳回應如何論罪？", body:"依貪污治罪條例§6Ⅰ④，對於主管或監督之事務，明知違背法律、法律授權之法規命令、職權命令、自治條例、自治規則、委辦規則或其他對多數不特定人民就一般事項所作對外發生法律效果之規定，直接或間接圖自己或其他私人不法利益，因而獲得利益者，處五年以上有期徒刑，本案A為廢棄物清運標案承辦人，其明知應依法定期限公開招標，此即明知違背相關招標法令，竟違反規定以隨機比價方式，將標案發包予由其配偶掛名經營之清運公司，使該公司獲得承攬清運業務之不法利益，此一將標案圖利予配偶掛名公司之行為，核屬直接或間接圖自己或其他私人不法利益、因而獲得利益，A本人並自該公司分得紅利15萬元，益證其確有圖利意圖並實際獲利，核與§6Ⅰ④構成要件完全相符，應論以主管圖利罪。就其犯後態度部分，依§8Ⅱ，犯第四條至第六條之罪，在偵查中自白，如有所得並自動繳交全部所得財物者，減輕其刑；因而查獲其他正犯或共犯者，減輕或免除其刑，本案A係經人檢舉後，於偵查中坦承違法發包及收受紅利之事實，並主動將15萬元全數繳回，其時點已在案發之後，核屬偵查中自白，且已自動繳交全部所得財物，符合§8Ⅱ前段之要件，應依規定減輕其刑。\n\n結語：A明知違背招標法令而圖利配偶掛名之清運公司，成立貪污治罪條例§6Ⅰ④主管圖利罪，因其於偵查中自白並繳回全部所得15萬元，依§8Ⅱ規定應減輕其刑。"},
  {a:"貪污治罪條例§6Ⅰ①、§12Ⅰ", q:"地價稅退稅承辦人A意圖從中獲取孳息利益，明知納稅義務人B之退稅案已核准退稅4萬8千元，仍故意拖延不予退還達3個月，先將該筆退稅款存入自己申設之帳戶生息，期滿後始將本金退還B。", problem:"問：A拖延退稅並存入自己帳戶生息之行為該當何罪？", body:"依貪污治罪條例§6Ⅰ①，意圖得利，抑留不發職務上應發之財物者，處五年以上有期徒刑，得併科新臺幣三千萬元以下罰金，本款構成要件為行為人須有意圖得利之主觀要件，客觀上並有抑留不發職務上應發財物之行為，本案A為地價稅退稅承辦人，明知納稅義務人B之退稅案已核准退稅4萬8千元，此為其職務上應發給B之財物，A本應依規定辦理退還，卻意圖從中獲取孳息利益，此即意圖得利之主觀要件，故意拖延不予退還達3個月，先將該筆退稅款存入自己申設之帳戶生息，此一拖延不發、挪供己用生息之行為核屬抑留不發職務上應發財物，二者結合，A之行為完全該當§6Ⅰ①構成要件，應論以本款之罪。就減刑事由而言，依§12Ⅰ，犯第四條至第六條之罪，情節輕微，而其所得或所圖得財物或不正利益在新臺幣五萬元以下者，減輕其刑，本案退稅款金額為4萬8千元，未逾新臺幣五萬元之情節輕微門檻，得依§12Ⅰ規定減輕其刑；A期滿後雖已將本金退還B，惟此僅屬犯後填補，其抑留期間所生孳息若未一併返還，仍應審酌是否另生不當得利返還或其他相關責任，惟不影響本罪之既遂認定。\n\n結語：A意圖獲取孳息利益而故意拖延退還已核准之退稅款，該當貪污治罪條例§6Ⅰ①抑留不發應發財物罪，因所得未逾五萬元情節輕微，得依§12Ⅰ規定減輕其刑。"},
  {a:"貪污治罪條例§4Ⅰ⑤、§7", q:"警員甲於執行毒品案件之調查勤務時，查獲乙持有第二級毒品達可疑販賣之數量，甲收受乙交付之現金5萬元後，明知應依法移送而未依法移送，反而將扣得之毒品證物銷毀滅跡並縱放乙離去。", problem:"問：警員甲收賄後銷毀證物縱放嫌犯之行為該當何罪？", body:"依貪污治罪條例§4Ⅰ⑤，對於違背職務之行為，要求、期約或收受賄賂或其他不正利益者，處無期徒刑或十年以上有期徒刑，本案警員甲於執行毒品案件之調查勤務時，查獲乙持有第二級毒品達可疑販賣之數量，其法定職務本應依法移送偵辦，甲收受乙交付之現金5萬元後，明知應依法移送而未依法移送，反而將扣得之毒品證物銷毀滅跡並縱放乙離去，此一應為而不為、甚至積極湮滅證物縱放之行為，核屬違背職務之典型且情節嚴重之型態，與收賄之對價關係明確，已完全該當§4Ⅰ⑤構成要件，應論以違背職務收受賄賂罪。另依§7，有調查、追訴或審判職務之人員，犯第四條第一項第五款或第五條第一項第三款之罪者，加重其刑至二分之一，此為司法人員收賄之加重規定，其適用主體包括負責犯罪調查職務之司法警察官，本案甲為警員，執行毒品案件之調查勤務，核屬有調查職務之人員，其所犯者又核屬§4Ⅰ⑤違背職務收受賄賂罪，與§7所定加重要件完全相符，應於§4Ⅰ⑤法定刑基礎上，再依§7規定加重其刑至二分之一。又甲銷毀毒品證物之行為，另涉刑法偽證湮滅證據及縱放人犯等相關罪責，惟就本題聚焦之貪污治罪條例部分，應以§4Ⅰ⑤並依§7加重為核心論述。\n\n結語：甲身為調查職務之警員收賄後銷毀證物縱放嫌犯，成立貪污治罪條例§4Ⅰ⑤違背職務收受賄賂罪，並因具調查職務人員身分，依§7規定應加重其刑至二分之一。"},
  {a:"刑法§121Ⅰ", q:"某民間商務糾紛經雙方合意提付仲裁，仲裁人A受選任處理該案。程序進行中，聲請人一方之負責人B私下致送A現金5萬元，向其表示「仰賴照顧」，A明知該款項與其仲裁職務有關仍予收下；惟A其後仍依仲裁法規定之程序，本於公正立場作成仲裁判斷，並未偏袒任何一方。", problem:"問：仲裁人A收受一方致贈現金之行為該當何罪？", body:"依刑法§121Ⅰ，公務員或仲裁人對於職務上之行為，要求、期約或收受賄賂或其他不正利益者，處七年以下有期徒刑，得併科七十萬元以下罰金，本條文明文將處罰主體及於仲裁人，此係因仲裁制度具有準司法性質，仲裁人本應本於獨立公正之立場作成仲裁判斷，其職務性質與公務員相類，故立法者特將仲裁人納入本條規範主體，構成要件為仲裁人對於其職務上之行為，即仲裁程序之進行及判斷之作成，要求期約或收受賄賂或其他不正利益即可成立，不以嗣後果真為偏頗之仲裁判斷為必要，此與同條第2項因而為違背職務之行為須另生加重結果之情形有別。本案某民間商務糾紛經雙方合意提付仲裁，仲裁人A受選任處理該案，其身分核屬本條所稱之仲裁人；程序進行中，聲請人一方之負責人B私下致送A現金5萬元，向其表示仰賴照顧，A明知該款項與其仲裁職務有關仍予收下，此一收受行為，核與對於職務上之行為收受賄賂或不正利益之構成要件完全相符，於A收下款項之時即屬既遂；縱A其後仍依仲裁法規定之程序，本於公正立場作成仲裁判斷，並未偏袒任何一方，此僅係其未再為違背職務行為，不影響其收賄行為於收受當下已然既遂之認定，仍應論以本罪，不能以最終仲裁結果公正為由主張不成立犯罪。\n\n結語：仲裁人A明知款項與其仲裁職務有關仍予收受，縱其後仍公正作成仲裁判斷，仍該當刑法§121Ⅰ不違背職務受賄罪，於收受賄賂之時即屬既遂。"},
  {a:"刑法§121Ⅱ", q:"某商務仲裁案之仲裁人C，受當事人一方D於程序進行中致贈名貴手錶一只（市價約15萬元），雙方僅泛稱「感謝費心處理」，未曾言明具體要求C為如何之仲裁結果。C收下手錶後，作成之仲裁判斷罔顧另一方提出之關鍵證據，明顯偏袒D，逾越仲裁人應保持之公正立場。", problem:"問：仲裁人C收受名貴手錶後作成偏頗判斷之行為該當何罪？", body:"依刑法§121Ⅰ，公務員或仲裁人對於職務上之行為，要求、期約或收受賄賂或其他不正利益者，處七年以下有期徒刑，本案仲裁人C受當事人一方D於程序進行中致贈名貴手錶一只市價約15萬元，此一手錶屬可用金錢計算之財物，核屬賄賂而非單純之不正利益，雙方雖僅泛稱感謝費心處理、未曾言明具體要求C為如何之仲裁結果，惟依實務見解，公務員或仲裁人基於某項特定或具體之職務關係而收受對方致贈之財物，即使以感謝、餽贈等名義包裝，仍應認具賄賂性質，不能以人情禮數作為抗辯，C收受該手錶之行為已該當§121Ⅰ收受賄賂之構成要件。惟本案C收下手錶後，作成之仲裁判斷罔顧另一方提出之關鍵證據，明顯偏袒D，逾越仲裁人應保持之公正立場，此一因而偏頗作成仲裁判斷之情節，應進一步適用§121Ⅱ，犯前項之罪，因而為違背職務之行為者，處一年以上七年以下有期徒刑，得併科一百萬元以下罰金，其構成要件在於仲裁人不僅收受賄賂，且因該收賄關係，實際將仲裁判斷之作成偏離公正立場、有利於行賄一方，此一情節較單純收賄而未生偏頗結果者更為嚴重，故法定刑由§121Ⅰ之七年以下提升至§121Ⅱ之一年以上七年以下有期徒刑。\n\n結語：C收受名貴手錶賄賂後，因而作成罔顧證據、偏袒D之仲裁判斷，該當刑法§121Ⅱ，處一年以上七年以下有期徒刑，較單純收賄而未生偏頗結果之§121Ⅰ為重。"},
  {a:"刑法§122Ⅰ", q:"某勞資爭議之仲裁人E經其中一方雇主F私下期約：只要仲裁判斷為F勝訴，事後將給付E新臺幣10萬元酬金，E應允之。惟因勞方嗣後撤回仲裁聲請，程序終止，仲裁判斷並未作成。", problem:"問：仲裁人E應允期約酬金但仲裁程序終止之行為應如何論罪？", body:"依刑法§122Ⅰ，公務員或仲裁人對於違背職務之行為，要求、期約或收受賄賂或其他不正利益者，處三年以上十年以下有期徒刑，得併科二百萬元以下罰金，本條所稱之期約，係指雙方就交付賄賂達成合意，不問係何方先行提出、亦不問賄賂是否已實際交付，僅須雙方對於賄賂之交付達成合意，本罪即屬既遂，此與收受須有實際受領賄賂之行為有別，屬賄賂罪三種行為態樣中程度較輕但仍足以成立既遂之型態。本案仲裁人E受其中一方雇主F私下期約，只要仲裁判斷為F勝訴，事後將給付E新臺幣10萬元酬金，此一要求以特定不利於他造、有利於F之仲裁結果作為給付酬金之對價條件，核屬違背職務之行為而非單純之不違背職務，蓋仲裁人本應本於公正立場依證據為判斷，而非預先承諾特定一方勝訴之結果，E應允此一期約，其主觀上已具備收賄之合意，核與§122Ⅰ對於違背職務之行為期約賄賂之構成要件相符，於E應允之時即屬既遂，不以仲裁判斷嗣後是否果真作成、亦不以酬金是否實際交付為必要。惟因勞方嗣後撤回仲裁聲請，程序終止，仲裁判斷並未作成，此僅係後續事實發展，不影響E期約受賄罪於應允當下已然既遂之認定，亦無適用§122Ⅱ加重規定之餘地，蓋該項要求因而為違背職務之行為，本案並未實際作成任何仲裁判斷。\n\n結語：仲裁人E應允雇主F以勝訴為條件期約給付酬金，於應允之時即該當刑法§122Ⅰ違背職務受賄罪而屬既遂，不因程序嗣後終止、判斷未及作成而受影響。"},
  {a:"刑法§123", q:"甲現為某產業公會秘書，尚未取得仲裁人資格。某工程廠商乙因預見雙方未來可能發生履約爭議，遂與甲約定：若甲日後取得仲裁人資格並受指定承辦該廠商之仲裁案件，即先行給付甲30萬元，甲應允並收受該筆款項。半年後甲通過仲裁人訓練取得資格，某次果真受指定處理乙提付仲裁之工程款爭議案，甲亦依約對乙從優處理，作成有利於乙之仲裁判斷。", problem:"問：甲於取得仲裁人資格前收受款項之行為應如何論罪？", body:"依刑法§123，於未為公務員或仲裁人時，預以職務上之行為，要求、期約或收受賄賂或其他不正利益，而於為公務員或仲裁人後履行者，以公務員或仲裁人要求期約或收受賄賂或其他不正利益論，此即準受賄罪，其規範對象除公務員外，明文及於仲裁人，構成要件為行為人於收賄當時尚未具備仲裁人身分、預先就未來可能受指定承辦之仲裁職務為要求期約或收受賄賂之約定、其後行為人果真取得仲裁人資格並受指定承辦該案、並依約履行先前之承諾，四要件具備即以仲裁人受賄論處。本案甲於收受乙所交付30萬元款項時，僅為產業公會秘書，尚未取得仲裁人資格，核屬未為仲裁人時；乙因預見雙方未來可能發生履約爭議，遂與甲約定若甲日後取得仲裁人資格並受指定承辦該廠商之仲裁案件即先行給付甲30萬元，此一約定核屬預以職務上之行為要求期約或收受賄賂，甲應允並收受該筆款項；半年後甲通過仲裁人訓練取得資格，某次果真受指定處理乙提付仲裁之工程款爭議案，此即其後為仲裁人，甲亦依約對乙從優處理，作成有利於乙之仲裁判斷，此即依約履行，四要件均已具備，甲之行為完全該當刑法§123準受賄罪，不能以收受款項當下尚不具仲裁人資格作為抗辯。\n\n結語：甲收受款項時雖尚未取得仲裁人資格，惟其後果真取得資格並依約作成有利於乙之仲裁判斷，該當刑法§123準受賄罪，以仲裁人收受賄賂論處。"},
  {a:"刑法§129Ⅰ", q:"地方稅捐稽徵所股長A為提升本年度稅捐稽徵考核績效數據，明知轄內某筆土地依土地稅減免規則規定應予免徵地價稅，仍指示所屬人員對該筆土地照常發單徵收，徵起稅款並依規定解繳國庫，A本人及所屬均未從中獲取任何金錢或其他利益，純粹是為使統計報表數字好看。", problem:"問：股長A為美化統計數據而違法照常徵稅之行為該當何罪？", body:"依刑法§129Ⅰ，公務員對於租稅或其他入款，明知不應徵收而徵收者，處一年以上七年以下有期徒刑，得併科二十一萬元以下罰金，此為違法徵收罪，構成要件核心在於公務員對於租稅入款明知不應徵收卻仍執意徵收，本罪成立與貪污治罪條例§5Ⅰ①之區辨關鍵在於行為人主觀上有無意圖得利，若行為人確有藉由違法徵收行為獲取金錢或其他不法利益之意圖，即應優先適用貪污治罪條例§5Ⅰ①之加重規定；反之若行為人僅係違法徵收，將徵起稅款依規定全數解繳國庫，自己並未從中獲取任何利益，欠缺意圖得利之要件，則僅單獨適用刑法本項之基礎規定。本案地方稅捐稽徵所股長A為提升本年度稅捐稽徵考核績效數據，明知轄內某筆土地依土地稅減免規則規定應予免徵地價稅，此即明知不應徵收，仍指示所屬人員對該筆土地照常發單徵收，此一違法徵收之行為核與§129Ⅰ客觀構成要件相符；徵起稅款並依規定解繳國庫，A本人及所屬均未從中獲取任何金錢或其他利益，純粹是為使統計報表數字好看，此一情節顯示A欠缺意圖得利之主觀要件，不符貪污治罪條例§5Ⅰ①之加重要件，應逕依刑法§129Ⅰ論處，不適用貪污治罪條例之加重規定。\n\n結語：股長A明知應予免徵仍指示照常徵收，惟因查無意圖得利之情事，應逕依刑法§129Ⅰ違法徵收罪論處，不適用貪污治罪條例§5Ⅰ①之加重規定。"},
  {a:"刑法§129Ⅱ", q:"消防局大隊部承辦人B原應於每月10日前發放轄區義消人員之出勤補助費，因B個人對某分隊幾位義消心生不滿，明知渠等出勤紀錄合於規定應予發給，仍以「尚待核章」為由持續拖延達半年之久未發放，B本人未將該筆款項挪作他用，亦未從中獲取任何利益，純粹出於對特定人之報復心態而抑留不發。", problem:"問：承辦人B出於報復心態拖延發放義消補助費之行為該當何罪？", body:"依刑法§129Ⅱ，公務員對於職務上發給之款項物品，明知應發給而抑留不發或剋扣者，處一年以上七年以下有期徒刑，得併科二十一萬元以下罰金，此為抑留剋扣罪，其構成要件為公務員明知應發給之款項物品，卻抑留不發，行為人主觀上僅須具備明知應發給仍抑留不發之故意即足，不以另具意圖得利之主觀要件為必要，凡行為人非因藉此獲取金錢或其他不法利益之目的，而係基於其他動機故意拖延不發者，因欠缺貪污治罪條例§6Ⅰ①所要求之意圖得利要件，僅能論以刑法本項之基礎規定。本案消防局大隊部承辦人B原應於每月10日前發放轄區義消人員之出勤補助費，因B個人對某分隊幾位義消心生不滿，此為其拖延之動機，明知渠等出勤紀錄合於規定應予發給，仍以尚待核章為由持續拖延達半年之久未發放，此一明知應發卻抑留不發之行為核與§129Ⅱ客觀構成要件相符；惟B本人未將該筆款項挪作他用，亦未從中獲取任何利益，純粹出於對特定人之報復心態而抑留不發，此一情節顯示B之主觀動機為報復而非得利，欠缺貪污治罪條例§6Ⅰ①所要求之意圖得利要件，應逕依刑法§129Ⅱ論處，不適用貪污治罪條例之加重規定，惟其拖延期間長達半年之久，情節非輕，仍應從重量處。\n\n結語：B出於報復心態拖延發放義消補助費，因查無意圖得利之情事，應逕依刑法§129Ⅱ抑留不發罪論處，不適用貪污治罪條例§6Ⅰ①之加重規定。"},
  {a:"刑法§130", q:"山地鄉公所建設課課長C及承辦土石流防災業務之技士D明知轄內某處坡地經中央地質調查機關列為土石流高潛勢警戒區，且已發布豪雨特報，仍因人力調度不足而心存「應該不會那麼剛好」之心態，不予理會，未依規定發布警戒疏散通知，亦未協調居民預先避難。當晚豪雨引發土石流，造成該區數戶民宅遭掩埋、居民傷亡。", problem:"問：課長C及技士D未依規定發布警戒疏散致居民傷亡之行為該當何罪？", body:"依刑法§130，公務員廢弛職務釀成災害者，處三年以上十年以下有期徒刑，此為廢弛職務釀災罪，構成要件為行為人具公務員身分、對其職務上應執行之事務消極廢弛不為、且因該廢弛職務之不作為而釀成災害，行為與結果間須具相當因果關係，本罪限於故意犯，行為人須明知怠於執行職務將致生災害風險卻仍消極不予理會，若僅單純過失疏忽未察覺風險，則不構成本罪。本案C、D分別為山地鄉公所建設課課長及承辦土石流防災業務之技士，均為負責轄內土石流防災職務之公務員，二人明知轄內某處坡地經中央地質調查機關列為土石流高潛勢警戒區，且已發布豪雨特報，此已足證其主觀上對於致災風險具有明確認識，卻因人力調度不足而心存應該不會那麼剛好之僥倖心態，不予理會，未依規定發布警戒疏散通知，亦未協調居民預先避難，此一消極不作為核屬明知有致災風險卻仍不予為意之故意廢弛職務，其僥倖心態並非真正之確信不發生而屬未必故意之範疇，仍該當故意要件；當晚豪雨果真引發土石流，造成該區數戶民宅遭掩埋、居民傷亡，二人廢弛職務之不作為與土石流致災結果間具相當因果關係，核與§130構成要件完全相符，C、D應共同或分別論以本罪。\n\n結語：C、D明知坡地屬土石流高潛勢警戒區且已發布豪雨特報，仍心存僥倖未依規定發布疏散通知，因而釀成居民傷亡之土石流災害，均該當刑法§130廢弛職務釀成災害罪。"},
  {a:"刑法§131", q:"鄉公所民政課約僱人員G明知依老人生活津貼申請要點規定，申請人之財產須低於一定額度始符合請領資格，仍在知悉申請人H名下另有一筆未申報之土地、明顯不符資格之情況下，違背規定逕行核准H之津貼申請，使H每月順利請領該項生活津貼。", problem:"問：約僱人員G明知申請人不符資格仍違法核准之行為該當何罪？", body:"依刑法§131，公務員對於主管或監督之事務，明知違背法令，直接或間接圖自己或他人不法利益，因而獲得利益者，處一年以上七年以下有期徒刑，得併科一百萬元以下罰金，此為刑法圖利罪之基礎規定，構成要件須具備明知違背法令、就其主管或監督事務圖自己或他人不法利益、因而獲得利益三項要素，本罪雖亦得為貪污治罪條例§6Ⅰ④主管圖利罪之基礎規範，惟依實務通說見解，鄉鎮市公所之約僱人員依聘用人員相關規定進用，其進用非循公務人員任用程序，一般認其職務性質及身分未必當然具備貪污治罪條例第2條所定公務員之特別要件，個案仍應審酌其是否具有法定職務權限而定，若經審認不具貪污治罪條例特別身分要件，即應回歸適用刑法本條之基礎規定。本案G為鄉公所民政課約僱人員，其負責老人生活津貼申請案件之審核，此為其主管或監督之事務，G明知依老人生活津貼申請要點規定，申請人之財產須低於一定額度始符合請領資格，仍在知悉申請人H名下另有一筆未申報之土地、明顯不符資格之情況下，違背規定逕行核准H之津貼申請，使H每月順利請領該項生活津貼，H因而獲得不法利益，核與明知違背法令、圖他人不法利益、因而獲得利益之構成要件完全相符，應論以刑法§131圖利罪。\n\n結語：約僱人員G明知申請人H不符資格仍違背規定逕行核准其津貼申請，使H獲得不法利益，該當刑法§131圖利罪，處一年以上七年以下有期徒刑。"},
  {a:"刑法§132Ⅱ", q:"警察局偵查隊員警G因辦理某重大案件之搜索票聲請作業，誤將載有該案尚未執行之搜索地點、時間等應秘密消息之公文書檔案，附加於一封原欲寄送其他單位之公務電子郵件中，未察覺附件夾帶錯誤即逕行寄出，導致該應秘密之搜索行動消息提前外流至非相關人員。", problem:"問：員警G誤將搜索機密文件附加寄出之行為該當何罪？", body:"依刑法§132Ⅰ，公務員洩漏或交付關於中華民國國防以外應秘密之文書、圖畫、消息或物品者，處三年以下有期徒刑，此為故意洩密罪，須行為人主觀上具備洩漏之故意；惟§132Ⅱ另設過失犯之處罰規定，因過失犯前項之罪者，處一年以下有期徒刑、拘役或九千元以下罰金，構成要件為公務員雖非出於故意，惟依其情節應注意並能注意而不注意，致該應秘密之消息外洩，即應論以過失洩密罪。本案警員G因辦理某重大案件之搜索票聲請作業，其職務上知悉該案尚未執行之搜索地點、時間等消息，此等資訊涉及執法行動之保密性，核屬國防以外應秘密之消息；G誤將載有該應秘密消息之公文書檔案，附加於一封原欲寄送其他單位之公務電子郵件中，未察覺附件夾帶錯誤即逕行寄出，此一誤附件、未察覺即寄出之過程，顯示G並無洩漏之故意，惟其對於寄送公務郵件前本應仔細核對附件內容之注意義務，依其情節應注意並能注意而未注意，核屬過失，導致該應秘密之搜索行動消息提前外流至非相關人員，此一過失行為與秘密外洩之結果間具因果關係，核與§132Ⅱ過失洩密罪之構成要件完全相符，應論以本罪，其刑度顯較同條第1項故意犯為輕。\n\n結語：G因疏未核對附件致誤將搜索機密文件寄出，其行為屬應注意能注意而不注意之過失，該當刑法§132Ⅱ過失洩密罪，處一年以下有期徒刑、拘役或罰金。"},
  {a:"刑法§132Ⅲ", q:"某大學教授H受衛生局委聘，以外部專家身分參與某傳染病防治應變小組之秘密會議，會後H明知會議中討論之防疫物資調度應變方案屬應秘密消息，為求在學術期刊搶先發表相關分析，故意將該應變方案內容提前透露予媒體記者。", problem:"問：外聘教授H洩漏防疫應變方案內容之行為該當何罪？", body:"依刑法§132Ⅲ，非公務員因職務或業務知悉或持有第一項之文書、圖畫、消息或物品，而洩漏或交付之者，處一年以下有期徒刑、拘役或九千元以下罰金，此為處理非公務員洩漏公務機密之特別規定，構成要件為行為人本身不具公務員身分，惟因參與特定職務或業務而知悉或持有應秘密之公務文書、消息或物品，其後故意洩漏或交付予他人者，即該當本項，此一規定將公務機密之保護範圍擴及因專業參與而知悉機密之外部人士，避免公務機密因委外諮詢或跨領域合作而形成保護漏洞。本案H為某大學教授，其身分本非公務員，惟受衛生局委聘，以外部專家身分參與某傳染病防治應變小組之秘密會議，此即因業務關係參與應秘密之公務程序；會後H明知會議中討論之防疫物資調度應變方案屬應秘密消息，其主觀上已具備明知應秘密之認識，卻為求在學術期刊搶先發表相關分析，此一動機顯示其洩漏行為出於故意而非過失，故意將該應變方案內容提前透露予媒體記者，核與§132Ⅲ非公務員因業務知悉持有應秘密消息而故意洩漏之構成要件完全相符，應論以本項之罪，不能以其學術研究目的作為阻卻違法或減免刑責之事由。\n\n結語：H雖非公務員，惟因參與防疫應變秘密會議而知悉應變方案，為搶先發表故意洩漏予媒體，該當刑法§132Ⅲ非公務員洩密罪，處一年以下有期徒刑、拘役或罰金。"},
  {a:"刑法§213", q:"警察分局某派出所員警I辦理民眾J之失竊機車報案受理後，為美化轄區當月偵查績效統計數字，明知該案尚未偵破、犯嫌尚未查獲，仍在職務上所掌之「刑案偵辦進度管制表」（公文書）上登載「已偵結，贓車尋獲」之不實內容陳報上級，足以生損害於公眾對治安統計數據之信賴及J對案件後續處理之權益。", problem:"問：I之行為該當何罪？", body:"刑法§213規定：「公務員明知為不實之事項，而登載於職務上所掌之公文書，足以生損害於公眾或他人者，處一年以上七年以下有期徒刑。」本罪之成立須具備行為人為公務員、登載於職務上所掌公文書、明知不實、足以生損害於公眾或他人四項要件。本案I為警察機關派出所員警，就其受理之刑案負有製作及登載偵辦進度之職務，屬公務員；I明知該竊盜案尚未偵破、犯嫌尚未查獲之客觀事實，仍於其職務上所掌之「刑案偵辦進度管制表」（性質上屬公文書）登載「已偵結，贓車尋獲」之不實內容陳報上級，核屬明知不實而故意登載於職務上公文書之行為；其虛偽登載一方面足以生損害於公眾對治安統計數據真實性之信賴，另一方面亦足以影響報案人J對其案件後續處理進度之知悉與行使救濟權利，已具備「足以生損害於公眾或他人」之抽象危險結果要件，不以實際發生損害為必要。又I之行為倘另涉及利用職務詐領績效獎金等財產上不法利益，則可能另該當貪污治罪條例相關圖利或詐欺得利罪責，應視I登載不實之動機是否兼具財產上不法所有意圖而併予評價，本案僅係美化統計數字，尚無具體證據顯示涉及財產犯意。\n\n結語：I成立刑法§213公務員登載不實公文書罪。"},
  {a:"刑法§213、貪污治罪條例§6Ⅰ④", q:"建管處建築物使用執照核發案承辦人K辦理廠商L申請之新建工程使用執照案件時，明知L之建物依竣工現場勘驗結果未依原核准圖說完成消防安全設備之設置，不符發照要件，因與L私交甚篤且受L請託，仍在職務上所掌之竣工勘驗紀錄表（公文書）登載「現場勘驗相符，准予核發」之不實內容，使L得以順利取得使用執照並將該批建物對外銷售獲利逾千萬元。", problem:"問：承辦人K為圖利L而登載不實勘驗紀錄之行為該當何罪？", body:"依刑法§213，公務員明知為不實之事項，而登載於其職務上所掌之公文書，足以生損害於公眾或他人者，處一年以上七年以下有期徒刑，此為登載不實文書罪，保護法益為公文書之公共信用；依貪污治罪條例§6Ⅰ④，對於主管或監督之事務，明知違背法令，直接或間接圖自己或其他私人不法利益，因而獲得利益者，處五年以上有期徒刑，保護法益則為公務廉潔性及國家財產，二罪保護法益不同，行為態樣亦可分，登載不實之文書行為、違法圖利之核准行為，應分別評價、數罪併罰，不能僅擇一論罪。本案K為建管處使用執照核發案承辦人，明知L之建物依竣工現場勘驗結果未依原核准圖說完成消防安全設備之設置，不符發照要件，此即明知違背發照相關法令，因與L私交甚篤且受L請託，仍違法核准使用執照，使L獲得順利銷售建物、獲利逾千萬元之不法利益，核與§6Ⅰ④主管圖利罪構成要件相符；K復於其職務上所掌之竣工勘驗紀錄表登載現場勘驗相符，准予核發之不實內容，此一明知不實而登載公文書之行為，足以生損害於公眾及L以外之購屋人，核與刑法§213構成要件相符。\n\n結語：K成立貪污治罪條例§6Ⅰ④主管圖利罪及刑法§213登載不實文書罪，二罪保護法益不同，應數罪併罰。"},
  {a:"刑法§122Ⅱ、刑法§122Ⅲ", q:"某消費爭議仲裁案之仲裁人M，於程序進行前經聲請人N期約：若仲裁判斷為N勝訴，事後給付M現金20萬元，M應允之；N亦依約於仲裁判斷作成前先行交付其中10萬元予M。其後M作成之仲裁判斷罔顧相對人提出之關鍵事證，逕為有利N之判斷，明顯違背其應秉持之公正仲裁義務。", problem:"問：仲裁人M與聲請人N之行為應各如何論罪？", body:"依刑法§122Ⅱ，公務員或仲裁人對於違背職務之行為，因而為違背職務之行為者，處無期徒刑或五年以上有期徒刑，得併科四百萬元以下罰金，本案仲裁人M於程序進行前經聲請人N期約若仲裁判斷為N勝訴、事後給付M現金20萬元，此一以特定有利於N之仲裁結果作為對價之約定，核屬對於違背職務之行為期約賄賂，M應允之，即已該當§122Ⅰ；N復依約於仲裁判斷作成前先行交付其中10萬元予M，M之收受行為，使其違背職務受賄之情節更進一步；其後M作成之仲裁判斷罔顧相對人提出之關鍵事證，逕為有利N之判斷，明顯違背其應秉持之公正仲裁義務，此一因而為違背職務之行為之加重結果已然發生，應優先適用刑度最重之§122Ⅱ，處無期徒刑或五年以上有期徒刑，而非僅論以§122Ⅰ之期約或收受階段。就聲請人N部分，依§122Ⅲ，對於公務員或仲裁人關於違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處三年以下有期徒刑，得併科三十萬元以下罰金，本案N期約並實際交付現金10萬元予M，要求其為違背職務之偏頗仲裁判斷，核與§122Ⅲ構成要件相符，應論以違背職務行賄罪，M、N二人分別成立收賄與行賄罪，各自論處。\n\n結語：仲裁人M因而為違背職務之偏頗仲裁判斷，應論以刑法§122Ⅱ違背職務受賄罪；聲請人N行求並交付賄賂，應論以§122Ⅲ違背職務行賄罪，二人分別論罪。"},
  {a:"刑法§132Ⅰ、刑法§318", q:"某公立醫院採購單位承辦人O於醫療設備採購案評選階段，除故意將本案預算核定之底價（應秘密消息）洩漏予其中一家投標廠商P外，並一併將競爭廠商Q先前投標文件中所載之獨家專利技術規格與成本結構明細（Q之工商秘密，O因職務知悉並持有）一併轉知P，使P得以調整投標策略。", problem:"問：承辦人O洩漏底價並一併洩漏競爭廠商工商秘密之行為該當何罪？", body:"依刑法§132Ⅰ，公務員洩漏或交付關於中華民國國防以外應秘密之文書、圖畫、消息或物品者，處三年以下有期徒刑，本案承辦人O於醫療設備採購案評選階段，故意將本案預算核定之底價洩漏予其中一家投標廠商P，底價核屬國防以外應秘密之消息，O主觀上具備洩漏之故意，客觀上亦有洩漏行為，核與§132Ⅰ構成要件相符，應論以本罪。另依刑法§318，公務員或曾任公務員之人，無故洩漏因職務知悉或持有他人之工商秘密者，處二年以下有期徒刑、拘役或六萬元以下罰金，此罪保護之法益與§132保護機關內部公務機密者不同，係保護公務員因執行職務接觸之他人民間工商秘密，本案O除洩漏底價外，並一併將競爭廠商Q先前投標文件中所載之獨家專利技術規格與成本結構明細轉知P，該等技術規格及成本明細核屬Q之工商秘密，O因職務知悉並持有，其無故將之洩漏予P，使P得以調整投標策略、獲得不當競爭優勢，核與刑法§318構成要件相符，應另論以本罪。O之行為同時觸犯§132Ⅰ及§318二罪，二罪保護法益不同，行為對象亦有別，應分別評價、數罪併罰。\n\n結語：O洩漏採購底價成立刑法§132Ⅰ洩密罪，另洩漏競爭廠商Q之工商秘密成立§318洩漏工商秘密罪，二罪保護法益及對象均不同，應數罪併罰。"},
  {a:"刑法§130、貪污治罪條例§6Ⅰ①", q:"轄區抽水站站長A明知該站抽水設備因年久失修，抽水功能早已大幅衰退、隨時可能故障，仍不予理會，未依規定簽報上級編列經費檢修。轄內里長及居民曾多次反映抽水站疑似故障、要求儘速檢修，A均以「尚可運作」為由置之不理。某次颱風豪雨來襲，抽水站果因設備故障無法及時排水，造成鄰近社區嚴重淹水，多戶民宅泡水受損。災後負責審核並核發淹水救助金之社會局承辦人員B，明知受災戶C等多人均已檢附證明文件、符合請領資格，卻故意拖延近四個月未予核發。B並將待撥付之救助金暫存入自己申辦之定期存款帳戶生息牟利，經C等人多次陳情催促後才勉強撥款了結。", problem:"問：抽水站站長A及社會局承辦人B之行為應各如何論罪？", body:"依刑法§130，公務員廢弛職務釀成災害者，處三年以上十年以下有期徒刑，本案抽水站站長A明知抽水設備因年久失修、抽水功能早已大幅衰退、隨時可能故障，此已足證其主觀上對於故障致災風險具有明確認識，卻仍不予理會，未依規定簽報上級編列經費檢修，即使轄內里長及居民多次反映要求儘速檢修，A仍以尚可運作為由置之不理，此一消極不作為核屬明知有致災風險卻仍不予為意之故意廢弛職務，其後颱風豪雨來襲，抽水站果因設備故障無法及時排水，造成鄰近社區嚴重淹水，A廢弛職務之不作為與淹水致災結果間具相當因果關係，核與§130構成要件相符，A應論以本罪。就社會局承辦人員B部分，依貪污治罪條例§6Ⅰ①，意圖得利，抑留不發職務上應發之財物者，處五年以上有期徒刑，B明知受災戶C等多人均已檢附證明文件、符合請領資格，卻故意拖延近四個月未予核發，此一拖延核屬抑留不發職務上應發之財物，B並將待撥付之救助金暫存入自己申辦之定期存款帳戶生息牟利，此一挪供己用生息之具體行為足證B確有意圖得利之主觀犯意，核與§6Ⅰ①構成要件完全相符，應論以本款之罪。A、B二人所犯罪名各自獨立、行為互不相關，應分別論罪科刑。\n\n結語：站長A明知設備故障風險卻不予理會致釀淹水災害，成立刑法§130廢弛職務釀災罪；承辦人B意圖得利拖延核發救助金並挪為生息，另成立貪污治罪條例§6Ⅰ①抑留不發罪，二人分別論罪。"},
  {a:"貪污治罪條例§4Ⅰ③、刑法§213", q:"某公共工程之監造人員A，於廠商負責人B私下拜訪後，同意於工程施作期間放寬監督標準，並收受B按工程契約總價二成計算、分次交付合計240萬元之現金作為回扣。驗收當日，A明知該工程實際使用之鋼筋規格與數量均與契約圖說不符，未達約定強度標準。A仍在其職務上所掌之驗收紀錄表上，載明「經核對與圖說相符，准予驗收合格」之不實內容。該工程因而順利辦理結算，機關並全額撥付工程款予B所屬公司。", problem:"問：監造人員A收取工程回扣並登載不實驗收紀錄之行為該當何罪？", body:"依貪污治罪條例§4Ⅰ③，建築或經辦公用工程或購辦公用器材、物品，浮報價額、數量、收取回扣或有其他舞弊情事者，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，本案A身為公共工程監造人員，於廠商負責人B私下拜訪後，同意放寬監督標準，並收受B按工程契約總價二成計算、分次交付合計240萬元之現金作為回扣，此一收取鉅額回扣之行為核與§4Ⅰ③經辦公用工程收取回扣構成要件完全相符，應論以本罪，其法定刑高達無期徒刑或十年以上有期徒刑。另依刑法§213，公務員明知為不實之事項，而登載於其職務上所掌之公文書，足以生損害於公眾或他人者，處一年以上七年以下有期徒刑，本案A於驗收當日，明知該工程實際使用之鋼筋規格與數量均與契約圖說不符，未達約定強度標準，此為攸關結構安全之重大不符情事，A仍在其職務上所掌之驗收紀錄表登載經核對與圖說相符，准予驗收合格之不實內容，此一明知不實而登載公文書之行為，足以生損害於公眾及機關，核與刑法§213構成要件相符，應另論以本罪。二罪保護法益不同、行為可分，應分別評價、數罪併罰，該工程因而順利辦理結算並全額撥付工程款，亦印證A之違法行為造成之實害結果重大。\n\n結語：A成立貪污治罪條例§4Ⅰ③經辦公用工程收取回扣罪及刑法§213登載不實文書罪，二罪保護法益不同，應分別論罪、數罪併罰，合併論處其刑責。"},
  {a:"貪污治罪條例§6Ⅰ②、§13Ⅰ", q:"某地政事務所辦理轄內重劃區土地徵收補償查估之承辦人員A，於查估轄內地主B所有之地上物補償金額時，明知B所有之地上物現況與登記面積不符、遠未達補償標準。A仍配合B虛報增列坪數及地上物項目，使徵收補償金額虛增新臺幣320萬元，並自B處收取「好處費」80萬元。A之直屬主管、該地政事務所課長C於例行稽核時，經承辦稽核人員簽報提醒查估明細數據異常，已知悉A涉嫌貪污舞弊。C因與A交情深厚而不予深究，既未依規定簽報調查，亦未陳報上級或司法機關，任由A繼續承辦後續查估業務。", problem:"問：承辦人A及其主管課長C之行為應各如何論罪？", body:"依貪污治罪條例§6Ⅰ②，募集款項或徵用土地、財物，從中舞弊者，處五年以上有期徒刑，得併科新臺幣三千萬元以下罰金，本案承辦人員A於查估地主B所有之地上物補償金額時，明知B所有之地上物現況與登記面積不符、遠未達補償標準，卻仍配合B虛報增列坪數及地上物項目，使徵收補償金額虛增新臺幣320萬元，此一虛增查估金額之行為核屬徵用土地財物從中舞弊之典型態樣，A並自B處收取好處費80萬元，益證其確有圖利意圖並實際獲利，核與§6Ⅰ②構成要件完全相符，應論以本罪。就其直屬主管課長C部分，依§13Ⅰ，直屬主管長官對於所屬人員，明知貪污有據，而予以庇護或不為舉發者，處一年以上七年以下有期徒刑，本案C身為A之直屬主管長官，於例行稽核時，經承辦稽核人員簽報提醒查估明細數據異常，已知悉A涉嫌貪污舞弊，主觀上已具備明知貪污有據之要件，C卻因與A交情深厚而不予深究，既未依規定簽報調查，亦未陳報上級或司法機關，任由A繼續承辦後續查估業務，此一消極不作為核屬不為舉發，核與§13Ⅰ構成要件相符，應論以本罪。A、C二人所犯罪名各自不同、行為分別獨立，應分別論罪科刑。\n\n結語：A虛報查估金額使徵收補償虛增並收取好處費，成立貪污治罪條例§6Ⅰ②募集徵用土地從中舞弊罪；C明知A貪污有據卻不予舉發，另成立§13Ⅰ包庇罪，二人分別論罪。"},
  {a:"刑法§122Ⅱ、Ⅲ", q:"某公共工程履約爭議依採購契約仲裁條款提付仲裁，由仲裁人A獨任審理。他造廠商負責人B為使仲裁結果對己方有利，於仲裁程序進行中私下與A餐敘，並約定若仲裁判斷對B有利，將致贈現金50萬元，A當場應允。其後A於仲裁評議時，明知卷內證據及鑑定報告均不利於B，仍刻意曲解相關證據內容，據以做出有利於B之仲裁判斷。仲裁判斷作成後，A收受B依約交付之現金50萬元。", problem:"問：仲裁人A曲解證據為有利判斷並收賄之行為該當何罪？", body:"依刑法§122Ⅰ，公務員或仲裁人對於違背職務之行為，要求、期約或收受賄賂或其他不正利益者，處三年以上十年以下有期徒刑，本案仲裁人A於仲裁程序進行中私下與廠商負責人B餐敘，並約定若仲裁判斷對B有利、將致贈現金50萬元，A當場應允，此一以特定有利判斷為對價之期約，核屬對於違背職務之行為期約賄賂，已該當§122Ⅰ；惟A其後於仲裁評議時，明知卷內證據及鑑定報告均不利於B，仍刻意曲解相關證據內容，據以做出有利於B之仲裁判斷，此一因而為違背職務之行為之加重結果已然發生，依§122Ⅱ，因而為違背職務之行為者，處無期徒刑或五年以上有期徒刑，得併科四百萬元以下罰金，應優先適用刑度最重之本項；仲裁判斷作成後，A復收受B依約交付之現金50萬元，此一收受行為與先前之期約、違背職務判斷屬同一犯罪事實之接續發展，應併入同一罪名整體評價，不另論罪。就廠商負責人B部分，依§122Ⅲ，對於公務員或仲裁人關於違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處三年以下有期徒刑，B期約並實際交付現金50萬元予A，要求其為違背職務之偏頗仲裁判斷，核與§122Ⅲ構成要件相符，應論以違背職務行賄罪。\n\n結語：仲裁人A因而曲解證據為有利於B之違背職務仲裁判斷並收受賄賂，應論以刑法§122Ⅱ違背職務受賄罪；廠商負責人B期約並交付賄賂，應論以§122Ⅲ違背職務行賄罪。"},
  {a:"貪污治罪條例§11Ⅱ、§12Ⅱ", q:"長期承攬某消防分隊清潔養護業務之廠商負責人A，感念倉管人員B平日驗收物料時從未刁難、均依規定辦理。農曆年前，A攜帶內含現金6千元之禮盒至倉庫，欲交予B表達謝意。B當場婉拒並請A將禮盒攜回，未予收受，A仍執意將禮盒留置於驗收台上逕自離去。B事後隨即將此事陳報主管處理，全案未有任何配合驗收放水之情事。", problem:"問：廠商負責人A留置禮盒欲交予倉管人員B之行為應如何論罪？", body:"依貪污治罪條例§11Ⅱ，對於第2條人員，關於不違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處三年以下有期徒刑、拘役或科或併科新臺幣五十萬元以下罰金，本案A長期承攬消防分隊清潔養護業務，感念倉管人員B平日驗收物料時從未刁難、均依規定辦理，A攜帶內含現金6千元之禮盒欲交予B表達謝意，其目的並非要求B違背職務放水驗收，而係針對B原即依規定正常辦理之職務行為表達感謝，核屬不違背職務之行為之對價餽贈，B當場婉拒並請A將禮盒攜回，未予收受，A仍執意將禮盒留置於驗收台上逕自離去，此一交付行為業已完成，蓋交付賄賂罪之既遂不以相對人是否受領入己為必要，行為人單方將財物置於相對人可得支配之處所並離去，即已完成交付行為，核與§11Ⅱ構成要件相符，A應論以不違背職務行賄罪；B因當場婉拒且事後隨即將此事陳報主管處理，全案未有任何配合驗收放水之情事，B本身不成立任何犯罪。就減刑事由而言，依§12Ⅱ，犯前條第一項至第四項之罪，情節輕微，而其行求、期約或交付之財物或不正利益在新臺幣五萬元以下者，亦同，本案禮盒內現金僅6千元，金額甚微且情節輕微，A得依§12Ⅱ規定減輕其刑。\n\n結語：A將內含現金之禮盒留置驗收台交付B，雖遭拒收，仍該當貪污治罪條例§11Ⅱ不違背職務行賄罪，因金額僅6千元情節輕微，得依§12Ⅱ規定減輕其刑；B則因婉拒並陳報主管而不成立犯罪。"},
  {a:"刑法§132Ⅰ、貪污治罪條例§6Ⅰ④、刑法§213", q:"某機關辦理公共工程採購案之承辦人員A，明知本案預算底價屬其職務上知悉、應秘密之消息，為使私交甚篤之廠商負責人B得以精準備標、順利得標，於開標前一日以通訊軟體私訊告知B底價金額。開標當日，A復利用其為本案採購承辦人之權限，明知B所屬公司投標文件之保證金繳納方式不符招標文件規定、應屬不合格標，仍違反採購規定逕行認定為合格標，使B所屬公司得以些微差距險勝其餘競標廠商順利得標。為掩飾前開違法認定之情事，A並於其職務上所掌之採購評選紀錄表上，登載該公司「保證金繳納方式核與招標文件規定相符」之不實內容。B所屬公司因而順利取得工程承攬權，獲利達220萬元。", problem:"問：承辦人A洩漏底價、違法認定合格標並登載不實之行為應如何論罪？", body:"本案承辦人A之行為涉及三個層次：其一，依刑法§132Ⅰ，公務員洩漏或交付關於中華民國國防以外應秘密之文書、圖畫、消息或物品者，處三年以下有期徒刑，A明知本案預算底價屬其職務上知悉、應秘密之消息，為使廠商B得以精準備標，於開標前一日私訊告知B底價金額，核與本罪構成要件相符，應論以洩密罪。其二，依貪污治罪條例§6Ⅰ④，對於主管或監督之事務，明知違背法令，直接或間接圖自己或其他私人不法利益，因而獲得利益者，處五年以上有期徒刑，A明知B所屬公司投標文件之保證金繳納方式不符招標文件規定、應屬不合格標，此即明知違背採購法令，仍違反規定逕行認定為合格標，使B所屬公司得以順利得標並獲利220萬元，核與主管圖利罪構成要件相符，應論以本罪。其三，依刑法§213，A為掩飾前開違法認定情事，於其職務上所掌之採購評選紀錄表登載保證金繳納方式核與招標文件規定相符之不實內容，足以生損害於公眾及機關採購程序之公正性，核與登載不實文書罪構成要件相符。三罪保護法益各自不同，行為態樣可分為洩密、違法認定、登載不實三個獨立行為，應分別評價、數罪併罰。\n\n結語：A成立刑法§132Ⅰ洩密罪、貪污治罪條例§6Ⅰ④主管圖利罪及刑法§213登載不實文書罪，三罪保護法益互異且行為可分，應分別論罪、數罪併罰。"},
  {a:"貪污治罪條例§4Ⅰ①、§8Ⅰ", q:"消防分隊裝備保管人員甲，明知分隊之緊急救護器材均屬公用財物，仍利用職務上保管之機會，將其中2組空氣呼吸器攜出轉售予他人，得款4萬元。案發前，甲於該事尚未被任何人發覺前，即主動向政風單位自首並繳交全部所得價金。", problem:"問：甲侵占公用器材後於案發前自首之行為應如何論罪？", body:"依貪污治罪條例§4Ⅰ①，竊取或侵占公用或公有器材、財物者，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，本案甲係消防分隊裝備保管人員，明知分隊之緊急救護器材均屬公用財物，仍利用職務上保管之機會，將其中2組空氣呼吸器攜出轉售予他人，得款4萬元，此一將自己職務上保管之公用財物變易為己有並處分之行為，核與§4Ⅰ①侵占公用財物構成要件完全相符，應論以本罪。就其犯後態度部分，依§8Ⅰ，犯第四條至第六條之罪，於犯罪後自首，如有所得並自動繳交全部所得財物者，減輕或免除其刑；因而查獲其他正犯或共犯者，免除其刑，此為自首並繳回全部所得之優惠規定，其效果較偵查中自白僅減輕其刑更為優惠，蓋自首者發生於犯罪尚未被有偵查權機關發覺前，可責性較低，故法律給予減輕或免除其刑之較大優惠幅度。本案甲於該事尚未被任何人發覺前，即主動向政風單位自首並繳交全部所得價金，其時點核屬案發前之自首，且已自動繳交全部所得4萬元，符合§8Ⅰ自首並繳回全部所得之要件，應依§8Ⅰ規定減輕或免除其刑，法院並得斟酌具體情節決定減輕之幅度或逕予免除其刑，較單純偵查中自白之減刑效果更為有利於甲。\n\n結語：甲侵占公用之空氣呼吸器該當貪污治罪條例§4Ⅰ①侵占公用財物罪，惟因其於案發前主動向政風單位自首並繳回全部所得，依§8Ⅰ規定得減輕或免除其刑。"},
  {a:"貪污治罪條例§4Ⅰ③、§12Ⅰ", q:"公共工程監造人員乙於某道路修繕工程施作期間，明知承包商實際施作面積較契約圖說短少一成，仍於估驗計價單上記載已全數依圖說完成，並向承包商收取估驗金額之回扣，合計新臺幣3萬元。", problem:"問：監造人員乙明知施作面積短少仍照實估驗收取回扣之行為該當何罪？", body:"依貪污治罪條例§4Ⅰ③，建築或經辦公用工程或購辦公用器材、物品，浮報價額、數量、收取回扣或有其他舞弊情事者，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，本案乙身為公共工程監造人員，於道路修繕工程施作期間，明知承包商實際施作面積較契約圖說短少一成，此一施作不足之情形已構成應予扣款或不予驗收之重大瑕疵，乙仍於估驗計價單上記載已全數依圖說完成，此一虛偽估驗登載之行為核屬浮報數量及其他舞弊情事之結合態樣，並向承包商收取估驗金額之回扣，合計新臺幣3萬元，收賄與放水估驗二行為緊密結合、互為對價，均應併入同一§4Ⅰ③罪名整體評價，核與本款構成要件完全相符，應論以本罪，其法定刑高達無期徒刑或十年以上有期徒刑。就減刑事由而言，依§12Ⅰ，犯第四條至第六條之罪，情節輕微，而其所得或所圖得財物或不正利益在新臺幣五萬元以下者，減輕其刑，本案乙所收取之回扣金額為3萬元，未逾新臺幣五萬元之情節輕微門檻，雖§4屬貪污治罪條例刑度最重之條文，惟§12Ⅰ之減刑規定並未區分係適用第四條、第五條或第六條之罪，凡所得或所圖得財物在五萬元以下且情節輕微者，均得依§12Ⅰ規定主張減輕其刑，本案乙自得依此規定請求減輕其刑。\n\n結語：乙明知施作面積短少仍照實估驗並收取回扣，該當貪污治罪條例§4Ⅰ③經辦公用工程收取回扣罪，因所得3萬元未逾五萬元情節輕微門檻，得依§12Ⅰ規定減輕其刑。"},
  {a:"貪污治罪條例§5Ⅰ③、§8Ⅱ", q:"稅捐稽徵人員丙於辦理民眾營業稅核定作業之職務上行為過程中，收受納稅義務人交付之現金6萬元。案經檢舉由檢察官分案偵辦後，丙於偵查中即坦承犯行，並自動繳交全部所得財物。", problem:"問：丙收受現金後於偵查中坦承並繳回應如何論罪？", body:"依貪污治罪條例§5Ⅰ③，對於職務上之行為，要求、期約或收受賄賂或其他不正利益者，處七年以上有期徒刑，得併科新臺幣六千萬元以下罰金，本案稅捐稽徵人員丙於辦理民眾營業稅核定作業之職務上行為過程中，收受納稅義務人交付之現金6萬元，依題示情節並未見丙有何違法放寬核定標準或違背應予核定義務之情事，堪認其僅係針對本應依法辦理之營業稅核定職務行為收受對價，核與§5Ⅰ③對於職務上之行為收受賄賂之構成要件相符，應論以不違背職務受賄罪，而非刑度更重之違背職務收賄罪。就其犯後態度部分，依§8Ⅱ，犯第四條至第六條之罪，在偵查中自白，如有所得並自動繳交全部所得財物者，減輕其刑；因而查獲其他正犯或共犯者，減輕或免除其刑，本案丙係案經檢舉由檢察官分案偵辦後，於偵查中即坦承犯行，並自動繳交全部所得財物，其時點核屬案發後之偵查中自白，而非案發前之自首，應依§8Ⅱ規定減輕其刑。另就是否符合§12Ⅰ情節輕微減刑而言，本案丙所收受之6萬元已逾新臺幣五萬元之情節輕微門檻，故不得再依§12Ⅰ主張情節輕微減刑，僅得依§8Ⅱ偵查中自白之規定減輕其刑，二者不可混淆。\n\n結語：丙收受6萬元對價成立貪污治罪條例§5Ⅰ③不違背職務受賄罪，因偵查中自白並繳回全部所得，依§8Ⅱ規定應減輕其刑，惟因金額逾五萬元，不得另依§12Ⅰ主張情節輕微減刑。"},
  {a:"貪污治罪條例§5Ⅰ①、§12Ⅰ", q:"地方稅務局代收稅款人員丁意圖獲取資金運用之利益，將應解庫之稅款延後入帳2週，先行挪用於個人資金調度，該筆挪用款項合計新臺幣2萬元，待有進帳後即補足解繳。", problem:"問：丁挪用小額稅款供己資金調度之行為應如何論罪？", body:"依貪污治罪條例§5Ⅰ①，意圖得利，擅提或截留公款或違背法令收募稅捐或公債者，處七年以上有期徒刑，得併科新臺幣六千萬元以下罰金，本案丁為地方稅務局代收稅款人員，意圖獲取資金運用之利益，此即意圖得利之主觀要件，將應解庫之稅款延後入帳2週，先行挪用於個人資金調度，此一延後入帳、先行挪用之行為核屬截留應行解繳之公款，二者結合，丁之行為完全該當§5Ⅰ①擅提截留公款罪之構成要件，應論以本罪，縱其待有進帳後即補足解繳，亦不影響其截留行為於挪用當下即已既遂之認定。就減刑事由而言，依§12Ⅰ，犯第四條至第六條之罪，情節輕微，而其所得或所圖得財物或不正利益在新臺幣五萬元以下者，減輕其刑，本案丁所挪用之款項合計新臺幣2萬元，且挪用期間僅2週，相較於長期截留鉅額公款之情形，情節顯屬輕微，該筆挪用款項金額未逾新臺幣五萬元之門檻，堪認同時符合金額及情節輕微二項要件，丁得依§12Ⅰ規定請求減輕其刑，此一減刑事由之適用，並不因§5條屬貪污治罪條例中刑度次重之條文而受影響，蓋§12Ⅰ之減刑規定明文及於第四條至第六條之罪，並未排除第五條之適用。\n\n結語：丁意圖獲取資金運用利益而截留稅款2萬元供己周轉，該當貪污治罪條例§5Ⅰ①擅提截留公款罪，因金額與情節均屬輕微，得依§12Ⅰ規定減輕其刑。"},
  {a:"貪污治罪條例§6Ⅰ③、§8Ⅰ", q:"警察分局扣押物保管人員戊職務上保管一批因案扣押之私人所有名貴手錶，戊利用職務上持有保管之機會，將其中1只手錶取出變賣，得款5萬元。案發前戊良心不安，於尚未被任何人發覺前主動向督察單位自首，並繳交全部所得價金。", problem:"問：戊變賣扣押手錶後於案發前自首之行為應如何論罪？", body:"依貪污治罪條例§6Ⅰ③，竊取或侵占職務上持有之非公用私有器材、財物者，處五年以上有期徒刑，得併科新臺幣三千萬元以下罰金，本案戊為警察分局扣押物保管人員，職務上保管一批因案扣押之私人所有名貴手錶，該等物品雖經扣押保管，其所有權仍屬案關被告私人所有，核屬非公用私有財物，戊利用職務上持有保管之機會，將其中1只手錶取出變賣，得款5萬元，此一將自己職務上持有他人所有之物變易為己有並處分之行為，核屬侵占，與§6Ⅰ③構成要件完全相符，應論以本罪。就其犯後態度部分，依§8Ⅰ，犯第四條至第六條之罪，於犯罪後自首，如有所得並自動繳交全部所得財物者，減輕或免除其刑，本案戊於良心不安後，於尚未被任何人發覺前主動向督察單位自首，並繳交全部所得價金，其時點核屬犯罪未經發覺前之自首，且已自動繳交全部所得5萬元，符合§8Ⅰ自首並繳回全部所得之要件，應依§8Ⅰ規定減輕或免除其刑，其效果較僅適用偵查中自白減輕其刑更為優惠。惟因所得金額為5萬元，是否符合§12Ⅰ情節輕微減刑之五萬元以下門檻，因條文文義係在新臺幣五萬元以下，5萬元應認在此範圍內，戊亦得一併主張§12Ⅰ減刑。\n\n結語：戊變賣職務上保管之扣押手錶該當貪污治罪條例§6Ⅰ③侵占職務上持有非公用私有財物罪，因其案發前主動自首並繳回全部所得，依§8Ⅰ規定得減輕或免除其刑，並得依§12Ⅰ併主張情節輕微減刑。"},
  {a:"貪污治罪條例§6Ⅰ④、§12Ⅰ", q:"區公所承辦人己明知某社福團體之補助申請不符資格要件，仍違背相關法規逕行核准通過，使該團體獲得補助利益新臺幣4萬元。", problem:"問：承辦人己明知申請不符資格仍違法核准補助之行為該當何罪？", body:"依貪污治罪條例§6Ⅰ④，對於主管或監督之事務，明知違背法律、法律授權之法規命令、職權命令、自治條例、自治規則、委辦規則或其他對多數不特定人民就一般事項所作對外發生法律效果之規定，直接或間接圖自己或其他私人不法利益，因而獲得利益者，處五年以上有期徒刑，得併科新臺幣三千萬元以下罰金，本案己為區公所承辦人，其職務為審核社福團體之補助申請，此為其主管或監督之事務，己明知某社福團體之補助申請不符資格要件，此即明知違背補助相關法規，仍違背相關法規逕行核准通過，使該團體獲得補助利益新臺幣4萬元，此一明知違背法令、直接圖利特定社福團體、並使其因而獲得利益之行為，核與§6Ⅰ④構成要件完全相符，應論以主管圖利罪。就減刑事由而言，依§12Ⅰ，犯第四條至第六條之罪，情節輕微，而其所得或所圖得財物或不正利益在新臺幣五萬元以下者，減輕其刑，本案該社福團體所獲補助利益為新臺幣4萬元，未逾新臺幣五萬元之情節輕微門檻，得依§12Ⅰ規定減輕其刑；應注意者，本罪為結果犯，須因而獲得利益始成立既遂，本案社福團體已實際獲得4萬元補助款，構成要件已然既遂，己不得以其自身並未獲利為由主張不成立犯罪。\n\n結語：己明知社福團體不符資格仍違法核准補助，使其獲得不法利益4萬元，該當貪污治罪條例§6Ⅰ④主管圖利罪，因金額未逾五萬元情節輕微，得依§12Ⅰ規定減輕其刑。"},
  {a:"貪污治罪條例§4Ⅰ⑤、§8Ⅱ", q:"建管處承辦人員庚收受廠商辛交付之現金20萬元後，違背應予駁回之法定義務，違法核准辛之違章建築就地合法申請。案經查獲後，庚於偵查中除坦承犯行、自動繳交全部所得財物外，並供出辛交付賄款之詳細經過，檢察官因而查獲辛涉犯行賄罪嫌。", problem:"問：庚違法核准並於偵查中供出辛行賄經過應如何論罪？", body:"依貪污治罪條例§4Ⅰ⑤，對於違背職務之行為，要求、期約或收受賄賂或其他不正利益者，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，本案建管處承辦人員庚收受廠商辛交付之現金20萬元後，違背應予駁回之法定義務，違法核准辛之違章建築就地合法申請，此一不應為而為之違背職務行為與收賄之對價關係明確，核與§4Ⅰ⑤構成要件完全相符，應論以違背職務收受賄賂罪。就其犯後態度部分，依§8Ⅱ，犯第四條至第六條之罪，在偵查中自白，如有所得並自動繳交全部所得財物者，減輕其刑；因而查獲其他正犯或共犯者，減輕或免除其刑，本案庚係案經查獲後，於偵查中除坦承犯行、自動繳交全部所得財物外，並供出辛交付賄款之詳細經過，檢察官因而查獲辛涉犯行賄罪嫌，此一因而查獲其他正犯或共犯之情節，已超越單純偵查中自白繳回所得之基本要件，依§8Ⅱ後段規定，效果應提升為減輕或免除其刑，而非僅單純減輕其刑，此一因查獲共犯而效果提升之機制，即為污點證人政策之具體展現，較單純自白繳回而未查獲他人之情形更為優惠。\n\n結語：庚收賄違法核准辛之違章建築就地合法申請，成立貪污治罪條例§4Ⅰ⑤違背職務收受賄賂罪，因其偵查中自白繳回所得並供出使檢方查獲辛之行賄犯行，依§8Ⅱ後段規定應減輕或免除其刑。"},
  {a:"貪污治罪條例§11Ⅰ、§12Ⅱ", q:"消防安全設備商廠商負責人壬，為使其產品得以優先通過消防局年度巡迴汰換案評選，私下向承辦審查人員癸提出致贈現金1萬5千元之要求，癸當場嚴詞拒絕，未予收受。", problem:"問：廠商負責人壬向承辦人癸提出致贈現金之要求應如何論罪？", body:"依貪污治罪條例§11Ⅰ，對於第2條人員，關於違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金，本案壬為使其產品得以優先通過消防局年度巡迴汰換案評選，此一要求癸違反公平評選原則、給予其產品不當優先待遇之目的，核屬要求癸為違背職務之行為，壬私下向承辦審查人員癸提出致贈現金1萬5千元之要求，此一提出行求賄賂之意思表示，依§11Ⅰ行求之行為態樣，不問明示或暗示、亦不問對方是否允諾，行為人一經向對方表示行求賄賂之意，本罪即屬既遂，本案癸雖當場嚴詞拒絕、未予收受，惟壬行求賄賂之行為於提出當下已然完成並既遂，不因癸拒絕收受而阻卻既遂之成立，核與§11Ⅰ構成要件相符，壬應論以違背職務行賄罪；癸因當場拒絕，未成立任何犯罪。就減刑事由而言，依§12Ⅱ，犯前條第一項至第四項之罪，情節輕微，而其行求、期約或交付之財物或不正利益在新臺幣五萬元以下者，亦同，本案壬行求之金額為1萬5千元，未逾新臺幣五萬元之門檻，情節亦屬輕微，壬得依§12Ⅱ規定請求減輕其刑。\n\n結語：壬向承辦人癸行求現金以求產品優先通過評選，縱遭拒收，仍該當貪污治罪條例§11Ⅰ違背職務行賄罪，因金額僅1萬5千元情節輕微，得依§12Ⅱ規定減輕其刑。"},
  {a:"貪污治罪條例§11Ⅲ、§12Ⅱ", q:"本國廠商負責人甲為使公司產品得以列入某友邦政府之採購名冊，透過當地代理人交付該國承辦官員現金等值新臺幣4萬元，作為順利列冊之對價。", problem:"問：本國廠商甲透過代理人交付友邦官員現金之行為該當何罪？", body:"依貪污治罪條例§11Ⅲ，對於外國、大陸地區、香港或澳門之公務員，就跨區貿易、投資或其他商業活動有關事項，為前二項行為者，依前二項規定處斷，本案甲為使公司產品得以列入某友邦政府之採購名冊，此核屬跨區貿易有關事項，透過當地代理人交付該國承辦官員現金等值新臺幣4萬元，作為順利列冊之對價，此一行賄目的僅在使該國官員將其產品列入採購名冊，係求取程序上之便利或優先待遇，並非要求該國官員違法為原不應通過之核准，性質上應歸類為不違背職務之行賄行為，依§11Ⅲ準用§11Ⅱ規定，處三年以下有期徒刑、拘役或科或併科新臺幣五十萬元以下罰金；又依§11Ⅳ，不具第2條人員之身分而犯前三項之罪者，亦同，甲雖非公務員，此規定並不影響其成立行賄罪之判斷，蓋行賄罪之處罰主體本即通常為非公務員之一般人民。就減刑事由而言，依§12Ⅱ，犯前條第一項至第四項之罪，情節輕微，而其行求、期約或交付之財物或不正利益在新臺幣五萬元以下者，亦同，本案交付之現金等值新臺幣4萬元，未逾新臺幣五萬元之門檻，情節亦屬輕微，甲得依§12Ⅱ規定請求減輕其刑，此一減刑規定於涉外行賄案件同樣有其適用，不因行賄對象為外國公務員而受影響。\n\n結語：甲透過代理人交付友邦官員現金以求產品列入採購名冊，該當貪污治罪條例§11Ⅲ準用§11Ⅱ不違背職務行賄罪，因金額4萬元未逾五萬元情節輕微，得依§12Ⅱ規定減輕其刑。"},
  {a:"貪污治罪條例§11Ⅳ、§12Ⅱ", q:"民眾乙受友人即廠商負責人丙之請託，代為將現金3萬元轉交予工程承辦人丁，作為丁於驗收時從寬認定之對價，惟乙本身並非該工程廠商之股東或員工，亦不具公務員身分，單純代為轉交。", problem:"問：受託代轉交賄款之民眾乙是否成立行賄罪？", body:"依貪污治罪條例§11Ⅳ，不具第2條人員之身分而犯前三項之罪者，亦同，此一規定明文將行賄罪之處罰主體擴及不具公務員身分之一般人民，無論行賄者本身是否為交易之利害關係人，僅單純代為轉交賄款者，只要其主觀上明知所交付者係作為公務員違背或不違背職務行為對價之賄賂，客觀上並有交付之行為，即可能成立行賄罪之正犯或共犯，不因其僅係代為轉交、非利害關係人本身而免責。本案民眾乙受友人即廠商負責人丙之請託，代為將現金3萬元轉交予工程承辦人丁，作為丁於驗收時從寬認定之對價，此一從寬認定之目的核屬要求丁為違背職務之驗收行為，乙明知該筆現金之對價性質仍予代為轉交，其行為核屬交付賄賂之構成要件，雖乙本身並非該工程廠商之股東或員工，亦不具公務員身分，惟依§11Ⅳ規定，仍應與具行賄故意之丙同依§11Ⅰ違背職務行賄罪之相關規定論處，不因其僅係單純代為轉交而免責。就減刑事由而言，依§12Ⅱ，本案交付金額3萬元，未逾新臺幣五萬元之門檻，情節亦屬輕微，乙、丙均得依§12Ⅱ規定請求減輕其刑。\n\n結語：乙受託代為轉交賄款予驗收承辦人丁，雖不具公務員身分亦非廠商股東員工，依貪污治罪條例§11Ⅳ規定仍應論以違背職務行賄罪，因金額3萬元情節輕微，得依§12Ⅱ減輕其刑。"}

];

const PAGE_SIZE = 20;
const state = {
  admin: { data: ADMIN, page: 1 },
  corrupt: { data: CORRUPT, page: 1 }
};

function totalPages(data){
  return Math.max(1, Math.ceil(data.length / PAGE_SIZE));
}

function render(key){
  const s = state[key];
  const paneId = "pane-" + key;
  const total = totalPages(s.data);
  if(s.page > total) s.page = total;
  if(s.page < 1) s.page = 1;
  const start = (s.page - 1) * PAGE_SIZE;
  const pageItems = s.data.slice(start, start + PAGE_SIZE);

  const list = document.getElementById(paneId + "-list");
  list.innerHTML = pageItems.map((item, i) => `
    <div class="q-card" data-idx="${start + i}">
      <div class="q-head">
        <div class="q-num">${start + i + 1}</div>
        <div style="flex:1;">
          <div class="q-text">${item.q}</div>
          ${item.problem ? `<div class="q-prompt">${item.problem}</div>` : ""}
          <div class="hint">點擊查看${item.body ? "參考答案" : "適用法條"}</div>
          <div class="q-answer">
            <div class="ans-law">${item.a}</div>
            ${item.body ? `<div class="ans-body">${item.body}</div>` : ""}
          </div>
        </div>
      </div>
    </div>
  `).join("");
  list.querySelectorAll(".q-card").forEach(card => {
    card.addEventListener("click", () => {
      card.classList.toggle("revealed");
      updateProgress();
    });
  });

  renderPagination(key, total);
  updateProgress();
}

function renderPagination(key, total){
  const wrap = document.getElementById("pane-" + key + "-pagination");
  const page = state[key].page;
  let html = `<button data-page="${page-1}" ${page<=1?"disabled":""}>‹ 上一頁</button>`;
  for(let p = 1; p <= total; p++){
    html += `<button data-page="${p}" class="${p===page?"active":""}">${p}</button>`;
  }
  html += `<button data-page="${page+1}" ${page>=total?"disabled":""}>下一頁 ›</button>`;
  wrap.innerHTML = html;
  wrap.querySelectorAll("button[data-page]").forEach(btn => {
    btn.addEventListener("click", () => {
      state[key].page = parseInt(btn.dataset.page, 10);
      render(key);
      document.querySelector(".tabs").scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
}

function shuffleArr(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

shuffleArr(ADMIN);
shuffleArr(CORRUPT);
render("admin");
render("corrupt");

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("pane-" + btn.dataset.tab).classList.add("active");
    updateProgress();
  });
});

function activeKey(){
  return document.getElementById("pane-admin").classList.contains("active") ? "admin" : "corrupt";
}
function updateProgress(){
  const pane = document.querySelector(".tab-pane.active");
  const total = pane.querySelectorAll(".q-card").length;
  const done = pane.querySelectorAll(".q-card.revealed").length;
  const key = activeKey();
  document.getElementById("progressText").textContent = `本頁已顯示 ${done} / ${total} 題（第 ${state[key].page} / ${totalPages(state[key].data)} 頁）`;
}

document.getElementById("revealAll").addEventListener("click", () => {
  document.querySelector(".tab-pane.active").querySelectorAll(".q-card").forEach(c => c.classList.add("revealed"));
  updateProgress();
});
document.getElementById("hideAll").addEventListener("click", () => {
  document.querySelector(".tab-pane.active").querySelectorAll(".q-card").forEach(c => c.classList.remove("revealed"));
  updateProgress();
});
document.getElementById("shuffleBtn").addEventListener("click", () => {
  const key = activeKey();
  shuffleArr(state[key].data);
  state[key].page = 1;
  render(key);
});

updateProgress();
</script>
</body>
