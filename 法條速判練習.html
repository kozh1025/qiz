<style>
  :root{
    --bg:#f5f4f0; --card:#ffffff; --ink:#2b2a28; --sub:#6b6a66;
    --accent:#6a4a8a; --accent2:#8a3b3b; --line:#e5e2da;
    --good:#2f7d4f; --good-bg:#eaf5ee;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:880px;margin:0 auto;padding:40px 20px 100px;}
  h1{font-size:1.5rem;margin:0 0 6px;}
  .subtitle{color:var(--sub);font-size:.9rem;margin-bottom:20px;line-height:1.7;}
  .note{background:#fbf9f5;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 16px;font-size:.85rem;color:#55524c;line-height:1.8;margin-bottom:24px;}

  .tabs{display:flex;gap:8px;margin-bottom:18px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:10;border-bottom:1px solid var(--line);}
  .tab-btn{flex:1;padding:12px 10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:.92rem;font-weight:600;cursor:pointer;color:var(--sub);transition:.15s;}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tab-btn:nth-child(2).active{background:var(--accent2);border-color:var(--accent2);}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;font-size:.82rem;color:var(--sub);}
  .toolbar button{font-size:.8rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);}
  .toolbar button:hover{background:var(--line);}
  .progress{margin-left:auto;font-size:.8rem;color:var(--sub);}

  .tab-pane{display:none;}
  .tab-pane.active{display:block;}

  .q-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s;}
  .q-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .q-head{display:flex;align-items:flex-start;gap:10px;}
  .q-num{flex-shrink:0;width:26px;height:26px;border-radius:7px;background:var(--line);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;}
  .q-text{flex:1;font-size:.93rem;line-height:1.9;}
  .q-text b{color:var(--ink);}
  .q-answer{display:none;margin-top:12px;padding:10px 14px;background:var(--good-bg);border-radius:8px;font-size:.9rem;color:var(--good);font-weight:700;letter-spacing:.02em;}
  .q-card.revealed .q-answer{display:block;}
  .q-card.revealed{border-color:var(--good);}
  .hint{font-size:.75rem;color:#a09d95;margin-top:2px;}
  .q-card.revealed .hint{display:none;}

  .pagination{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin:20px 0 8px;}
  .pagination button{font-size:.8rem;min-width:34px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);}
  .pagination button:hover:not(:disabled){background:var(--line);}
  .pagination button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .pagination button:disabled{opacity:.4;cursor:default;}
  #pane-corrupt .pagination button.active{background:var(--accent2);border-color:var(--accent2);}

  footer{margin-top:40px;text-align:center;color:#b3b0a8;font-size:.76rem;}
</style>
</head>

<script>
const ADMIN = [
  {a:"§9", q:"消防局裁罰某工廠「未依規定進行消防安全設備複查」，承辦人僅以工廠逾期未申報之系統紀錄作為裁罰依據；工廠負責人提出當月台電線路施工導致廠區停電、系統無法連線申報之台電施工公告及維修紀錄佐證，惟承辦人員以「申報逾期為客觀事實」為由，未予調查即逕行裁處最高額罰鍰。"},
  {a:"§33Ⅲ", q:"阿強向消防局申請某承辦員迴避，消防局審查後認定阿強所述純屬臆測、並無具體事證，予以駁回。阿強不服該駁回決定，遲至決定送達後第20日，始向上級機關提請覆決。"},
  {a:"§135", q:"消防局為強化轄區防救災量能，與民間救護車公司簽訂契約，約定由消防局提供部分經費補助及無線電設備，救護車公司則負有於轄區發生重大災害時接受消防局指揮調度出勤之義務，雙方就此公法上權利義務關係，以書面契約明定之。"},
  {a:"§92Ⅱ", q:"消防局於某工廠火警搶救現場，對於現場圍觀之不特定民眾以擴音器公告「本管制區域即日起禁止進入，違者依法處罰」，該公告之相對人雖非特定個人，惟依「進入管制區域者」之特徵可得確定其範圍，並對外直接發生禁止進入之法律效果。"},
  {a:"§15Ⅰ、Ⅲ", q:"某市政府未經任何法規授權，直接以「內部行政規則」將原屬其本身之違規裁罰權限，下放給所屬消防局及各消防大隊，由各大隊自行以自己名義開單裁罰，亦未將委任事項及法規依據公告或刊登政府公報。阿明收到某消防大隊開立之裁處書後提出質疑。"},
  {a:"§168、§46Ⅱ①", q:"阿明發現鄰居場所疑似違規堆置易燃物，向消防局陳情請求查處，消防局派員查察後認定屬實並已裁罰。阿明其後基於後續民事求償需要，向消防局申請閱覽該案調查卷宗，消防局僅提供部分現場照片，就承辦人員內部研擬之簽稿部分予以拒絕。"},
  {a:"§111①、§117", q:"消防局同一年度對甲、乙兩工廠分別開立裁處書：對甲工廠之裁處書完全未記載作成機關名稱；對乙工廠之裁處書則因承辦人員援引法條錯誤，屬得撤銷之違法瑕疵，惟乙工廠並無信賴不值得保護之情事。"},
  {a:"§5", q:"消防局對甲君之工廠開立限期改善通知單，通知單上僅記載「請將廠內不安全之處全數改善完畢，並比照法規要求辦理」，未具體指明應改善之項目、地點或內容為何。甲君詳閱後仍無法確認究竟應更換滅火器、改善逃生動線，抑或修繕警報系統，遂向消防局申請釋疑，惟承辦人員僅重申前開文字，未進一步說明。"},
  {a:"§22Ⅱ", q:"16歲之小明未經父母同意，自行前往消防局申請核發其住家之消防安全檢查合格證明，並於申請書上自行簽名，承辦人員發現小明尚未成年，依規定告知應由其法定代理人代為辦理該項申請。"},
  {a:"§123③、§127Ⅰ", q:"消防局核准甲君之危險物品儲放場所設立許可，並附加「三年內不得變更為其他用途，否則應繳回全額補助款」之負擔。甲君其後一年即將場所變更為其他營業用途，消防局依法廢止原許可，並要求甲君返還已受領之補助款項。"},
  {a:"§154Ⅰ", q:"消防署擬訂新版《各類場所消防安全設備設置標準》，承辦人員認為僅屬技術性規範調整，遂逕行簽請長官核定後即予發布施行，未先於政府公報或新聞紙公告草案內容，亦未開放外界於一定期間內陳述意見，且非屬情況急迫顯然無法事先公告周知之情形。"},
  {a:"§111①③", q:"消防局核發之裁處書上完全未記載作成處分之機關名稱及首長署名，且其主旨要求受處分人「應於一日內將廠內一百噸危險化學物質全數銷毀完畢」，客觀上顯然不能實現。"},
  {a:"§10", q:"某法規就特定違規行為授權機關得裁處新臺幣1萬元至10萬元罰鍰，消防局承辦人員因與當事人先前有陳情糾紛、素有嫌隙，未依個案情節輕重及一般裁量基準衡酌，逕行裁處15萬元，已逾法規所定裁量上限。"},
  {a:"§74Ⅰ", q:"甲君因工作關係出國一個月，郵務人員多次前往其住所均未獲會晤本人，亦查無同居人、受僱人可代為收領，遂將裁處書寄存於當地警察機關，並將送達通知書一份黏貼於甲君住居所門首，另一份置於信箱。"},
  {a:"§15、§19Ⅳ②", q:"消防局將轄內某類小型場所之消防安全檢查裁罰權限，依法規委任所屬分隊辦理，並依規定公告委任事項及法規依據；同一時期，消防局另就一起跨機關之化學品鑑定案件，行文請求環保局提供人力協助，環保局評估後認為抽調人力將嚴重影響其本職稽查工作，遂予拒絕。"},
  {a:"§101Ⅰ", q:"消防局對阿明工廠開立裁處書，內容記載裁罰金額為新臺幣3萬元，惟因承辦人員繕打疏失，將阿明身分證統一編號末碼「8」誤植為「3」。阿明發現後，主張此為足以影響其身分同一性之重大瑕疵，該處分應屬無效。"},
  {a:"§48Ⅳ", q:"消防局對甲君之場所作成「文到次日起20日內完成改善」之限期改善通知，甲君於通知送達後開始計算改善期限，發現第20日恰逢星期日，且次日星期一又適逢國定假日。"},
  {a:"§43", q:"某場所火警調查案中，消防局雖已蒐集現場照片、監視器畫面及多名證人陳述，惟承辦人員最終僅憑報案人單方臆測之說法作成調查結論，未依論理及經驗法則綜合斟酌全部證據，亦未於結論中說明其認定理由並告知當事人。"},
  {a:"§93Ⅱ①④", q:"消防局核准甲君設立液化石油氣儲放場所之許可，並於許可函中同時載明「本許可以3年為限，屆期失其效力」及「本局保留日後得因情事變更廢止本許可之權利」兩項要求。"},
  {a:"§33Ⅳ、§36", q:"阿強向消防局申請承辦員迴避，惟該承辦員在消防局就迴避申請作成准駁決定前，未停止行政程序，仍依阿強片面陳述作成調查結論，並未依職權另行蒐集現場證據或兼顧阿強有利之情形，逕自完成調查報告。"},
  {a:"§8", q:"甲君擬投資設立三溫暖場所，事前檢附完整設計圖說向消防局書面諮詢，消防局承辦人明確以正式公文回覆「設計圖說完全符合現行消防法規，可安心施工」。甲君信賴該回覆，隨即斥資裝潢並購置相關設備。完工申請查驗時，消防局卻改稱「先前審查有誤，設計實屬不合規定」，拒絕發給查驗合格證明，亦未提出任何補救或過渡措施。"},
  {a:"§128Ⅱ", q:"阿明兩年前申請火災受災戶特別救助金，因無法提出居住事實證明遭消防局駁回，阿明當時並未提起訴願，該駁回處分已確定。半年前阿明整理舊家廢墟時意外尋獲關鍵證明文件，遂持該文件申請消防局重新審查，惟距原處分之法定救濟期間經過已逾5年6個月。"},
  {a:"§166Ⅱ", q:"消防人員前往老舊社區逐戶建議住戶自費安裝住警器，某住戶當場明確表示拒絕安裝。消防人員見狀不悅，遂告知該住戶：「你不裝沒關係，以後我們會把你家列為高風險場所，每個月都排定人力來做嚴格複查。」"},
  {a:"§95Ⅱ", q:"消防人員於某場所稽查時，發現有明火表演嚴重違反消防法規，情況危急，遂當場以言詞命令業者立即停止表演並清場。業者當場質疑「口頭講講不算數」，並要求消防人員立即開立書面文件，消防人員因未攜帶公文用紙，遂以「稍後補發」為由暫時拒絕。"},
  {a:"§24Ⅱ、Ⅲ", q:"甲君因與消防局間同時有多起裁罰案件進行中，一次委任5名代理人代為處理相關行政程序事務，其中一名代理人並欲代甲君撤回其中一件申請案，惟甲君並未就撤回申請一事，另外對該代理人為特別授權。"},
  {a:"§7②", q:"轄內某社區公園日前舉辦大型園遊會，因主辦單位申請之瓦斯鋼瓶使用未依規定辦理，消防局稽查人員到場後，未區分違規與未違規之攤位，逕行下令封鎖整座公園、強制驅離現場全部約200組合法擺攤之攤商及上千名遊客，園遊會被迫全面終止，未考慮僅要求違規攤位撤除鋼瓶或劃設安全距離等侵害較小之替代手段。"},
  {a:"§98Ⅲ、§99", q:"消防局於裁處書上完全漏未記載救濟期間及受理機關，阿明因而誤以為任何機關均可受理，遂於期間內將訴願書逕行寄至無管轄權之當地區公所，區公所收文後始發現此屬消防局業務。"},
  {a:"§174", q:"甲君於行政機關調查程序進行中，聲請調閱相關卷證資料遭機關駁回，甲君欲於實體處分作成前，就此駁回決定單獨提起訴願。"},
  {a:"§6", q:"消防局訂有「違反消防法事件裁罰基準表」，明定同類輕微違規之裁罰下限為新臺幣2萬元。某日稽查人員同時查獲阿華與阿強之店面均有滅火器逾期未檢修之相同違規情事，且兩人均無前科紀錄；惟承辦人員僅因阿強稽查當日態度較為冷淡，便捨棄基準表，逕對阿強裁處基準表上限之10萬元，對阿華則仍依基準表下限裁處2萬元。"},
  {a:"§51Ⅱ", q:"甲君向消防局申請「防焰物品認證」，該項申請之處理期間，消防局既未依法規訂定並公告，法規亦未另有規定。甲君送件後等候2個月又10日，消防局仍未作成決定，亦未曾通知延長期間之事由。"},
  {a:"§154Ⅰ、§150Ⅱ", q:"消防署訂定新版《防焰物品認證作業要點》（性質上屬法規命令），未依法先行公告草案並開放陳述意見，內容並逕行限制人民營業自由，惟查無任何法律明文授權消防署訂定此類限制規定。"},
  {a:"§11Ⅱ", q:"某年度組織改造，消防局原轄之危險物品儲存場所管制業務，依新修正之組織法規劃歸環保局管轄，惟環保局相關作業辦法尚未同步修正配套。甲君向消防局申請該類場所之設立許可，消防局承辦人員以「業務已依組織法規劃出」為由逕行拒絕受理，亦未協調公告後續處理方式。"},
  {a:"§46Ⅱ①", q:"民眾甲君於消防局對其作成裁罰處分後，向該局申請閱覽相關卷宗，並特別指明欲閱覽承辦人簽核裁罰金額前之內部簽呈及研議簽稿。消防局同意提供裁罰事實認定所依據之現場照片及檢測紀錄，惟就內部簽呈及簽稿部分則予以拒絕。"},
  {a:"§32①", q:"消防局指派承辦員小陳處理某工廠消防安全檢查複查案件，事後發現該工廠負責人恰為小陳配偶之兄長。小陳認為雙方僅為姻親關係，且自己執法一向公正，故未主動陳報迴避，逕行完成複查並簽准合格證明。"},
  {a:"§93Ⅱ②", q:"消防局為讓工廠儘速開始生產，提前核發某工廠籌設許可，並附加「應於開始生產前完成消防安全設備竣工查驗，否則本許可失其效力」之條件。"},
  {a:"§135、§142③", q:"消防局與甲君間就一起火災原因無法查明之案件，雙方雖仍可透過進一步鑑識查明真相，惟消防局承辦人員為求儘速結案，逕與甲君締結和解契約，約定雙方各自承擔一半責任並繳納罰鍰了事。"},
  {a:"§78Ⅰ①", q:"某瓦斯行因重大違規遭裁處鉅額罰鍰，惟負責人於裁處前已攜眷遷離原址、戶籍亦一併遷出，行蹤不明，消防局多次派員查訪均無法查得其新址，郵寄裁處書亦遭退回，致無法依通常方式完成送達。"},
  {a:"§16", q:"消防局為提升防火標章核發效率，將標章之現場勘查及核發作業，依法規委託某民間專業機構辦理，並公告委託事項及法規依據，委託所需費用亦依規定由消防局支付，該民間機構並依委託範圍以自己名義完成勘查及核發作業。"},
  {a:"§114Ⅰ③、Ⅱ", q:"消防局於裁罰阿強之工廠前，依法應給予陳述意見之機會，惟承辦人員疏未通知，逕行作成裁處書。阿強不服提起訴願，消防局於訴願機關作成決定前，發現此一程序疏失，遂補行通知阿強到局陳述意見，聽取其說明後仍維持原裁罰決定。"},
  {a:"§102、§103②", q:"消防局於稽查中發現某餐廳消防安全設備嚴重違反規定，現場情況已達危及公共安全之急迫程度，決定即時強制歇業，未及依通常程序事先通知該餐廳負責人到場陳述意見。"},
  {a:"§19Ⅳ②", q:"消防局調查某化工廠火災原因時，因欠缺特殊化學品鑑定設備與專業人力，行文請求環保局協助進行成分鑑定；環保局評估後認為，若抽調專業人員協助鑑定，將導致該局當週排定之多場重大違法傾倒廢棄物稽查勤務全數無法出勤，嚴重影響其本職工作之執行。"},
  {a:"§165", q:"消防局推動「住宅用火災警報器安裝」宣導專案，消防人員前往老舊社區，逐戶「建議」住戶自費安裝住警器，並說明其提升居家安全之效益，惟未以任何強制力要求住戶配合，住戶亦可自由決定是否採納。"},
  {a:"§117、§119", q:"消防局承辦人員因計算錯誤，誤發新臺幣5千元之消防設備補助款予不符資格之甲君，甲君已持該核准函前往特約器材行購買並安裝相關設備。半年後消防局內部稽核發現核發有誤，經查甲君並無詐欺、脅迫、賄賂，或提供不正確資料，亦無明知違法或因重大過失而不知之情事。"},
  {a:"§73Ⅰ", q:"郵務人員將消防局裁處書送達甲君住所時，甲君外出不在，經確認後，郵務人員將該裁處書交由與甲君同住、就讀大學二年級且具相當辨別事理能力之表妹簽收。"},
  {a:"§96Ⅰ④", q:"消防局核發某工廠裁處書，其上詳載裁罰金額、違規事實及所依據之法條，惟通篇未記載作成該處分之機關名稱，亦未見機關首長署名。"},
  {a:"§131Ⅰ", q:"阿明經營之KTV於民國103年間因重大消防違規遭消防局裁處10萬元罰鍰，阿明始終拒不繳納。消防局承辦人員因職務交接疏漏，遲未將案件移送行政執行，直到民國114年清查舊案時才發現此筆呆帳，隨即發函要求阿明限期繳納。"},
  {a:"§98Ⅱ", q:"消防局於裁處書上誤載「如不服本處分，應於送達後60日內提起訴願」，惟該類事件之法定救濟期間實為30日。甲君信賴裁處書上之記載，遲至送達後第45日始提起訴願。"},
  {a:"§123③", q:"消防局核准甲君之危險物品儲放場所設立許可，並於許可函中附加「應每半年辦理一次自衛消防編組演練」之負擔，甲君其後連續逾一年半均未依約履行該項演練義務。"},
  {a:"§9", q:"消防局裁罰某餐廳「未依規定維護逃生設備」，僅蒐集逃生門遭上鎖之現場照片作為裁罰依據，對於業者提出「該日因裝修臨時封閉逃生門並已張貼公告」之說明及照片，未予調查即逕行裁處。"},
  {a:"§36", q:"消防局於審理甲君申請之「防火避難設施改善計畫」時，甲君於申請書中信誓旦旦聲稱廠房周邊淨空無障礙物，惟承辦人透過空拍及實地勘查，發現周邊全被違建搭滿，根本不符規定。甲君抗議機關「只能根據我提交的書面資料審查，不能自己跑去查其他證據反駁我」。"},
  {a:"§2Ⅲ", q:"內政部消防署依法規將防火管理人講習訓練之測驗業務，委託民間「甲訓練機構」辦理；某學員測驗未通過，甲機構逕行核發「測驗不合格」通知，該學員主張甲機構僅為私法人，其所為之通知不具公權力性質，非屬行政處分。"},
  {a:"§3Ⅱ①", q:"某縣議會審議消防局年度預算案時，僅由議員內部討論決議刪減部分經費項目，並未依行政程序法之相關規定通知受影響之消防局承辦人員到場陳述意見；消防局事後主張議會審議程序違反行政程序法規定。"},
  {a:"§3Ⅲ⑦", q:"某消防員因年度考績遭評定為丙等，深感不服，主張機關於作成考績決定前，未依行政程序法給予其陳述意見之機會，逕行評定顯有程序瑕疵。"},
  {a:"§4", q:"某消防局為增闢財源，未經任何法律或法規命令授權，逕行公告對轄內營業場所每年徵收「消防安全維護費」，並對屆期未繳納者予以列管催繳。"},
  {a:"§11Ⅴ", q:"甲、乙兩消防分隊為減輕彼此工作負荷，未經任何法規變更程序，僅由兩隊長口頭協議互相調換轄內部分里別之管轄範圍，並自行依此新劃分受理後續案件。"},
  {a:"§15Ⅱ", q:"某消防局因轄內特殊場所之消防安全設備性能鑑定業務所需專業儀器與人力不足，依法規將該部分鑑定權限，委託與其不相隸屬之經濟部標準檢驗局執行，並公告委託事項及法規依據。"},
  {a:"§18", q:"某消防安全檢查案件審理過程中，因行政區劃調整，原受理之A消防局喪失該轄區管轄權，改由B消防局管轄；惟當事人及B消防局均同意仍由已進行大半審查程序之A消防局繼續處理該案件。"},
  {a:"§19Ⅱ⑤", q:"消防局為查明某地處偏遠山區場所是否違規使用瓦斯設備，因自行派員前往需耗費大量交通與人力成本，而與其無隸屬關係之當地鄉公所人員經常在地巡查，消防局遂請求鄉公所代為赴現場初步查核並回報結果。"},
  {a:"§19Ⅴ", q:"A消防局請求B警察機關於特定時段協助戒護某場所安全檢查現場秩序，惟B警察機關轄內當日適逢重大治安事件，全體警力已調派一空，實無餘裕人力可供支援，遂函復婉拒並說明理由。"},
  {a:"§22Ⅰ③", q:"某未辦理法人登記、僅設有主任委員之社區管理委員會，就轄區內消防安全改善事宜向消防局提出陳情，全程均由該委員會選任之主任委員出面代表提出陳情並與機關聯繫。"},
  {a:"§23", q:"消防局就某工廠設備變更是否符合消防安全規定進行審查，該審查結果可能影響毗鄰廠房承租人之營業權益；該承租人雖未主動提出申請，消防局仍依職權通知其參加程序表示意見。"},
  {a:"§32②", q:"承辦某場所消防安全設備改善裁罰案件之公務員，其配偶恰與該場所負責人就該場所之營業登記為共同經營人，兩人對該場所負有共同義務；該公務員明知此一關係，仍繼續承辦本案而未自行迴避。"},
  {a:"§32④", q:"某公務員於甲場所火災原因調查程序中，曾以證人身分到場陳述其所目睹之火災發生經過；嗣後該公務員調任至裁罰業務單位，該場所後續之消防法令裁罰案件又指派由其承辦。"},
  {a:"§33Ⅰ②", q:"某場所負責人發現承辦本案裁罰事宜之公務員，與其為同一間健身房之長期會員，兩人經常一同運動、往來密切，惟並無親屬或代理等關係；負責人以此具體事實為由，向該公務員所屬機關申請其迴避。"},
  {a:"§33Ⅴ", q:"機關內部分派案件時發現，承辦人與當事人具有四親等內血親關係，惟當事人對此並不知情、亦未提出任何迴避申請；機關主管察覺後，依職權命該承辦人迴避，改分由他人辦理。"},
  {a:"§32③、§33Ⅰ①", q:"甲君三年前另案曾委任乙擔任其代理人處理相關事宜；乙其後轉任消防機關公務員，現又承辦甲君本次消防安全裁罰案件，明知自己曾任甲君之代理人卻未自行迴避；甲君發現後，具體舉出乙曾任其代理人之事實，向機關申請乙迴避。"},
  {a:"§9、§10", q:"消防局就某場所違反消防安全設備規定案件進行調查裁罰，承辦人僅調查該場所違規之不利事證，對業者提出其已委請專業廠商積極改善之有利事證置之不理；作成裁罰決定時，並將業者曾與承辦人發生口角之私人恩怨一併納入裁罰輕重之考量。"},
  {a:"§6、§8", q:"消防局對轄內同類場所違反消防安全設備規定之案件，歷年來均依內部慣例從輕處以警告並給予改善期限，業者均已依此慣例信賴並安排場所營運計畫；某日消防局無正當理由，獨對其中一家場所改採從重裁罰且未給予改善期限，其餘同類場所仍依慣例從輕處理。"},
  {a:"§34", q:"甲君依相關法規規定，向消防局提出場所使用執照變更之申請，消防局承辦人員以案件不具急迫性、機關人力不足為由，逾三個月仍未開始受理審查程序。"},
  {a:"§35", q:"阿明識字有限，親自至消防局櫃檯以言詞方式提出防火管理人變更之申請，承辦人員僅口頭聽取內容後即逕行結案，未作成紀錄向阿明朗讀確認，亦未經其簽名或蓋章。"},
  {a:"§39", q:"消防局為查明某工廠負責人是否知悉場所違規使用情事，以書面通知該負責人到場陳述意見，惟通知書僅記載到場之時間及地點，並未載明詢問目的，亦未敘明不到場所生之效果。"},
  {a:"§41Ⅱ", q:"鑑定人受消防局委託，就某倉庫火災是否起因於電氣設備老化以書面提出鑑定報告，消防局審閱後認報告內容仍有未盡明確之處，遂通知該鑑定人到場說明。"},
  {a:"§46Ⅰ", q:"與甲君受裁罰案件全然無關之路人丙君，因單純好奇該案裁處內容，向消防局申請閱覽甲君受裁罰案件之相關卷宗，惟丙君無法說明其與該案有何法律上利益。"},
  {a:"§46Ⅱ③、§46Ⅲ", q:"甲君申請閱覽某同業場所公共安全檢查案卷宗，其中部分內容記載該場所消防安全設備之詳細配置圖，依法規屬應保密之營業秘密，消防局遂將整份卷宗均予拒絕閱覽，未區分卷宗中無保密必要之其餘部分逕予准許閱覽。"},
  {a:"§46Ⅳ", q:"甲君閱覽其自身受裁罰案件之卷宗後，發現卷宗中關於其住居所地址之記載有誤，乃檢具戶籍謄本向消防局請求更正該項記載。"},
  {a:"§47Ⅲ", q:"消防局承辦人員因調查所需，於非正式場合以電話與當事人聯繫並談及案情細節，惟事後僅憑記憶處理，並未將通話之對象、時間、地點及內容作成書面紀錄附卷。"},
  {a:"§48Ⅱ", q:"甲君於3月10日收受消防局裁罰處分書，處分書載明應於收受後20日內提起訴願，承辦人員於計算期間時，將3月10日當日一併計入該20日期間之內。"},
  {a:"§48Ⅴ", q:"消防局對甲君違規使用場所處以限期改善之處分，改善期間之末日恰逢國定假日，消防局仍以該日為期間之末日，未依一般期間計算方式順延至次一工作日。"},
  {a:"§49", q:"甲君於訴願法定期限之最後一日，以掛號郵寄方式將訴願書寄交消防局，惟消防局實際收受該訴願書時，已逾法定期限三日。"},
  {a:"§50Ⅰ", q:"某地區因颱風來襲導致郵路及通信中斷數日，甲君因而未能於法定期間內提出證照展延申請，於郵路及通信恢復後第8日，甲君向消防局申請回復原狀，並同時補提展延申請。"},
  {a:"§51Ⅲ、§51Ⅳ", q:"消防局受理甲君場所使用許可申請，因案情複雜，於原處理期間屆滿後第3日，消防局始通知甲君展延處理期間，且此為該案第二次展延處理期間，先前已展延一次。"},
  {a:"§54", q:"某地方政府依都市計畫法規定舉行都市計畫變更公聽會，因該法就聽證應踐行之通知方式、預備程序及主持人職權等細節未有規定，主辦機關遂援引聽證程序共通規範辦理。"},
  {a:"§60Ⅱ", q:"某聽證案件開始時，主持人僅簡短宣布聽證開始，未由主持人或其指定之人說明該事件之內容要旨，即逕行進入當事人陳述程序。"},
  {a:"§67", q:"甲君接獲消防局通知須至機關說明其違規使用瓦斯設備一事，遂主動詢問承辦人員後續之裁處書應由其本人提出何種申請才能收到送達；承辦人員告知毋須由甲君提出任何申請，機關將主動辦理送達相關文書。"},
  {a:"§68Ⅱ", q:"某工廠因消防安全設備複查不合格，機關依相關法規以傳真方式將複查結果通知傳送至該廠登記之傳真號碼，全程未另以紙本郵寄方式送達。"},
  {a:"§68Ⅲ", q:"機關就甲君違規儲放公共危險物品一案作成高額罰鍰裁處書，因內容對甲君權利義務有重大影響，卻疏未辦理掛號，逕以一般平信交由郵政機關寄發。"},
  {a:"§68Ⅳ", q:"機關就某處分書決定自行送達，遂指派機關內部專責辦理送達事務之人員（並非本案承辦人）持送處分書予甲君簽收，機關認為此舉並無不合。"},
  {a:"§69Ⅰ", q:"甲(6歲)於自家騎樓玩弄打火機，不慎引燃堆置之雜物，經消防局查明後認應發函促請其改善；機關擬送達該函文，遂將文書送達甲之父母。"},
  {a:"§69Ⅱ", q:"某消防設備保養股份有限公司因保養紀錄造假遭機關裁處罰鍰，機關擬送達裁處書，遂將文書送達該公司登記之代表人。"},
  {a:"§71", q:"甲君因違反消防法規遭裁罰，已委任律師乙君為訴願代理人，委任狀並未記載限制乙律師受送達之權限；機關作成訴願決定後，遂逕行將決定書送達乙律師。"},
  {a:"§72Ⅱ", q:"機關擬送達裁處書予某餐飲股份有限公司之登記代表人，因未能於該公司登記之營業處所會晤代表人本人，機關審酌後改前往代表人之自家住居所，當場會晤本人並完成送達。"},
  {a:"§73Ⅱ、§74Ⅰ", q:"消防局承辦人員攜帶違規使用爆竹煙火之裁處書前往甲公司登記地址送達，未獲負責人本人在場，僅有一名員工在場，惟經查該員工即為本案檢舉人，與甲公司立場明顯相反；承辦人員遂改將文書寄存於送達地之地方警察機關，並依規定將送達通知書一份黏貼於該處門首。"},
  {a:"§75", q:"某社區因地下室化學品外洩有爆炸疑慮，消防局須緊急通知周邊不特定之路人與流動攤販立即疏散，惟因對象不特定、人數眾多無法逐一確認身分，機關遂於周邊明顯處張貼公告，代替逐一送達通知。"},
  {a:"§78Ⅰ③、§81", q:"甲君為旅居A國之僑民，因國內房屋消防安全檢查未合格遭裁罰，機關評估縱依第86條規定辦理囑託送達仍預料無法完成，甲君遂委由其在國內之代理人向機關申請公示送達；該公示送達之公告於同年3月1日刊登政府公報，為最後一次刊登，機關遂以此計算裁處書送達生效及後續訴願期間起算之日。"},
  {a:"§69Ⅳ、§73Ⅲ", q:"甲(17歲)因住處增設之消防安全設備遭裁罰，逕自具狀向機關提出陳述意見，惟未於書面中載明其法定代理人為何人；機關於補正前，仍依址將復函送達甲本人，甲在場卻拒絕收領，送達人員遂將文書留置於該處以為送達。"},
  {a:"§83Ⅰ", q:"甲君向機關提起訴願，並於訴願書內載明指定其配偶乙君為送達代收人；機關嗣後作成訴願決定，遂將決定書送達乙君。"},
  {a:"§83Ⅱ、§83Ⅲ", q:"甲君以郵寄方式向機關提出申請，其交郵地並無住居所、事務所及營業所；機關乃通知甲君於10日內指定送達代收人，惟甲君屆期仍未指定亦未陳明，機關遂將文書註明甲君原提出申請時之住居所地址，交郵政機關掛號發送，並以交付文書之時視為送達時。"},
  {a:"§136", q:"甲工廠內部管線配置複雜，消防局經職權調查仍無法確定其是否達到應設置自動撒水設備之標準，為解決此項爭執並有效達成行政目的，消防局與甲工廠負責人締結契約，由廠方分階段完成設備改善，以代替裁處與否之行政處分。"},
  {a:"§137Ⅰ③、§142④", q:"消防局對甲君所有場所核發消防安全設備檢查合格證明，屬機關有裁量權之處分。消防局改以締結行政契約代替該處分，契約載明甲君應繳納之款項係供消防局辦理年度設備汰換之用，惟其金額高達甲君原應繳納檢查規費之十倍，與消防局所為之查驗給付顯不相當，亦欠缺正當合理之關聯。"},
  {a:"§139", q:"消防局與某社區管理委員會口頭約定，由消防局提供防災器材，委員會協助辦理住戶防火宣導，雙方未簽署任何書面文件，相關法規亦未就此類契約另定其他方式。事後委員會否認曾有此項約定。"},
  {a:"§152Ⅰ、Ⅱ", q:"某消防安全設備商業同業公會以書面敘明訂定「防火材料檢測基準」法規命令之目的、依據及理由，並檢附相關技術資料，向消防主管機關提議訂定該法規命令。"},
  {a:"§154Ⅱ", q:"消防局於政府公報公告某法規命令草案後，另於機關官方網站及轄內各分隊公布欄張貼該草案內容摘要，以擴大周知範圍，使更多民眾得以知悉並表示意見。"},
  {a:"§155", q:"消防主管機關於訂定某項涉及大量民眾權益之法規命令時，考量該草案爭議性高，雖法規並未要求必須舉行聽證，機關仍基於職權決定召開聽證會，廣泛聽取各方意見。"},
  {a:"§157Ⅰ、Ⅲ", q:"某法規命令依法應經上級機關核定，訂定機關於報請上級機關核定後，始將該法規命令刊登於政府公報公告發布，於核定前並未對外發布。"},
  {a:"§159Ⅱ②、§160Ⅱ", q:"消防局為使所屬各分隊對違反消防法案件之罰鍰裁處金額一致，訂頒「違反消防法罰鍰裁量基準表」，供分隊承辦人統一認定事實及行使裁量權之用。該基準表僅由業務科長核章後即下達各分隊使用，未經局長簽署，亦未登載於政府公報。"},
  {a:"§159Ⅰ", q:"消防局訂定一份「值班勤務輪替原則」，僅規範局內各科室排班作業方式及內部溝通流程，並非直接對外發生法規範效力，亦未對外公告。"},
  {a:"§161", q:"甲君對消防局依內部「安全檢查作業要點」所為之現場檢查方式表示不服，主張該要點並非法規命令，不能直接拘束身為一般民眾之甲君。消防局說明該要點僅經有效下達所屬各分隊使用。"},
  {a:"§92Ⅰ", q:"某工廠未依規定設置滅火器，消防局承辦人以正式函文通知該工廠負責人，限期於三十日內完成改善並接受複查，該函文並敘明屆期未改善將另予處分。"},
  {a:"§93Ⅱ⑤", q:"消防局核准某民眾申請設立公眾使用場所之消防安全查驗合格證明，並於核准文件中明訂機關得依日後安全檢查結果，另行追加或變更本處分之附款負擔；半年後因法規修正，消防局據此通知業者須加裝新式警報設備，作為原核准處分之追加負擔。"},
  {a:"§94", q:"消防局核准某KTV業者變更營業場所用途登記，卻於核准函中要求業者須先捐贈一批消防器材予地方消防分隊，方予核准，該項要求與本件變更登記之實質內容並無關聯。"},
  {a:"§95Ⅰ", q:"消防稽查人員於夜市稽查現場，以言詞當場命令某攤商立即撤除違規增設之瓦斯炊具，該命令未以任何書面作成，相關法規就此類稽查命令並無要式規定。"},
  {a:"§96Ⅰ②", q:"消防局核發之裁處書上僅記載「經查違反消防法相關規定，處罰鍰新臺幣六萬元」，並未敘明具體違規事實經過，亦未載明所適用之法令條項。"},
  {a:"§97③", q:"消防局對轄內數百家營業場所同步辦理年度消防安全檢查，就全數合格場所以電腦系統自動列印同一格式之合格通知書，並未逐一敘明各場所檢查合格之具體理由。"},
  {a:"§99", q:"甲君收受某分局之裁處書，因裁處書教示記載錯誤，誤將不服聲明書逕行提出於毫無管轄權限之鄉公所，鄉公所收受後於七日內將全案移送有管轄權之消防局，並通知甲君。"},
  {a:"§101Ⅱ", q:"消防局發現某裁處書上受處分人身分證統一號碼誤繕一碼，屬誤寫之顯然錯誤，惟原處分書正本已送達當事人，無法於書面上加註更正，機關遂另行製作一份更正書，以書面通知受處分人及已知之利害關係人。"},
  {a:"§103①", q:"消防局對轄內一千二百戶住宅同步核發限期改善老舊電線之同種類處分，基於作業量能考量，未逐戶個別給予陳述意見之機會即逕行核發處分書。"},
  {a:"§103③", q:"某開發案之審查程序訂有不可延展之法定期限，消防局於期限屆滿前一日始接獲相關違規資料，若依通常程序通知開發單位陳述意見，顯然無法於法定期間內完成審查，機關遂逕行作成處分。"},
  {a:"§105Ⅲ", q:"消防局依法通知某工廠負責人，於文到十日內就擬處分之違規事實提出陳述書，負責人屆期未提出任何陳述書，機關遂依現有事證逕行作成處分。"},
  {a:"§106Ⅰ", q:"甲君接獲消防局通知，得於十五日內提出陳述書，惟甲君於期限內改親赴消防局，以言詞方式陳述意見，並經承辦人員作成紀錄。"},
  {a:"§107②", q:"某爆竹煙火製造場所擬遭撤銷許可，相關法規就此並未明文規定應舉行聽證，惟因案情複雜且涉及多方利害關係人，消防局衡酌後仍決定舉行聽證。"},
  {a:"§109", q:"甲君所經營之加油站，經消防局依正式聽證程序作成廢止許可之處分，甲君不服，擬直接向行政法院提起撤銷訴訟，未先提起訴願。"},
  {a:"§111②", q:"依法令規定，消防設備檢修專技人員合格資格應以證書方式發給，惟消防局僅以口頭告知甲君考試合格，迄未核發任何證書。"},
  {a:"§111④", q:"某機關誤信申請資料，核准甲君之營業許可申請，該許可內容實質上係同意甲君於場所內從事販賣槍砲之營業行為，而此一經許可之行為依法構成犯罪。"},
  {a:"§113", q:"消防局核發之處分書內容包含准予營業登記，及命業者繳納一筆法無明文依據之特別捐兩部分；其中特別捐部分因欠缺法律依據而無效，惟除去該部分後，准予營業登記之核准內容仍可獨立成立並生效。"},
  {a:"§117、§119①", q:"甲君為取得消防設備補助款，對承辦人員行賄，使其違反審查標準逕行核准補助處分，機關事後查獲上情，擬撤銷該處分。"},
  {a:"§121Ⅰ", q:"消防局於一0九年間即已知悉某補助處分因申請人資料造假而屬違法，惟遲至知悉後第三年，機關始擬撤銷該處分。"},
  {a:"§122", q:"消防局先前依法對某場所核發限期改善逃生通道之合法處分，嗣後該場所歇業，機關擬依職權廢止該限期改善處分，惟經查若該場所日後復業，機關仍須對其為相同內容之改善處分。"},
  {a:"§123①", q:"某補助辦法明文規定，主管機關得於受補助單位嗣後不再具備一定資格時，廢止其補助資格處分，消防局據該辦法規定，對已喪失資格之受補助單位廢止原核准補助處分。"},
  {a:"§123④", q:"消防局原核准某場所依當時標準設置之消防安全設備處分，嗣後相關法規修正提高安全標準，且該場所所在建物之實際使用狀況亦已變更，若不廢止原處分而繼續適用舊有標準，將對公共安全造成危害。"},
  {a:"§124", q:"某受益人未依約履行補助負擔之情事於一0八年即已發生，消防局遲至該情事發生後第三年，始擬依此事由廢止原補助處分。"},
  {a:"§131Ⅰ", q:"消防局對甲君核發之罰鍰處分確定後，得為強制執行之時起已逾五年又六個月，機關始擬移送執行徵收。"},
  {a:"§117、§119②", q:"甲君申請消防安全設備補助時，就廠房實際坪數此一重要事項為不完全陳述，消防局據其陳述資料核准補助處分，於法定救濟期間經過後，機關始發現上情，擬撤銷原處分。"},
  {a:"§123③、§125、§127Ⅰ", q:"消防局核准甲君之消防安全設備補助處分，並附加負擔命其於一年內完成設備安裝及提出驗收證明，甲君屆期仍未安裝亦未提出證明，消防局遂廢止原補助處分，並以書面處分命甲君返還已受領之補助款。"},
  {a:"§96Ⅰ⑥、§98Ⅰ", q:"消防局核發之裁處書上記載不服本處分應於十日內提起訴願，惟法定訴願期間實為三十日，機關事後發現此一錯誤，遂以書面通知受處分人更正救濟期間。"},
  {a:"§111⑤、§114Ⅰ", q:"消防局命甲君拆除違建結構之處分，其內容實質上係命甲君將拆除之建材未經任何環保處理，逕行掩埋於水源保護區內；又該處分作成前，消防局並未依法給予甲君陳述意見之機會，乃於處分作成後始通知甲君補行提出意見。"},
  {a:"§102、§103⑤", q:"消防局擬對某場所違規使用易燃材料裝修之事實作成停業處分，惟違規事實業經稽查人員現場拍照及儀器檢測數據明確記錄，客觀上已明白足以確認，機關遂未再給予該場所負責人陳述意見之機會，即逕行作成處分。"},
  {a:"§128Ⅰ②、§128Ⅱ", q:"甲君之消防安全設備檢修不合格處分，於法定救濟期間經過後確定；嗣後甲君發現其送驗時因儀器故障導致檢測數據異常之相關紀錄，該紀錄於處分作成前即已存在，惟當時未經機關調查斟酌，甲君於知悉後二個月內向機關申請重新審查，機關審酌全案後認為甲君之申請為有理由。"},
  {a:"§120Ⅰ、§121Ⅱ", q:"消防局撤銷甲君信賴值得保護之補助處分後，依法告知甲君得請求合理補償之事由，惟甲君遲至機關告知後第三年，始行文請求給付補償金。"},
  {a:"§163、§164Ⅰ", q:"某直轄市消防局為解決轄內老舊社區木造建物密集延燒風險，事前就未來五年應辦理之土地徵收、防災通道開闢及分期改善等方法、步驟預為規劃，訂定「防災空間整建計畫」。因該計畫涉及多筆私有土地之特定利用，且牽涉都市發展局、地政局、消防局等多個機關權限，該局於確定計畫前，依規定辦理公開展覽並召開聽證會。"},
  {a:"§165", q:"消防局關懷轄內獨居長者居家用火安全，以電話方式「勸告」某獨居長者自行加裝住宅用火災警報器，並向其表示是否採納全憑個人意願，消防局並未以任何命令或處分要求其配合。"},
  {a:"§165", q:"消防局承辦人發現某住戶擬於防火巷內加蓋鐵皮增建，以口頭「勸導」方式建議住戶勿施作，並表示若住戶仍執意施工，消防局於當下並不會逕行開罰或強制拆除。"},
  {a:"§166Ⅰ", q:"某消防分隊員警於執行公務期間，以行政指導名義要求轄內KTV業者向其配偶所經營之公司採購與該場所消防安全設備需求無關之高價裝潢材料，其指導內容與消防法規保障公共安全之立法目的顯不相關。"},
  {a:"§166Ⅱ", q:"消防局向某工廠業者建議加裝非屬法定應設之特殊偵煙設備，業者已以書面明確表示婉拒；消防局承辦人仍多次致電要求業者配合，並於其後排定之公共危險物品定期檢查中，刻意提高審查標準。"},
  {a:"§167Ⅰ、§167Ⅱ", q:"消防局員警至某餐廳進行口頭行政指導時，僅告知「這樣不太好，改一下比較安全」，未說明指導之目的、具體內容及負責指導人員；業者事後致電消防局，要求提供該次指導內容之書面文件以利內部簽核，消防局並無任何特別困難，卻僅重複口頭說明，未提供書面。"},
  {a:"§168", q:"某里里長認為轄區消防局例行巡查次數過少，恐無法及時發現違規情事，特備函向消防局提出增加巡查頻率之建議。"},
  {a:"§168", q:"民眾對消防法規中「複合用途建築物」之認定標準有所疑惑，特以書面函詢消防局，請求說明其適用範圍。"},
  {a:"§169Ⅰ、§169Ⅱ", q:"陳情人甲君以電話向消防局陳情，舉發鄰居頂樓加蓋堆置大量紙箱雜物，承辦人僅簡要摘記重點，未將紀錄向甲君朗讀或提供閱覽即逕行歸檔；甲君事後索閱紀錄，發現記載地址有誤，要求更正，承辦人卻以「案件已結案」為由拒絕處理。"},
  {a:"§170Ⅰ", q:"某消防分隊並未訂定陳情案件處理作業規定，亦未指派專責人員負責受理，導致一件舉發瓦斯行儲放不當之陳情案件擱置逾三個月無人處理。"},
  {a:"§170Ⅱ", q:"民眾陳情舉發其任職公司違規使用易燃裝潢材料，並於陳情書中載明因擔心遭報復，要求對其身分保密；消防局承辦人於現場稽查時，卻逕自向公司負責人出示該陳情書影本。"},
  {a:"§172Ⅰ、§172Ⅱ", q:"民眾向消防局提出陳情，內容同時包含兩部分：一為不服消防局先前對其開立之罰鍰處分，二為指摘鄰地違建情事。消防局審酌後認為違建部分適合逕行移送建管機關處理並通知陳情人，另就不服罰鍰處分部分，告知陳情人得依法提起訴願。"},
  {a:"§173①", q:"消防局收受一封陳情書，內容僅空泛稱「某處很危險，請盡快查辦」，未載明真實姓名，亦未留存任何聯絡地址，致無從查證陳情人身分及具體事實。"},
  {a:"§173②", q:"陳情人乙君先前就其住家附近工廠噪音及消防安全疑慮提出陳情，消防局已派員查處並以書面明確答覆處理結果；惟乙君其後仍就同一事由反覆多次陳情，內容並無任何新事證。"},
  {a:"§173③", q:"陳情人將同一起場所違規堆置事件，以完全相同內容同時分別向消防局、警察局及環保局提出陳情，消防局並非該違規事項之主管機關。"},
  {a:"§174", q:"行政機關於調查程序中，對當事人所持有、有立即危險之物品逕行為得強制執行之扣留處置，當事人於該處置作成時，即欲對之單獨聲明不服。"},
  {a:"§174-1", q:"某機關於本法施行前，依中央法規標準法第七條訂定一項職權命令，其內容性質上應以法律規定或以法律明列授權依據，惟該機關迄未於本法施行後二年內完成法律授權依據之補正。"},
  {a:"§1", q:"消防局訂定內部工作要點，明定各科所辦理裁罰案件之作業程序，除要求嚴格援引法律及法規命令為准駁依據外，並規定審查過程應公開透明、給予民眾陳述意見及參與之機會；局長於要點說明中指出，如此設計旨在保障民眾權益、提升機關辦事效能，並增進民眾對消防局之信賴。"},
  {a:"§20", q:"甲君向消防局提出申請，請求對乙君所經營之倉庫進行消防安全複查；消防局同時就防火知識巡迴宣導服務案與丙君簽訂行政契約，並依約定內容請丙君配合辦理相關宣導事宜。"},
  {a:"§21", q:"某社區管理委員會尚未依法辦理法人登記，惟已依規約選任主任委員為代表人；該管理委員會就轄內消防安全設施改善事項向消防局提出書面陳情，並由該主任委員代表委員會與承辦人員接洽後續事宜。"},
  {a:"§26", q:"甲君委任乙君為代理人，處理其工廠消防安全改善計畫之審查程序；審查期間甲君因意外身故，承辦人員審認乙君之代理權並未因此消滅，程序得繼續進行，未要求另行委任代理人。"},
  {a:"§28", q:"某大樓住戶就共同消防安全改善事宜，共同選定甲、乙、丙三人為代表；甲君其後單獨出面向消防局表示同意某項改善方案並簽署相關文件，消防局逕認該意思表示已對全體住戶發生效力，未待乙、丙共同會簽。"},
  {a:"§30Ⅰ", q:"多名長期未依規定辦理公共安全檢查之工廠業者，於聯名陳情書上共同具名，並附記已推選甲君為代表，向消防局協調改善期程；因該書面已載明選定意旨並送達消防局，機關遂僅以甲君為聯繫窗口，逕行通知後續改善事項。"},
  {a:"§38", q:"消防局承辦人員於火災原因調查過程中，訪談多名到場目擊之鄰居，並將其陳述內容據實製作書面紀錄附卷存查，作為後續判斷起火原因之參考資料。"},
  {a:"§70Ⅰ", q:"某在我國境內設有辦事處、惟未辦理獨立公司登記之外商消防器材公司違反消防法規定遭裁罰，消防局遂將裁處書送達予其在我國境內辦事處之代表人，而非逕行寄往該公司國外總部地址。"},
  {a:"§79", q:"消防局前已就甲君行蹤不明一事，依申請辦理公示送達一次；嗣後另有一份裁處書須送達同一位甲君，因其仍下落不明，承辦人員未待任何人提出申請，逕依職權將該文書辦理公示送達。"},
  {a:"§2Ⅲ", q:"消防局委託轄內一家經認證之民間機構，就集合住宅之防火標章申請案進行現場查核並作成核可與否之通知；該民間機構於受託範圍內，代表消防局對外作成查核結果通知予申請人。"},
  {a:"§16Ⅱ", q:"消防局擬將某項消防設備定期檢驗業務委託民間檢驗公司辦理，僅簽准內部委辦契約並通知該公司開始執行，並未將委託事項及法規依據公告，亦未刊登於政府公報或新聞紙。"},
  {a:"§22Ⅲ", q:"一名外籍學生依其本國法律規定尚不具備完全之行為能力，惟依中華民國民法規定其已達成年、具有完全行為能力；其本人就讀學校之消防安全講習報名事宜，自行向消防局提出申請，消防局審認其已具行政程序行為能力，逕予受理，未要求法定代理人代為之。"},
  {a:"§41Ⅰ、Ⅱ", q:"消防局就某起火災之起火原因，選定具公信力之鑑定機構出具書面鑑定報告；嗣後承辦人員因報告部分論述不明，通知該鑑定人到場補充說明。"},
  {a:"§50Ⅰ、Ⅱ", q:"甲君原應於某月十五日前提出消防安全設備改善計畫，惟因強烈颱風侵襲致其所在地對外交通及通信中斷數日；交通恢復後第八日，甲君向消防局申請回復原狀，並同時補行提出改善計畫。"},
  {a:"§60Ⅰ、Ⅱ", q:"消防局就某工廠停業處分舉行聽證，聽證開始時，先由主持人說明本次聽證之事由，並說明本案內容要旨，隨後始請當事人及其代理人依序陳述意見。"},
  {a:"§75", q:"消防局因轄內某加油站擴建案涉及周邊安全評估，須通知可能受影響之附近居民表示意見，惟該範圍內住戶眾多且流動性高，難以逐一確認具體對象，遂以公告並刊登地方新聞紙之方式代替個別送達通知。"},
  {a:"§11Ⅴ", q:"甲、乙兩消防分隊因轄區邊界之出勤動線較為迂迴，兩分隊長私下口頭約定互相支援對方轄區內之部分里別，作為固定管轄範圍調整，並未經任何法規訂定或公告程序。"},
  {a:"§9、§36", q:"消防局於調查某餐飲場所違反消防安全設備規定案件時，僅依檢舉人所提供之單方資料作成調查，未依職權另行蒐集其他佐證；業者於程序中提出已完成改善並取得改善證明之文件，承辦人員閱後未予採認亦未載明不採之理由，逕行依檢舉資料作成裁罰處分。"},
  {a:"§48Ⅳ、§51Ⅱ", q:"消防局受理某老舊建築物申請公共安全檢查合格證明，因未依規定訂定並公告個案處理期間，其法定處理期間依法為二個月；承辦人員試算屆滿日期後，發現該二個月期間之末日恰為星期日，遂將該案處理期限順延至次日始行屆滿。"},
  {a:"§69Ⅰ、§73Ⅰ", q:"消防局裁處書之應受送達人為一名尚未成年、不具行政程序行為能力之少年，依法應向其法定代理人為送達；惟送達人員到場時，其法定代理人恰巧外出，遂將文書交付在場、具辨別事理能力之其同住祖母簽收，以完成送達。"},
  {a:"§24Ⅱ、§35", q:"甲君就其工廠消防安全改善協商案件，一次委任四名代理人向消防局接洽；其中一名代理人到場時以言詞方式代甲君正式提出改善計畫變更之申請，承辦人員當場作成紀錄，經朗讀並由該代理人確認內容無誤後簽名。"},
  {a:"§7③、§10", q:"某小型工廠僅因一具滅火器逾期未更換藥劑遭查獲，依消防局訂定之裁罰基準，該違規情節原應處新臺幣一萬元罰鍰；惟承辦人員逕行作成勒令該工廠全面停業之處分，並將罰鍰金額提高至十萬元，已超出裁罰基準所定上限。"},
  {a:"§91", q:"消防局委託外交部代為送達一份行政處分書予僑居海外之甲君。外交部於送達地多次嘗試後仍無法完成送達，遂將辦理情形回覆消防局，消防局承辦人A將該回覆文件附入原案卷保存。"},
  {a:"§97⑤", q:"甲君參加消防設備士資格檢定測驗，主辦機關依評分標準核定其筆試成績未達合格門檻，並以書面通知甲君測驗結果，通知書中並未記載各科成績之評分理由及依據。"},
  {a:"§100Ⅱ", q:"轄內某商圈因鄰近化工廠發生氣體外洩，消防局對區內不特定但依所在範圍可得確定之商家作成疏散命令。因商家眾多且情況緊急，消防局僅將該疏散命令刊登於地方新聞紙及公告於商圈入口，未對各商家逐一送達書面處分。"},
  {a:"§106Ⅰ、Ⅱ", q:"甲君於消防局所定得提出陳述意見之期限內，並未提出書面陳述書，而是親自到消防局以言詞陳述意見；承辦人A當場作成陳述紀錄，向甲君朗讀確認內容無誤後，由甲君於紀錄上簽名。"},
  {a:"§108Ⅰ、Ⅱ、§109", q:"消防局就是否廢止甲君所經營爆竹煙火製造場之許可乙案，依法舉行聽證。聽證終結後，消防局斟酌聽證全部結果，以書面作成廢止許可之處分並送達甲君。甲君不服，未先提起訴願，逕向高等行政法院提起撤銷訴訟。"},
  {a:"§104Ⅰ、§105Ⅲ", q:"消防局擬對甲君作成限制其營業權利之處分前，以書面通知甲君其住居所、擬為處分之原因事實及法規依據，並敘明得於文到十日內提出陳述書及屆期不提出之效果。甲君屆期未提出陳述書，消防局遂逕依卷內既有事證作成處分。"},
  {a:"§110Ⅲ", q:"消防局五年前對甲君所有之公共危險物品倉儲場所作成禁止使用之處分，該處分自作成後從未經撤銷或廢止，亦無其他失效事由發生。甲君近日主張該處分因久未執行而已自動失效，消防局否認之。"},
  {a:"§113Ⅱ", q:"甲君認為其所受消防局之處分具有重大明顯之瑕疵，遂具狀敘明理由，向消防局請求確認該處分是否為無效。"},
  {a:"§118", q:"消防局發現其核發予甲君之消防設備補助處分違法，依法予以撤銷；惟為避免甲君因信賴原處分已購置設備而遭受財產上損失，消防局於撤銷處分中另訂該處分自撤銷後三個月始失其效力，而非溯及既往失效。"},
  {a:"§120Ⅰ、Ⅱ、§121Ⅰ", q:"消防局於112年6月查知其於109年核發予甲君之防火設備補助處分違法，並於113年5月依職權將該處分全部撤銷。甲君受領補助時並無詐欺、提供不實資料或明知違法之情事，因信賴該處分業已購置相關設備而受有財產上之損失，消防局於撤銷處分後一併決定給予甲君合理之補償，補償金額並以甲君因原處分存續可得之利益為上限。"},
  {a:"§122", q:"消防局曾對甲君所有之違規場所核發限期改善之處分，該處分不涉及授予甲君任何利益且屬合法處分。嗣後消防局認為該場所已無繼續要求改善之必要，遂依職權將該處分全部廢止。"},
  {a:"§124", q:"甲君自109年1月起即未履行消防局核准補助處分所附「應於一年內完成裝設」之負擔，消防局遲至112年3月始依職權將該補助處分予以廢止。"},
  {a:"§125", q:"甲君受領消防局核准之消防安全設備補助處分，因迄未履行「應於一年內完成裝設」之負擔，消防局依法廢止該合法之授益處分，並認定其效力應溯及至原處分核發時起失其效力。"},
  {a:"§126Ⅰ", q:"消防局因法規事後修正，若不廢止原核准予甲君之防災設備補助處分，將對公益造成危害，遂依職權廢止該合法之補助處分。甲君原信賴該處分而已支出安裝費用，因處分遭廢止受有財產上之損失。"},
  {a:"§131Ⅰ", q:"消防局於107年間對甲君核發裁罰處分後即取得對甲君之公法上罰鍰請求權，該請求權迄今已逾六年未經消防局行使，其間亦未曾中斷。消防局擬向甲君追繳該筆罰鍰，甲君主張該請求權已罹於時效而消滅。"},
  {a:"§132", q:"消防局為徵收甲君積欠之規費，曾作成處分而使原本進行中之時效中斷，惟該處分嗣後因違法而經撤銷，溯及既往失其效力。甲君主張先前因該處分而中斷之時效，應視為自始未曾中斷。"},
  {a:"§134", q:"甲君對消防局之公法上請求權原時效期間僅剩3年，因消防局為實現該權利而作成行政處分，致該時效中斷；該處分其後已確定不得訴請撤銷，時效應重行起算。"},
  {a:"§137Ⅰ①、③", q:"消防局與轄內某工廠締結行政契約，約定工廠捐贈救災器材以換取消防局核准其設置公共危險物品儲槽。契約僅記載捐贈器材之項目及數量，並未約定該等器材應供特定用途使用之意旨，且所捐器材價值與該工廠獲准設置儲槽所得之經濟利益顯不相當，兩者欠缺正當合理之關聯。"},
  {a:"§148Ⅰ、Ⅱ、§149", q:"消防局與轄區民間防災協會締結提供緊急救災物資集散場地之行政契約，雙方約定協會如未依約提供場地，消防局得逕以本契約為強制執行之執行名義，該項約定並已經消防局所屬地方自治團體行政首長之認可。契約另約定協會逾期未騰空場地時之遲延違約金計算方式，因本法就此未設規定，遂比照民法遲延給付之相關規定處理。"},
  {a:"§150Ⅰ、§159Ⅰ、Ⅱ②", q:"消防局依消防法之授權訂定「防火管理人講習訓練辦法」，對轄區內特定場所之管理權人統一課予接受講習之義務，並對外發生法律效果。消防局另訂定「稽查裁罰基準表」，供所屬稽查人員辦理裁罰時統一認定違規情節輕重及行使裁量權之用，該基準表並未對外直接發生法規範效力。"},

  {a:"貪污治罪條例§3", q:"戶政事務所主任A與友人即地政士B共謀，由A利用職務上機會，違法提前核發原應歷經完整審查程序始能核發之戶籍謄本供B之客戶使用，B則自始參與整體計畫之謀劃，並負責招攬客戶、收取加急費用後與A朋分。案發後，B辯稱自己並非公務員，主張僅能論以較輕之普通刑法罪責，不應適用貪污治罪條例。"},
  {a:"貪污治罪條例§4Ⅰ①", q:"消防分隊裝備保管人員A負責保管分隊之緊急救護器材與破壞器材，明知該批器材均屬公有財物，竟利用保管職務之便，將其中3台原裝進口之液壓破壞器攜出分隊，轉售予資源回收業者換取現金8萬元，並於裝備盤點紀錄上塗改數量矇混過關。"},
  {a:"貪污治罪條例§4Ⅰ②", q:"違章建築查報人員A於例行稽查中，發現店家負責人B所經營之小吃店有部分違建增建情形，A竟以「若不表示誠意，將立即函報拆除大隊強制拆除違建」為由，暗示B需交付紅包始願通融，B心生畏懼，於稽查後將現金3萬元交予A。"},
  {a:"貪污治罪條例§4Ⅰ③", q:"自來水廠汰換老舊水管工程之監造人員A，於工程施作期間，明知承包商B實際更換之新管線僅涵蓋原設計里程之七成，其餘三成仍使用舊管線僅做外觀翻修，A仍在估驗計價單上記載已依圖說全數更換完成，並向B收取估驗金額一成之回扣，合計120萬元。"},
  {a:"貪污治罪條例§4Ⅰ④", q:"海巡查緝艇艇長A利用執行公務駕駛公務快艇巡邏之機會，暗中協助走私集團以該公務快艇載運未稅洋菸一批進入國內港口，事後A收取走私集團給付之報酬15萬元。"},
  {a:"貪污治罪條例§5Ⅰ①", q:"地方稅務局代收稅款人員A每日負責將民眾繳納之稅款彙整解庫，A意圖獲取資金運用之利益，連續數週將應解庫之稅款延後入帳，先行挪用於個人資金調度，待有進帳後始補足解繳，帳面上未曾發現短少。"},
  {a:"貪污治罪條例§5Ⅰ②", q:"區公所里幹事A利用執行社會救助業務之機會，明知某低收入戶已於半年前遷離該區、不再符合資格，仍虛偽製作訪視紀錄，持續為其申請並具領生活扶助款項，將溢領之扶助費共12萬元據為己有。"},
  {a:"貪污治罪條例§6Ⅰ②", q:"區公所辦理某道路拓寬工程，承辦人A負責受理沿線土地徵收補償作業，A明知土地所有權人B實際使用面積僅80平方公尺，竟與土地代書C勾結，於徵收清冊上虛列為120平方公尺，使B溢領徵收補償款，事後B將溢領款項之半數回饋予A、C朋分。"},
  {a:"貪污治罪條例§6Ⅰ③", q:"警察分局扣押物保管人員A職務上保管一批因案扣押之私人所有名貴手錶及珠寶，該等物品雖經扣押保管，仍屬案關被告私人所有之非公用財物；A利用職務上持有保管之機會，將其中2只手錶取出變賣，得款共18萬元。"},
  {a:"貪污治罪條例§6Ⅰ⑤", q:"監理站甲僅負責汽車新領牌照業務，與換發車牌無關；某日甲利用同事出差、代為看管換牌櫃檯之機會，明知申請人之車輛已逾期未換發、依規定應加徵滯納金2,000元，仍主動略去加徵程序、免除申請人應繳之滯納金，逕行換發新牌；甲之目的僅是為討好該申請人（其女友之父親），甲本身並未從中收取任何金錢。"},
  {a:"貪污治罪條例§6-1", q:"建管處建照審查人員A因涉嫌違法核准建照及包庇廠商施工違規遭檢察官分案偵辦；偵查期間查得A名下除固定薪資收入外，另於其配偶及未成年子女名下合計新臺幣350萬元不明存款，且該等存款均係於A涉嫌犯罪後之1年內陸續存入。檢察官命A就上開財產來源提出說明，A僅泛稱「多年儲蓄所得」，卻無法提出任何薪資、投資或借貸憑證佐證。"},
  {a:"貪污治罪條例§11Ⅴ", q:"廠商負責人A曾於2年前對機關承辦人B行求現金30萬元，要求B違法放寬其工程履約期限，B當場拒絕收受。A事後心生悔意，於案件尚未被任何人發覺前，即主動向調查局說明上情並坦承全部經過。"},
  {a:"貪污治罪條例§12Ⅱ", q:"廠商負責人A為求工程驗收順利，交付現金2萬元予驗收人員B，請求B對於工程中一處不影響結構安全之極輕微瑕疵不予記載扣分。"},
  {a:"貪污治罪條例§16Ⅰ", q:"民眾A因土地重劃補償金額與地政局承辦人員B協調未果心生不滿，明知B從未向自己索取任何財物或不正利益，竟仍具狀向監察院檢舉B於重劃過程中收受其行賄之現金50萬元，企圖使B遭移送懲戒並負刑事責任；監察院調查後查無實據簽結。"},
  {a:"貪污治罪條例§18Ⅰ", q:"某機關約僱人員A發現同事B涉嫌於採購案中收受廠商賄賂，A擔心檢舉後遭受職場報復或人事考核不利，猶豫是否具名檢舉，欲了解是否有相關法令保障檢舉人身分並給予適當之獎勵。"},
  {a:"貪污治罪條例§4Ⅰ⑤、§11Ⅰ", q:"某餐飲業者A經營之店面因未經合法變更用途，遭建管處認定違規使用，屆期未改善將遭勒令停業。A乃私下拜訪承辦科員B，於B辦公室內提出現金15萬元，要求B將本案分類為「已補正」並不再列管稽查；B收下款項後，明知該店面仍屬違規使用，仍將稽查案件逕行結案並移除列管。"},
  {a:"貪污治罪條例§5Ⅰ③、§11Ⅱ", q:"KTV業者負責人A為求消防安全檢查程序順利進行、避免久候，於檢查前主動包了紅包2千元交給消防局承辦安檢人員B；B依規定正常檢查，該場所原本即完全符合各項消防安全設備標準，B遂依實際檢查結果開立合格證明。"},
  {a:"貪污治罪條例§6Ⅰ④、§8Ⅱ", q:"廢棄物清運標案承辦人A明知應依法定期限公開招標，竟違反規定以隨機比價方式，將標案發包予由其配偶掛名經營之清運公司，A並自該公司分得紅利15萬元。案經人檢舉後，A於偵查中坦承違法發包及收受紅利之事實，並主動將15萬元全數繳回。"},
  {a:"貪污治罪條例§6Ⅰ①、§12Ⅰ", q:"地價稅退稅承辦人A意圖從中獲取孳息利益，明知納稅義務人B之退稅案已核准退稅4萬8千元，仍故意拖延不予退還達3個月，先將該筆退稅款存入自己申設之帳戶生息，期滿後始將本金退還B。"},
  {a:"貪污治罪條例§4Ⅰ⑤、§7", q:"警員甲於執行毒品案件之調查勤務時，查獲乙持有第二級毒品達可疑販賣之數量，甲收受乙交付之現金5萬元後，明知應依法移送而未依法移送，反而將扣得之毒品證物銷毀滅跡並縱放乙離去。"},
  {a:"刑法§121Ⅰ", q:"某民間商務糾紛經雙方合意提付仲裁，仲裁人A受選任處理該案。程序進行中，聲請人一方之負責人B私下致送A現金5萬元，向其表示「仰賴照顧」，A明知該款項與其仲裁職務有關仍予收下；惟A其後仍依仲裁法規定之程序，本於公正立場作成仲裁判斷，並未偏袒任何一方。"},
  {a:"刑法§121Ⅱ", q:"某商務仲裁案之仲裁人C，受當事人一方D於程序進行中致贈名貴手錶一只（市價約15萬元），雙方僅泛稱「感謝費心處理」，未曾言明具體要求C為如何之仲裁結果。C收下手錶後，作成之仲裁判斷罔顧另一方提出之關鍵證據，明顯偏袒D，逾越仲裁人應保持之公正立場。"},
  {a:"刑法§122Ⅰ", q:"某勞資爭議之仲裁人E經其中一方雇主F私下期約：只要仲裁判斷為F勝訴，事後將給付E新臺幣10萬元酬金，E應允之。惟因勞方嗣後撤回仲裁聲請，程序終止，仲裁判斷並未作成。"},
  {a:"刑法§123", q:"甲現為某產業公會秘書，尚未取得仲裁人資格。某工程廠商乙因預見雙方未來可能發生履約爭議，遂與甲約定：若甲日後取得仲裁人資格並受指定承辦該廠商之仲裁案件，即先行給付甲30萬元，甲應允並收受該筆款項。半年後甲通過仲裁人訓練取得資格，某次果真受指定處理乙提付仲裁之工程款爭議案，甲亦依約對乙從優處理，作成有利於乙之仲裁判斷。"},
  {a:"刑法§129Ⅰ", q:"地方稅捐稽徵所股長A為提升本年度稅捐稽徵考核績效數據，明知轄內某筆土地依土地稅減免規則規定應予免徵地價稅，仍指示所屬人員對該筆土地照常發單徵收，徵起稅款並依規定解繳國庫，A本人及所屬均未從中獲取任何金錢或其他利益，純粹是為使統計報表數字好看。"},
  {a:"刑法§129Ⅱ", q:"消防局大隊部承辦人B原應於每月10日前發放轄區義消人員之出勤補助費，因B個人對某分隊幾位義消心生不滿，明知渠等出勤紀錄合於規定應予發給，仍以「尚待核章」為由持續拖延達半年之久未發放，B本人未將該筆款項挪作他用，亦未從中獲取任何利益，純粹出於對特定人之報復心態而抑留不發。"},
  {a:"刑法§130", q:"山地鄉公所建設課課長C及承辦土石流防災業務之技士D明知轄內某處坡地經中央地質調查機關列為土石流高潛勢警戒區，且已發布豪雨特報，仍因人力調度不足而心存「應該不會那麼剛好」之心態，不予理會，未依規定發布警戒疏散通知，亦未協調居民預先避難。當晚豪雨引發土石流，造成該區數戶民宅遭掩埋、居民傷亡。"},
  {a:"刑法§131", q:"鄉公所民政課約僱人員G明知依老人生活津貼申請要點規定，申請人之財產須低於一定額度始符合請領資格，仍在知悉申請人H名下另有一筆未申報之土地、明顯不符資格之情況下，違背規定逕行核准H之津貼申請，使H每月順利請領該項生活津貼。"},
  {a:"刑法§132Ⅱ", q:"警察局偵查隊員警G因辦理某重大案件之搜索票聲請作業，誤將載有該案尚未執行之搜索地點、時間等應秘密消息之公文書檔案，附加於一封原欲寄送其他單位之公務電子郵件中，未察覺附件夾帶錯誤即逕行寄出，導致該應秘密之搜索行動消息提前外流至非相關人員。"},
  {a:"刑法§132Ⅲ", q:"某大學教授H受衛生局委聘，以外部專家身分參與某傳染病防治應變小組之秘密會議，會後H明知會議中討論之防疫物資調度應變方案屬應秘密消息，為求在學術期刊搶先發表相關分析，故意將該應變方案內容提前透露予媒體記者。"},
  {a:"刑法§213", q:"警察分局某派出所員警I辦理民眾J之失竊機車報案受理後，為美化轄區當月偵查績效統計數字，明知該案尚未偵破、犯嫌尚未查獲，仍在職務上所掌之「刑案偵辦進度管制表」（公文書）上登載「已偵結，贓車尋獲」之不實內容陳報上級，足以生損害於公眾對治安統計數據之信賴及J對案件後續處理之權益。"},
  {a:"刑法§213、貪污治罪條例§6Ⅰ④", q:"建管處建築物使用執照核發案承辦人K辦理廠商L申請之新建工程使用執照案件時，明知L之建物依竣工現場勘驗結果未依原核准圖說完成消防安全設備之設置，不符發照要件，因與L私交甚篤且受L請託，仍在職務上所掌之竣工勘驗紀錄表（公文書）登載「現場勘驗相符，准予核發」之不實內容，使L得以順利取得使用執照並將該批建物對外銷售獲利逾千萬元。"},
  {a:"刑法§122Ⅱ、刑法§122Ⅲ", q:"某消費爭議仲裁案之仲裁人M，於程序進行前經聲請人N期約：若仲裁判斷為N勝訴，事後給付M現金20萬元，M應允之；N亦依約於仲裁判斷作成前先行交付其中10萬元予M。其後M作成之仲裁判斷罔顧相對人提出之關鍵事證，逕為有利N之判斷，明顯違背其應秉持之公正仲裁義務。"},
  {a:"刑法§132Ⅰ、刑法§318", q:"某公立醫院採購單位承辦人O於醫療設備採購案評選階段，除故意將本案預算核定之底價（應秘密消息）洩漏予其中一家投標廠商P外，並一併將競爭廠商Q先前投標文件中所載之獨家專利技術規格與成本結構明細（Q之工商秘密，O因職務知悉並持有）一併轉知P，使P得以調整投標策略。"},
  {a:"刑法§130、貪污治罪條例§6Ⅰ①", q:"轄區抽水站站長A明知該站抽水設備因年久失修，抽水功能早已大幅衰退、隨時可能故障，仍不予理會，未依規定簽報上級編列經費檢修。轄內里長及居民曾多次反映抽水站疑似故障、要求儘速檢修，A均以「尚可運作」為由置之不理。某次颱風豪雨來襲，抽水站果因設備故障無法及時排水，造成鄰近社區嚴重淹水，多戶民宅泡水受損。災後負責審核並核發淹水救助金之社會局承辦人員B，明知受災戶C等多人均已檢附證明文件、符合請領資格，卻故意拖延近四個月未予核發。B並將待撥付之救助金暫存入自己申辦之定期存款帳戶生息牟利，經C等人多次陳情催促後才勉強撥款了結。"},
  {a:"貪污治罪條例§4Ⅰ③、刑法§213", q:"某公共工程之監造人員A，於廠商負責人B私下拜訪後，同意於工程施作期間放寬監督標準，並收受B按工程契約總價二成計算、分次交付合計240萬元之現金作為回扣。驗收當日，A明知該工程實際使用之鋼筋規格與數量均與契約圖說不符，未達約定強度標準。A仍在其職務上所掌之驗收紀錄表上，載明「經核對與圖說相符，准予驗收合格」之不實內容。該工程因而順利辦理結算，機關並全額撥付工程款予B所屬公司。"},
  {a:"貪污治罪條例§6Ⅰ②、§13Ⅰ", q:"某地政事務所辦理轄內重劃區土地徵收補償查估之承辦人員A，於查估轄內地主B所有之地上物補償金額時，明知B所有之地上物現況與登記面積不符、遠未達補償標準。A仍配合B虛報增列坪數及地上物項目，使徵收補償金額虛增新臺幣320萬元，並自B處收取「好處費」80萬元。A之直屬主管、該地政事務所課長C於例行稽核時，經承辦稽核人員簽報提醒查估明細數據異常，已知悉A涉嫌貪污舞弊。C因與A交情深厚而不予深究，既未依規定簽報調查，亦未陳報上級或司法機關，任由A繼續承辦後續查估業務。"},

];

const PAGE_SIZE = 20;
const state = {
  admin: { data: ADMIN, page: 1 },
  corrupt: { data: CORRUPT, page: 1 }
};

function totalPages(data){
  return Math.max(1, Math.ceil(data.length / PAGE_SIZE));
}

function render(key){
  const s = state[key];
  const paneId = "pane-" + key;
  const total = totalPages(s.data);
  if(s.page > total) s.page = total;
  if(s.page < 1) s.page = 1;
  const start = (s.page - 1) * PAGE_SIZE;
  const pageItems = s.data.slice(start, start + PAGE_SIZE);

  const list = document.getElementById(paneId + "-list");
  list.innerHTML = pageItems.map((item, i) => `
    <div class="q-card" data-idx="${start + i}">
      <div class="q-head">
        <div class="q-num">${start + i + 1}</div>
        <div style="flex:1;">
          <div class="q-text">${item.q}</div>
          <div class="hint">點擊查看適用法條</div>
          <div class="q-answer">${item.a}</div>
        </div>
      </div>
    </div>
  `).join("");
  list.querySelectorAll(".q-card").forEach(card => {
    card.addEventListener("click", () => {
      card.classList.toggle("revealed");
      updateProgress();
    });
  });

  renderPagination(key, total);
  updateProgress();
}

function renderPagination(key, total){
  const wrap = document.getElementById("pane-" + key + "-pagination");
  const page = state[key].page;
  let html = `<button data-page="${page-1}" ${page<=1?"disabled":""}>‹ 上一頁</button>`;
  for(let p = 1; p <= total; p++){
    html += `<button data-page="${p}" class="${p===page?"active":""}">${p}</button>`;
  }
  html += `<button data-page="${page+1}" ${page>=total?"disabled":""}>下一頁 ›</button>`;
  wrap.innerHTML = html;
  wrap.querySelectorAll("button[data-page]").forEach(btn => {
    btn.addEventListener("click", () => {
      state[key].page = parseInt(btn.dataset.page, 10);
      render(key);
      document.querySelector(".tabs").scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
}

function shuffleArr(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

shuffleArr(ADMIN);
shuffleArr(CORRUPT);
render("admin");
render("corrupt");

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("pane-" + btn.dataset.tab).classList.add("active");
    updateProgress();
  });
});

function activeKey(){
  return document.getElementById("pane-admin").classList.contains("active") ? "admin" : "corrupt";
}
function updateProgress(){
  const pane = document.querySelector(".tab-pane.active");
  const total = pane.querySelectorAll(".q-card").length;
  const done = pane.querySelectorAll(".q-card.revealed").length;
  const key = activeKey();
  document.getElementById("progressText").textContent = `本頁已顯示 ${done} / ${total} 題（第 ${state[key].page} / ${totalPages(state[key].data)} 頁）`;
}

document.getElementById("revealAll").addEventListener("click", () => {
  document.querySelector(".tab-pane.active").querySelectorAll(".q-card").forEach(c => c.classList.add("revealed"));
  updateProgress();
});
document.getElementById("hideAll").addEventListener("click", () => {
  document.querySelector(".tab-pane.active").querySelectorAll(".q-card").forEach(c => c.classList.remove("revealed"));
  updateProgress();
});
document.getElementById("shuffleBtn").addEventListener("click", () => {
  const key = activeKey();
  shuffleArr(state[key].data);
  state[key].page = 1;
  render(key);
});

updateProgress();
</script>
