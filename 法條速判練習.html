  {a:"§103③", q:"某開發案之審查程序訂有不可延展之法定期限，消防局於期限屆滿前一日始接獲相關違規資料，若依通常程序通知開發單位陳述意見，顯然無法於法定期間內完成審查，機關遂逕行作成處分。", problem:"問：消防局於法定期限緊迫下逕行作成處分而未給予陳述意見機會，是否合法？", body:"依§103③，有下列各款情形之一者，行政機關得不給予陳述意見之機會，其中第三款為受法定期間之限制，如予陳述意見之機會，顯然不能遵行者。此為§102陳述意見原則之法定例外事由之一，其要件可拆解為：該行政處分之作成受有不可延展之法定期間限制、倘依通常程序給予相對人陳述意見之機會，客觀上顯然將無法於該法定期間內完成處分之作成，此一例外之立法考量在於，若干事項因法規明定有嚴格之審查時限，若強行要求機關逐一踐行陳述意見程序，將使機關陷於違反法定期限與違反陳述意見義務兩難之窘境，故明文容許機關於此種情形下例外免除陳述意見義務。本案某開發案之審查程序訂有不可延展之法定期限，消防局於期限屆滿前一日始接獲相關違規資料，若依通常程序通知開發單位陳述意見，顯然無法於法定期間內完成審查，核與§103③受法定期間限制如予陳述意見顯然不能遵行之要件相符，消防局遂逕行作成處分，於法有據，並非違反§102正當程序保障之要求。惟機關仍應注意此一例外事由之適用應從嚴審酌，非謂機關得任意藉口時間緊迫而規避陳述意見義務。\n\n結語：消防局因法定不可延展期限緊迫致無法踐行陳述意見程序，依§103③得例外逕行作成處分，於法有據，惟該例外事由之適用應從嚴審酌，不得任意援引規避正當程序。"},
  {a:"§105Ⅲ", q:"消防局依法通知某工廠負責人，於文到十日內就擬處分之違規事實提出陳述書，負責人屆期未提出任何陳述書，機關遂依現有事證逕行作成處分。", problem:"問：負責人屆期未提出陳述書，機關逕依現有事證作成處分，是否合法？", body:"依§105Ⅰ，行政處分之相對人依前條規定提出之陳述書，應為事實上及法律上陳述；依§105Ⅲ，不於期間內提出陳述書者，視為放棄陳述之機會。此係規範陳述書提出之效果，其要件可拆解為：機關已依§104合法通知相對人得於一定期限內提出陳述書、相對人未於該期限內提出陳述書、法律效果上視為相對人已放棄陳述意見之機會，機關即得依現有事證逕行作成處分，毋須再等待或另行通知，亦不因相對人事後始提出陳述而必然影響原處分之合法性。本案消防局依法通知某工廠負責人，於文到十日內就擬處分之違規事實提出陳述書，此一通知程序核屬依§104所踐行之陳述意見通知程序，負責人屆期未提出任何陳述書，核與§105Ⅲ不於期間內提出陳述書之要件相符，依法應視為負責人已放棄陳述意見之機會，消防局遂依現有事證逕行作成處分，核與§105Ⅲ規定意旨完全相符，於法有據，並不因負責人未行使陳述意見機會而使該處分之作成程序有所欠缺，蓋機關已依法給予陳述意見之機會，僅係負責人自身未於期限內把握行使，其法律效果應由負責人自行承擔，機關不負補行通知或延展期限之義務。\n\n結語：工廠負責人逾期未提出陳述書，依§105Ⅲ視為放棄陳述機會，消防局依現有事證逕行作成處分，於法有據，程序上並無欠缺。"},
  {a:"§106Ⅰ", q:"甲君接獲消防局通知，得於十五日內提出陳述書，惟甲君於期限內改親赴消防局，以言詞方式陳述意見，並經承辦人員作成紀錄。", problem:"問：甲君得否以言詞方式陳述意見代替提出陳述書？", body:"依§106Ⅰ，行政處分之相對人或利害關係人得於第104條第1項第4款所定期限內，以言詞向行政機關陳述意見代替陳述書之提出。此係賦予相對人得於原定陳述書提出期限內，以言詞方式陳述意見以代替書面陳述書之選擇權，其要件可拆解為：須於§104Ⅰ④所定提出陳述書之期限內、以言詞方式向機關陳述意見、其效力等同於提出陳述書，機關不得以相對人未依原通知格式提出書面陳述書為由，逕認其未行使陳述意見權利，此一制度設計兼顧不同相對人陳述意見方式之便利性與彈性，避免因書面撰擬能力不足而剝奪其實質陳述意見之機會。本案甲君接獲消防局通知，得於十五日內提出陳述書，惟甲君於期限內改親赴消防局，以言詞方式陳述意見，此一作法核與§106Ⅰ得以言詞陳述意見代替陳述書之提出之要件完全相符，於法有據，甲君並非未行使陳述意見之機會，而係選擇以言詞方式行使。依§106Ⅱ，以言詞陳述意見者，行政機關應作成紀錄，經向陳述人朗讀或使閱覽確認其內容無誤後，由陳述人簽名或蓋章，本案承辦人員已依規定作成紀錄，惟仍應注意是否已依規定向甲君朗讀或使閱覽確認內容無誤後由其簽名或蓋章，倘漏未踐行此一確認程序，該言詞陳述紀錄之程序仍屬有瑕疵，應予補正。\n\n結語：甲君於期限內改以言詞陳述意見，依§106Ⅰ於法有據，效力等同提出陳述書，惟消防局仍應依§106Ⅱ完整踐行紀錄朗讀確認及簽章程序，以確保陳述內容之正確性。"},
  {a:"§107②", q:"某爆竹煙火製造場所擬遭撤銷許可，相關法規就此並未明文規定應舉行聽證，惟因案情複雜且涉及多方利害關係人，消防局衡酌後仍決定舉行聽證。", problem:"問：消防局於法規未強制規定下自行決定舉行聽證，是否於法有據？", body:"依§107，行政機關遇有下列各款情形之一者，舉行聽證：一、法規明文規定應舉行聽證者；二、行政機關認為有舉行聽證之必要者。此為聽證發動之二種情形，其要件可拆解為：第一款係義務性規定，法規明文要求者機關無裁量餘地，必須舉行聽證；第二款則係裁量性規定，縱法規未強制要求，機關本於個案情節認為有舉行聽證之必要者，仍得依職權決定舉行，二者併列為聽證發動之獨立事由，機關援引任一款均得合法舉行聽證。本案某爆竹煙火製造場所擬遭撤銷許可，此一撤銷許可處分對業者權益影響重大，相關法規就此雖並未明文規定應舉行聽證，惟因案情複雜且涉及多方利害關係人，消防局衡酌後仍決定舉行聽證，核與§107②行政機關認為有舉行聽證之必要者之要件完全相符，於法有據，機關本於職權裁量認定該案情複雜、影響層面廣泛而主動舉行聽證，並非法所不許，且更有助於周延保障業者及相關利害關係人之程序參與權利。倘經聽證程序後作成撤銷許可之處分，依§109，該處分之行政救濟程序，免除訴願及其先行程序，業者如不服，得逕行提起行政訴訟。\n\n結語：消防局依§107②基於職權認有必要而舉行聽證，於法有據，經聽證作成之撤銷許可處分，依§109業者得免除訴願程序逕行提起行政訴訟救濟。"},
  {a:"§109", q:"甲君所經營之加油站，經消防局依正式聽證程序作成廢止許可之處分，甲君不服，擬直接向行政法院提起撤銷訴訟，未先提起訴願。", problem:"問：甲君得否不經訴願程序逕行提起行政訴訟？", body:"依§109，不服依前條作成之行政處分者，其行政救濟程序，免除訴願及其先行程序。此係聽證制度賦予人民之重要程序回饋，其要件可拆解為：該行政處分須係依§108經聽證程序作成者、人民如不服該處分，其行政救濟程序得免除訴願及其先行程序，得逕行提起行政訴訟，此一設計之立法理由在於，經正式聽證程序作成之處分，其事實調查及程序保障已臻嚴謹周延，性質上近似於訴願之審查功能已於聽證程序中充分實現，故毋須再課予人民重複踐行訴願程序之負擔，以節省人民救濟成本並加速紛爭之終局解決。本案甲君所經營之加油站，經消防局依正式聽證程序作成廢止許可之處分，此一廢止許可處分核屬§108所稱經聽證程序作成之行政處分，甲君如不服，依§109規定，其行政救濟程序免除訴願及其先行程序，甲君擬直接向行政法院提起撤銷訴訟，未先提起訴願，核與§109規定要件完全相符，於法有據，行政法院不得以甲君未經訴願程序為由，逕認其起訴不合法而裁定駁回。此與一般未經聽證程序作成之行政處分，其相對人仍應依法先踐行訴願先行程序之情形明顯不同，二者救濟途徑之差異，即繫諸該處分作成時是否確實踐行§54至§66完整之聽證程序，甲君主張本案已符合免除訴願要件，應屬有據。\n\n結語：本案廢止許可處分係經正式聽證程序作成，依§109甲君得免除訴願程序，逕行向行政法院提起撤銷訴訟，其起訴程序合法。"},
  {a:"§111②", q:"依法令規定，消防設備檢修專技人員合格資格應以證書方式發給，惟消防局僅以口頭告知甲君考試合格，迄未核發任何證書。", problem:"問：消防局僅口頭告知合格而未核發證書，該處分效力如何？", body:"依§111②，行政處分有下列各款情形之一者，無效：應以證書方式作成而未給予證書者。此為無效行政處分七款事由中之一款，其要件可拆解為：依法規規定，該行政處分性質上應以證書方式作成、機關卻未依規定給予證書，僅以其他方式為之，即該當本款無效事由，其立法理由在於，若干資格或權利之取得，法規特別要求應以正式證書之形式賦予，係為確保該權利或資格之取得具有高度之公示性、確定性及證明力，若機關未依法給予證書，即與該要式規定之立法目的顯然背離，其瑕疵已達重大明顯之程度，故直接規定為無效，而非僅得撤銷。本案依法令規定，消防設備檢修專技人員合格資格應以證書方式發給，此核屬應以證書方式作成之要式行政處分，惟消防局僅以口頭告知甲君考試合格，迄未核發任何證書，核與§111②應以證書方式作成而未給予證書之要件完全相符，該口頭告知行為應認自始、當然、確定不生效力，甲君尚不得執此口頭告知，主張已合法取得消防設備檢修專技人員資格。應與§95Ⅰ言詞處分之一般規定區辨：§95Ⅰ原則上容許以言詞為行政處分，惟法規另有要式規定者從其規定，本案即屬該除外情形，機關仍應依法補發證書，方使甲君合法取得該資格。\n\n結語：消防局僅口頭告知甲君考試合格而未依法核發證書，依§111②該行為無效，機關應速依法補發證書，甲君於取得證書前尚不得主張已合法取得該專技資格。"},
  {a:"§111④", q:"某機關誤信申請資料，核准甲君之營業許可申請，該許可內容實質上係同意甲君於場所內從事販賣槍砲之營業行為，而此一經許可之行為依法構成犯罪。", problem:"問：機關核准甲君從事販賣槍砲營業行為之許可處分，效力如何？", body:"依§111④，行政處分有下列各款情形之一者，無效：所要求或許可之行為構成犯罪者。此為無效行政處分七款事由中之一款，其要件可拆解為：該行政處分之內容係要求相對人為一定行為，或許可相對人得為一定行為、該被要求或許可之行為，依法本身即構成犯罪行為，符合此二項要件者，該處分即屬無效，其立法理由在於，行政處分本應遵循依法行政原則，若處分之內容本身係命令或容許人民從事犯罪行為，即與法秩序整體之價值判斷根本牴觸，此種瑕疵已達重大明顯之程度，自不容任其發生效力，縱經相對人信賴或已有履行行為，亦不生任何法律上之保護必要。本案某機關誤信申請資料，核准甲君之營業許可申請，該許可內容實質上係同意甲君於場所內從事販賣槍砲之營業行為，而依法販賣槍砲未經合法許可者本身即構成犯罪行為，核與§111④所許可之行為構成犯罪之要件完全相符，該營業許可處分應認自始、當然、確定不生效力，甲君不得執此無效之許可處分，主張其販賣槍砲之行為已合法阻卻違法，機關發現後應依§113依職權確認該處分無效，並得逕行取締甲君違法販賣槍砲之行為，不受該無效許可外觀之拘束。\n\n結語：機關核准甲君從事依法構成犯罪之槍砲販賣行為，依§111④該許可處分自始無效，機關應依§113確認其無效並依法取締，甲君不得主張其行為已獲合法許可。"},
  {a:"§113", q:"消防局核發之處分書內容包含准予營業登記，及命業者繳納一筆法無明文依據之特別捐兩部分；其中特別捐部分因欠缺法律依據而無效，惟除去該部分後，准予營業登記之核准內容仍可獨立成立並生效。", problem:"問：業者得否請求消防局確認特別捐部分處分無效，而准予登記部分仍屬有效？", body:"依§113Ⅰ，行政處分之無效，行政機關得依職權確認之；依§113Ⅱ，行政處分之相對人或利害關係人有正當理由請求確認行政處分無效時，處分機關應確認其為有效或無效。此係無效行政處分之確認機制，其要件可拆解為：無效之確認得由機關依職權主動為之，亦得由相對人或利害關係人於具有正當理由時，向處分機關請求確認，機關受理後即負有應確認其為有效或無效之法定義務，不得置之不理，此一機制之目的在使處分之無效狀態，經機關以正式決定予以確認，避免無效處分之效力狀態長期處於不明確、爭議未決之狀態。而判斷本案特別捐部分是否確屬無效，仍應回歸§112行政處分一部分無效者其他部分仍為有效但除去該無效部分行政處分不能成立者全部無效之可分性原則為實體判斷基準：本案消防局核發之處分書內容包含准予營業登記，及命業者繳納一筆法無明文依據之特別捐兩部分，其中特別捐部分因欠缺法律依據，其無效事由甚為明確；而除去該特別捐部分後，准予營業登記之核准內容，其成立及生效並不以特別捐之繳納為前提要件，客觀上仍可獨立成立並發生效力，核與§112但書除去無效部分即不能成立之情形不同，依§112本文，准予營業登記部分應仍為有效。業者如就此存有疑義，得依§113Ⅱ向消防局請求確認該特別捐部分無效、准予登記部分有效。\n\n結語：業者依§113Ⅱ得請求消防局確認特別捐部分無效、准予登記部分有效，消防局依§112可分性原則審酌後，應確認特別捐部分無效而其餘核准登記部分仍屬有效，不得置之不理。"},
  {a:"§117、§119①", q:"甲君為取得消防設備補助款，對承辦人員行賄，使其違反審查標準逕行核准補助處分，機關事後查獲上情，擬撤銷該處分。", problem:"問：機關得否撤銷甲君以行賄取得之補助處分？", body:"依§117，違法行政處分於法定救濟期間經過後，原處分機關得依職權為全部或一部之撤銷，惟有二款除外情形不得撤銷：一為撤銷對公益有重大危害者；二為受益人無§119所列信賴不值得保護情形，而其信賴授予利益處分之信賴利益顯然大於撤銷所欲維護之公益者。依§119①，受益人有下列各款情形之一者，其信賴不值得保護：以詐欺、脅迫或賄賂方法，使行政機關作成行政處分者。本案甲君為取得消防設備補助款，對承辦人員行賄，使其違反審查標準逕行核准補助處分，該補助處分之作成因欠缺合法審查基礎，核屬違法行政處分，機關得依§117撤銷之；甲君以行賄方式使機關作成該處分，核與§119①以賄賂方法使行政機關作成行政處分之要件完全相符，其信賴依法應屬不值得保護，即不該當§117但書第2款受益人無§119所列情形之要件，機關撤銷該處分並無§117但書所定不得撤銷之限制事由，機關自得依§117撤銷該違法補助處分。又因甲君信賴不值得保護，依§120Ⅰ反面解釋，機關撤銷後無須給予甲君任何補償；依§127Ⅰ，該補助款屬一次或連續金錢給付，經撤銷而溯及既往失效者，甲君應返還因該處分所受領之補助款，機關應依§127Ⅲ以書面行政處分確認返還範圍並限期命其返還。\n\n結語：甲君以行賄取得補助處分，依§119①其信賴不值得保護，機關得依§117撤銷該處分，並依§127命其返還已受領之補助款，甲君亦可能另涉刑事責任。"},
  {a:"§121Ⅰ", q:"消防局於一0九年間即已知悉某補助處分因申請人資料造假而屬違法，惟遲至知悉後第三年，機關始擬撤銷該處分。", problem:"問：消防局於知悉違法原因後第三年始擬撤銷，是否已逾撤銷權行使期限？", body:"依§121Ⅰ，行政機關依第117條之撤銷權，應自原處分機關或其上級機關知有撤銷原因時起二年內為之。此為撤銷權之除斥期間規定，其要件可拆解為：期間之起算點為原處分機關或其上級機關知有撤銷原因時、機關應於該起算點起二年內行使撤銷權，逾期即不得再行撤銷，此與§131Ⅰ公法上請求權之一般消滅時效性質不同，二者不可混淆：前者係機關撤銷違法處分此一形成權之除斥期間，後者係公法上金錢給付等請求權之消滅時效，起算點與適用對象均有差異。本案消防局於一0九年間即已知悉某補助處分因申請人資料造假而屬違法，依§121Ⅰ，其撤銷權除斥期間應自一0九年知悉撤銷原因時起算，二年之除斥期間應於一一一年即屆滿；惟消防局遲至知悉後第三年，始擬撤銷該處分，其行使撤銷權之時點已逾§121Ⅰ所定二年除斥期間，核與該條規定要件不符，消防局此時已不得再依§117撤銷該違法補助處分，該補助處分縱屬違法，因撤銷權已罹於除斥期間而消滅，其效力應認已趨於確定，機關不得再行撤銷。此與§124廢止權除斥期間之起算基準亦有不同，二者雖同為二年之除斥期間，然撤銷權以機關知悉違法原因之時為起算基準，廢止權則以客觀原因發生之時起算，二者性質及起算點均有差異，作答時應注意勿混淆援引錯誤條號。\n\n結語：消防局遲至知悉撤銷原因後第三年始擬撤銷，已逾§121Ⅰ所定二年除斥期間，其撤銷權已消滅，該補助處分縱屬違法亦不得再予撤銷，其效力應認已確定。"},
  {a:"§122", q:"消防局先前依法對某場所核發限期改善逃生通道之合法處分，嗣後該場所歇業，機關擬依職權廢止該限期改善處分，惟經查若該場所日後復業，機關仍須對其為相同內容之改善處分。", problem:"問：消防局得否依職權廢止該限期改善逃生通道之處分？", body:"依§122，非授予利益之合法行政處分，得由原處分機關依職權為全部或一部之廢止，但廢止後仍應為同一內容之處分或依法不得廢止者，不在此限。此為非授益合法處分廢止之規定，其要件可拆解為：須為非授予利益之合法行政處分、原則上機關得依職權廢止、例外於廢止後仍應為同一內容之處分，或依法不得廢止者，則不得廢止，此一但書規定之目的在於，若廢止該處分後，機關基於相同事實或法規依據，仍須對相對人另為內容相同之處分，則此種廢止實質上僅屬形式上之空轉，對相對人之權利義務並無實質變動，徒增行政程序之重複與成本，故明文排除此種情形之廢止。本案消防局先前依法對某場所核發限期改善逃生通道之合法處分，此屬非授予利益之合法行政處分，該場所嗣後歇業，機關擬依職權廢止該限期改善處分；惟經查若該場所日後復業，機關仍須對其為相同內容之改善處分，此一情形核與§122但書廢止後仍應為同一內容之處分之除外事由相符，消防局依法即不得廢止該限期改善逃生通道處分，該處分縱因場所歇業而暫時欠缺執行實益，仍應維持其存續，不得逕行廢止。\n\n結語：本案因場所日後復業仍須為相同內容之改善處分，核屬§122但書之除外情形，消防局不得依職權廢止該限期改善逃生通道處分，該處分應繼續存續。"},
  {a:"§123①", q:"某補助辦法明文規定，主管機關得於受補助單位嗣後不再具備一定資格時，廢止其補助資格處分，消防局據該辦法規定，對已喪失資格之受補助單位廢止原核准補助處分。", problem:"問：消防局依補助辦法規定廢止已喪失資格單位之補助處分，是否合法？", body:"依§123，授予利益之合法行政處分，有下列各款情形之一者，得由原處分機關依職權為全部或一部之廢止：一、法規准許廢止者。其餘尚有原處分機關保留廢止權、附負擔未履行、法規事實變更致不廢止有害公益、其他防止或除去公益重大危害等事由。其中第一款法規准許廢止者，其要件可拆解為：須有明文之法規規定，就一定情形明文准許機關得廢止該授益處分，此款屬法規已預先明定廢止事由之類型，與其餘各款須機關另行審酌是否合於個案要件者相較，第一款之判斷相對明確，機關僅須查核是否確實符合該法規所定之廢止要件即可。本案某補助辦法明文規定，主管機關得於受補助單位嗣後不再具備一定資格時，廢止其補助資格處分，此一辦法規定核屬§123①所稱法規准許廢止之明文依據；消防局據該辦法規定，對已喪失資格之受補助單位廢止原核准補助處分，核與§123①要件完全相符，於法有據。惟仍應注意，依§124，此項廢止應自廢止原因發生後二年內為之，逾期即不得再行廢止；又依§125，合法行政處分經廢止後，原則上自廢止時起向後失效。\n\n結語：消防局依§123①法規准許廢止之明文依據，對已喪失資格單位廢止原補助處分，於法有據，惟應注意依§124於二年除斥期間內為之，並依§125原則向後發生失效。"},
  {a:"§123④", q:"消防局原核准某場所依當時標準設置之消防安全設備處分，嗣後相關法規修正提高安全標準，且該場所所在建物之實際使用狀況亦已變更，若不廢止原處分而繼續適用舊有標準，將對公共安全造成危害。", problem:"問：消防局得否以法規及事實變更為由廢止原核准處分？", body:"依§123④，授予利益之合法行政處分，有行政處分所依據之法規或事實事後發生變更，致不廢止該處分對公益將有危害者，得由原處分機關依職權為全部或一部之廢止。此為授益處分廢止事由之一，其要件可拆解為：須為原處分所依據之法規或事實事後發生變更、且須因該變更致不廢止該處分將對公益產生危害，二者須同時具備，方得依本款廢止，此一事由之立法理由在於，行政處分作成當時雖屬合法，然情事變遷後若仍任其存續，可能與變更後之法規或事實狀態產生扞格，甚而危及公益，故賦予機關因應情事變更而廢止原處分之權限。本案消防局原核准某場所依當時標準設置之消防安全設備處分，於作成當時核屬合法授益處分；嗣後相關法規修正提高安全標準，且該場所所在建物之實際使用狀況亦已變更，此均屬處分所依據之法規及事實事後發生變更之情形，若不廢止原處分而繼續適用舊有標準，將對公共安全造成危害，核與§123④法規或事實變更致不廢止對公益將有危害之要件完全相符，消防局得依職權廢止原核准處分，命該場所依修正後之新標準重新設置消防安全設備。依§126Ⅰ，因本款事由廢止授益處分，致受益人受有信賴財產上損失者，機關應給予合理補償。\n\n結語：消防局得依§123④因法規及事實變更廢止原核准處分，惟依§126Ⅰ，該場所業主如因信賴原處分而受有財產上損失，消防局應給予合理補償。"},
  {a:"§124", q:"某受益人未依約履行補助負擔之情事於一0八年即已發生，消防局遲至該情事發生後第三年，始擬依此事由廢止原補助處分。", problem:"問：消防局遲至第三年始擬廢止，是否已逾廢止權行使期限？", body:"依§124，前條之廢止，應自廢止原因發生後二年內為之。此為授益處分廢止權之除斥期間規定，其要件可拆解為：期間之起算點為廢止原因發生之時，機關應於該起算點起二年內行使廢止權，逾期即不得再依§123各款事由廢止該授益處分，此與§121Ⅰ撤銷權除斥期間之起算點知有撤銷原因時有所不同：撤銷權除斥期間以機關知悉違法原因為起算基準，廢止權除斥期間則以廢止原因發生之客觀時點為起算基準，不以機關主觀知悉與否為斷，二者起算基準不同，作答時應注意區辨勿混淆。本案某受益人未依約履行補助負擔之情事於一0八年即已發生，此即§123③附負擔之行政處分受益人未履行該負擔者之廢止原因發生時點，依§124，消防局之廢止權除斥期間應自一0八年該未履行負擔情事發生時起算，二年除斥期間應於一一0年屆滿；惟消防局遲至該情事發生後第三年，始擬依此事由廢止原補助處分，其行使廢止權之時點已逾§124所定二年除斥期間，消防局此時已不得再依§123③廢止該補助處分，該處分之存續狀態應認已趨於確定。此與§121Ⅰ撤銷權除斥期間之起算基準（機關知有撤銷原因時）亦有不同，本款廢止權除斥期間不問機關主觀上是否知悉未履行負擔之情事，一律自客觀原因發生時起算，機關內部未能及時掌握相關情資，亦不影響該除斥期間之進行。\n\n結語：消防局遲至廢止原因發生後第三年始擬廢止，已逾§124所定二年除斥期間，其廢止權已消滅，不得再依§123③事由廢止原補助處分。"},
  {a:"§131Ⅰ", q:"消防局對甲君核發之罰鍰處分確定後，得為強制執行之時起已逾五年又六個月，機關始擬移送執行徵收。", problem:"問：消防局逾五年又六個月始擬移送執行，該罰鍰請求權是否已消滅？", body:"依§131Ⅰ，公法上之請求權，於請求權人為行政機關時，除法律另有規定外，因五年間不行使而消滅；於請求權人為人民時，則因十年間不行使而消滅。依§131Ⅱ，公法上請求權，因時效完成而當然消滅，不待義務人主張。其要件可拆解為：請求權人為行政機關者，適用五年時效期間、時效起算點原則上為得請求給付之時、時效完成後該請求權當然消滅，不因義務人未於程序中主張抗辯而使機關仍得繼續行使。本案消防局對甲君核發之罰鍰處分確定後，其請求甲君繳納罰鍰之公法上金錢給付請求權，請求權人為消防局，依§131Ⅰ前段應適用五年時效期間，時效應自處分確定、得為強制執行之時起算；消防局自得為強制執行之時起已逾五年又六個月始擬移送執行徵收，其未行使該請求權之期間已明顯超過五年之法定時效期間，依§131Ⅱ規定，該罰鍰繳納請求權應已因時效完成而當然消滅，消防局現始移送行政執行機關徵收，於法已屬無據，執行機關亦應本於時效完成當然消滅之法理，不予受理該移送執行案件，甲君並得援引時效完成為抗辯，拒絕繳納。\n\n結語：消防局對甲君罰鍰請求權已逾五年時效期間，依§131當然消滅，消防局現始擬移送執行於法無據，甲君得以時效完成為由拒絕繳納。"},
  {a:"§117、§119②", q:"甲君申請消防安全設備補助時，就廠房實際坪數此一重要事項為不完全陳述，消防局據其陳述資料核准補助處分，於法定救濟期間經過後，機關始發現上情，擬撤銷原處分。", problem:"問：機關得否撤銷甲君因不完全陳述取得之補助處分？", body:"依§117，違法行政處分於法定救濟期間經過後，原處分機關得依職權為全部或一部之撤銷，惟有二款除外情形不得撤銷。依§119②，受益人有下列各款情形之一者，其信賴不值得保護：對重要事項提供不正確資料或為不完全陳述，致使行政機關依該資料或陳述而作成行政處分者。本案甲君申請消防安全設備補助時，就廠房實際坪數此一重要事項為不完全陳述，消防局據其陳述資料核准補助處分，核與§119②對重要事項提供不正確資料或為不完全陳述致使行政機關依該資料或陳述而作成行政處分之要件完全相符，甲君之信賴依法應屬不值得保護。該補助處分因甲君陳述不完全致機關審查基礎有誤，其作成即有違法之瑕疵，於法定救濟期間經過後，機關依§117仍得依職權撤銷之；因甲君信賴不值得保護，不該當§117但書第2款之要件，機關撤銷並無不得撤銷之限制事由。應與§119①以詐欺脅迫或賄賂方法相區辨：本款所稱不完全陳述，不以甲君主觀上有詐欺故意為必要，只須客觀上其陳述內容確有不完全、致機關依此作成錯誤處分即足當之，主觀可歸責程度雖較①③款輕，惟法律效果同樣使其信賴不值得保護。機關撤銷後，依§120Ⅰ反面解釋無須補償，並得依§127命甲君返還已受領之補助款。\n\n結語：甲君就重要事項不完全陳述致機關依此核准補助，依§119②其信賴不值得保護，機關得依§117撤銷原處分，並依§127命其返還已受領之補助款。"},
  {a:"§123③、§125、§127Ⅰ", q:"消防局核准甲君之消防安全設備補助處分，並附加負擔命其於一年內完成設備安裝及提出驗收證明，甲君屆期仍未安裝亦未提出證明，消防局遂廢止原補助處分，並以書面處分命甲君返還已受領之補助款。", problem:"問：消防局廢止原補助處分並命甲君返還補助款，是否合法，效力應如何認定？", body:"依§123③，授予利益之合法行政處分，附負擔之行政處分，受益人未履行該負擔者，得由原處分機關依職權為全部或一部之廢止。本案消防局核准甲君之消防安全設備補助處分，並附加負擔命其於一年內完成設備安裝及提出驗收證明，此屬§93Ⅱ③負擔之合法附款，甲君屆期仍未安裝亦未提出證明，核與§123③受益人未履行該負擔之要件完全相符，消防局得依職權廢止原補助處分，於法有據。依§125，合法行政處分經廢止後，自廢止時或自廢止機關所指定較後之日時起，失其效力，但受益人未履行負擔致行政處分受廢止者，得溯及既往失其效力，本案甲君因未履行負擔而受廢止，核與§125但書相符，消防局得使原補助處分溯及既往失效，使甲君自始不具受領補助之合法原因。依§127Ⅰ，授予利益之行政處分，其內容係提供一次或連續之金錢給付者，經廢止而有溯及既往失效之情形時，受益人應返還因該處分所受領之給付，本案補助款屬一次性金錢給付，經溯及既往失效後，甲君即負有返還義務，消防局依§127Ⅲ以書面行政處分確認返還範圍並限期命甲君返還，核與規定相符，惟依§127Ⅳ，該返還處分未確定前，不得移送行政執行。\n\n結語：消防局依§123③廢止原補助處分並依§125但書使其溯及既往失效，依§127Ⅰ、Ⅲ以書面處分命甲君返還補助款，程序合法，惟該返還處分未確定前依§127Ⅳ不得移送行政執行。"},
  {a:"§96Ⅰ⑥、§98Ⅰ", q:"消防局核發之裁處書上記載不服本處分應於十日內提起訴願，惟法定訴願期間實為三十日，機關事後發現此一錯誤，遂以書面通知受處分人更正救濟期間。", problem:"問：消防局發現教示錯誤後以書面通知更正，程序是否合法？", body:"依§96Ⅰ⑥，行政處分以書面為之者，應記載表明其為行政處分之意旨及不服行政處分之救濟方法、期間及其受理機關，此即教示制度，屬書面處分應記載事項之一，目的在使處分相對人得以知悉如何行使救濟權利。依§98Ⅰ，處分機關告知之救濟期間有錯誤時，應由該機關以通知更正之，並自通知送達之翌日起算法定期間。本案消防局核發之裁處書上記載不服本處分應於十日內提起訴願，惟法定訴願期間實為三十日，此一記載核與§96Ⅰ⑥所要求正確教示救濟期間之義務不符，屬教示錯誤，且係將期間記載較法定期間為短，若受處分人信賴該錯誤之十日較短期間，恐因此喪失部分本應享有之法定救濟期間，機關事後發現此一錯誤，依§98Ⅰ規定，應由該機關以通知更正之，並自通知送達之翌日起算法定期間，即三十日訴願期間應自更正通知送達受處分人之翌日起重新起算，而非自原裁處書送達之日起算，本案消防局遂以書面通知受處分人更正救濟期間，核與§98Ⅰ規定要件完全相符，於法有據。倘受處分人已信賴原錯誤記載之十日期間而於十日內提起訴願，依§98Ⅰ更正後重新起算之三十日期間，其原提起訴願之效力並不因此受影響，仍應認屬合法；此與§98Ⅱ規範機關告知救濟期間較法定期間為長之情形恰為相反之態樣，二者均在保障人民不因機關教示疏失而喪失救濟權利。\n\n結語：消防局依§96Ⅰ⑥發現教示期間錯誤，依§98Ⅰ以書面通知更正，程序合法，受處分人之三十日訴願期間應自更正通知送達之翌日起重新起算。"},
  {a:"§111⑤、§114Ⅰ", q:"消防局命甲君拆除違建結構之處分，其內容實質上係命甲君將拆除之建材未經任何環保處理，逕行掩埋於水源保護區內；又該處分作成前，消防局並未依法給予甲君陳述意見之機會，乃於處分作成後始通知甲君補行提出意見。", problem:"問：本件處分之效力如何，其程序瑕疵得否補正？", body:"依§111⑤，行政處分有下列各款情形之一者，無效：內容違背公共秩序、善良風俗者。本案消防局命甲君拆除違建結構之處分，其內容實質上係命甲君將拆除之建材未經任何環保處理，逕行掩埋於水源保護區內，此一內容顯然嚴重違反環境保護及水源保護之公共秩序，核與§111⑤內容違背公共秩序之要件相符，該處分應認自始、當然、確定不生效力，甲君不得亦不應依該無效處分之內容為掩埋行為。另就程序瑕疵部分，依§114Ⅰ，違反程序或方式規定之行政處分，除依第111條規定而無效者外，因列舉五款事由而得補正，其中第3款為應給予當事人陳述意見之機會已於事後給予者；惟依§114Ⅱ，該補正行為僅得於訴願程序終結前為之，得不經訴願程序者，僅得於向行政法院起訴前為之。惟須注意，本案處分因內容違背公共秩序而依§111⑤已屬無效，依§114Ⅰ本文除依第111條規定而無效者外之除外規定，無效處分本身即不生補正之問題，補正僅適用於得撤銷之瑕疵處分，無效處分自始不生效力，補正亦無實益，縱機關已於事後給予甲君陳述意見機會，亦無從治癒該處分因內容違法而生之無效瑕疵。\n\n結語：本件處分因命甲君違法掩埋建材而依§111⑤違背公共秩序，應屬無效，縱機關事後補行陳述意見程序，依§114Ⅰ除外規定，亦無從補正治癒該無效瑕疵，甲君不受該處分內容拘束。"},
  {a:"§102、§103⑤", q:"消防局擬對某場所違規使用易燃材料裝修之事實作成停業處分，惟違規事實業經稽查人員現場拍照及儀器檢測數據明確記錄，客觀上已明白足以確認，機關遂未再給予該場所負責人陳述意見之機會，即逕行作成處分。", problem:"問：消防局未給予陳述意見機會逕行作成停業處分，是否合法？", body:"依§102，行政機關作成限制或剝奪人民自由或權利之行政處分前，除已依第39條規定通知處分相對人陳述意見或決定舉行聽證者外，應給予該處分相對人陳述意見之機會，此為原則性規定；惟依§103⑤，有下列各款情形之一者，行政機關得不給予陳述意見之機會，其中第五款為行政處分所根據之事實，客觀上明白足以確認者。此係§102陳述意見原則之法定例外事由之一，其要件可拆解為：該處分所依據之事實，須客觀上已臻明白、無庸再經陳述意見程序即已足以確認，不因給予陳述意見與否而影響機關對事實之認定結果，此一例外之立法考量在於，若處分所依據之事實客觀上已極為明確，縱使給予陳述意見機會，亦難以動搖既已明確之事實認定，此時要求機關仍須踐行陳述意見程序，僅徒具形式而無實益，故明文容許例外免除。本案消防局擬對某場所違規使用易燃材料裝修之事實作成停業處分，此為§102所稱剝奪人民權利之處分，原則應給予陳述意見機會；惟該違規事實業經稽查人員現場拍照及儀器檢測數據明確記錄，客觀上已明白足以確認，核與§103⑤要件相符，機關遂未再給予該場所負責人陳述意見之機會，即逕行作成處分，於法有據，並非違反§102正當程序保障之要求。\n\n結語：本案違規事實業經拍照及儀器檢測明確記錄，客觀上已明白足以確認，核屬§103⑤例外事由，消防局未給予陳述意見機會逕行作成停業處分，於法有據，並不構成程序違法。"},
  {a:"§128Ⅰ②、§128Ⅱ", q:"甲君之消防安全設備檢修不合格處分，於法定救濟期間經過後確定；嗣後甲君發現其送驗時因儀器故障導致檢測數據異常之相關紀錄，該紀錄於處分作成前即已存在，惟當時未經機關調查斟酌，甲君於知悉後二個月內向機關申請重新審查，機關審酌全案後認為甲君之申請為有理由。", problem:"問：甲君得否於處分確定後，依新發現證據申請程序重開？", body:"依§128Ⅰ②，行政處分於法定救濟期間經過後，具有下列各款情形之一者，相對人或利害關係人得向行政機關申請撤銷、廢止或變更之，其中第二款為發生新事實或發現新證據者，但以如經斟酌可受較有利益之處分者為限。依§128Ⅱ，前項申請，應自法定救濟期間經過後三個月內為之，其事由發生在後或知悉在後者，自發生或知悉時起算，但自法定救濟期間經過後已逾五年者，不得申請。此為確定行政處分程序重開制度，其要件可拆解為：處分已於法定救濟期間經過後確定、發生新事實或發現新證據且經斟酌可受較有利益之處分、申請應自知悉該事由時起算三個月內為之，且不得逾法定救濟期間經過後五年之最長期限。依§128Ⅲ，所稱新證據，指處分作成前已存在或成立而未及調查斟酌，及處分作成後始存在或成立之證據。本案甲君之消防安全設備檢修不合格處分於法定救濟期間經過後確定，甲君嗣後發現其送驗時因儀器故障導致檢測數據異常之相關紀錄，該紀錄於處分作成前即已存在，惟當時未經機關調查斟酌，核與§128Ⅲ處分作成前已存在或成立而未及調查斟酌之新證據定義相符，且經斟酌顯可能使甲君受較有利益之處分，核與§128Ⅰ②要件相符；甲君於知悉後二個月內向機關申請重新審查，未逾§128Ⅱ所定三個月申請期限，機關審酌全案後認甲君申請有理由，依§129，應撤銷、廢止或變更原處分。\n\n結語：甲君發現之儀器故障紀錄核屬§128Ⅲ所稱新證據，其於知悉後二個月內申請重開程序，未逾§128Ⅱ期限，機關認申請有理由，依§129應撤銷或變更原不合格處分。"},
  {a:"§120Ⅰ、§121Ⅱ", q:"消防局撤銷甲君信賴值得保護之補助處分後，依法告知甲君得請求合理補償之事由，惟甲君遲至機關告知後第三年，始行文請求給付補償金。", problem:"問：甲君遲至機關告知後第三年始請求補償，其補償請求權是否已消滅？", body:"依§120Ⅰ，授予利益之違法行政處分經撤銷後，如受益人無前條所列信賴不值得保護之情形，其因信賴該處分致遭受財產上之損失者，為撤銷之機關應給予合理之補償。本案甲君信賴值得保護，消防局撤銷該補助處分後，依§120Ⅰ應給予甲君合理補償，此一補償請求權之發生要件已具備。惟依§121Ⅱ，前條之補償請求權，自行政機關告知其事由時起，因二年間不行使而消滅；自處分撤銷時起逾五年者，亦同。此為補償請求權之消滅時效規定，其要件可拆解為：時效起算點為行政機關告知其事由時，機關告知後二年間不行使即罹於時效而消滅；另設有自處分撤銷時起算五年之最長期限，二者取其先屆至者。本案消防局已依法告知甲君得請求合理補償之事由，依§121Ⅱ，甲君之補償請求權應自機關告知時起算二年時效，惟甲君遲至機關告知後第三年，始行文請求給付補償金，其行使補償請求權之時點已逾§121Ⅱ所定二年時效期間，核與該條規定不符，該補償請求權應已因罹於時效而消滅，消防局得以時效抗辯拒絕給付，甲君現始請求，於法已屬無據。\n\n結語：甲君之補償請求權應自機關告知時起算二年時效，其遲至第三年始請求，已逾§121Ⅱ所定期限，該請求權已罹於時效消滅，消防局得拒絕給付。"},
  {a:"§163、§164Ⅰ", q:"某直轄市消防局為解決轄內老舊社區木造建物密集延燒風險，事前就未來五年應辦理之土地徵收、防災通道開闢及分期改善等方法、步驟預為規劃，訂定「防災空間整建計畫」。因該計畫涉及多筆私有土地之特定利用，且牽涉都市發展局、地政局、消防局等多個機關權限，該局於確定計畫前，依規定辦理公開展覽並召開聽證會。", problem:"問：該防災空間整建計畫之性質為何，其確定程序是否合法？", body:"依§163，行政計畫，係指行政機關為將來一定期限內達成特定之目的或實現一定之構想，事前就達成該目的或實現該構想有關之方法、步驟或措施等所為之設計與規劃。本案消防局為解決轄內老舊社區木造建物密集延燒風險，事前就未來五年應辦理之土地徵收、防災通道開闢及分期改善等方法、步驟預為規劃，訂定防災空間整建計畫，此一規劃具有未來性、目的性及方法步驟之綜合設計性質，核與§163行政計畫之定義要件完全相符，性質上應認屬行政計畫。依§164Ⅰ，行政計畫有關一定地區土地之特定利用或重大公共設施之設置，涉及多數不同利益之人及多數不同行政機關權限者，確定其計畫之裁決，應經公開及聽證程序，並得有集中事權之效果。本案該計畫涉及多筆私有土地之特定利用，核屬一定地區土地之特定利用，且牽涉都市發展局、地政局、消防局等多個機關權限，核屬涉及多數不同行政機關權限，二者要件均已具備，依§164Ⅰ，該計畫之確定應經公開及聽證程序，消防局於確定計畫前，依規定辦理公開展覽並召開聽證會，核與§164Ⅰ規定要件完全相符，於法有據，程序合法周延。\n\n結語：本案防災空間整建計畫核屬§163行政計畫，因涉及特定土地利用及多機關權限，依§164Ⅰ消防局辦理公開展覽並召開聽證會確定計畫，程序合法，並得發揮集中事權之效果。"},
  {a:"§165", q:"消防局關懷轄內獨居長者居家用火安全，以電話方式「勸告」某獨居長者自行加裝住宅用火災警報器，並向其表示是否採納全憑個人意願，消防局並未以任何命令或處分要求其配合。", problem:"問：消防局以電話勸告獨居長者加裝住警器之行為性質為何？", body:"依§165，行政指導，謂行政機關在其職權或所掌事務範圍內，為實現一定之行政目的，以輔導、協助、勸告、建議或其他不具法律上強制力之方法，促請特定人為一定作為或不作為之行為。其要件可拆解為：須為機關於職權或所掌事務範圍內所為、目的在實現一定行政目的、手段限於輔導協助勸告建議等非權力性方法、效果不具法律上強制力、相對人得自由決定是否配合。本案消防局關懷轄內獨居長者居家用火安全，以電話方式勸告某獨居長者自行加裝住宅用火災警報器，核屬機關本於職掌之消防安全宣導事務所為之行為，目的在實現提升獨居長者居家用火安全此一行政目的，手段上係以勸告此一§165所明列之非權力性方法為之，並向其表示是否採納全憑個人意願，消防局並未以任何命令或處分要求其配合，核與§165行政指導五項要件悉數相符，性質上應屬行政指導，而非行政處分。此與§92Ⅰ行政處分對外直接發生法律效果之要件顯不相符，蓋該獨居長者無論是否採納此一勸告，均不生任何法律上之權利義務變動，消防局亦無從逕依此勸告本身對其為任何不利處置。依§166Ⅱ，相對人明確拒絕指導時，行政機關應即停止，並不得據此對相對人為不利之處置，倘該長者拒絕加裝，消防局仍應予以尊重。\n\n結語：消防局以電話勸告獨居長者加裝住警器之行為核屬§165行政指導，不具法律強制力，該長者得自由決定是否採納，消防局亦不得因其拒絕而為任何不利處置。"},
  {a:"§165", q:"消防局承辦人發現某住戶擬於防火巷內加蓋鐵皮增建，以口頭「勸導」方式建議住戶勿施作，並表示若住戶仍執意施工，消防局於當下並不會逕行開罰或強制拆除。", problem:"問：消防局承辦人口頭勸導住戶勿加蓋之行為性質為何？", body:"依§165，行政指導，謂行政機關在其職權或所掌事務範圍內，為實現一定之行政目的，以輔導、協助、勸告、建議或其他不具法律上強制力之方法，促請特定人為一定作為或不作為之行為。其要件可拆解為：須為機關於職權範圍內所為、目的在實現一定行政目的、手段限於輔導協助勸告建議等非權力性方法、效果不具法律上強制力、相對人得自由決定是否配合。本案消防局承辦人發現某住戶擬於防火巷內加蓋鐵皮增建，以口頭勸導方式建議住戶勿施作，核屬§165所稱之勸告方法；並明確表示若住戶仍執意施工，消防局於當下並不會逕行開罰或強制拆除，此一表示更彰顯該勸導行為不具任何法律上之強制力，核與§165行政指導之要件悉數相符，性質上應屬行政指導，而非行政處分或其他具強制力之公權力措施。應與消防局嗣後如依消防法或建築法規定，就該違規增建另行依法作成禁止或拆除之行政處分相區辨：本次口頭勸導本身，性質上僅係促請住戶自願配合之柔性手段，住戶縱執意施工，該行為本身亦不因違反勸導而當然構成違法，仍應視是否另違反其他強制性法規範而定，機關嗣後如欲強制執行，仍須另行依法作成具強制力之行政處分。\n\n結語：消防局承辦人以口頭勸導住戶勿於防火巷加蓋之行為核屬§165行政指導，不具強制力，住戶執意施工者，機關仍須另行依法作成具強制力之行政處分方得取締。"},
  {a:"§166Ⅰ", q:"某消防分隊員警於執行公務期間，以行政指導名義要求轄內KTV業者向其配偶所經營之公司採購與該場所消防安全設備需求無關之高價裝潢材料，其指導內容與消防法規保障公共安全之立法目的顯不相關。", problem:"問：該員警以行政指導名義要求業者採購配偶公司產品，是否合法？", body:"依§166Ⅰ，行政機關為行政指導時，應注意有關法規規定之目的，不得濫用。此係行政指導之目的拘束原則，其要件可拆解為：行政指導雖不具法律強制力，然機關為行政指導時，仍應注意相關法規規定之立法目的，不得假借行政指導之名，行與該目的無關甚或圖利特定私人之實，逾越目的範圍之行政指導即構成濫用，縱其形式上不具強制力，仍屬違法之行政行為，應予禁止。本案某消防分隊員警於執行公務期間，以行政指導名義要求轄內KTV業者向其配偶所經營之公司採購與該場所消防安全設備需求無關之高價裝潢材料，其指導內容與消防法規保障公共安全之立法目的顯不相關，反而係圖利該員警配偶所經營之公司，核與§166Ⅰ不得濫用之要求顯不相符，構成違法濫用行政指導權限之行為，非僅止於單純行政指導妥適與否之裁量問題。此一行為除違反§166Ⅰ外，因其實質上係公務員利用職務上機會，以行政指導之外觀掩飾圖利特定廠商之不正利益輸送，亦可能已該當貪污治罪條例圖利罪或其他刑事責任，業者如遭此不當要求，得拒絕配合並向消防局或監察機關檢舉該員警之違法行為，消防局查證屬實後，並應依法對該員警為相應之懲處。\n\n結語：該員警以行政指導名義要求業者採購配偶公司產品，違反§166Ⅰ目的拘束原則，構成濫用行政指導之違法行為，業者得拒絕並檢舉，機關應依法懲處該員警。"},
  {a:"§166Ⅱ", q:"消防局向某工廠業者建議加裝非屬法定應設之特殊偵煙設備，業者已以書面明確表示婉拒；消防局承辦人仍多次致電要求業者配合，並於其後排定之公共危險物品定期檢查中，刻意提高審查標準。", problem:"問：消防局於業者婉拒後仍持續要求並藉檢查刁難，是否合法？", body:"依§166Ⅱ，相對人明確拒絕指導時，行政機關應即停止，並不得據此對相對人為不利之處置。此為行政指導相對人拒絕權之保障規定，其要件可拆解為：相對人已明確表示拒絕該行政指導、機關即負有立即停止該指導之義務、且不得因相對人拒絕而對其為任何不利之處置，此二項義務性規定共同構成行政指導相對人得自由決定是否配合此一本質特徵之具體法律保障，若機關於相對人拒絕後仍持續施壓或另尋其他名目為不利對待，即與行政指導不具強制力之本質背道而馳，構成違法。本案消防局向某工廠業者建議加裝非屬法定應設之特殊偵煙設備，此核屬§165行政指導之範疇，業者已以書面明確表示婉拒，依§166Ⅱ，消防局本應即停止該項指導；惟消防局承辦人仍多次致電要求業者配合，已違反應即停止之義務，更於其後排定之公共危險物品定期檢查中，刻意提高審查標準，此一行為實質上係因業者拒絕配合行政指導而對其為不利之處置，核與§166Ⅱ不得據此對相對人為不利之處置之強制規定顯不相符，構成明確違法。業者得就此一違法之刁難檢查提出異議、申復或循訴願、國家賠償等途徑救濟。\n\n結語：消防局於業者明確拒絕後仍持續要求並藉提高檢查標準刁難，違反§166Ⅱ規定，構成違法之不利處置，業者得提出異議、申復並循相關救濟途徑主張權益。"},
  {a:"§167Ⅰ、§167Ⅱ", q:"消防局員警至某餐廳進行口頭行政指導時，僅告知「這樣不太好，改一下比較安全」，未說明指導之目的、具體內容及負責指導人員；業者事後致電消防局，要求提供該次指導內容之書面文件以利內部簽核，消防局並無任何特別困難，卻僅重複口頭說明，未提供書面。", problem:"問：消防局員警之行政指導及事後拒提書面之作法，是否合乎規定？", body:"依§167Ⅰ，行政機關對相對人為行政指導時，應明示行政指導之目的、內容及負責指導者等事項；依§167Ⅱ，前項明示，得以書面、言詞或其他方式為之。如相對人請求交付文書時，除行政上有特別困難外，應以書面為之。此係行政指導應踐行之明示義務及書面提供義務，其要件可拆解為：機關為行政指導時，應明示目的、內容及負責指導者三項事項、相對人請求交付文書時，除有行政上特別困難外，機關應以書面為之，不得任意拒絕。本案消防局員警至某餐廳進行口頭行政指導時，僅告知「這樣不太好，改一下比較安全」，此一說明內容空泛籠統，並未說明指導之目的、具體內容及負責指導人員，核與§167Ⅰ應明示行政指導之目的、內容及負責指導者之要件顯不相符，已違反明示義務；業者事後致電消防局，要求提供該次指導內容之書面文件以利內部簽核，消防局並無任何特別困難之情形，卻僅重複口頭說明，未提供書面，核與§167Ⅱ後段除行政上有特別困難外應以書面為之之強制規定顯不相符，亦屬違法。此二項瑕疵均使業者無從具體知悉指導內容及依據，亦無從留存書面憑證以供內部簽核或後續參考。\n\n結語：消防局員警之口頭指導未依§167Ⅰ明示目的內容及負責人，事後復未依§167Ⅱ提供書面，均屬違法，消防局應速補正明示內容並提供書面文件予業者。"},
  {a:"§168", q:"某里里長認為轄區消防局例行巡查次數過少，恐無法及時發現違規情事，特備函向消防局提出增加巡查頻率之建議。", problem:"問：里長備函向消防局提出增加巡查頻率之建議，其性質為何？", body:"依§168，人民對於行政興革之建議、行政法令之查詢、行政違失之舉發或行政上權益之維護，得向主管機關陳情。此為陳情之範圍界定條文，涵蓋四大類事項：行政興革之建議、行政法令之查詢、行政違失之舉發、行政上權益之維護，其要件可拆解為：陳情人不限於當事人或利害關係人，凡一般人民均得為之，此與§46卷宗閱覽權須有法律上利益者不同、陳情事項須屬上開四類之一、陳情對象須為主管機關，此一制度係人民對行政機關表達意見門檻最低、範圍最廣之管道。本案某里里長認為轄區消防局例行巡查次數過少，恐無法及時發現違規情事，特備函向消防局提出增加巡查頻率之建議，此一建議內容核屬對消防局巡查勤務執行方式提出興革改善之建議，核與§168行政興革之建議之要件相符，性質上應屬陳情，消防局應依§170訂定之陳情作業規定，指派人員迅速確實處理，並依§171，認為該建議有理由者，應採取適當之措施，認為無理由者，應通知里長並說明其意旨，不得對此一合法陳情置之不理，亦不得以里長非利害關係人為由拒絕受理。\n\n結語：里長備函提出增加巡查頻率之建議，核屬§168行政興革建議類型之陳情，消防局應依§170、§171規定迅速處理並回覆處理結果或說明理由。"},
  {a:"§168", q:"民眾對消防法規中「複合用途建築物」之認定標準有所疑惑，特以書面函詢消防局，請求說明其適用範圍。", problem:"問：民眾以書面函詢消防局法令適用範圍，其性質為何？", body:"依§168，人民對於行政興革之建議、行政法令之查詢、行政違失之舉發或行政上權益之維護，得向主管機關陳情。此為陳情之範圍界定條文，涵蓋四大類事項，其中行政法令之查詢即指人民對於相關法令規定不明瞭，得向主管機關查詢釋疑，此為人民行使陳情權最常見之態樣之一，其要件可拆解為：陳情人不限於當事人或利害關係人，凡一般人民對法令內容有疑義者均得查詢、查詢對象須為該法令之主管機關、查詢事項須與行政法令之適用範圍或內容有關。本案民眾對消防法規中複合用途建築物之認定標準有所疑惑，特以書面函詢消防局，請求說明其適用範圍，此一函詢核屬對消防法令規定內容不明瞭而請求釋疑之行為，核與§168行政法令之查詢之要件完全相符，性質上應屬陳情，消防局應依§170訂定之陳情作業規定，指派人員迅速確實處理，並依§171予以適當之答覆說明，倘該查詢重要內容不明確或有疑義，依§171Ⅱ，消防局並得通知陳情人補陳說明，以利正確答覆，不得對此一合法陳情置之不理或藉故拖延答覆。此與依法規申請之行政程序性質有別，陳情人無須具備法律上利害關係，亦不因查詢內容之答覆未盡滿意而得提起訴願或行政訴訟，蓋陳情制度本質上非屬具拘束力之正式救濟程序，僅係人民與機關間溝通意見之便捷管道。\n\n結語：民眾以書面函詢複合用途建築物認定標準，核屬§168行政法令查詢類型之陳情，消防局應依§170、§171規定迅速處理並就其疑義為適當之答覆說明。"},
  {a:"§169Ⅰ、§169Ⅱ", q:"陳情人甲君以電話向消防局陳情，舉發鄰居頂樓加蓋堆置大量紙箱雜物，承辦人僅簡要摘記重點，未將紀錄向甲君朗讀或提供閱覽即逕行歸檔；甲君事後索閱紀錄，發現記載地址有誤，要求更正，承辦人卻以「案件已結案」為由拒絕處理。", problem:"問：承辦人未依規定確認紀錄內容並拒絕更正錯誤，是否合法？", body:"依§169Ⅰ，陳情得以書面或言詞為之；其以言詞為之者，受理機關應作成紀錄，並向陳情人朗讀或使閱覽後命其簽名或蓋章；依§169Ⅱ，陳情人對紀錄有異議者，應更正之。其要件可拆解為：言詞陳情機關應作成紀錄、須向陳情人朗讀或使閱覽以確認內容無誤、並命其簽名或蓋章、陳情人嗣後對紀錄內容如有異議，機關應予更正，不得以任何理由拒絕，此為保障陳情紀錄真實正確性之重要程序機制。本案陳情人甲君以電話向消防局陳情，舉發鄰居頂樓加蓋堆置大量紙箱雜物，此屬以言詞方式為陳情，依§169Ⅰ，承辦人應作成紀錄並向甲君朗讀或使閱覽後命其簽名或蓋章，惟承辦人僅簡要摘記重點，未將紀錄向甲君朗讀或提供閱覽即逕行歸檔，核與§169Ⅰ規定要件顯不相符，已有違反紀錄確認程序之瑕疵；甲君事後索閱紀錄，發現記載地址有誤，要求更正，依§169Ⅱ，承辦人應予更正，惟承辦人卻以案件已結案為由拒絕處理，核與§169Ⅱ陳情人對紀錄有異議者應更正之之強制規定顯不相符，屬違法拒絕更正之行為，機關不得以案件已結案為由，規避其依法應予更正紀錄錯誤之義務。\n\n結語：承辦人未依§169Ⅰ向甲君朗讀確認紀錄，復以案件已結案為由拒絕依§169Ⅱ更正錯誤地址，均屬違法，消防局應速更正該紀錄內容。"},
  {a:"§170Ⅰ", q:"某消防分隊並未訂定陳情案件處理作業規定，亦未指派專責人員負責受理，導致一件舉發瓦斯行儲放不當之陳情案件擱置逾三個月無人處理。", problem:"問：消防分隊未訂定陳情作業規定致案件擱置未處理，是否合法？", body:"依§170Ⅰ，行政機關對人民之陳情，應訂定作業規定，指派人員迅速、確實處理之。此為機關處理陳情案件之組織及作業義務規定，其要件可拆解為：機關應訂定陳情案件處理作業規定、應指派專責人員負責受理處理、處理應迅速確實，不得無故拖延或置之不理，此一規定之目的在確保人民依§168提出之陳情，均能獲得機關妥適及時之處理回應，避免陳情制度流於形式而無實益。本案某消防分隊並未訂定陳情案件處理作業規定，亦未指派專責人員負責受理，此一組織及作業上之欠缺核與§170Ⅰ應訂定作業規定指派人員之要件顯不相符，已違反機關應盡之組織法定義務；因欠缺明確之作業規定及專責人員，導致一件舉發瓦斯行儲放不當之陳情案件擱置逾三個月無人處理，此一結果亦與§170Ⅰ迅速、確實處理之要求顯不相符，尤其該陳情內容涉及瓦斯儲放安全，具有相當之公共安全急迫性，機關長期擱置未予處理，更凸顯其違反本條規定之嚴重性，應速予改善並儘速處理該擱置之陳情案件，並依§171回覆陳情人處理結果。此一組織上之欠缺致陳情案件長期擱置，倘因而導致公共危險擴大或造成損害，該消防分隊及其所屬機關恐須進一步檢討是否構成國家賠償法上公務員怠於執行職務之責任，非僅止於單純違反行政程序法組織性義務之問題。\n\n結語：該消防分隊未依§170Ⅰ訂定作業規定及指派專責人員，致陳情案件擱置逾三個月未處理，已違反本條規定，應速訂定作業規定並儘速處理該瓦斯儲放陳情案件。"},
  {a:"§170Ⅱ", q:"民眾陳情舉發其任職公司違規使用易燃裝潢材料，並於陳情書中載明因擔心遭報復，要求對其身分保密；消防局承辦人於現場稽查時，卻逕自向公司負責人出示該陳情書影本。", problem:"問：承辦人逕自出示陳情書影本予被檢舉公司負責人，是否合法？", body:"依§170Ⅱ，人民之陳情有保密必要者，受理機關處理時，應不予公開。此為陳情保密義務之規定，其要件可拆解為：陳情內容有保密必要，尤其涉及陳情人身分可能因公開而遭受報復或不利對待之情形、受理機關處理該陳情時，應不予公開，此為機關之法定強制性義務，非機關得自由裁量是否公開之事項，其立法目的在保障陳情人得安心行使陳情權利、舉發違法情事，避免因擔心身分曝光遭報復而不敢陳情，影響行政違失舉發機制之實效性。本案民眾陳情舉發其任職公司違規使用易燃裝潢材料，並已於陳情書中明確載明因擔心遭報復，要求對其身分保密，此一陳情核屬§170Ⅱ所稱有保密必要之陳情，消防局承辦人依法本應不予公開該陳情人身分及相關陳情書內容，惟承辦人於現場稽查時，卻逕自向公司負責人出示該陳情書影本，使該公司負責人得以直接知悉陳情人身分及陳情內容，核與§170Ⅱ應不予公開之強制規定顯不相符，構成明確違法，且已使該陳情人身分曝光，可能致其遭受報復之風險大幅提升，消防局應對此一嚴重違失究責，並採取後續補救措施保障陳情人。\n\n結語：承辦人逕自出示陳情書影本予被檢舉公司負責人，違反§170Ⅱ保密義務，構成違法，消防局應究責並採取補救措施，避免陳情人因此遭受報復。"},
  {a:"§172Ⅰ、§172Ⅱ", q:"民眾向消防局提出陳情，內容同時包含兩部分：一為不服消防局先前對其開立之罰鍰處分，二為指摘鄰地違建情事。消防局審酌後認為違建部分適合逕行移送建管機關處理並通知陳情人，另就不服罰鍰處分部分，告知陳情人得依法提起訴願。", problem:"問：消防局分別移送違建部分並告知訴願部分之處理方式，是否合法？", body:"依§172Ⅰ，人民之陳情應向其他機關為之者，受理機關應告知陳情人。但受理機關認為適當時，應即移送其他機關處理，並通知陳情人。依§172Ⅱ，陳情之事項，依法得提起訴願、訴訟或請求國家賠償者，受理機關應告知陳情人。其要件可拆解為：第一項處理陳情內容非受理機關主管事項之情形，原則告知陳情人另向主管機關陳情，但受理機關認為適當時，得逕行移送並通知陳情人；第二項處理陳情事項本有更正式法定救濟途徑之情形，受理機關應告知陳情人改循正式途徑，避免以陳情規避正式救濟程序。本案民眾向消防局提出陳情，內容同時包含二部分：其一為不服消防局先前對其開立之罰鍰處分，此一部分依法本可提起訴願之正式救濟途徑，核與§172Ⅱ依法得提起訴願之情形相符，消防局告知陳情人得依法提起訴願，於法有據；其二為指摘鄰地違建情事，此一部分非消防局主管事項，核與§172Ⅰ應向其他機關為之之情形相符，消防局審酌後認為適合逕行移送建管機關處理並通知陳情人，核與§172Ⅰ但書規定要件相符，於法有據。消防局將同一陳情書中性質不同之二部分內容，分別依§172Ⅰ、Ⅱ妥為處理，程序核屬合法允當。\n\n結語：消防局就違建部分依§172Ⅰ但書逕行移送建管機關並通知陳情人，就罰鍰部分依§172Ⅱ告知得提起訴願，處理方式均合乎規定，程序合法。"},
  {a:"§173①", q:"消防局收受一封陳情書，內容僅空泛稱「某處很危險，請盡快查辦」，未載明真實姓名，亦未留存任何聯絡地址，致無從查證陳情人身分及具體事實。", problem:"問：消防局得否對此一陳情不予處理？", body:"依§173①，人民陳情案有下列情形之一者，得不予處理：無具體之內容或未具真實姓名或住址者。此為陳情得不予處理之三款事由之一，其要件可拆解為：陳情內容欠缺具體性、或陳情人未具真實姓名、或未留存住址，三者具備其一即可，此一規定之目的在於，若陳情內容過於空泛抽象，或陳情人身分及聯絡方式均無從查證，機關即難以據以展開有意義之查證及後續處理，若強制要求機關就此類陳情仍應迅速確實處理，將造成機關資源浪費，且亦無從對陳情人為後續之處理結果通知，故明文賦予機關就此類陳情得不予處理之裁量權限。本案消防局收受一封陳情書，內容僅空泛稱「某處很危險，請盡快查辦」，並未具體載明危險場所之地點、性質等具體事實內容，核與§173①無具體之內容之要件相符；且該陳情書未載明真實姓名，亦未留存任何聯絡地址，致無從查證陳情人身分及具體事實，核與§173①未具真實姓名或住址之要件亦屬相符，二者要件均已具備，消防局依法得依§173①對此一陳情不予處理，惟基於行政機關維護公共安全之積極職責，倘機關仍能自其他管道獲悉具體危險地點，宜本於職權主動查證處理。\n\n結語：本案陳情內容空泛且未具真實姓名住址，核與§173①要件相符，消防局依法得不予處理，惟仍宜視其他情資自行評估是否有主動查證之必要。"},
  {a:"§173②", q:"陳情人乙君先前就其住家附近工廠噪音及消防安全疑慮提出陳情，消防局已派員查處並以書面明確答覆處理結果；惟乙君其後仍就同一事由反覆多次陳情，內容並無任何新事證。", problem:"問：消防局得否對乙君反覆之同一事由陳情不予處理？", body:"依§173②，人民陳情案有下列情形之一者，得不予處理：同一事由，經予適當處理，並已明確答覆後，而仍一再陳情者。此為陳情得不予處理之三款事由之一，其要件可拆解為：須為同一事由之陳情、機關已就先前陳情予以適當處理、並已明確答覆處理結果、陳情人事後仍就同一事由反覆一再陳情，此四項要件須同時具備，方得援引本款不予處理，其立法目的在避免機關對已處理完畢並明確答覆之事項，因陳情人反覆提出而須一再重複耗費行政資源處理，兼顧行政效能之維護。本案陳情人乙君先前就其住家附近工廠噪音及消防安全疑慮提出陳情，消防局已派員查處並以書面明確答覆處理結果，核與§173②經予適當處理並已明確答覆之要件相符；惟乙君其後仍就同一事由反覆多次陳情，內容並無任何新事證，此一情形核與§173②同一事由而仍一再陳情之要件亦屬相符，消防局依法得依§173②對乙君此後反覆提出之同一事由陳情不予處理。惟仍應注意，倘乙君嗣後之陳情內容確實提出新事證或反映情況已有變化，即非單純之同一事由反覆陳情，消防局仍應本於§9有利不利一律注意之精神，就該新事證重新查處，不得逕以本款拒絕受理。\n\n結語：乙君就已獲適當處理並明確答覆之同一事由反覆陳情且無新事證，消防局依§173②得不予處理，惟如乙君提出新事證，機關仍應重新查處。"},
  {a:"§173③", q:"陳情人將同一起場所違規堆置事件，以完全相同內容同時分別向消防局、警察局及環保局提出陳情，消防局並非該違規事項之主管機關。", problem:"問：消防局得否對此一分向多機關提出之陳情不予處理？", body:"依§173③，人民陳情案有下列情形之一者，得不予處理：非主管陳情內容之機關，接獲陳情人以同一事由分向各機關陳情者。此為陳情得不予處理之三款事由之一，其要件可拆解為：受理機關須非該陳情內容事項之主管機關、陳情人係以同一事由同時分別向各機關提出陳情，此二項要件須同時具備，方得援引本款不予處理，其立法考量在於，此種同一事由分向多機關陳情之情形，實質上係一種濫訴或資源重複耗用之陳情態樣，若干陳情人為求提高處理速度或引起機關重視，同時向多個不相關或非主管機關陳情，若均要求各機關逐一處理，將造成行政資源之重複浪費，故明文容許非主管機關就此類陳情得不予處理，僅由真正主管機關依法處理即可。本案陳情人將同一起場所違規堆置事件，以完全相同內容同時分別向消防局、警察局及環保局提出陳情，消防局並非該違規事項之主管機關，核與§173③非主管陳情內容之機關之前提要件相符，且陳情人確係以同一事由分向各機關陳情，核與該款要件完全相符，消防局依法得依§173③對此一陳情不予處理，僅由該違規事項之真正主管機關依法查處即可，惟消防局如認有必要，仍得依§172Ⅰ告知或移送予主管機關處理。\n\n結語：本案陳情人以同一事由分向消防局、警察局、環保局提出陳情，消防局非主管機關，依§173③得不予處理，宜告知或移送真正主管機關依法查處。"},
  {a:"§174", q:"行政機關於調查程序中，對當事人所持有、有立即危險之物品逕行為得強制執行之扣留處置，當事人於該處置作成時，即欲對之單獨聲明不服。", problem:"問：當事人得否於程序進行中就該扣留處置單獨聲明不服？", body:"依§174，當事人或利害關係人不服行政機關於行政程序中所為之決定或處置，僅得於對實體決定聲明不服時一併聲明之。但行政機關之決定或處置得強制執行或本法或其他法規另有規定者，不在此限。此係規範程序中決定不得單獨救濟之原則及其例外，其要件可拆解為：原則上，程序中之決定或處置，不得於程序進行中單獨提起救濟，須待實體決定作成後，於對實體決定聲明不服時一併聲明；例外於該決定或處置本身得強制執行，或本法或其他法規另有規定得單獨救濟者，則不受此原則限制，得單獨提起救濟，此一例外之立法考量在於，若該程序中處置本身即具有得強制執行之效果，倘仍要求當事人須待實體決定作成後始能一併救濟，恐緩不濟急，無法及時制止該處置對其權益造成之損害，故明文容許例外單獨救濟。本案行政機關於調查程序中，對當事人所持有、有立即危險之物品逕行為得強制執行之扣留處置，此一扣留處置本身即具有得強制執行之性質，核與§174但書得強制執行之除外情形完全相符，當事人於該處置作成時，即得依§174但書單獨對之聲明不服，毋須待實體決定作成後始得一併救濟。\n\n結語：本案扣留處置本身得強制執行，核屬§174但書之例外情形，當事人得於處置作成時即單獨聲明不服，毋須待實體決定作成後始一併救濟。"},
  {a:"§174-1", q:"某機關於本法施行前，依中央法規標準法第七條訂定一項職權命令，其內容性質上應以法律規定或以法律明列授權依據，惟該機關迄未於本法施行後二年內完成法律授權依據之補正。", problem:"問：該職權命令迄未補正法律授權依據，其效力如何？", body:"依§174-1，本法施行前，行政機關依中央法規標準法第七條訂定之命令，須以法律規定或以法律明列其授權依據者，應於本法施行後二年內，以法律規定或以法律明列其授權依據後修正或訂定；逾期失效。此為附則中之過渡條款，其要件可拆解為：須為本法施行前，機關依中央法規標準法第七條所訂定之命令、該命令之內容依其性質應以法律規定或以法律明列授權依據者、機關未於本法施行後二年內完成法律授權依據之補正，其法律效果為該命令逾期失效，此一過渡條款之立法目的在於，淘汰本法施行前欠缺法律授權基礎、卻實質限制人民權利之舊有職權命令，落實法律保留原則，同時給予機關合理之緩衝期間完成法制整備。本案某機關於本法施行前，依中央法規標準法第七條訂定一項職權命令，其內容性質上應以法律規定或以法律明列授權依據，核與§174-1前段之前提要件相符；該機關迄未於本法施行後二年內完成法律授權依據之補正，核與§174-1逾期失效之要件完全相符，依本條明文規定，該職權命令應認已逾期失效，機關不得再依該命令對人民為任何限制或剝奪權利之行政行為，該命令喪失其規範效力。\n\n結語：該職權命令因逾§174-1所定二年補正期限仍未取得法律授權依據，依本條明文規定已失效，機關不得再據以對人民為任何限制或剝奪權利之行為。"},
  {a:"§1", q:"消防局訂定內部工作要點，明定各科所辦理裁罰案件之作業程序，除要求嚴格援引法律及法規命令為准駁依據外，並規定審查過程應公開透明、給予民眾陳述意見及參與之機會；局長於要點說明中指出，如此設計旨在保障民眾權益、提升機關辦事效能，並增進民眾對消防局之信賴。", problem:"問：消防局工作要點所揭示之立法精神，與行政程序法之立法目的有何關聯？", body:"依§1，為使行政行為遵循公正、公開與民主之程序，確保依法行政之原則，以保障人民權益，提高行政效能，增進人民對行政之信賴，特制定本法。此為行政程序法之立法目的條款，其要件可拆解為程序面與實體面二層次：程序面要求行政行為應遵循公正、公開、民主之程序原則；實體面則要求確保依法行政原則，並以此達成保障人民權益、提高行政效能、增進人民對行政之信賴三項終極目的，程序面與實體面相輔相成，透過踐行公正公開民主之程序，落實依法行政，進而實現保障權益、提升效能、增進信賴之立法目的。本案消防局訂定內部工作要點，明定各科所辦理裁罰案件之作業程序，除要求嚴格援引法律及法規命令為准駁依據外，呼應§1確保依法行政之原則，並規定審查過程應公開透明、給予民眾陳述意見及參與之機會，呼應§1公正、公開與民主之程序，局長於要點說明中指出，如此設計旨在保障民眾權益、提升機關辦事效能，並增進民眾對消防局之信賴，此一說明核與§1所揭示保障人民權益提高行政效能增進人民對行政之信賴三項立法目的完全相符，堪認消防局訂定該工作要點之精神，確實貫徹本法第一條立法目的之核心價值。\n\n結語：消防局工作要點所揭示之依法行政、公開透明及保障權益等設計，核與§1所定立法目的完全契合，展現行政程序法立法精神於實務作業之具體落實。"},
  {a:"§20", q:"甲君向消防局提出申請，請求對乙君所經營之倉庫進行消防安全複查；消防局同時就防火知識巡迴宣導服務案與丙君簽訂行政契約，並依約定內容請丙君配合辦理相關宣導事宜。", problem:"問：甲君、乙君及丙君於各該行政程序中之當事人地位為何？", body:"依§20，本法所稱之當事人如下：一、申請人及申請之相對人。二、行政機關所為行政處分之相對人。三、與行政機關締結行政契約之相對人。四、行政機關實施行政指導之相對人。五、對行政機關陳情之人。六、其他依本法規定參加行政程序之人。此為當事人範圍之界定條文，涵蓋六種類型，其要件可拆解為：依行政程序之不同類型，分別界定何人具有該程序之當事人地位，此一界定之意義在於，惟有具備當事人地位者，方得享有陳述意見、閱覽卷宗等本法賦予當事人之各項程序上權利。本案甲君向消防局提出申請，請求對乙君所經營之倉庫進行消防安全複查，甲君核屬§20①所稱之申請人，具當事人地位；至於乙君雖非申請人本人，然其倉庫係本次複查申請之對象，其權益可能因複查結果而受影響，性質上核屬§20①申請之相對人，亦具當事人地位。消防局同時就防火知識巡迴宣導服務案與丙君簽訂行政契約，丙君核屬§20③所稱與行政機關締結行政契約之相對人，於該行政契約程序中具當事人地位，並依約定內容負有配合辦理相關宣導事宜之義務。\n\n結語：甲君依§20①為申請人、乙君為申請之相對人，均具本次複查程序之當事人地位；丙君依§20③為行政契約相對人，於該契約程序中亦具當事人地位。"},
  {a:"§21", q:"某社區管理委員會尚未依法辦理法人登記，惟已依規約選任主任委員為代表人；該管理委員會就轄內消防安全設施改善事項向消防局提出書面陳情，並由該主任委員代表委員會與承辦人員接洽後續事宜。", problem:"問：該管理委員會得否以自己名義成為本件陳情程序之當事人？", body:"依§21，有行政程序之當事人能力者如下：一、自然人。二、法人。三、非法人之團體設有代表人或管理人者。四、行政機關。五、其他依法律規定得為權利義務之主體者。此為當事人能力之界定條文，其要件可拆解為：得為行政程序當事人之主體範圍較民事訴訟為廣，其中第三款非法人之團體設有代表人或管理人者，其要件為該團體雖未依法辦理法人登記，惟已依其內部規約或章程選任代表人或管理人，即賦予其行政程序上之當事人能力，得以自己名義作為行政程序之當事人，此一規定使實務上常見之未辦理法人登記之團體亦得以團體自身名義參與行政程序，無須以全體成員名義為之，簡化程序參與之複雜度。本案某社區管理委員會尚未依法辦理法人登記，惟已依規約選任主任委員為代表人，核與§21③非法人之團體設有代表人或管理人者之要件完全相符，該管理委員會即具備行政程序之當事人能力，得以自己名義作為本件陳情程序之當事人，就轄內消防安全設施改善事項向消防局提出書面陳情，並由該主任委員代表委員會與承辦人員接洽後續事宜，核與§22Ⅰ③非法人團體由其代表人為行政程序行為之規定相符，程序合法。\n\n結語：該管理委員會雖未辦理法人登記，惟已依§21③設有代表人，具備當事人能力，得以自己名義提出陳情並由主任委員代表接洽後續事宜，程序合法。"},
  {a:"§26", q:"甲君委任乙君為代理人，處理其工廠消防安全改善計畫之審查程序；審查期間甲君因意外身故，承辦人員審認乙君之代理權並未因此消滅，程序得繼續進行，未要求另行委任代理人。", problem:"問：甲君死亡是否使乙君之代理權隨之消滅？", body:"依§26，代理權不因本人死亡或其行政程序行為能力喪失而消滅。法定代理有變更或行政機關經裁併或變更者，亦同。此係規範代理權存續不受特定事由影響之規定，其要件可拆解為：本人死亡、本人行政程序行為能力喪失、法定代理有變更、行政機關經裁併或變更，此四種情形均不致使既有之代理權隨之消滅，代理人仍得繼續代理進行行政程序，此一規定之立法目的在於維持行政程序進行之安定性與延續性，避免因本人死亡等偶發事由，即須中斷程序另尋代理人或法定繼受人重新委任，徒增程序延宕及成本，尤其行政程序常涉及公益事項之調查認定，程序之延續進行有其一定之公益考量。本案甲君委任乙君為代理人，處理其工廠消防安全改善計畫之審查程序，審查期間甲君因意外身故，此一死亡事由核屬§26所列舉不影響代理權存續之事由之一，依§26明文規定，乙君之代理權並不因甲君死亡而消滅，承辦人員審認乙君之代理權並未因此消滅，程序得繼續進行，未要求另行委任代理人，核與§26規定要件完全相符，於法有據，該審查程序後續仍得由乙君代理繼續進行。\n\n結語：甲君死亡並不使乙君之代理權依§26消滅，承辦人員認程序得由乙君繼續代理進行，於法有據，毋須另行委任代理人。"},
  {a:"§28", q:"某大樓住戶就共同消防安全改善事宜，共同選定甲、乙、丙三人為代表；甲君其後單獨出面向消防局表示同意某項改善方案並簽署相關文件，消防局逕認該意思表示已對全體住戶發生效力，未待乙、丙共同會簽。", problem:"問：甲君單獨簽署同意文件，是否已對全體住戶發生效力？", body:"依§28，選定或指定當事人有二人以上時，均得單獨為全體為行政程序行為。此係規範選定當事人有多人時之代理方式，其要件可拆解為：須為依§27選定或指定之當事人有二人以上者、每一位被選定或指定之當事人均得單獨代表全體為行政程序行為，不須全體被選定人共同會簽方生效力，此一單獨代理原則之立法考量，在於避免因要求多位選定代表人須全體一致行動，而使程序因意見不一或聯繫困難而延宕，簡化程序進行之複雜度，與§25代理人單獨代理原則之精神一致。本案某大樓住戶就共同消防安全改善事宜，共同選定甲、乙、丙三人為代表，此核屬§27Ⅰ多數有共同利益之當事人選定代表人之情形，甲、乙、丙三人均為選定當事人；甲君其後單獨出面向消防局表示同意某項改善方案並簽署相關文件，依§28規定，甲君本得單獨為全體住戶為此一行政程序行為，毋須乙、丙共同會簽，消防局逕認該意思表示已對全體住戶發生效力，核與§28規定要件完全相符，於法有據。惟依§27Ⅳ但書，若該意思表示涉及申請之撤回、權利之拋棄或義務之負擔者，則非經全體有共同利益之人同意，不得為之，本案單純同意改善方案尚非此類特殊情形。\n\n結語：甲君依§28得單獨為全體住戶表示同意改善方案，消防局認該意思表示已對全體發生效力，於法有據，毋須待乙、丙共同會簽，除非涉及撤回申請等特殊事項。"},
  {a:"§30Ⅰ", q:"多名長期未依規定辦理公共安全檢查之工廠業者，於聯名陳情書上共同具名，並附記已推選甲君為代表，向消防局協調改善期程；因該書面已載明選定意旨並送達消防局，機關遂僅以甲君為聯繫窗口，逕行通知後續改善事項。", problem:"問：消防局僅以甲君為聯繫窗口通知後續事項，是否合乎選定當事人生效之規定？", body:"依§30Ⅰ，當事人之選定、更換或增減，非以書面通知行政機關不生效力。此係規範選定當事人生效要件之規定，其要件可拆解為：當事人選定代表人之行為，須以書面通知行政機關，方生效力，倘僅以口頭方式為之，或雖有選定之意但未通知機關，均不生對機關發生效力之選定效果，此一要式性規定之立法目的在於，使機關明確知悉何人業經選定為全體之代表，作為後續聯繫、送達及程序進行之基準，避免因選定關係不明確而生程序上之混亂或爭議。本案多名長期未依規定辦理公共安全檢查之工廠業者，於聯名陳情書上共同具名，並附記已推選甲君為代表，向消防局協調改善期程，該聯名陳情書已載明選定意旨並送達消防局，核與§30Ⅰ以書面通知行政機關之要件完全相符，該選定甲君為代表之行為即已合法生效，機關遂僅以甲君為聯繫窗口，逕行通知後續改善事項，核與§30Ⅰ規定意旨相符，於法有據，並依§28、§27Ⅳ規定，甲君既經合法選定為代表，即得單獨為全體業者為行政程序行為，其他業者則依§27Ⅳ本文脫離行政程序，僅由甲君代表接受機關通知及聯繫。\n\n結語：本案業者已以書面聯名陳情書載明選定甲君為代表並送達消防局，依§30Ⅰ已合法生效，消防局僅以甲君為聯繫窗口通知後續改善事項，於法有據。"},
  {a:"§38", q:"消防局承辦人員於火災原因調查過程中，訪談多名到場目擊之鄰居，並將其陳述內容據實製作書面紀錄附卷存查，作為後續判斷起火原因之參考資料。", problem:"問：承辦人員製作訪談紀錄附卷之行為，是否於法有據？", body:"依§38，行政機關調查事實及證據，必要時得據實製作書面紀錄。此係賦予機關於調查過程中，得將調查所得內容製作書面紀錄之明文依據，其要件可拆解為：機關於調查事實及證據過程中認有必要者、得將調查內容據實製作書面紀錄，此一書面紀錄性質上屬機關調查程序之一環，得作為嗣後依§43判斷事實真偽、認定處分理由之依據，亦得供當事人依§46申請閱覽卷宗以主張或維護其法律上利益。本案消防局承辦人員於火災原因調查過程中，訪談多名到場目擊之鄰居，並將其陳述內容據實製作書面紀錄附卷存查，作為後續判斷起火原因之參考資料，此一訪談紀錄製作行為核屬機關調查事實及證據過程中之必要作為，核與§38規定要件完全相符，於法有據，並非法所不許或逾越調查權限之行為。此一紀錄製作除有助於機關嗣後依§43綜合全部調查結果判斷起火原因之真偽外，亦可作為機關就火災原因調查結果作成後續行政處分時之理由依據及事實基礎，倘嗣後相關人員對處分不服提起救濟，該訪談紀錄並得作為機關舉證支持其事實認定之重要卷證資料，承辦人員製作紀錄時應力求據實記載，避免加入個人主觀臆測或未經查證之內容。\n\n結語：承辦人員依§38製作鄰居訪談紀錄附卷存查，於法有據，該紀錄得作為機關嗣後依§43判斷起火原因及後續處分之重要事實依據。"},
  {a:"§70Ⅰ", q:"某在我國境內設有辦事處、惟未辦理獨立公司登記之外商消防器材公司違反消防法規定遭裁罰，消防局遂將裁處書送達予其在我國境內辦事處之代表人，而非逕行寄往該公司國外總部地址。", problem:"問：消防局將裁處書送達境內辦事處代表人，是否合乎送達規定？", body:"依§70Ⅰ，對於在中華民國有事務所或營業所之外國法人或團體為送達者，應向其在中華民國之代表人或管理人為之。此係規範對境內設有事務所或營業所之外國法人團體送達對象之規定，其要件可拆解為：受送達人須為外國法人或團體、該法人或團體須於中華民國境內設有事務所或營業所、送達應向其在中華民國之代表人或管理人為之，而非逕向該外國法人團體之國外總部或註冊地送達，此一規定之立法目的在於，若外國法人團體已於我國境內設有辦事處等營業據點，即已具備得於我國境內受領送達之聯繫管道，逕向境內代表人送達不僅較為便捷有效，亦足以確保送達之實效性，毋須捨近求遠採行境外送達等較為繁複之程序。本案某外商消防器材公司雖未辦理獨立公司登記，惟已於我國境內設有辦事處，核與§70Ⅰ於中華民國有事務所或營業所之外國法人或團體之前提要件相符，其因違反消防法規定遭裁罰，消防局遂將裁處書送達予其在我國境內辦事處之代表人，而非逕行寄往該公司國外總部地址，核與§70Ⅰ規定要件完全相符，於法有據，該送達應認已合法生效，毋須循§86境外送達程序辦理。\n\n結語：消防局依§70Ⅰ將裁處書送達該外商公司我國境內辦事處代表人，於法有據，已生合法送達效力，毋須另循境外送達程序辦理。"},
  {a:"§79", q:"消防局前已就甲君行蹤不明一事，依申請辦理公示送達一次；嗣後另有一份裁處書須送達同一位甲君，因其仍下落不明，承辦人員未待任何人提出申請，逕依職權將該文書辦理公示送達。", problem:"問：承辦人員未待申請逕依職權辦理第二次公示送達，是否合法？", body:"依§79，依前條規定為公示送達後，對於同一當事人仍應為公示送達者，依職權為之。此係規範同一當事人已經公示送達後，後續再次公示送達發動方式之規定，其要件可拆解為：須先前已依§78對同一當事人合法為公示送達、其後對於同一當事人仍有再為公示送達之必要者、此時機關得逕依職權為之，不待任何人另行提出申請，此一規定之立法目的在於簡化程序，避免因當事人行蹤持續不明之狀態並未改變，卻仍須每次均待申請人重新提出申請，徒增程序上不必要之繁瑣，機關本於已知悉該當事人行蹤不明之事實狀態，自得逕依職權主動辦理後續之公示送達。本案消防局前已就甲君行蹤不明一事，依申請辦理公示送達一次，核屬§78所稱先前已合法為公示送達之情形；嗣後另有一份裁處書須送達同一位甲君，因其仍下落不明，核與§79對於同一當事人仍應為公示送達之前提要件相符，承辦人員未待任何人提出申請，逕依職權將該文書辦理公示送達，核與§79規定要件完全相符，於法有據，並非違反公示送達應經申請之一般規定，該一般規定僅適用於首次公示送達依§78Ⅰ之情形。\n\n結語：消防局前已依申請對甲君辦理公示送達一次，嗣後同一當事人仍應公示送達者，依§79承辦人員得逕依職權辦理，毋須另待申請，程序合法。"},
  {a:"§2Ⅲ", q:"消防局委託轄內一家經認證之民間機構，就集合住宅之防火標章申請案進行現場查核並作成核可與否之通知；該民間機構於受託範圍內，代表消防局對外作成查核結果通知予申請人。", problem:"問：該民間機構於受託範圍內所為之查核結果通知，其法律性質為何？", body:"依§2Ⅲ，受託行使公權力之個人或團體，於委託範圍內，視為行政機關。此為行政程序法擬制行政機關範圍之重要規定，其要件可拆解為：須有合法之委託、受託人得為個人或團體、僅於委託範圍內視為行政機關，逾越委託範圍之行為則不生此擬制效果，其立法目的在使人民之權益保障不因機關將公權力事務委託民間辦理而受影響，於受託範圍內，受託之個人或團體所為之行為，於法律評價上等同於行政機關本身所為，其對外所作成之決定，如符合行政處分之其他要件，仍應認屬行政處分。本案消防局委託轄內一家經認證之民間機構，就集合住宅之防火標章申請案進行現場查核並作成核可與否之通知，此一委託核屬§16Ⅰ委託民間團體辦理公權力事務之情形，該民間機構於受託範圍內，依§2Ⅲ即視為行政機關；其代表消防局對外作成之查核結果通知予申請人，因對外直接發生該集合住宅是否取得防火標章資格之法律效果，核與§92Ⅰ行政處分要素相符，該通知性質上應認屬行政處分，申請人如不服，得依法提起訴願及行政訴訟，其被告或受理救濟之相對機關，仍以委託機關消防局為準。\n\n結語：該民間機構於受託範圍內依§2Ⅲ視為行政機關，其所為查核結果通知具行政處分性質，申請人如不服，得依法提起訴願及行政訴訟救濟。"},
  {a:"§16Ⅱ", q:"消防局擬將某項消防設備定期檢驗業務委託民間檢驗公司辦理，僅簽准內部委辦契約並通知該公司開始執行，並未將委託事項及法規依據公告，亦未刊登於政府公報或新聞紙。", problem:"問：消防局未依規定公告及刊登委託事項，該委託是否合法？", body:"依§16Ⅰ，行政機關得依法規將其權限之一部分，委託民間團體或個人辦理；依§16Ⅱ，前項情形，應將委託事項及法規依據公告之，並刊登政府公報或新聞紙。此係委託民間辦理公權力事務之公告義務規定，其要件可拆解為：機關委託民間團體或個人辦理權限事務者，除須有法規依據外，並應將委託事項及法規依據予以公告，且須刊登於政府公報或新聞紙，此二項公告要求均屬強制規定，缺一即不符法定程序，其立法目的在使人民得以知悉該項公權力事務業已委託特定民間團體或個人辦理，避免人民因不知情而誤向原機關洽辦或對受託人資格產生疑義，並確保委託關係之公示性及可受公評性。本案消防局擬將某項消防設備定期檢驗業務委託民間檢驗公司辦理，僅簽准內部委辦契約並通知該公司開始執行，並未將委託事項及法規依據公告，亦未刊登於政府公報或新聞紙，核與§16Ⅱ應公告並刊登政府公報或新聞紙之強制規定顯不相符，該委託程序即有重大瑕疵，尚難認已完成合法之委託公示程序，於此瑕疵補正前，該民間檢驗公司縱已實質開始執行檢驗業務，其是否已合法取得依§2Ⅲ視為行政機關之地位，即非無疑，宜由消防局速依規定補行公告及刊登程序，以杜爭議。\n\n結語：消防局委託民間檢驗公司辦理業務，未依§16Ⅱ公告並刊登政府公報或新聞紙，程序具重大瑕疵，消防局應速補行公告及刊登程序，以確保委託關係之合法性。"},
  {a:"§22Ⅲ", q:"一名外籍學生依其本國法律規定尚不具備完全之行為能力，惟依中華民國民法規定其已達成年、具有完全行為能力；其本人就讀學校之消防安全講習報名事宜，自行向消防局提出申請，消防局審認其已具行政程序行為能力，逕予受理，未要求法定代理人代為之。", problem:"問：消防局逕予受理該外籍學生本人提出之申請，是否合法？", body:"依§22Ⅲ，外國人依其本國法律無行政程序之行為能力，而依中華民國法律有行政程序之行為能力者，視為有行政程序之行為能力。此係規範外國人行政程序行為能力判斷基準之特別規定，其要件可拆解為：外國人依其本國法律不具備行政程序行為能力、惟依中華民國法律已具有行為能力者，此時法律擬制其視為有行政程序之行為能力，得自行為行政程序行為，不須法定代理人代為之，此一擇優適用之立法設計，目的在避免因該外國人本國法律規定較為保守，反而剝奪其依我國法律本應享有之自主行為能力，有利於保障在我國境內活動之外國人權益，並簡化行政機關審查外國人行為能力之複雜度。本案該外籍學生依其本國法律規定尚不具備完全之行為能力，惟依中華民國民法規定其已達成年、具有完全行為能力，核與§22Ⅲ依其本國法律無行政程序行為能力而依中華民國法律有行政程序行為能力之要件完全相符，依法應視為有行政程序之行為能力，消防局審認其已具行政程序行為能力，逕予受理其本人提出之申請，未要求法定代理人代為之，核與§22Ⅲ規定意旨完全相符，於法有據。\n\n結語：該外籍學生依中華民國民法已具完全行為能力，依§22Ⅲ視為有行政程序行為能力，消防局逕予受理其本人申請而未要求法定代理人代為之，於法有據。"},
  {a:"§41Ⅰ、Ⅱ", q:"消防局就某起火災之起火原因，選定具公信力之鑑定機構出具書面鑑定報告；嗣後承辦人員因報告部分論述不明，通知該鑑定人到場補充說明。", problem:"問：消防局選任鑑定機構並通知到場說明之程序是否合法？", body:"依§41Ⅰ，行政機關為調查事實及證據之必要，得選定適當之人為鑑定，鑑定人之選任應具備專業能力及公正性，就個案事實提出專業意見以供機關認定事實之參考，鑑定本質上屬於機關依職權調查證據方法之一種，是§36職權調查主義之具體展現。鑑定得以言詞或書面方式為之，依§41Ⅱ，若係以書面方式提出鑑定意見者，機關認有必要時，得通知鑑定人到場說明，使鑑定人就書面報告中論述不明或有疑義之處為口頭補充，以確保機關依§43所為之事實認定確實斟酌全部證據並符合論理及經驗法則。本案消防局為調查起火原因，選定具公信力之鑑定機構出具書面鑑定報告，核屬§41Ⅰ選定鑑定人之適例；嗣後承辦人員因報告部分論述不明，通知該鑑定人到場補充說明，亦與§41Ⅱ「以書面為鑑定者，必要時得通知鑑定人到場說明」之規定相符，程序並無瑕疵。若機關明知鑑定報告論述不明卻逕予採認、未予澄清，將使事實認定基礎薄弱，日後如涉行政爭訟，恐因未盡調查義務而遭撤銷；反之，機關依法通知鑑定人到場補充，並將補充說明併入卷證斟酌，正是落實§9有利不利一律注意及§36職權調查主義之具體表現，亦有助於後續處分理由完整正確。\n\n結語：消防局選定鑑定機構出具書面報告並依§41Ⅱ通知鑑定人到場補充說明，程序合法，該鑑定意見連同補充說明應併入全案證據，作為後續行政處分事實認定之依據。"},
  {a:"§50Ⅰ、Ⅱ", q:"甲君原應於某月十五日前提出消防安全設備改善計畫，惟因強烈颱風侵襲致其所在地對外交通及通信中斷數日；交通恢復後第八日，甲君向消防局申請回復原狀，並同時補行提出改善計畫。", problem:"問：甲君得否依法申請回復原狀以補行提出改善計畫？", body:"依§50Ⅰ，因天災或其他不可歸責於申請人之事由，致基於法規之申請不能於法定期間內提出者，得於其原因消滅後十日內，申請回復原狀；若法定期間本身少於十日者，則於相等日數內得為申請，此為兼顧程序安定性與個案正義所設之例外救濟機制，要件包括須有天災等不可歸責事由、須因該事由致不能於法定期間內為行政程序行為、須於原因消滅後法定期間內申請。§50Ⅱ進一步要求申請回復原狀時，應同時補行期間內應為之行政程序行為，亦即不能僅空言申請回復原狀，須將原本逾期未為之行為一併完成，程序始屬完整。本案甲君原應於某月十五日前提出改善計畫，因強烈颱風侵襲致其所在地對外交通通信中斷數日，此屬不可歸責於甲君之天災事由，其不能於法定期間內提出應可認定；交通恢復後即為原因消滅，甲君於第八日提出申請，未逾十日之法定期間，且同時補行提出改善計畫，核與§50Ⅰ、Ⅱ之要件完全相符。應注意者，若甲君遲誤法定期間已逾一年，依§50Ⅲ即不得再申請回復原狀，此為回復原狀制度之外部時間界限，本案顯無逾一年之情形，附此敘明以求論述周延，且甲君所補行之行為與原應為之改善計畫申請內容一致，並無逾越補行範圍之問題。\n\n結語：甲君之申請合於§50Ⅰ、Ⅱ回復原狀之要件，消防局應予准許，視為甲君已於法定期間內合法提出改善計畫，不生逾期之法律效果。"},
  {a:"§60Ⅰ、Ⅱ", q:"消防局就某工廠停業處分舉行聽證，聽證開始時，先由主持人說明本次聽證之事由，並說明本案內容要旨，隨後始請當事人及其代理人依序陳述意見。", problem:"問：本件聽證開始程序之進行是否符合法定要式？", body:"依§60Ⅰ，聽證應以主持人說明案由為始，此為聽證程序啟動之形式要件，目的在使到場之當事人及利害關係人首先了解本次聽證所欲處理之事由及範圍；§60Ⅱ進一步規定，聽證開始時，應由主持人或其指定之人說明事件之內容要旨，使當事人在正式陳述意見或詰問前，先行掌握案件事實概要與爭點所在，俾利其後續有效行使§61所賦予之陳述意見、提出證據及詢問等程序參與權。二項規定具有先後銜接關係：先說明案由，再說明內容要旨，兩者均屬主持人於聽證開始階段應踐行之法定義務，若略而不為，即可能構成聽證程序之瑕疵，影響其後作成處分之合法性。本案消防局就某工廠停業處分舉行聽證，聽證開始時先由主持人說明本次聽證之事由，繼而說明本案內容要旨，隨後始請當事人及其代理人依序陳述意見，其程序進行順序核與§60Ⅰ、Ⅱ規定完全相符，並無跳過說明案由或內容要旨即逕行進入實質辯論之瑕疵。此後聽證終結，機關依§108作成處分時，應斟酌聽證全部結果，並依§109免除訴願及其先行程序，逕以行政訴訟救濟，此為聽證程序異於一般陳述意見程序之重要法律效果。\n\n結語：本件聽證開始程序完全符合§60Ⅰ、Ⅱ之法定要式，程序合法；嗣後聽證終結所作成之停業處分，當事人如有不服，依§109得逕行提起行政訴訟，無須先經訴願程序。"},
  {a:"§75", q:"消防局因轄內某加油站擴建案涉及周邊安全評估，須通知可能受影響之附近居民表示意見，惟該範圍內住戶眾多且流動性高，難以逐一確認具體對象，遂以公告並刊登地方新聞紙之方式代替個別送達通知。", problem:"問：消防局以公告代替個別通知之送達方式是否合法？", body:"依§75，行政機關對於不特定人之送達，得以公告或刊登政府公報或新聞紙代替之，此係因應相對人範圍難以逐一確定或人數過於龐大之特殊情形所設之送達替代機制，其適用重點在於相對人是否屬於「不特定」，亦即機關根本無從逐一確認具體對象或住居所，而非僅單純人數眾多但個別身分明確之情形；此與§78以下之公示送達不同，公示送達係處理「特定人所在不明」之送達困境，二者規範對象及適用前提均有區別，作答時應予辨明。本案消防局因加油站擴建案涉及周邊安全評估，須通知可能受影響之附近居民表示意見，惟該範圍內住戶眾多且流動性高，難以逐一確認具體對象，其情形核屬相對人不特定之典型態樣，消防局遂以公告並刊登地方新聞紙之方式代替個別送達通知，程序上與§75規定相符。若消防局明明可得確認特定住戶名冊卻仍便宜行事以公告方式為之，恐有規避個別通知義務、損及特定居民陳述意見機會之疑慮，日後如生爭議，機關仍應舉證證明確有相對人不特定、逐一送達顯有困難之事實，始能主張公告方式合法有效。\n\n結語：消防局以公告刊登新聞紙方式代替個別送達，因該案居民對象確屬不特定且範圍難以逐一確認，核與§75規定相符，該通知自公告或刊登最後登載之日發生效力。"},
  {a:"§11Ⅴ", q:"甲、乙兩消防分隊因轄區邊界之出勤動線較為迂迴，兩分隊長私下口頭約定互相支援對方轄區內之部分里別，作為固定管轄範圍調整，並未經任何法規訂定或公告程序。", problem:"問：兩分隊長私下約定調整轄區管轄範圍是否發生合法效力？", body:"依§11Ⅴ，管轄權非依法規不得設定或變更，此即學理上所稱之「管轄恆定原則」，其規範意旨在於管轄權之歸屬涉及人民權益及機關組織分工之安定性，不容機關或其人員以私下協議、口頭約定等非正式方式任意調整，必須依§11Ⅰ組織法規或其他行政法規所定之管轄權為準，縱使組織法規變更管轄，亦須依§11Ⅱ、Ⅲ由原機關會同新機關或共同上級機關踐行公告程序，始生移轉管轄權之效力，且依§11Ⅳ公告事項自公告之日起第三日起發生效力。本案甲、乙兩消防分隊長因轄區邊界出勤動線迂迴，私下口頭約定互相支援對方轄區內部分里別，作為固定管轄範圍之調整，並未經任何法規訂定或公告程序，此種私下約定既非依法規為之，亦未踐行公告程序，核與§11Ⅴ管轄恆定原則相悖，該約定在法律上不生變更管轄權之效力，兩分隊就對方轄區內之出勤義務及管轄權限並不因此私下協議而發生移轉。若兩分隊基於實際救災效率之考量，確有調整轄區必要者，仍應循正式程序，簽報上級機關依組織法規或另訂行政規則、依§15辦理委任或委託，並依法公告，始能發生合法變更管轄之效力，不能僅憑基層人員間之口頭協議行之。\n\n結語：兩分隊長私下口頭約定既未依法規亦未經公告程序，依§11Ⅴ管轄恆定原則不生變更管轄權之效力，原轄區管轄範圍仍應依原組織法規定之。"},
  {a:"§9、§36", q:"消防局於調查某餐飲場所違反消防安全設備規定案件時，僅依檢舉人所提供之單方資料作成調查，未依職權另行蒐集其他佐證；業者於程序中提出已完成改善並取得改善證明之文件，承辦人員閱後未予採認亦未載明不採之理由，逕行依檢舉資料作成裁罰處分。", problem:"問：消防局此一調查及裁處程序是否違反行政程序法相關原則？", body:"依§36，行政機關應依職權調查證據，不受當事人主張之拘束，對當事人有利及不利事項一律注意，此為職權調查主義之明文，機關調查事實不能僅憑單方陳述或檢舉資料照單全收，而應主動蒐集、查證各項相關證據，以確保事實認定之全面性與正確性；§9則進一步宣示有利不利一體注意原則，要求機關就該管行政程序，應於當事人有利及不利之情形一律注意，二條文相輔相成，共同構成行政機關調查事實應遵循之基本準則，機關若僅片面採信不利於當事人之資料，而漠視當事人提出之有利事證，即與此二原則有違。本案消防局僅依檢舉人所提供之單方資料作成調查，未依職權另行蒐集其他佐證，已有違反§36職權調查主義之嫌；業者於程序中提出已完成改善並取得改善證明之文件，此屬對業者有利之事證，承辦人員閱後未予採認，亦未依§43說明不採之理由，逕行依檢舉資料作成裁罰處分，顯係僅注意不利於業者之事項而完全忽視有利事項，核與§9有利不利一律注意原則明顯牴觸。此種調查與裁處程序因未善盡職權調查義務、未充分審酌有利事證，其所作成之裁罰處分應認有調查未臻完備之程序瑕疵。\n\n結語：消防局之調查及裁處程序違反§9、§36規定，該裁罰處分因事實認定基礎有欠周延，業者如有不服，得循訴願及行政訴訟程序請求撤銷，並命消防局重新調查改善事實。"},
  {a:"§48Ⅳ、§51Ⅱ", q:"消防局受理某老舊建築物申請公共安全檢查合格證明，因未依規定訂定並公告個案處理期間，其法定處理期間依法為二個月；承辦人員試算屆滿日期後，發現該二個月期間之末日恰為星期日，遂將該案處理期限順延至次日始行屆滿。", problem:"問：消防局關於處理期間及其屆滿日之計算是否合法？", body:"依§51Ⅰ，行政機關對於人民依法規之申請，除法規另有規定外，應按各事項類別，訂定處理期間公告之；§51Ⅱ明定未依前項規定訂定處理期間者，其處理期間為二個月，此為法定之補充性處理期間，用以保障人民申請案件不致因機關怠於訂定期間而長期懸而未決。就期間屆滿日之計算，應依§48Ⅳ規定，期間之末日為星期日、國定假日或其他休息日者，以該日之次日為期間之末日；期間之末日為星期六者，以其次星期一上午為期間末日，此一順延規則之目的在避免因假日致人民或機關無法於當日完成相關程序行為，屬期間計算之一般原則，於處理期間之屆滿計算亦有適用。本案消防局受理老舊建築物申請公共安全檢查合格證明，因未依§51Ⅰ訂定並公告個案處理期間，依§51Ⅱ其法定處理期間為二個月，承辦人員試算屆滿日期後，發現該二個月期間之末日恰為星期日，遂依§48Ⅳ規定將該案處理期限順延至次日星期一始行屆滿，其計算方式與法條規定相符，並無違誤。若消防局於該順延後之期限內仍未能處理終結，依§51Ⅲ、Ⅳ，得於原處理期間限度內延長一次，並應於原期間屆滿前通知申請人延長事由，方為適法。\n\n結語：消防局以§48Ⅳ順延規則計算§51Ⅱ二個月處理期間之屆滿日，程序合法；若屆期仍未能處理終結，應依§51Ⅲ、Ⅳ辦理延長並通知申請人。"},
  {a:"§69Ⅰ、§73Ⅰ", q:"消防局裁處書之應受送達人為一名尚未成年、不具行政程序行為能力之少年，依法應向其法定代理人為送達；惟送達人員到場時，其法定代理人恰巧外出，遂將文書交付在場、具辨別事理能力之其同住祖母簽收，以完成送達。", problem:"問：本件將裁處書交付祖母簽收是否發生合法送達之效力？", body:"依§69Ⅰ，對於無行政程序之行為能力人為送達者，應向其法定代理人為之，此係因無行為能力人尚無從自行理解文書內容並為適當之因應，故以法定代理人為送達對象，確保受送達人之權益獲得妥適照料；惟若送達人員至法定代理人之住居所送達時未能會晤法定代理人本人，依§73Ⅰ，於應送達處所不獲會晤應受送達人時，得將文書付與有辨別事理能力之同居人、受僱人或應送達處所之接收郵件人員，此即補充送達制度，其要件為受送達處所確係應受送達人之住居所，且受領人須具辨別事理能力並與應受送達人非利害關係相反。本案少年不具行政程序行為能力，依§69Ⅰ本應向其法定代理人送達，送達人員到場時法定代理人恰巧外出，遂將文書交付在場、具辨別事理能力之同住祖母簽收，該祖母核屬與法定代理人同居且具辨別事理能力之人，並無利害關係相反之情形，依§73Ⅰ補充送達規定，此一送達方式應認發生合法送達之效力，送達生效時點以交付祖母簽收之時為準。惟若祖母與該少年於本案有利害關係相反之情形，依§73Ⅱ即不得對其為補充送達，仍應另覓其他合法送達方式，此為本題應予辨明之反面情形。\n\n結語：本件將裁處書交付具辨別事理能力且無利害關係相反之同住祖母簽收，核與§69Ⅰ、§73Ⅰ規定相符，於交付時即生合法送達之效力，救濟期間應自該時起算。"},
  {a:"§24Ⅱ、§35", q:"甲君就其工廠消防安全改善協商案件，一次委任四名代理人向消防局接洽；其中一名代理人到場時以言詞方式代甲君正式提出改善計畫變更之申請，承辦人員當場作成紀錄，經朗讀並由該代理人確認內容無誤後簽名。", problem:"問：甲君委任四名代理人及以言詞提出申請之程序是否合法？", body:"依§24Ⅱ，每一當事人委任之代理人，不得逾三人，此為委任代理人數之法定上限，目的在避免程序因代理人過多而增加溝通成本、影響行政效率；若當事人委任逾三人之代理人，其超過部分之委任應認不生代理權授與之效力，惟已委任之前三名代理人仍得依法代理當事人為程序行為。另依§35，當事人依法向行政機關提出申請者，除法規另有規定外，得以書面或言詞為之，以言詞為申請者，受理之行政機關應作成紀錄，經向申請人朗讀或使閱覽，確認其內容無誤後由其簽名或蓋章，此為言詞申請之法定作業程序，用以確保申請內容之真實性與證據力。本案甲君一次委任四名代理人，已逾§24Ⅱ所定三人之上限，其中第四名代理人之委任應不生合法代理權授與之效力，僅前三名代理人得代理甲君為程序行為；至於代理人以言詞方式代甲君正式提出改善計畫變更之申請，承辦人員當場作成紀錄，經朗讀並由該代理人確認內容無誤後簽名，其程序核與§35規定相符，惟仍以該代理人屬合法委任之前三人之一為前提，若恰為逾額委任之第四人，其代理行為即因欠缺合法代理權而效力有疑，消防局宜請甲君釐清代理人選定範圍，以免程序後續發生爭議。\n\n結語：甲君委任四名代理人已違反§24Ⅱ三人上限，逾額部分不生代理效力；言詞申請部分之作成紀錄程序則與§35相符，惟仍須以合法代理人為前提始生效力。"},
  {a:"§7③、§10", q:"某小型工廠僅因一具滅火器逾期未更換藥劑遭查獲，依消防局訂定之裁罰基準，該違規情節原應處新臺幣一萬元罰鍰；惟承辦人員逕行作成勒令該工廠全面停業之處分，並將罰鍰金額提高至十萬元，已超出裁罰基準所定上限。", problem:"問：消防局之停業處分及提高罰鍰金額是否違反相關法律原則？", body:"依§7③，行政行為採取之方法所造成之損害不得與欲達成目的之利益顯失均衡，此為狹義比例原則之明文，要求行政手段與所欲達成之行政目的間須維持適當之衡平關係，不能為達成輕微之管制目的而採取過度侵害人民權益之手段；又依§10，行政機關行使裁量權，不得逾越法定之裁量範圍，並應符合法規授權之目的，裁量瑕疵可分為裁量逾越、裁量濫用及裁量怠惰三種類型，機關訂有裁罰基準者，基於行政自我拘束原則及§6平等原則，原則上應受該基準拘束，非有正當理由不得任意逾越。本案某小型工廠僅因一具滅火器逾期未更換藥劑遭查獲，此屬輕微之違規情節，依消防局訂定之裁罰基準，原應處新臺幣一萬元罰鍰，情節與所生風險均屬有限；承辦人員竟逕行作成勒令工廠全面停業之處分，此一手段對工廠營業自由及財產權之限制程度，與滅火器藥劑逾期未更換此一輕微違規事實顯不相當，核屬違反§7③比例原則之情形；又其將罰鍰金額提高至十萬元，已超出裁罰基準所定一萬元上限達十倍之多，且未見有何符合裁罰基準所定加重事由之特殊情形，顯屬逾越法定裁量範圍之裁量逾越瑕疵，違反§10合法裁量原則。\n\n結語：本件停業處分及提高罰鍰金額均因違反§7③比例原則及§10合法裁量原則而屬違法處分，甲得循訴願及行政訴訟程序請求撤銷或減輕處分內容。"},
  {a:"§91", q:"消防局委託外交部代為送達一份行政處分書予僑居海外之甲君。外交部於送達地多次嘗試後仍無法完成送達，遂將辦理情形回覆消防局，消防局承辦人A將該回覆文件附入原案卷保存。", problem:"問：消防局承辦人A將外交部回覆文件附卷之作法是否合法妥適？", body:"依§86Ⅰ，於外國或境外為送達者，應囑託該國管轄機關或駐在該國之中華民國使領館或其他機構、團體為之，消防局委託外交部代為送達正屬此一境外送達機制之運用；而依§91，受囑託之機關或公務員，經通知已為送達或不能為送達者，行政機關應將通知書附卷，此一規定之意旨在於委託送達之結果無論成功或失敗均須以書面通知原委託機關，並由原機關將該通知書妥善保存於案卷之中，作為日後判斷送達是否合法生效、行政救濟期間應如何起算之重要證據，亦與§85不能送達應製作報告書附卷之精神相呼應。本案外交部受消防局委託送達行政處分書予僑居海外之甲君，於送達地多次嘗試後仍無法完成送達，遂將辦理情形回覆消防局，此一回覆即屬§91所稱「通知已為送達或不能為送達」之情形，消防局承辦人A將該回覆文件附入原案卷保存，其作法核與§91規定完全相符，屬依法應為之處置。消防局後續應依送達不能之事實，考量是否轉依§78以下公示送達之規定重新踐行送達程序，蓋境外送達不能亦屬§78Ⅰ③所定公示送達要件，機關不得因送達不能即放任處分懸而不生效力。\n\n結語：承辦人A將外交部之回覆文件附卷，合於§91規定；消防局後續宜依§78以下規定改採公示送達，以使該行政處分依法對甲君發生效力。"},
  {a:"§97⑤", q:"甲君參加消防設備士資格檢定測驗，主辦機關依評分標準核定其筆試成績未達合格門檻，並以書面通知甲君測驗結果，通知書中並未記載各科成績之評分理由及依據。", problem:"問：主辦機關通知書未記載評分理由是否構成違法？", body:"依§96Ⅰ②，書面行政處分原則上應記載主旨、事實、理由及其法令依據，此為理由附記義務，用以使相對人瞭解處分作成之依據，並利其判斷是否提起救濟；惟§97設有例外規定，列舉六款得不記明理由之情形，其中第五款明定「有關專門知識、技能或資格所為之考試、檢定或鑑定等程序」得不記明理由，蓋此類程序涉及高度專業性之評分判斷，性質上屬於判斷餘地之範疇，若強令逐一說明評分理由，將使主辦機關負擔過重之行政成本，且評分標準之專業性亦非一般理由說明所能盡述。本案甲君參加消防設備士資格檢定測驗，此核屬§97⑤所稱「有關專門知識、技能或資格所為之考試、檢定」程序，主辦機關依評分標準核定其筆試成績未達合格門檻，並以書面通知測驗結果，通知書中未記載各科成績之評分理由及依據，依§97⑤規定，主辦機關本得不記明理由，其通知書之作成程序並無違反§96Ⅰ②理由附記義務之情形，於法有據。惟應注意者，主辦機關雖得不記明理由，仍應確保評分標準及程序本身之公正客觀，倘甲君對評分結果有具體爭議，仍得依§46申請閱覽相關評分卷宗資料，以維護其正當之權益。\n\n結語：主辦機關依§97⑤得不記明理由，其通知書未載評分理由並不違法；甲君如有爭執，仍得循§46卷宗閱覽及相關救濟途徑維護其權益。"},
  {a:"§100Ⅱ", q:"轄內某商圈因鄰近化工廠發生氣體外洩，消防局對區內不特定但依所在範圍可得確定之商家作成疏散命令。因商家眾多且情況緊急，消防局僅將該疏散命令刊登於地方新聞紙及公告於商圈入口，未對各商家逐一送達書面處分。", problem:"問：消防局以公告方式送達疏散命令予商圈商家是否合法？", body:"依§92Ⅱ，行政處分之相對人雖非特定，而依一般性特徵可得確定其範圍者，為一般處分，適用本法有關行政處分之規定，本案消防局對區內不特定但依「商圈範圍內商家」此一特徵可得確定範圍之對象作成疏散命令，其性質核屬對人之一般處分無疑。就一般處分之送達方式，依§100Ⅱ，一般處分之送達，得以公告或刊登政府公報或新聞紙代之，此係考量一般處分之相對人眾多且範圍係依特徵確定而非逐一列名，若仍要求機關逐一送達顯有困難，故特設此一簡化送達方式，以兼顧行政效率與相對人知悉處分內容之機會，並依§110Ⅱ，一般處分自公告日或刊登政府公報、新聞紙最後登載日起發生效力。本案消防局因商家眾多且情況緊急，僅將該疏散命令刊登於地方新聞紙及公告於商圈入口，未對各商家逐一送達書面處分，其作法核與§100Ⅱ規定相符，該疏散命令應自刊登新聞紙最後登載之日或公告之日起發生效力，商家自該時起即負有依命令疏散之義務，其未依限疏散者，消防局得依相關法規為後續處置。若本案情況更為急迫，消防局尚非不得援引§95Ⅰ以言詞或其他適當方式先行作成處分並使商家即時知悉，事後再補行公告程序，以爭取搶救時效。\n\n結語：消防局以公告及刊登新聞紙方式送達本件疏散命令，核與§100Ⅱ規定相符，該疏散命令自最後刊登或公告之日起對區內商家發生法律效力。"},
  {a:"§106Ⅰ、Ⅱ", q:"甲君於消防局所定得提出陳述意見之期限內，並未提出書面陳述書，而是親自到消防局以言詞陳述意見；承辦人A當場作成陳述紀錄，向甲君朗讀確認內容無誤後，由甲君於紀錄上簽名。", problem:"問：甲君以言詞陳述取代提出陳述書之程序是否合法？", body:"依§106Ⅰ，行政處分之相對人或利害關係人得於§104Ⅰ④所定期限內，以言詞向行政機關陳述意見代替陳述書之提出，此為陳述意見程序中賦予當事人之選擇權，蓋機關依§104通知當事人得提出陳述書，惟考量部分當事人未必善於書面表達，或有急迫情形不及製作書面，故明文允許以言詞方式代替，二者法律效果相同，均屬已依法給予陳述意見之機會，非謂當事人選擇言詞方式即屬程序不備。依§106Ⅱ，以言詞陳述意見者，行政機關應作成紀錄，經向陳述人朗讀或使閱覽確認其內容無誤後，由陳述人簽名或蓋章；其拒絕簽名或蓋章者，應記明其事由，陳述人對紀錄有異議者，應更正之，此一程序與§35言詞申請、§64聽證紀錄之製作要求體例相仿，均在確保言詞陳述之內容具備可稽核之證據力。本案甲君於消防局所定期限內，未提出書面陳述書，而親自到場以言詞陳述意見，核屬§106Ⅰ所允許之陳述方式；承辦人A當場作成陳述紀錄，向甲君朗讀確認內容無誤後，由甲君於紀錄上簽名，其作業程序完全符合§106Ⅱ之要求，該言詞陳述紀錄應與書面陳述書具有相同之效力，消防局應將其內容併入全案事證中依§43斟酌判斷，作成後續處分之依據。\n\n結語：甲君以言詞陳述並經合法作成紀錄簽名確認，核與§106Ⅰ、Ⅱ規定相符，該陳述紀錄與書面陳述書有同一效力，消防局應併同全部事證斟酌後始得作成處分。"},
  {a:"§108Ⅰ、Ⅱ、§109", q:"消防局就是否廢止甲君所經營爆竹煙火製造場之許可乙案，依法舉行聽證。聽證終結後，消防局斟酌聽證全部結果，以書面作成廢止許可之處分並送達甲君。甲君不服，未先提起訴願，逕向高等行政法院提起撤銷訴訟。", problem:"問：甲君未經訴願程序逕行提起撤銷訴訟是否合法？", body:"依§108Ⅰ，行政機關作成經聽證之行政處分時，除依§43規定外，並應斟酌全部聽證之結果，但法規明定應依聽證紀錄作成處分者，從其規定；§108Ⅱ並要求該處分應以書面為之，並通知當事人，此為聽證程序終結後，機關作成終局處分應遵循之程序要求，確保處分之作成確實建立於聽證過程中當事人充分陳述意見、詰問、提出證據之基礎上，而非置聽證結果於不顧、逕依原擬定之立場作成處分。就救濟途徑而言，§109明定不服依§108作成之行政處分者，其行政救濟程序，免除訴願及其先行程序，此係因聽證程序本身已具備高度嚴謹之正當程序保障，立法者認無須再經訴願程序重複審查，故賦予人民得逕行提起行政訴訟之特別救濟途徑，此為聽證制度異於一般陳述意見程序最重要之法律效果差異。本案消防局就廢止甲君爆竹煙火製造場許可乙案依法舉行聽證，聽證終結後斟酌聽證全部結果，以書面作成廢止許可之處分並送達甲君，其處分作成程序核與§108Ⅰ、Ⅱ規定相符；甲君對該處分不服，未先提起訴願，逕向高等行政法院提起撤銷訴訟，其救濟途徑之選擇正合於§109免除訴願及其先行程序之規定，程序合法，法院不得以未經訴願程序為由裁定駁回其訴。\n\n結語：本件廢止許可處分係經合法聽證程序作成，甲君依§109規定得免除訴願程序逕行提起撤銷訴訟，其起訴程序合法，法院應予受理並為實體審理。"},
  {a:"§104Ⅰ、§105Ⅲ", q:"消防局擬對甲君作成限制其營業權利之處分前，以書面通知甲君其住居所、擬為處分之原因事實及法規依據，並敘明得於文到十日內提出陳述書及屆期不提出之效果。甲君屆期未提出陳述書，消防局遂逕依卷內既有事證作成處分。", problem:"問：消防局於甲君屆期未提出陳述書後逕行作成處分是否合法？", body:"依§104Ⅰ，行政機關依§102給予相對人陳述意見之機會時，應以書面記載相對人及其住居所等基本資料、將為限制或剝奪自由或權利行政處分之原因事實及法規依據、得依§105提出陳述書之意旨、提出陳述書之期限及不提出之效果、其他必要事項，此為陳述意見通知之法定應載事項，用以使相對人充分了解機關擬為處分之內容及其得行使之程序權利，並知悉屆期不行使之法律效果，屬正當程序保障之具體展現。而依§105Ⅲ，不於期間內提出陳述書者，視為放棄陳述之機會，此一效果之發生，以機關已依§104Ⅰ完整履行通知義務為前提，若通知內容有欠缺，縱相對人屆期未提出陳述書，亦難逕認已生放棄陳述機會之法律效果。本案消防局於作成限制甲君營業權利之處分前，以書面通知甲君其住居所、擬為處分之原因事實及法規依據，並敘明得於文到十日內提出陳述書及屆期不提出之效果，其通知內容已涵蓋§104Ⅰ各款應載事項，程序完備；甲君屆期未提出陳述書，依§105Ⅲ規定，即視為放棄陳述之機會，消防局於此情形下逕依卷內既有事證作成處分，並無不合，蓋其已依法賦予甲君陳述意見之機會，甲君未於期限內行使，其法律效果應由甲君自行承擔，不生程序違法之問題。\n\n結語：消防局之通知已符合§104Ⅰ應載事項，甲君屆期未提出陳述書依§105Ⅲ視為放棄陳述機會，消防局逕依既有事證作成處分程序合法。"},
  {a:"§110Ⅲ", q:"消防局五年前對甲君所有之公共危險物品倉儲場所作成禁止使用之處分，該處分自作成後從未經撤銷或廢止，亦無其他失效事由發生。甲君近日主張該處分因久未執行而已自動失效，消防局否認之。", problem:"問：本件禁止使用處分是否因久未執行而自動失效？", body:"依§110Ⅲ，行政處分未經撤銷、廢止，或未因其他事由而失效者，其效力繼續存在，此即學理上所稱行政處分之「存續力」，其規範意旨在於行政處分一經合法生效，即形成一定之法律狀態，除非有法定之失效事由發生，如經撤銷、廢止、附解除條件成就、目的已完成、標的消滅等，否則其效力應繼續存在，不因單純時間經過、機關未積極執行，或當事人主觀上認為已無必要而當然消滅，此與§118撤銷溯及失效、§125廢止向後失效係規範「處分經撤銷或廢止後」之效力狀態有別，本條處理的是處分尚未經撤銷廢止前之常態存續問題。本案消防局五年前對甲君所有之公共危險物品倉儲場所作成禁止使用之處分，該處分自作成後從未經撤銷或廢止，亦查無其他法定失效事由發生，依§110Ⅲ規定，該處分之效力自應繼續存在，甲君主張該處分因久未執行而已自動失效，於法無據，蓋「久未執行」並非行政程序法或其他法規所定之當然失效事由，行政處分之存續與機關是否積極執行強制執行問題係屬二事，不能混為一談，機關縱一時未予執行，亦不影響處分本身效力之存續。\n\n結語：本件禁止使用處分因未經撤銷、廢止且無其他法定失效事由，依§110Ⅲ其效力仍繼續存在，甲君主張自動失效並無理由，消防局仍得本於該處分為後續執行行為。"},
  {a:"§113Ⅱ", q:"甲君認為其所受消防局之處分具有重大明顯之瑕疵，遂具狀敘明理由，向消防局請求確認該處分是否為無效。", problem:"問：甲君得否依法請求消防局確認該處分為無效？", body:"依§113Ⅰ，行政處分之無效，行政機關得依職權確認之；§113Ⅱ進一步規定，行政處分之相對人或利害關係人有正當理由請求確認行政處分無效時，處分機關應確認其為有效或無效，此為無效確認制度之明文，賦予人民於認處分具有無效事由時，得主動請求機關確認之權利，機關受理後負有應為確認之義務，不得置之不理。此與§111所定無效之七款事由互相呼應，包括不能由書面得知處分機關、應以證書方式作成而未給予證書、內容對任何人均不能實現、所要求或許可之行為構成犯罪、內容違背公序良俗、未經授權違背專屬管轄或缺乏事務權限、其他重大明顯瑕疵，須先判斷是否確實具備該等無效事由，機關始應為無效之確認，若僅屬得撤銷之違法瑕疵而未達無效程度，機關應為駁回其請求或改依§117撤銷程序處理。本案甲君認為其所受消防局之處分具有重大明顯之瑕疵，遂具狀敘明理由，向消防局請求確認該處分是否為無效，其請求核屬§113Ⅱ「相對人有正當理由請求確認行政處分無效」之適例，消防局受理後即負有應為確認之法定義務，須就甲君所主張之瑕疵是否確實該當§111各款無效事由逐一審查，並將確認結果以書面通知甲君。\n\n結語：甲君之請求合於§113Ⅱ規定，消防局負有應予確認之法定義務，須就是否該當§111所定無效事由為實質審查並書面回覆，人民如對確認結果不服，仍得循相關行政爭訟程序救濟。"},
  {a:"§118", q:"消防局發現其核發予甲君之消防設備補助處分違法，依法予以撤銷；惟為避免甲君因信賴原處分已購置設備而遭受財產上損失，消防局於撤銷處分中另訂該處分自撤銷後三個月始失其效力，而非溯及既往失效。", problem:"問：消防局於撤銷處分中另訂失效日期之作法是否合法？", body:"依§118，違法行政處分經撤銷後，溯及既往失其效力，此為撤銷之原則效果，蓋違法處分自始即欠缺合法基礎，撤銷後回復至未曾作成處分前之法律狀態，方符依法行政之要求；惟該條但書設有例外，明定為維護公益或為避免受益人財產上之損失，為撤銷之機關得另定失其效力之日期，亦即機關於撤銷違法之授益處分時，得斟酌個案情形，不採溯及既往失效，而改訂處分向未來某一日期始失其效力，藉此緩和撤銷溯及失效對受益人已生之信賴利益或既有法律關係所造成之衝擊，此一裁量權之行使仍應具體說明理由，並與§119信賴不值得保護之判斷、§120信賴補償制度相互配合觀察。本案消防局核發予甲君之消防設備補助處分經發現違法而依職權撤銷，因甲君已信賴原處分購置相關設備，若逕採溯及既往失效，甲君恐須全數返還補助款並承受已購置設備之財產損失，消防局為避免此一結果，於撤銷處分中另訂該處分自撤銷後三個月始失其效力，核屬§118但書所賦予機關之裁量權限之合法行使，程序並無不合。此一作法與逕依§120給予金錢補償相比，係以延後失效之方式緩和衝擊，二者性質不同、可擇一或併用。\n\n結語：消防局依§118但書另訂處分自撤銷後三個月始失效力，核屬法定裁量權之合法行使，於此三個月過渡期間內，甲君仍得繼續享有原處分之利益，逾期後始生失效之效果。"},
  {a:"§120Ⅰ、Ⅱ、§121Ⅰ", q:"消防局於112年6月查知其於109年核發予甲君之防火設備補助處分違法，並於113年5月依職權將該處分全部撤銷。甲君受領補助時並無詐欺、提供不實資料或明知違法之情事，因信賴該處分業已購置相關設備而受有財產上之損失，消防局於撤銷處分後一併決定給予甲君合理之補償，補償金額並以甲君因原處分存續可得之利益為上限。", problem:"問：消防局撤銷處分及給予補償之程序與金額是否均屬合法？", body:"依§121Ⅰ，行政機關依§117之撤銷權，應自原處分機關或其上級機關知有撤銷原因時起二年內為之，此為撤銷權之除斥期間，其起算點為「知有撤銷原因時」而非處分作成時，此一區辨甚為重要；本案消防局於112年6月查知109年核發之補助處分違法，即為知有撤銷原因之時點，消防局於113年5月依職權撤銷，距知悉時未滿一年，並未逾§121Ⅰ所定二年除斥期間，撤銷權之行使於法有據。就補償部分，依§120Ⅰ，授予利益之違法行政處分經撤銷後，如受益人無§119所列信賴不值得保護之情形，其因信賴該處分致遭受財產上之損失者，為撤銷之機關應給予合理之補償，本案甲君受領補助時並無詐欺、脅迫或賄賂、提供不正確資料或明知違法等§119所列信賴不值得保護之情事，其因信賴原處分購置設備而受有財產損失，消防局自負有依§120Ⅰ給予合理補償之義務；又依§120Ⅱ，補償額度不得超過受益人因該處分存續可得之利益，本案消防局補償金額以甲君因原處分存續可得之利益為上限，核與此一上限規定相符，程序及金額均屬合法，甲君如對補償金額有爭執，依§120Ⅲ，得向行政法院提起給付訴訟救濟。\n\n結語：消防局於§121Ⅰ二年除斥期間內合法撤銷處分，並依§120Ⅰ、Ⅱ給予甲君合理且未逾存續利益上限之補償，程序與金額均屬適法。"},
  {a:"§122", q:"消防局曾對甲君所有之違規場所核發限期改善之處分，該處分不涉及授予甲君任何利益且屬合法處分。嗣後消防局認為該場所已無繼續要求改善之必要，遂依職權將該處分全部廢止。", problem:"問：消防局將此一合法非授益處分予以廢止是否合法？", body:"依§122，非授予利益之合法行政處分，得由原處分機關依職權為全部或一部之廢止，但廢止後仍應為同一內容之處分或依法不得廢止者，不在此限。本條規範對象為非授益且合法之行政處分，與§117處理違法處分之撤銷、§123處理授益合法處分之廢止均有不同，蓋非授益處分之相對人並無值得保護之信賴利益可言，故機關廢止此類處分之裁量空間相對寬鬆，僅於廢止後依法仍須為同一內容之處分，或有其他法律明文禁止廢止之情形，機關始不得廢止。本案消防局曾對甲君所有之違規場所核發限期改善之處分，此一處分課予甲君改善義務、限制其場所使用，性質上核屬非授益之負擔處分，且未見有何違法情事，應屬合法處分；嗣後消防局認為該場所已無繼續要求改善之必要，遂依職權將該處分全部廢止，並無廢止後仍須為同一內容處分之情形，亦無其他法律禁止廢止之規定，其廢止核與§122規定相符，屬合法之裁量行使。廢止後，該限期改善處分即向後失其效力，甲君自廢止時起不再負有履行改善之義務，此與授益處分之廢止須具備§123所列五款事由之要求相較，非授益處分之廢止門檻明顯較低。\n\n結語：消防局依§122規定將該非授益合法處分予以廢止，程序合法，該處分自廢止時起向後失其效力，甲君不再負有改善義務。"},
  {a:"§124", q:"甲君自109年1月起即未履行消防局核准補助處分所附「應於一年內完成裝設」之負擔，消防局遲至112年3月始依職權將該補助處分予以廢止。", problem:"問：消防局遲至112年3月始為廢止是否已逾法定除斥期間？", body:"依§123③，授予利益之合法行政處分，於附負擔之行政處分，受益人未履行該負擔者，得由原處分機關依職權為全部或一部之廢止，此為授益處分廢止事由之一；而依§124，前條之廢止，應自廢止原因發生後二年內為之，此為廢止權之除斥期間，用以督促機關及時行使廢止權，避免法律關係長期處於不確定狀態，其起算點為廢止原因發生後，本案之廢止原因即為甲君未履行負擔之事實發生時點。依題示，甲君原應於一年內完成裝設，其負擔應於110年1月屆滿履行期限，甲君自109年1月起即未履行，惟履行期限既為一年，其未履行之廢止原因應認發生於履行期限屆滿之時即110年1月，於此之前尚在履行期限內，不生未履行之廢止原因，消防局應自110年1月起算二年內即至112年1月前行使廢止權；消防局遲至112年3月始依職權將該補助處分予以廢止，已逾§124所定二年除斥期間約二個月，其廢止權已因除斥期間經過而消滅，消防局於112年3月所為之廢止處分，即因欠缺合法之廢止權基礎而屬違法。\n\n結語：消防局之廢止已逾§124所定二年除斥期間，其廢止權消滅，112年3月所為之廢止處分因欠缺合法權限基礎而屬違法，甲君得循訴願及行政訴訟程序請求撤銷。"},
  {a:"§125", q:"甲君受領消防局核准之消防安全設備補助處分，因迄未履行「應於一年內完成裝設」之負擔，消防局依法廢止該合法之授益處分，並認定其效力應溯及至原處分核發時起失其效力。", problem:"問：消防局認定本件廢止處分應溯及既往失效是否於法有據？", body:"依§125，合法行政處分經廢止後，自廢止時或自廢止機關所指定較後之日時起，失其效力，此為廢止之原則效果，即向後失效，與撤銷原則上溯及既往失效恰成對比，此一區辨為撤銷與廢止在法律效果上最重要之差異，蓋合法處分於廢止前既屬有效存在，其效力自不應無故回溯抹滅；惟§125但書設有例外，明定受益人未履行負擔致行政處分受廢止者，得溯及既往失其效力，此一例外係考量受益人本應履行負擔卻怠於履行，其信賴保護之正當性相對薄弱，且若不允許溯及失效，將使未履行負擔之受益人與已履行負擔者相較顯失公平，故特別賦予機關溯及失效之裁量權限。本案甲君受領消防局核准之消防安全設備補助處分，因迄未履行「應於一年內完成裝設」之負擔，此正屬§125但書所定受益人未履行負擔之情形，消防局依§123③廢止該合法之授益處分後，認定其效力應溯及至原處分核發時起失其效力，核與§125但書規定相符，於法有據；廢止效力既溯及既往，甲君原受領之補助款項，依§127Ⅰ即應予以返還，返還範圍準用民法不當得利之規定，消防局應以書面行政處分確認返還範圍並限期命甲君返還。\n\n結語：消防局因甲君未履行負擔而依§125但書認定廢止效力溯及既往，於法有據；甲君所受領之補助款項應依§127規定予以返還。"},
  {a:"§126Ⅰ", q:"消防局因法規事後修正，若不廢止原核准予甲君之防災設備補助處分，將對公益造成危害，遂依職權廢止該合法之補助處分。甲君原信賴該處分而已支出安裝費用，因處分遭廢止受有財產上之損失。", problem:"問：甲君得否請求消防局就其財產上損失給予補償？", body:"依§123④，授予利益之合法行政處分，行政處分所依據之法規或事實事後發生變更，致不廢止該處分對公益將有危害者，得由原處分機關依職權為全部或一部之廢止，本案消防局因法規事後修正，若不廢止原補助處分將對公益造成危害，其廢止事由核屬§123④之適例；惟因該處分本屬合法，受益人甲君原無可歸責事由，僅因公益考量而使其既有信賴利益受損，法律乃於§126Ⅰ明定，原處分機關依§123④、⑤規定廢止授予利益之合法行政處分者，對受益人因信賴該處分致遭受財產上之損失，應給予合理之補償，此一補償義務具強制性，機關不得逕以公益考量為由拒絕補償，蓋公益之實現不應由個別人民獨自承擔全部代價，此即特別犧牲理論於行政法上之具體實踐。又依§126Ⅱ，準用§120Ⅱ、Ⅲ及§121Ⅱ之規定，故補償額度同樣不得超過受益人因該處分存續可得之利益，補償爭議得提起給付訴訟。本案甲君原信賴該補助處分而已支出安裝費用，因處分遭廢止受有財產上之損失，其信賴應堪認值得保護，消防局自應依§126Ⅰ給予甲君合理之補償。\n\n結語：消防局依§123④廢止合法補助處分後，依§126Ⅰ應對甲君因信賴該處分所受財產損失給予合理補償，補償額度以其存續可得之利益為上限，甲君如有不服得提起給付訴訟。"},
  {a:"§131Ⅰ", q:"消防局於107年間對甲君核發裁罰處分後即取得對甲君之公法上罰鍰請求權，該請求權迄今已逾六年未經消防局行使，其間亦未曾中斷。消防局擬向甲君追繳該筆罰鍰，甲君主張該請求權已罹於時效而消滅。", problem:"問：消防局對甲君之罰鍰請求權是否已罹於時效而消滅？", body:"依§131Ⅰ，公法上之請求權，於請求權人為行政機關時，除法律另有規定外，因五年間不行使而消滅；於請求權人為人民時，除法律另有規定外，因十年間不行使而消滅，此一規定明文區分機關對人民之請求權與人民對機關之請求權兩種不同時效期間，與民法一般債權消滅時效十五年之規定並不相同，作答時須特別留意此一不對稱之時效期間設計；又依§131Ⅱ，公法上請求權因時效完成而當然消滅，不待義務人主張時效抗辯，此與民法時效完成僅生抗辯權之效果亦有不同，屬行政法上時效制度之特色。本案消防局於107年間對甲君核發裁罰處分後即取得對甲君之公法上罰鍰請求權，此一請求權人為行政機關，依§131Ⅰ應適用五年時效期間；該請求權迄今已逾六年未經消防局行使，且依題示其間亦未曾中斷，已逾五年之時效期間，依§131Ⅱ規定，該請求權應認當然消滅，消防局已不得再向甲君追繳該筆罰鍰，甲君主張該請求權已罹於時效而消滅，核屬有據，消防局不得再為任何請求或執行行為，此與§131Ⅲ機關為實現該權利所作成之行政處分而中斷時效之情形有別，本案並無中斷事由發生。\n\n結語：消防局對甲君之罰鍰請求權已逾§131Ⅰ所定五年時效期間且未曾中斷，依§131Ⅱ當然消滅，甲君之時效抗辯有理由，消防局不得再行追繳。"},
  {a:"§132", q:"消防局為徵收甲君積欠之規費，曾作成處分而使原本進行中之時效中斷，惟該處分嗣後因違法而經撤銷，溯及既往失其效力。甲君主張先前因該處分而中斷之時效，應視為自始未曾中斷。", problem:"問：甲君主張原中斷之時效應視為自始未曾中斷是否有理由？", body:"依§131Ⅲ，時效因行政機關為實現該權利所作成之行政處分而中斷，此為公法上請求權時效中斷事由之一，機關作成處分向義務人主張權利，即生時效中斷之效果，中斷後之時效原應依§133、§134之規定重行起算；惟§132特別規定，行政處分因撤銷、廢止或其他事由而溯及既往失效時，自該處分失效時起，已中斷之時效視為不中斷，此一規定之意旨在於，時效中斷之所以發生，係因機關已合法行使權利而中斷原時效之進行，若作成中斷效果之處分本身嗣後經撤銷而溯及既往失效，即視為自始未曾合法作成，則該處分所生之中斷效果亦應隨之失所附麗，回復為未曾中斷之狀態，以維持法律關係之邏輯一貫性，並避免義務人因機關作成違法處分反而受有時效延長之不利益。本案消防局為徵收甲君積欠之規費，曾作成處分而使原本進行中之時效中斷，惟該處分嗣後因違法而經撤銷，依§118撤銷原則上溯及既往失其效力，核屬§132所稱處分因撤銷而溯及既往失效之情形，依§132規定，先前因該處分而中斷之時效，應自該撤銷處分溯及失效時起，視為自始未曾中斷，甲君之主張核屬有據。\n\n結語：依§132規定，本件先前因違法處分而中斷之時效，因該處分經撤銷溯及既往失效，應視為自始未曾中斷，甲君之主張有理由，時效應以原進行狀態繼續計算。"},
  {a:"§134", q:"甲君對消防局之公法上請求權原時效期間僅剩3年，因消防局為實現該權利而作成行政處分，致該時效中斷；該處分其後已確定不得訴請撤銷，時效應重行起算。", problem:"問：本件時效中斷後重行起算之期間應為多久？", body:"依§133，因行政處分而中斷之時效，自行政處分不得訴請撤銷或因其他原因失其效力後，重行起算，此為時效中斷後重新計算之起算時點，須待該中斷事由所依據之處分確定不得再爭執或因其他事由失效後，時效始重新起算，避免時效狀態於處分尚可能被撤銷之不確定期間內即開始重行計算。至於重行起算後之期間長度，依§134明文規定，因行政處分而中斷時效之請求權，於行政處分不得訴請撤銷後，其原有時效期間不滿五年者，因中斷而重行起算之時效期間為五年，此一規定之意旨在於避免時效中斷後重行起算之期間過短、甚至短於中斷前剩餘期間，造成請求權人反因時效中斷而更加不利之不合理結果，故特別將重行起算期間拉平至與§131Ⅰ機關對人民請求權時效相同之五年下限。本案甲君對消防局之公法上請求權原時效期間僅剩3年，因消防局為實現該權利而作成行政處分，致該時效中斷，其後該處分已確定不得訴請撤銷，依§133時效應自此時起重行起算；因甲君原有時效期間僅剩餘3年，不滿五年，依§134規定，重行起算之時效期間應為五年，而非僅按原剩餘之3年計算，此一結果係法律為求時效制度計算一致性所為之明文規定。\n\n結語：本件時效中斷後，依§133應自處分確定不得撤銷時起重行起算，且因原剩餘期間不滿五年，依§134規定重行起算之時效期間應為五年。"},
  {a:"§137Ⅰ①、③", q:"消防局與轄內某工廠締結行政契約，約定工廠捐贈救災器材以換取消防局核准其設置公共危險物品儲槽。契約僅記載捐贈器材之項目及數量，並未約定該等器材應供特定用途使用之意旨，且所捐器材價值與該工廠獲准設置儲槽所得之經濟利益顯不相當，兩者欠缺正當合理之關聯。", problem:"問：本件行政契約之締結是否符合雙務契約之合法要件？", body:"依§137Ⅰ，行政機關與人民締結行政契約，互負給付義務者，應符合下列規定：第①款契約中應約定人民給付之特定用途；第②款人民之給付有助於行政機關執行其職務；第③款人民之給付與行政機關之給付應相當，並具有正當合理之關聯，此三款要件本質上係不當聯結禁止原則於雙務契約領域之具體化，用以防止機關假借契約自由之名，行變相勒索或利益輸送之實，尤其第③款相當性及正當合理關聯性之要求，更是判斷雙務契約是否合法之核心標準。本案消防局與轄內工廠締結行政契約，約定工廠捐贈救災器材以換取消防局核准其設置公共危險物品儲槽，屬互負給付義務之雙務契約；惟契約僅記載捐贈器材之項目及數量，並未約定該等器材應供特定用途使用之意旨，已違反§137Ⅰ①之要件；又所捐器材價值與該工廠獲准設置儲槽所得之經濟利益顯不相當，兩者欠缺正當合理之關聯，亦與§137Ⅰ③之相當性及關聯性要求相悖，該契約應認同時違反第①款及第③款規定。依§142④，代替行政處分之行政契約，締結之雙務契約未符合§137規定者，無效，消防局應重新協商契約內容，明訂器材專款專用意旨並調整雙方給付之相當性。\n\n結語：本件行政契約因未約定給付特定用途且雙方給付顯不相當、欠缺正當合理關聯，違反§137Ⅰ①、③規定，該契約應屬無效，雙方應重新締約以符合法定要件。"},
  {a:"§148Ⅰ、Ⅱ、§149", q:"消防局與轄區民間防災協會締結提供緊急救災物資集散場地之行政契約，雙方約定協會如未依約提供場地，消防局得逕以本契約為強制執行之執行名義，該項約定並已經消防局所屬地方自治團體行政首長之認可。契約另約定協會逾期未騰空場地時之遲延違約金計算方式，因本法就此未設規定，遂比照民法遲延給付之相關規定處理。", problem:"問：本件契約約定自願接受執行及比照民法計算違約金是否合法？", body:"依§148Ⅰ，行政契約約定自願接受執行時，債務人不為給付時，債權人得以該契約為強制執行之執行名義，此一約定使行政契約本身即取得執行名義之效力，毋須另行取得法院確定判決或行政處分，大幅簡化違約時之救濟程序；惟依§148Ⅱ，此項約定，締約之一方為地方自治團體之行政機關時，應經該地方自治團體行政首長之認可，始生效力，此一認可程序係為避免基層承辦人員任意約定自願接受執行條款而設之內部監督機制，屬該約定生效之特別要件。另就本法未規定事項，依§149，行政契約，本法未規定者，準用民法相關之規定，此為行政契約補充適用之一般原則，凡本法第三章未設明文規範之事項，均得回歸民法相關規定處理，體現公法契約仍以私法契約法理為基礎架構之立法設計。本案消防局與民間防災協會締結行政契約，約定協會未依約提供場地時，消防局得逕以本契約為強制執行之執行名義，該項約定並已經消防局所屬地方自治團體行政首長之認可，核與§148Ⅰ、Ⅱ規定完全相符，該自願接受執行條款有效；又契約約定逾期未騰空場地之遲延違約金計算方式，因本法就違約金計算方式未設規定，依§149規定比照民法遲延給付之相關規定處理，於法有據。\n\n結語：本件契約之自願接受執行約定已依§148Ⅰ、Ⅱ完成首長認可程序而有效；違約金計算方式依§149準用民法規定處理，均屬合法妥適之契約安排。"},
  {a:"§150Ⅰ、§159Ⅰ、Ⅱ②", q:"消防局依消防法之授權訂定「防火管理人講習訓練辦法」，對轄區內特定場所之管理權人統一課予接受講習之義務，並對外發生法律效果。消防局另訂定「稽查裁罰基準表」，供所屬稽查人員辦理裁罰時統一認定違規情節輕重及行使裁量權之用，該基準表並未對外直接發生法規範效力。", problem:"問：講習訓練辦法與稽查裁罰基準表之法律性質分別為何？", body:"依§150Ⅰ，法規命令，係指行政機關基於法律授權，對多數不特定人民就一般事項所作抽象之對外發生法律效果之規定，其成立要件有三：須基於法律授權、規範對象為多數不特定人民、內容須抽象並對外直接發生法律效果，凡具備此三要件者即屬法規命令，其訂定應依§151以下之預告、聽證、核定發布等法定程序為之。至於§159Ⅰ則規定，行政規則係指上級機關對下級機關，或長官對屬官，依其權限或職權為規範機關內部秩序及運作，所為非直接對外發生法規範效力之一般、抽象之規定，其中§159Ⅱ②特別列舉為協助下級機關或屬官統一解釋法令、認定事實、及行使裁量權，而訂頒之解釋性規定及裁量基準為行政規則之一種，此類基準雖形式上僅係內部規範，不用法律授權，但因實質上支配公務員之裁量方向，對外僅生間接效力，而非直接對外發生法規範效力，此與法規命令直接對外發生效力有本質區別。本案消防局依消防法之授權訂定「防火管理人講習訓練辦法」，對轄區內特定場所之管理權人統一課予接受講習之義務並對外直接發生法律效果，核符§150Ⅰ要件，屬法規命令；另訂定之「稽查裁罰基準表」，供所屬稽查人員統一認定違規情節輕重及行使裁量權之用，並未對外直接發生法規範效力，核符§159Ⅰ、Ⅱ②要件，屬行政規則中之裁量基準。\n\n結語：「防火管理人講習訓練辦法」依§150Ⅰ屬法規命令，應依法定程序訂定發布；「稽查裁罰基準表」依§159Ⅰ、Ⅱ②屬行政規則之裁量基準，僅生內部拘束力。"},
  {a:"§152Ⅰ、Ⅱ", q:"某消防設備商業同業公會以書面敘明訂定目的、依據及理由，並檢附相關資料，向消防主管機關提議訂定「防火材料認證作業辦法」。", problem:"問：該同業公會之提議程序是否符合法規命令提議之法定要件？", body:"依§152Ⅰ，法規命令之訂定，除由行政機關自行草擬者外，並得由人民或團體提議為之，此一規定賦予人民及團體參與法規命令訂定程序之主動權，體現行政程序法保障人民程序參與、落實行政民主化之立法精神，不再侷限於機關單方發動訂定程序之傳統模式；此處所稱團體，解釋上應包括依法設立之公會、協會等非法人團體或社團法人，其得為提議之主體並不以自然人為限。依§152Ⅱ，該項提議，應以書面敘明法規命令訂定之目的、依據及理由，並附具相關資料，此為提議之法定方式要件，須具備四項要素：書面形式、訂定目的、訂定依據、訂定理由，並應檢附相關佐證資料，以利受理機關判斷是否確有訂定之必要，若提議之形式或內容有所欠缺，受理機關得依§153②、③以理由不足或無須訂定為由通知提議者，而非逕予受理研擬。本案某消防設備商業同業公會以書面敘明訂定目的、依據及理由，並檢附相關資料，向消防主管機關提議訂定「防火材料認證作業辦法」，其提議之形式及內容均已完整具備，核與§152Ⅰ、Ⅱ規定相符，屬合法有效之提議，消防主管機關受理後，應依§153規定之四種處理方式分別處理，其中如認確有訂定必要者，即應著手研擬草案。\n\n結語：該同業公會之提議程序已完整符合§152Ⅰ、Ⅱ規定，消防主管機關應依§153規定妥為處理，如認有訂定必要，即應著手研擬「防火材料認證作業辦法」草案。"},
  {a:"§157Ⅰ", q:"消防局訂定之「公共危險物品場所管理辦法」草案，依法應經其上級機關內政部核定後始得發布，惟消防局於報請內政部核定前，即逕行將該辦法刊登政府公報對外發布。", problem:"問：消防局未經核定即逕行發布該辦法是否合法？", body:"依§157Ⅰ，法規命令依法應經上級機關核定者，應於核定後始得發布，此為法規命令發布程序之強制性規定，其規範意旨在於，部分法規命令因涉及重大政策事項或跨機關權責，法律或法規特別要求須經上級機關審核把關，以確保其內容合法妥適並符合上級政策方向，機關於報請核定並經核定前，尚不具備對外發布之權限，此一核定程序性質上屬於法規命令生效前之必要前置程序，與§157Ⅲ所定法規命令之發布應刊登政府公報或新聞紙之公示要件係屬先後銜接之不同程序階段，須先完成核定，始得進行發布之後續程序。本案消防局訂定之「公共危險物品場所管理辦法」草案，依法應經其上級機關內政部核定後始得發布，此一核定前置程序既為法定要件，消防局即負有於報請並取得內政部核定後始得發布之義務；惟消防局於報請內政部核定前，即逕行將該辦法刊登政府公報對外發布，其發布行為顯然欠缺§157Ⅰ所要求之核定程序，核屬違反法規命令發布之法定程序，依§158Ⅰ③，法規命令之訂定依法應經其他機關核准而未經核准者，無效，本案該辦法之訂定依法應經內政部核定而未經核定即逕行發布，核屬§158Ⅰ③所定無效事由，該辦法應屬無效，不生法規範效力。\n\n結語：消防局未經內政部核定即逕行發布該辦法，違反§157Ⅰ核定前置程序，依§158Ⅰ③該辦法應屬無效，消防局應重新報請核定後始得對外發布。"},
  {a:"§161", q:"消防署訂定之「滅火器材採購作業要點」業已依法下達所屬各地方消防局。某地方消防局承辦人B以該要點僅供內部參考、並無法律授權為由，拒絕依該要點辦理採購作業。", problem:"問：承辦人B得否以無法律授權為由拒絕依該要點辦理採購？", body:"依§159Ⅰ，行政規則係指上級機關對下級機關，或長官對屬官，依其權限或職權為規範機關內部秩序及運作，所為非直接對外發生法規範效力之一般、抽象之規定，其訂定本不須法律授權，機關本於組織權限或職權即得自行訂定，此與法規命令須基於法律授權之要件截然不同，承辦人B若以「並無法律授權」為由質疑該要點之效力，顯係誤將行政規則與法規命令之要件混為一談。而依§161，有效下達之行政規則，具有拘束訂定機關、其下級機關及屬官之效力，此一規定明確劃定行政規則之拘束範圍，僅拘束訂定機關本身及其下級機關、所屬公務員，不直接拘束一般人民，但對於內部下級機關及公務員而言，該行政規則一經合法下達，即發生內部拘束力，下級機關及所屬人員負有遵循之義務，不得逕以其非屬法規命令、未經法律授權為由拒絕適用或執行。本案消防署訂定之「滅火器材採購作業要點」業已依法下達所屬各地方消防局，依§161規定，該要點對消防署之下級機關即地方消防局及其所屬人員具有拘束力，該地方消防局承辦人B身為下級機關之承辦人員，即負有依該要點辦理採購作業之義務，其以要點僅供內部參考、並無法律授權為由拒絕依該要點辦理採購，其理由顯係誤解行政規則之性質與拘束力來源，並不足採。\n\n結語：依§161規定，已合法下達之作業要點對地方消防局及承辦人B具有內部拘束力，B不得以無法律授權為由拒絕辦理，消防局應督促B確實依該要點執行採購業務。"},
  {a:"§162Ⅰ", q:"消防署認「化學品調查通報作業要點」已無繼續適用之必要，遂由原發布機關即消防署本身，依規定程序將該要點予以廢止。", problem:"問：消防署自行廢止該作業要點之程序是否合法？", body:"依§162Ⅰ，行政規則得由原發布機關廢止之，此一規定明定行政規則之廢止權限專屬於原發布機關，此與法規命令之廢止依§151Ⅱ準用訂定程序須經預告、必要時聽證、核定發布等完整程序之要求相對簡化，蓋行政規則本質上僅係機關內部規範，其訂定既不須法律授權、亦不須踐行對外預告聽證等民主參與程序，僅依§160下達或發布即可，其廢止程序自亦毋須比照法規命令之嚴格程序，僅須由原發布機關本於其訂定行政規則之相同權限逕行廢止即可，展現行政規則作為內部管理工具所具備之較高彈性與效率性。又依§162Ⅱ，行政規則之廢止，準用§160規定，亦即若該行政規則原屬§159Ⅱ②解釋性規定及裁量基準性質者，其廢止亦應由首長簽署並登載政府公報；若屬一般性內部規範，僅下達下級機關或屬官即可。本案消防署認「化學品調查通報作業要點」已無繼續適用之必要，遂由原發布機關即消防署本身，依規定程序將該要點予以廢止，其廢止主體核與§162Ⅰ「原發布機關」之要求相符，程序合法，該要點自廢止時起，即不再對消防署所屬下級機關及人員發生拘束力。\n\n結語：消防署為該作業要點之原發布機關，依§162Ⅰ自得依規定程序將其廢止，程序合法，該要點廢止後即喪失對下級機關及所屬人員之內部拘束力。"},
  {a:"§163", q:"消防局為強化轄區未來十年之災害防救能量，事前就達成該目的所需之各項方法、步驟及設施設置等，預為整體性之設計與規劃，並定名為「轄區消防安全發展中程計畫」。", problem:"問：消防局所定之中程計畫在行政程序法上之性質為何？", body:"依§163，本法所稱行政計畫，係指行政機關為將來一定期限內達成特定之目的或實現一定之構想，事前就達成該目的或實現該構想有關之方法、步驟或措施等所為之設計與規劃，其成立要件可歸納為：須具未來性、目的性、綜合性，行政計畫在行政行為體系中具有承先啟後之特殊地位，其法律性質可能因個案內容而異，或為單純之內部作業方針，或轉化為對外發生拘束力之法規範，甚或於具體實現階段轉換為個別行政處分，故行政計畫本身之法律性質，應依其實際內容及對外效果，個案判斷究屬法規命令、行政處分或另一種獨立之行為類型，不能一概而論。本案消防局為強化轄區未來十年之災害防救能量，具未來性，事前就達成該目的所需之各項方法、步驟及設施設置等，涵蓋方法步驟措施，預為整體性之設計與規劃，並定名為「轄區消防安全發展中程計畫」，其性質、內容及規劃期程均與§163所定行政計畫之定義要件完全相符，應認屬行政程序法上之行政計畫。倘該計畫涉及一定地區土地之特定利用或重大公共設施之設置，且涉及多數不同利益之人及多數不同行政機關權限者，依§164Ⅰ，其確定裁決尚應經公開及聽證程序，以周延保障利害關係人之程序參與權。\n\n結語：本件「轄區消防安全發展中程計畫」核屬§163所定之行政計畫，其後續擬訂、確定、修訂及廢棄程序，若涉及土地利用或重大設施設置且影響多數利益關係人者，應依§164辦理公開及聽證程序。"}
];

const CORRUPT = [
  {a:"貪污治罪條例§4Ⅰ①", q:"機關出納人員A利用職務上保管公款之機會，明知該筆款項應解繳國庫，竟利用製作傳票之便，將公款侵占入己，並以「暫時周轉」為由挪用近半年之久，用以清償個人信用卡卡債及房貸。", problem:"問：A之行為該當何罪？", body:"貪污治罪條例§4Ⅰ①規定：「竊取或侵占公用或公有器材、財物者」，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，法定刑度為貪污治罪條例各罪中最重者。本案A為機關出納人員，職務上持有保管應解繳國庫之公款，該公款性質上屬公有財物，A對該財物具有基於職務之合法持有關係。A明知該款項應解庫，竟利用製作傳票之便，將公款移作己用，用以清償個人信用卡卡債及房貸，其主觀上有將原基於職務合法持有之公有財物，變易持有為所有之不法所有意圖，客觀上亦已將公款排除公有財產之支配並移作私用，核與「侵占公用財物」之構成要件相符。縱A以「暫時周轉」為藉口、主觀上或有事後歸還之計畫，然侵占罪之既遂不以行為人有無歸還意思為斷，其一旦將持有物變易為所有，犯罪即屬既遂，不因事後有無返還意圖而異其認定。又A利用製作傳票之便掩飾侵占事實，倘另涉及登載不實傳票內容，可能另該當刑法§213或相關文書犯罪，應與本罪分別評價、數罪併罰。\n\n結語：A成立貪污治罪條例§4Ⅰ①侵占公用財物罪，其長達近半年之挪用行為，於量刑上亦屬情節重大之加重因素。"},
  {a:"貪污治罪條例§11Ⅰ、§4Ⅰ⑤", q:"廠商負責人A為使工程驗收矇混過關，向承辦公務員B行求交付現金50萬元，要求B故意放寬驗收標準；B明知工程確有重大瑕疵，仍依約收受賄賂並違法核准驗收通過。", problem:"問：廠商負責人A與收賄之承辦公務員B各該當何罪？", body:"依貪污治罪條例§4Ⅰ⑤，對於違背職務之行為，要求、期約或收受賄賂或其他不正利益者，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，其構成要件核心在於公務員針對違背職務之行為收受賄賂，亦即應為而不為、不應為而為，或執行不當，本案承辦公務員B明知工程確有重大瑕疵，本應依規定嚴格審核、不予驗收通過，卻仍依約收受賄賂並違法核准驗收通過，其行為屬不應為而為之違背職務型態，核與§4Ⅰ⑤構成要件相符，應論以違背職務收受賄賂罪。另依§11Ⅰ，對於第2條人員，關於違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金，本案廠商負責人A為使工程驗收矇混過關，向承辦公務員B行求交付現金50萬元，要求B故意放寬驗收標準，其行求對象係要求B為違背職務之驗收行為，核與§11Ⅰ構成要件相符，應論以違背職務行賄罪。A、B二人一收一送，行為互相對應，各自成立獨立之對向犯，不生共犯關係，應分別論罪科刑；又因本案賄款達50萬元，已逾§12情節輕微減刑門檻之新臺幣五萬元，尚無適用減刑之空間。\n\n結語：B成立貪污治罪條例§4Ⅰ⑤違背職務收受賄賂罪，處無期徒刑或十年以上有期徒刑；A成立§11Ⅰ違背職務行賄罪，二人分別論罪，不成立共犯關係。"},
  {a:"貪污治罪條例§6Ⅰ⑤", q:"收容所替代役A雖不負責查緝違禁品業務，仍利用戒護收容人之機會，將香菸以每支100元至200元、顯高於市價之價格販售予收容人B、C，藉此賺取價差合計3,000元。", problem:"問：A利用戒護收容人之機會賺取價差之行為該當何罪？", body:"依貪污治罪條例§6Ⅰ⑤，對於非主管或監督之事務，明知違背前款規定，利用職權機會或身分圖自己或其他私人不法利益，因而獲得利益者，處五年以上有期徒刑，得併科新臺幣三千萬元以下罰金，此為圖利罪之非主管圖利類型，與同條第④款主管圖利之區別在於，行為人所圖利之事務並非其本人主管或監督之業務範圍，而係利用其職權所生之機會或公務員身分為之，仍成立圖利罪，構成要件包含非主管或監督事務、明知違背法令、利用職權機會或身分、圖自己或他人不法利益、因而獲得利益。本案收容所替代役A之法定職務為戒護管理，並不負責查緝違禁品業務，其向收容人販售香菸牟利之行為並非其主管事務範圍，惟A利用其戒護收容人之機會，此即職權所生之機會，將香菸以顯高於市價之價格販售予收容人B、C，明知此舉違背相關管理規定，仍圖自己不法利益，並因而獲得價差3,000元之不法所得，核與§6Ⅰ⑤構成要件完全相符。本罪為結果犯，A確已因販售行為獲得3,000元價差之不法利益，構成要件已然既遂；又因所得金額僅3,000元，遠低於§12Ⅰ所定新臺幣五萬元之情節輕微門檻，A得依§12Ⅰ主張減輕其刑。\n\n結語：A成立貪污治罪條例§6Ⅰ⑤非主管圖利罪，因所得金額僅3,000元，情節輕微，得依§12Ⅰ減輕其刑。"},
  {a:"貪污治罪條例§17", q:"公務員A因犯貪污治罪條例圖利罪，經法院判決有期徒刑2年確定。", problem:"問：A除受宣告之有期徒刑外，是否應併宣告褫奪公權？", body:"依貪污治罪條例§17，犯本條例之罪，宣告有期徒刑以上之刑者，並宣告褫奪公權，此為褫奪公權之特別規定，褫奪公權性質上屬於刑法上之資格刑，其效果為剝奪受宣告人擔任公務員、公職候選人，以及行使選舉、罷免、創制、複決等公民權利之資格；本條與刑法第37條一般褫奪公權規定最大之不同在於，一般刑法之褫奪公權多屬法院得依犯罪情節斟酌宣告之裁量事項，而貪污治罪條例§17則明文規定為應宣告，法院對此並無裁量餘地，只要行為人所犯者為貪污治罪條例之罪，且經法院宣告有期徒刑以上之刑，即應一併宣告褫奪公權，此一強制規定之設計，正是貪污治罪條例第1條嚴懲貪污、澄清吏治立法目的之具體實踐，用以確保曾犯貪污重罪之公務員，於刑滿或緩刑期滿後，仍在一定期間內不得再任公職，避免其再度進入公部門危害廉政。本案公務員A因犯貪污治罪條例圖利罪，經法院判決有期徒刑2年確定，其所犯者屬貪污治罪條例之罪，且經宣告有期徒刑2年，已達有期徒刑以上之刑，核與§17規定之要件完全相符，法院於判決時應併予宣告褫奪公權，不得僅宣告主刑而漏未宣告此一從刑。\n\n結語：依貪污治罪條例§17規定，A經宣告有期徒刑2年確定，法院應併宣告褫奪公權，此為法定應宣告事項，法院並無裁量空間。"},
  {a:"刑法§123", q:"甲即將自偵查隊調任某分駐所所長，事先與轄內經營特種行業之業者乙約定「到任後稽查會睜一隻眼閉一隻眼」，並收受乙致贈之訂金5萬元；甲到任後果依約未依規定稽查乙之場所。", problem:"問：甲收受訂金5萬元之行為應如何論罪？", body:"依刑法§123，於未為公務員或仲裁人時，預以職務上之行為，要求、期約或收受賄賂或其他不正利益，而於為公務員或仲裁人後履行者，以公務員或仲裁人要求期約或收受賄賂或其他不正利益論，此即學理上所稱準受賄罪，其規範目的在解決身分犯行為時尚不具該職務公務員身分之時間差問題，避免行為人以收賄當下尚未取得該職務權限為由規避刑責，構成要件為行為人於收賄當時尚未具備該職務上之公務員身分或權限、預先就未來職務上之行為要求期約或收受賄賂、其後行為人果真取得該公務員職務、並依約履行先前之承諾，四要件具備即以公務員受賄論處，此與一般受賄罪最大差異僅在行為時身分未具備此一時間要素，其餘要求、期約、收受三者有一即成立等概念，仍與刑法§121、§122之解釋相通。本案甲收受乙所交付訂金5萬元時，雖已具偵查隊人員之公務員身分，惟其收賄係針對即將到任之分駐所所長職務上之稽查權限所為之預先約定，就此稽查職務而言，甲於約定當下尚未取得該職務上之權限，屬預以職務上之行為要求收受賄賂之情形；甲到任後果依約未依規定稽查乙之場所，即屬於為公務員後履行，其行為完全該當刑法§123準受賄罪之構成要件，不能以收錢當下尚非分駐所所長作為抗辯。\n\n結語：甲之行為完全該當刑法§123準受賄罪，其收賄約定發生於尚未取得稽查職務權限之時，而於到任後依約履行不予稽查，正符合本條預約、事後履行之特殊構造。"},
  {a:"貪污治罪條例§13、§6Ⅰ④", q:"機關主管C得知下屬A為圖利好友、違背招標程序將採購業務分批發包，非但未予制止或舉發，反而指示相關人員刻意隱匿採購紀錄，掩蓋A之圖利行為。", problem:"問：主管C與下屬A之行為各該當何罪？", body:"依貪污治罪條例§6Ⅰ④，對於主管或監督之事務，明知違背法律、法律授權之法規命令、職權命令、自治條例、自治規則、委辦規則或其他對多數不特定人民就一般事項所作對外發生法律效果之規定，直接或間接圖自己或其他私人不法利益，因而獲得利益者，處五年以上有期徒刑，此為圖利罪主管圖利類型，構成要件為明知違背法令、對主管或監督事務、圖自己或他人不法利益且因而獲得利益。本案下屬A為圖利好友，違背招標程序將採購業務分批發包以規避公開招標之法定義務，其行為明知違背招標相關法令，就其主管之採購事務直接圖利特定廠商並使該廠商因而獲得利益，核與§6Ⅰ④構成要件相符，應論以主管圖利罪。另依§13Ⅰ，直屬主管長官對於所屬人員，明知貪污有據，而予以庇護或不為舉發者，處一年以上七年以下有期徒刑，此為包庇罪，其適用主體限於直屬主管長官，行為態樣包括消極之不為舉發及積極之予以庇護兩種，凡符合其一即成立本罪。本案機關主管C係A之直屬主管長官，得知A圖利犯行後，非但未依規定簽報舉發，反而指示相關人員刻意隱匿採購紀錄，此已超越單純消極不舉發之程度，屬積極掩蓋證據之庇護行為，情節較單純不舉發更為嚴重，核與§13Ⅰ構成要件相符，應論以包庇罪。C、A二人所犯之罪名不同、行為互相獨立，應分別論罪。\n\n結語：A成立貪污治罪條例§6Ⅰ④主管圖利罪；C明知A貪污有據仍積極隱匿掩蓋，成立§13Ⅰ包庇罪，二人應分別論罪科刑，不因C之包庇而使A之罪責受影響。"},
  {a:"貪污治罪條例§5Ⅰ②", q:"機關保管公務車加油卡之人員A，利用職務之便，多次持公務加油卡為自用轎車加油，並於加油紀錄表上竄改車牌號碼及公里數以掩飾，合計詐得加油款3萬元。", problem:"問：A持公務加油卡為私人轎車加油並竄改紀錄之行為該當何罪？", body:"依貪污治罪條例§5Ⅰ②，利用職務上之機會，以詐術使人將本人之物或第三人之物交付者，處七年以上有期徒刑，得併科新臺幣六千萬元以下罰金，本款性質上為刑法第339條普通詐欺罪之特別規定，構成要件為公務員利用其職務上之機會，以詐術使人陷於錯誤而將本人或第三人之物交付，凡以領款、核銷等方式使機關財物名實不符而溢領者，均屬本款規範範疇，常見態樣包括冒領補助費、虛報加班費、差旅費、工資等。本案A係機關保管公務車加油卡之人員，其職務範圍限於保管及依規定用途使用該加油卡，並無為私人轎車加油之權限；A利用其保管加油卡之職務機會，多次持公務加油卡為自用轎車加油，此一行為使加油站或機關陷於錯誤而交付油品或核銷款項，核屬利用職務上之機會實施詐術；A復於加油紀錄表上竄改車牌號碼及公里數以掩飾其私用之事實，此一竄改紀錄之行為正是實施詐術、使人陷於錯誤之具體方法，二者相互結合，使機關誤信該等加油紀錄均屬公務車輛之合法加油，進而核銷撥付加油款，A因而詐得加油款合計3萬元，核與§5Ⅰ②構成要件完全相符，應論以利用職務機會詐取財物罪。又因所得金額僅3萬元，未逾§12Ⅰ所定新臺幣五萬元情節輕微門檻，A得依§12Ⅰ主張減輕其刑。\n\n結語：A成立貪污治罪條例§5Ⅰ②利用職務上機會詐取財物罪，因所得3萬元未逾五萬元情節輕微門檻，得依§12Ⅰ減輕其刑。"},
  {a:"貪污治罪條例§6Ⅰ④", q:"某機關承辦人A負責辦理臨時汽車停車證業務，明知該年度採購需求總額逾15萬元、依政府採購相關法令應辦理公開招標，為避免曝光採購資訊、使好友經營之印刷廠得以承攬業務，故意以分批小額採購方式規避招標程序。", problem:"問：A之行為該當何罪？", body:"貪污治罪條例§6Ⅰ④規定：「對於主管或監督之事務，明知違背法律、法律授權之法規命令、職權命令、自治條例、自治規則、委辦規則或其他對多數不特定人民就一般事項所作對外發生法律效果之規定，直接或間接圖自己或其他私人不法利益，因而獲得利益者」，處五年以上有期徒刑，此即實務上常稱之「圖利罪」。本案A為停車證採購業務之承辦人，該採購案之發包方式屬其主管事務；A明知採購需求總額逾15萬元，依政府採購相關法令應辦理公開招標，仍故意以分批小額採購方式規避招標程序，核屬明知違背政府採購法令之行為；其動機在使好友經營之印刷廠得以規避競爭順利承攬業務，屬間接圖利特定私人不法利益之情形，且該印刷廠嗣後確因規避招標程序而獲得承攬機會，已具體發生「因而獲得利益」之結果，四項要件均已該當。又本罪之成立不以A自身直接獲得財產上利益為必要，其圖利對象包含「其他私人」，A雖未自印刷廠處直接獲取對價，仍無礙於圖利罪之成立；倘查有A自印刷廠處另受有對價給付，則應另論以貪污治罪條例收賄相關罪責，數罪併罰。\n\n結語：A成立貪污治罪條例§6Ⅰ④圖利罪，其分批規避招標之手段亦可能同時違反政府採購法相關規定，應併予審酌。"},
  {a:"刑法§129Ⅰ", q:"稅務人員A明知某商家依法規定應予免徵之稅捐項目，仍故意向其徵收該項稅款。", problem:"問：A明知不應徵收仍予徵收之行為該當何罪？", body:"依刑法§129Ⅰ，公務員對於租稅或其他入款，明知不應徵收而徵收者，處一年以上七年以下有期徒刑，得併科二十一萬元以下罰金，此為違法徵收罪，其構成要件核心在於公務員對於租稅或其他入款明知不應徵收卻仍執意徵收，行為人主觀上須具備明知之直接故意，若僅係對法規解釋有所誤解或單純疏忽而誤徵，因欠缺明知要件，充其量僅生行政責任，不構成本罪。本罪與貪污治罪條例§5Ⅰ①意圖得利、擅提或截留公款或違背法令收募稅捐或公債之區別在於，本罪為刑法上之基礎規定，若行為人另具意圖得利之主觀要件，即應優先適用貪污治罪條例之特別規定，刑度更重；反之，若行為人僅係單純違法徵收，將稅款依法解繳國庫、自己並未從中獲取任何利益者，則應論以刑度較輕之刑法§129Ⅰ。本案稅務人員A明知某商家依法規定應予免徵之稅捐項目，仍故意向其徵收該項稅款，其主觀上具備明知不應徵收之直接故意，客觀上亦確有徵收行為，核與§129Ⅰ構成要件相符；依題示情節，並未見A有何意圖得利、將徵起稅款挪為己用或圖利自己或他人之情事，堪認A單純僅為使稅捐稽徵績效數字好看而違法徵收，並無§5Ⅰ①意圖得利之主觀要件，應逕依刑法§129Ⅰ論處。又依§129Ⅲ，本項之未遂犯亦罰之，若A僅已著手徵收而尚未實際收取稅款，仍應論以未遂犯。\n\n結語：A之行為該當刑法§129Ⅰ違法徵收罪，因查無意圖得利之情事，不適用貪污治罪條例§5Ⅰ①之加重規定，應逕依刑法本條論處其刑責。"},
  {a:"貪污治罪條例§6-1", q:"公務員A因涉犯圖利罪遭檢察官偵辦，偵查期間發現A及其配偶、未成年子女於A涉嫌犯罪後3年內，財產大幅增加且與其合法薪資收入顯不相當，經檢察官命其就來源可疑財產提出說明，A前後供述反覆且無法提出合理說明。", problem:"問：A就其財產來源說明反覆之情形應如何論罪？", body:"依貪污治罪條例§6-1Ⅰ，公務員犯本條所列各款罪嫌之一，範圍包括第四條至前條之罪，以及刑法第121條等瀆職罪家族之罪，檢察官於偵查中，發現公務員本人及其配偶、未成年子女自公務員涉嫌犯罪時及其後三年內，有財產增加與收入顯不相當時，得命本人就來源可疑之財產提出說明，無正當理由未為說明、無法提出合理說明或說明不實者，處五年以下有期徒刑、拘役或科或併科不明來源財產額度以下之罰金，此即財產來源不明罪，其規範特色在於舉證責任轉換，一般刑事訴訟採無罪推定、由檢方負舉證責任，本罪則改由被告本人證明財產來源合法，此係因應貪瀆案件金流隱匿、鑑識困難之現實所設之特殊機制，說明義務並限於涉嫌犯罪時及其後三年內財產異常增加之部分，且僅限於檢察官偵查中始得命本人說明。本案公務員A因涉犯圖利罪遭檢察官偵辦，偵查期間發現A及其配偶、未成年子女於A涉嫌犯罪後3年內，財產大幅增加且與其合法薪資收入顯不相當，此核屬§6-1Ⅰ所定財產增加與收入顯不相當之情形，檢察官依法命A就來源可疑財產提出說明，A前後供述反覆且無法提出合理說明，核屬無法提出合理說明之要件，應論以財產來源不明罪。本罪與前置之圖利罪係屬各自獨立之罪名，縱使圖利罪部分事證尚待補強而未能起訴，僅憑本罪之獨立構成要件已足使A受刑事追訴。\n\n結語：A就其異常增加財產無法提出合理說明，該當貪污治罪條例§6-1財產來源不明罪，此罪與前置圖利罪各自獨立，縱圖利罪未能證明，仍得單獨依本罪定罪科刑。"},
  {a:"刑法§121Ⅰ", q:"某非屬貪污治罪條例特別要件範圍之公務員A，於辦理一般行政作業之職務上行為過程中，收受相對人贈與之財物作為對價，惟其職務行為本身並未違法。", problem:"問：A收受財物作為對價之行為該當何罪？", body:"依刑法§121Ⅰ，公務員或仲裁人對於職務上之行為，要求、期約或收受賄賂或其他不正利益者，處七年以下有期徒刑，得併科七十萬元以下罰金，此為刑法上不違背職務受賄罪之基礎規定，其構成要件核心在於公務員針對自己本來就應為之職務上行為收受對價，與貪污治罪條例§5Ⅰ③規範內容相同、僅刑度較輕，二者屬普通法與特別法之關係。就要求、期約、收受三種行為態樣而言，三者有一即成立，不問係公務員主動索求或被動收受、於職務執行前或後受領，均屬本罪規範範圍；賄賂與不正利益之區別則在於前者限於金錢或可用金錢計算之財物，後者則泛指一切足以滿足人之慾望之有形或無形利益，範圍更廣。實務上，公務員收賄之行為若同時該當貪污治罪條例相關規定者，基於特別法優於普通法原則，通常優先適用貪污治罪條例，刑法§121多作為理解受賄罪構成要件之基礎規定，或於行為人欠缺貪污治罪條例所定特別身分要件時方單獨適用。本案A雖具公務員身分，惟依題示其不屬貪污治罪條例特別要件範圍之公務員，於辦理一般行政作業之職務上行為過程中，收受相對人贈與之財物作為對價，而其職務行為本身並未違法、未放水，核屬對於職務上之行為收受對價之典型態樣，因A不具備適用貪污治罪條例之特別身分要件，僅得逕依刑法§121Ⅰ論以不違背職務受賄罪。\n\n結語：A之行為該當刑法§121Ⅰ不違背職務受賄罪，因其不具貪污治罪條例特別身分要件而無從優先適用該條例，應逕依刑法本條論處其刑責。"},
  {a:"貪污治罪條例§11Ⅲ", q:"某台商A為使其在大陸地區之投資案順利通過當地審批，向對岸負責審核之公務員B交付人民幣現金，要求其加速核准流程。", problem:"問：台商A交付現金予大陸公務員之行為是否成立行賄罪？", body:"依貪污治罪條例§11Ⅲ，對於外國、大陸地區、香港或澳門之公務員，就跨區貿易、投資或其他商業活動有關事項，為前二項行為者，依前二項規定處斷，此一規定係為因應國際及兩岸經貿往來日益頻繁、貪腐風險跨境化之現實，並回應國際反貪腐公約之要求所增訂，將行賄罪之規範對象擴及大陸地區、港澳及外國公務員，避免行為人以對方非我國公務員為由規避刑責，惟其適用範圍限於跨區貿易、投資或其他商業活動有關事項，非漫無限制及於一切事項。本案台商A為使其在大陸地區之投資案順利通過當地審批，此核屬跨區投資有關事項，向對岸負責審核之公務員B交付人民幣現金，要求其加速核准流程，此一行求交付賄賂之目的僅在使B加速原本依法應為之核准程序，而非要求B違法核准原不應通過之投資案，性質上應歸類為不違背職務之行賄行為，依§11Ⅲ準用§11Ⅱ規定，處三年以下有期徒刑、拘役或科或併科新臺幣五十萬元以下罰金。倘A係要求B違法核准原依規定不應通過之投資案，則應改依§11Ⅲ準用§11Ⅰ違背職務行賄之規定處斷，刑度較重，二者之區辨關鍵仍在於受賄之對岸公務員所為之職務行為是否違背其法定職務內容。又依§11Ⅵ，在中華民國領域外犯本罪者，不問犯罪地法律有無處罰規定，均依本條例處罰，此一域外效力規定使A縱於大陸地區行賄，仍應依我國法律受追訴處罰。\n\n結語：A交付現金予大陸公務員B加速核准投資案，因屬不違背職務之對價，應依貪污治罪條例§11Ⅲ準用§11Ⅱ論以行賄罪，且依§11Ⅵ域外效力規定不因犯罪地在境外而免責。"},
  {a:"貪污治罪條例§8", q:"公務員A因涉嫌收賄案件遭檢察官約談，於偵查中主動坦承收賄犯行，並自動繳交全部所得財物。", problem:"問：A之自白行為在法律上有何效果？", body:"貪污治罪條例§8規定自首與偵查中自白兩種減刑機制：第1項「犯第四條至第六條之罪，於犯罪後自首，如有所得並自動繳交全部所得財物者，減輕或免除其刑；因而查獲其他正犯或共犯者，免除其刑」；第2項「犯第四條至第六條之罪，在偵查中自白，如有所得並自動繳交全部所得財物者，減輕其刑；因而查獲其他正犯或共犯者，減輕或免除其刑」。本案A所涉收賄行為，如係違背職務收受賄賂，應論以貪污治罪條例§4Ⅰ⑤（或視具體情節論以其他相應條款）；A係於檢察官約談、案件已進入偵查程序後，始主動坦承犯行並自動繳交全部所得財物，其自白之時點係「偵查中」，而非「犯罪後、案件尚未經任何機關發覺前」，故應適用§8Ⅱ偵查中自白之規定，而非§8Ⅰ之自首規定，二者法律效果有別，不容混淆。又倘A之犯行同時涉及貪污治罪條例§11之行賄相對人，A之自白內容如因而查獲該行賄之廠商，依§8Ⅱ後段，尚得因查獲其他正犯或共犯而獲更有利之減輕或免除其刑待遇，此為鼓勵配合偵查之立法設計。\n\n結語：A之行為該當§8Ⅱ偵查中自白之要件，得依法減輕其刑；倘因而查獲其他正犯或共犯，尚得再減輕或免除其刑。"},
  {a:"貪污治罪條例§16", q:"A與他人因商業糾紛提告，因不滿承辦檢察官D的辦案方式，明知D並未收受任何對價，卻具狀誣指D涉犯貪污治罪條例違背職務收受賄賂罪。", problem:"問：A具狀誣指檢察官D涉貪之行為該當何罪？", body:"依貪污治罪條例§16Ⅰ，誣告他人犯本條例之罪者，依刑法規定加重其刑至二分之一，此為誣告罪之加重規定，其構成要件建立於刑法誣告罪之基礎上，須行為人明知所訴事實為虛偽，仍向該管公務員申告，意圖使他人受刑事或懲戒處分，且誣指之內容係指摘他人涉犯貪污治罪條例之罪者，即應在刑法誣告罪之基礎法定刑之上，依本條加重其刑至二分之一，此一加重規定之立法目的在於，貪污治罪條例之罪責及社會觀感均較一般刑事犯罪嚴重，一旦遭誣指涉貪，被誣告人所受名譽及職務上之損害往往更為深重，故特別加重誣告者之刑責，以遏止藉誣指貪污手段報復或攻訐他人之歪風；又依§16Ⅲ，縱誣告者本身不具公務員身分，一樣適用本條加重規定，不因誣告者自己是否具公務員身分而有差別待遇。本案A與他人因商業糾紛提告，因不滿承辦檢察官D的辦案方式，明知D並未收受任何對價，即明知所訴事實為虛偽，卻具狀向偵辦機關誣指D涉犯貪污治罪條例違背職務收受賄賂罪，意圖使D受刑事訴追，其主觀上具備誣告之故意，客觀上並有具狀申告之行為，且誣指之罪名核屬貪污治罪條例之罪，核與§16Ⅰ構成要件完全相符，應論以誣告罪並依本條加重其刑至二分之一。\n\n結語：A明知檢察官D未收賄仍具狀誣指其涉犯貪污治罪條例收賄罪，該當貪污治罪條例§16Ⅰ誣告罪，應依刑法誣告罪規定加重其刑至二分之一論處。"},
  {a:"刑法§132Ⅰ", q:"甲機關承辦人A明知工程採購案之底價屬應秘密之消息，因與投標廠商B私交甚好，為使B順利備標，於開標前故意將底價洩漏給B。", problem:"問：A之行為該當何罪？", body:"刑法§132Ⅰ規定：「公務員洩漏或交付關於中華民國國防以外應秘密之文書、圖畫、消息或物品者，處三年以下有期徒刑。」本罪保護法益為國家事務之保密義務，凡依法令或性質應秘密之消息，經公務員洩漏，即該當本罪，不限於國防機密。本案A為機關工程採購案之承辦人，屬公務員；依政府採購相關規定，招標底價於開標前屬應嚴格保密之消息，任何人不得於開標前洩漏，A因職務關係知悉該底價，屬其職務上持有之應秘密消息。A明知底價應秘密，僅因與投標廠商B私交甚好，即基於使B順利備標之動機，故意於開標前將底價洩漏予B，使B得以此為據調整投標策略、提高得標機率，核屬故意洩漏應秘密消息之行為；因A係出於故意而非疏失，應適用§132Ⅰ而非過失犯之§132Ⅱ，且A本身即為公務員，亦非§132Ⅲ所定非公務員洩漏之情形。又倘查得A另有收受B所交付之對價，則A除成立§132Ⅰ洩密罪外，尚應併論貪污治罪條例§4Ⅰ③工程收回扣罪或相應收賄條款，二罪犯罪時點及構成要件各自獨立，應予分論併罰，非單一行為之想像競合。\n\n結語：A成立刑法§132Ⅰ公務員洩漏應秘密消息罪；倘A事後另收受B交付之對價，應併論貪污治罪條例相關收賄罪責，數罪併罰。"},
  {a:"貪污治罪條例§4Ⅰ③", q:"工程監造人員A於某公共工程施作期間，向得標廠商暗示如欲順利驗收通過，須按工程款2成比例交付回扣，廠商配合後合計交付200萬元，A於驗收時亦刻意放寬鋼筋數量與強度標準，未依圖說確實查核。", problem:"問：監造人員A收取工程回扣並放寬查核標準之行為該當何罪？", body:"依貪污治罪條例§4Ⅰ③，建築或經辦公用工程或購辦公用器材、物品，浮報價額、數量、收取回扣或有其他舞弊情事者，處無期徒刑或十年以上有期徒刑，得併科新臺幣一億元以下罰金，本款之構成要件為行為人須係經辦公用工程或購辦公用器材物品之公務員，且有浮報價額數量、收取回扣或其他舞弊情事之一，其規範重點在於保護公共工程與採購事務之廉潔性及國家財產之完整，收取回扣係指利用經辦職務之機會，向廠商索取原契約價金之一定比例作為對價，屬本款最典型之舞弊態樣。本案A身為公共工程之監造人員，職司監督工程施作品質及辦理驗收之職務，其向得標廠商暗示如欲順利驗收通過，須按工程款2成比例交付回扣，廠商配合後合計交付200萬元，此一收取回扣之行為核屬經辦公用工程收取回扣之典型態樣，已完全該當§4Ⅰ③構成要件；A復於驗收時刻意放寬鋼筋數量與強度標準，未依圖說確實查核，此一放水行為與收受回扣之對價目的緊密結合，屬同一收賄舞弊事實之延伸，應與收取回扣之行為合併評價於同一罪名之下，不應割裂論以另一獨立罪名。本案工程款金額龐大、回扣達200萬元，情節重大，顯無§12Ⅰ情節輕微減刑五萬元門檻之適用餘地，且因涉及公共工程結構安全，後續尚應由主管機關依法追究其民事賠償及行政責任。\n\n結語：A收取工程回扣並放寬驗收查核標準之行為，該當貪污治罪條例§4Ⅰ③經辦公用工程收取回扣罪，處無期徒刑或十年以上有期徒刑，得併科鉅額罰金。"},
  {a:"貪污治罪條例§6-1、§6Ⅰ④", q:"消防設備採購案承辦人A明知某廠商投標文件之保證金繳納方式不符招標規定、應屬不合格標，仍違法逕行認定為合格標，使該廠商順利得標並獲得承攬利益180萬元。案經檢察官偵辦圖利罪期間，另發現A及其配偶於涉嫌犯罪後3年內財產增加合計220萬元，與其合法薪資收入顯不相當，經檢察官命A就來源可疑財產提出說明，A仍無法提出合理說明。", problem:"問：A違法認定合格標使廠商獲利及財產說明不實情形應如何論罪？", body:"依貪污治罪條例§6Ⅰ④，對於主管或監督之事務，明知違背法律、法律授權之法規命令、職權命令、自治條例、自治規則、委辦規則或其他對多數不特定人民就一般事項所作對外發生法律效果之規定，直接或間接圖自己或其他私人不法利益，因而獲得利益者，處五年以上有期徒刑，本案A為消防設備採購案承辦人，明知該廠商投標文件之保證金繳納方式不符招標規定、應屬不合格標，此即明知違背採購法令，仍逕行認定為合格標，使該廠商順利得標並獲得承攬利益180萬元，核與明知違背法令、圖利特定廠商、因而獲得利益之構成要件完全相符，應論以主管圖利罪。另依§6-1Ⅰ，公務員犯本條所列各款罪嫌含§6Ⅰ④圖利罪之一，檢察官於偵查中，發現公務員本人及其配偶、未成年子女自公務員涉嫌犯罪時及其後三年內，有財產增加與收入顯不相當時，得命本人就來源可疑之財產提出說明，無正當理由未為說明、無法提出合理說明或說明不實者，另成立財產來源不明罪，此一規定與前置之圖利罪各自獨立、互不隸屬，縱前置圖利罪部分事證尚待補強，仍無礙本罪之單獨成立。本案A及其配偶於涉嫌犯罪後3年內財產增加合計220萬元，與其合法薪資收入顯不相當，經檢察官命其就來源可疑財產提出說明，A仍無法提出合理說明，核屬無法提出合理說明之情形，應另論以§6-1財產來源不明罪，二罪應依刑法數罪併罰之規定分論併罰。\n\n結語：A違法認定合格標使廠商獲利，應論以貪污治罪條例§6Ⅰ④主管圖利罪；其另有鉅額財產來源不明且無法合理說明，應另論以§6-1財產來源不明罪，二罪分論併罰。"},
  {a:"貪污治罪條例§12", q:"消防小隊長甲於執行複查業務時，收受業者致贈之紅包3萬6千元，因情節輕微且金額低於新臺幣5萬元。", problem:"問：甲得否主張減刑事由？", body:"本案甲收受業者紅包3萬6千元，其行為態樣應先論以貪污治罪條例相應本罪，若甲對業者複查事項有主管或監督權責且違背相關規定而使業者獲利，應論以§6Ⅰ④圖利罪；若屬單純對於職務上行為收受對價，則論以相應之收賄條款。貪污治罪條例§12Ⅰ規定：「犯第四條至第六條之罪，情節輕微，而其所得或所圖得財物或不正利益在新臺幣五萬元以下者，減輕其刑」，此為情節輕微之獨立減刑事由。本案甲收受金額為3萬6千元，未逾新臺幣5萬元之法定門檻，且題示情節輕微，核與§12Ⅰ之要件相符，得主張減輕其刑；倘甲另於偵查中自白並繳回全部所得財物，依§8Ⅱ尚得再減輕其刑，兩項減刑事由之性質及要件各自獨立，得併同主張、重複減輕，並非互相排斥、僅能擇一適用之關係。又本題所涉「消防小隊長甲於執行複查業務時收受紅包」之情節，倘經查甲之複查結果並無故意放水或違法核准情事，其行為態樣亦可能僅論以較輕之§5Ⅰ③對於職務上行為收賄罪，而非§6Ⅰ④圖利罪，應視複查結果是否確有違法放水而定，二者法律效果並不相同。\n\n結語：甲得依§12Ⅰ主張情節輕微減輕其刑，如另符合§8Ⅱ偵查中自白之要件，並得與之併同適用，二次遞減其刑。"},
  {a:"貪污治罪條例§10", q:"公務員A經檢察官命其證明名下異常增加之財產來源合法，A雖未能被依財產來源不明罪起訴，惟亦無法提出合理說明證明該筆財產來源合法。", problem:"問：A無法證明來源合法之財產應如何處理？", body:"依貪污治罪條例§10，犯第四條至第六條之罪，本人及其配偶、未成年子女自犯罪時及其後三年內取得之來源可疑財產，經檢察官或法院於偵查、審判程序中命本人證明來源合法而未能證明者，視為其犯罪所得，此一規定與§6-1財產來源不明罪雖同樣處理財產來源說不清楚之情形，惟二者性質截然不同：§6-1係獨立之刑罰規定，處罰無法說明此一行為本身，須經起訴、審判並符合罪刑法定原則之各項證據法則始能定罪；而§10則屬沒收替代機制，其效果僅係將無法證明來源合法之可疑財產視為犯罪所得，據以依法追徵沒收，並不生另立罪名科刑之效果，二者可謂一把刀用於定罪、一把刀用於沒收，縱使其中一項要件未能成立，仍可能單獨適用另一項規定，二者不以同時成立為必要。本案公務員A經檢察官命其證明名下異常增加之財產來源合法，A雖未能被依財產來源不明罪起訴，可能因證據未達起訴門檻或其他程序原因，惟其亦無法提出合理說明證明該筆財產來源合法，此一情形核與§10命本人證明來源合法而未能證明之要件相符，該筆財產應依§10規定視為A之犯罪所得，檢察官或法院得依法對該財產予以追徵沒收，不以A另受財產來源不明罪之刑事追訴或有罪判決為前提。\n\n結語：A雖未受財產來源不明罪起訴，惟其無法證明來源合法之財產，依貪污治罪條例§10規定仍應視為犯罪所得，得由檢察官或法院依法予以追徵沒收。"},
  {a:"刑法§122Ⅰ", q:"某公務員A對於應依法審核駁回之申請案，向申請人要求給付對價，作為將案件違法核准之交換條件。", problem:"問：A向申請人要求對價以換取違法核准之行為該當何罪？", body:"依刑法§122Ⅰ，公務員或仲裁人對於違背職務之行為，要求、期約或收受賄賂或其他不正利益者，處三年以上十年以下有期徒刑，得併科二百萬元以下罰金，此為違背職務受賄罪之刑法基礎規定，其構成要件為公務員對於違背職務之行為，即應為而不為、不應為而為或執行不當之行為，向他人要求、期約或收受賄賂或不正利益，三種行為態樣中，要求係指公務員向對方表示索賄之意，不問明示或暗示、亦不問對方是否允諾，公務員一經表示要求，本罪即屬既遂，不以嗣後果真收受賄賂或果真違背職務為必要，此與§122Ⅱ因而為違背職務之行為須進一步論以加重結果之情形有別。本案A對於應依法審核駁回之申請案，此即其職務上應為駁回之羈束處分，向申請人要求給付對價，作為將案件違法核准之交換條件，其要求對價之內容係以違背應予駁回之法定義務、違法核准案件為對價目的，核屬對於違背職務之行為要求賄賂，已完全該當§122Ⅰ之構成要件，於A提出要求之時即屬既遂，不待申請人是否允諾給付、亦不待A是否果真違法核准。倘A同時具備貪污治罪條例第2條所定公務員身分，因該行為亦該當貪污治罪條例§4Ⅰ⑤違背職務要求賄賂之構成要件，實務上應優先適用貪污治罪條例，惟依本題所問聚焦於刑法§122Ⅰ本身之構成要件解析，先予敘明。\n\n結語：A向申請人要求對價作為違法核准之交換條件，於要求之時即該當刑法§122Ⅰ違背職務受賄罪而屬既遂，不以嗣後果真收受賄賂或違法核准為必要。"},
  {a:"貪污治罪條例§4Ⅰ②", q:"機關主管A對於轄內某承包商長期心存不滿，利用其核准請款之職務上權勢，明示若不「表示心意」，將刻意刁難該廠商後續之驗收及請款作業，並暗示可能影響其未來投標資格，承包商因心生畏懼交付現金15萬元。", problem:"問：A之行為該當何罪？", body:"貪污治罪條例§4Ⅰ②規定：「藉勢或藉端勒索、勒徵、強占或強募財物者」，處無期徒刑或十年以上有期徒刑。本案A身為機關主管，掌有核准承包商請款之職務上權勢地位，明知承包商有求於己、對其後續驗收請款作業具有相當依賴性，竟利用該職務上之優勢地位，以刻意刁難驗收及請款作業、暗示可能影響未來投標資格等不利後果相要脅，向承包商暗示須「表示心意」，使承包商因心生畏懼而被迫交付現金15萬元，核屬利用職務上之權勢地位，以要脅手段使人交付財物之行為，構成要件核心在其「藉勢藉端」之手段，與單純之對於違背職務行為要求、期約或收受賄賂（§4Ⅰ⑤）著重於雙方合意交換不同，本罪更強調行為人一方之要脅、強暴脅迫色彩，法律評價上更為嚴重。又倘承包商係出於自願行賄之意，而非因A之要脅心生畏懼，則該金錢交付性質上應轉為承包商行賄A之對價關係，此時應另論承包商是否成立貪污治罪條例§11行賄罪責，二者評價截然不同，端視承包商交付財物之主觀意思係出於畏懼抑或期約對價。\n\n結語：A成立貪污治罪條例§4Ⅰ②藉勢勒索罪，承包商交付財物出於畏懼而非自願行賄，不構成行賄罪之共犯。"},
  {a:"貪污治罪條例§8、§6Ⅰ⑤", q:"收容所替代役A因利用戒護機會轉賣香菸予收容人遭檢舉，於偵查中主動坦承犯行，並自動繳交全部所得價差款項。", problem:"問：A於偵查中坦承並繳回所得對其罪責有何影響？", body:"依貪污治罪條例§6Ⅰ⑤，對於非主管或監督之事務，明知違背前款規定，利用職權機會或身分圖自己或其他私人不法利益，因而獲得利益者，處五年以上有期徒刑，收容所替代役A利用戒護收容人之機會轉賣香菸牟利，其行為已如前述該當本款非主管圖利罪之構成要件。就其犯後態度部分，依貪污治罪條例§8Ⅱ，犯第四條至第六條之罪，在偵查中自白，如有所得並自動繳交全部所得財物者，減輕其刑；因而查獲其他正犯或共犯者，減輕或免除其刑，此為偵查中自白之減刑規定，其要件為須於偵查程序中自白犯行、且須自動繳交全部所得財物，二者缺一不可，僅有自白而未繳回所得者，貪污治罪條例本身並無另予減刑之規定；此與§8Ⅰ自首案發前主動坦承之效果減輕或免除其刑相比，偵查中自白案發後始坦承之減刑效果較輕，僅單純減輕其刑，二者一字之差、位階有別，須特別留意其起算時點不同：自首須於犯罪未經有偵查權機關發覺前為之，自白則發生於案件已進入偵查程序之後。本案A因遭檢舉而東窗事發，其後於偵查中主動坦承犯行並自動繳交全部所得價差款項，其時點已在案件被檢舉、進入偵查程序之後，核屬§8Ⅱ偵查中自白而非案發前自首之情形，應依§8Ⅱ規定減輕其刑，減輕幅度依刑法§66原則上減至二分之一。\n\n結語：A之圖利罪成立貪污治罪條例§6Ⅰ⑤，因其於偵查中自白並自動繳交全部所得，依§8Ⅱ規定應減輕其刑，惟因非案發前自首，不生免除其刑之效果。"},
  {a:"貪污治罪條例§5Ⅰ①", q:"稅務執行人員A將已代收之滯納稅款截留，未依規定於期限內解繳國庫，反將該筆款項存入其個人證券帳戶，用以買賣股票生息，長達數月始被察覺。", problem:"問：A截留稅款供己買賣股票生息之行為該當何罪？", body:"依貪污治罪條例§5Ⅰ①，意圖得利，擅提或截留公款或違背法令收募稅捐或公債者，處七年以上有期徒刑，得併科新臺幣六千萬元以下罰金，本款所稱截留，係指以非法方法截取抑留應行解繳之公款，使該筆公款未依法定程序解繳入庫，構成要件為行為人須有意圖得利之主觀要件，客觀上並有擅提或截留公款、或違背法令收募稅捐公債之行為，其中意圖得利不以行為人自己終局取得該筆公款為必要，凡意圖利用該筆公款獲取利息、投資收益等資金運用上之利益，即已具備本款之主觀要件。本案A為稅務執行人員，其職務為代收滯納稅款並依規定期限解繳國庫，此為其法定之解繳義務；A將已代收之滯納稅款截留，未依規定於期限內解繳國庫，此一行為核屬截留應行解繳之公款；A復將該筆款項存入其個人證券帳戶，用以買賣股票生息，其主觀上顯具意圖利用該筆公款從事股票投資以獲取利益之意圖，核與§5Ⅰ①意圖得利要件相符，二者結合，A之行為完全該當本款構成要件，應論以擅提截留公款罪。又本案截留期間長達數月始被察覺，情節非輕，A嗣後如將該筆款項全數解繳，僅屬犯後態度，不影響犯罪之既遂認定，惟得作為自首或自白減刑之審酌事由。\n\n結語：A截留代收之滯納稅款並供己買賣股票生息，該當貪污治罪條例§5Ⅰ①擅提截留公款罪，處七年以上有期徒刑，得併科鉅額罰金。"},
  {a:"刑法§132Ⅱ", q:"甲機關承辦人A明知工程採購案之底價屬應秘密之消息，因僅係不慎將底價文件遺留在影印機旁而被投標廠商B看見，並非故意洩漏。", problem:"問：A不慎遺留底價文件致廠商看見之行為該當何罪？", body:"依刑法§132Ⅰ，公務員洩漏或交付關於中華民國國防以外應秘密之文書、圖畫、消息或物品者，處三年以下有期徒刑，此為故意洩密罪之規定，須行為人主觀上具備洩漏之故意；惟§132Ⅱ另設過失犯之處罰規定，因過失犯前項之罪者，處一年以下有期徒刑、拘役或九千元以下罰金，此為刑法瀆職罪章少數處罰過失犯之條文，其構成要件為公務員雖非故意洩漏應秘密之文書消息，惟依其情節應注意並能注意而不注意，致該應秘密之消息外洩，即應論以過失洩密罪，刑度顯較故意犯為輕，此一過失處罰之特別設計，係考量公務機密之維護具高度公益重要性，縱行為人非出於故意，仍有以刑罰督促公務員善盡保密注意義務之必要。本案甲機關承辦人A明知工程採購案之底價屬應秘密之消息，其對於底價應予保密乙事已有認識，惟A僅係不慎將底價文件遺留在影印機旁而被投標廠商B看見，並非出於故意洩漏之主觀犯意，其行為性質核屬應注意能注意而不注意之過失，該應秘密之底價消息因此外洩予投標廠商B知悉，核與§132Ⅱ過失洩密罪之構成要件相符。應注意者，若洩漏底價者非A本人而係其他因職務或業務知悉底價之非公務員，因§132Ⅲ僅處罰非公務員之故意洩密行為、未設對應之過失處罰規定，該非公務員縱屬過失洩漏，亦不成立本條之罪，此為本題應併予辨明之對照情形。\n\n結語：A因過失、非故意遺留底價文件致廠商B看見，該當刑法§132Ⅱ過失洩密罪，其刑度遠較同條第1項故意犯為輕。"},
  {a:"貪污治罪條例§7、§4Ⅰ⑤", q:"檢察官A偵辦某貪污案件時，收受被告親屬交付之現金50萬元，於偵結時故意為對被告有利之不起訴處分。", problem:"問：檢察官A收賄並為有利被告不起訴處分之行為該當何罪？", body:"依貪污治罪條例§4Ⅰ⑤，對於違背職務之行為，要求、期約或收受賄賂或其他不正利益者，處無期徒刑或十年以上有期徒刑，本案檢察官A偵辦貪污案件，其法定職務本應本於事證獨立公正偵結，卻收受被告親屬交付之現金50萬元，並於偵結時故意為對被告有利之不起訴處分，此一應予起訴卻故意為不起訴處分之行為，核屬不應為而為之違背職務型態，與收受賄賂之對價關係明確，已完全該當§4Ⅰ⑤違背職務收受賄賂罪之構成要件。另依§7，有調查、追訴或審判職務之人員，犯第四條第一項第五款或第五條第一項第三款之罪者，加重其刑至二分之一，此為司法人員收賄之加重規定，其適用範圍並非及於貪污治罪條例所有罪名，而係限縮於前開兩款收賄罪，蓋立法者認為，負責調查、追訴或審判職務之司法人員，本應是防止貪腐犯罪之最後防線，若反而利用職務收賄放水，其可責性顯較一般公務員更高，故特別加重其刑。本案檢察官A身為偵辦本案之檢察官，具有追訴職務之人員身分，其所犯者又核屬§4Ⅰ⑤違背職務收受賄賂罪，核與§7所定加重要件完全相符，應於§4Ⅰ⑤法定刑之基礎上，再依§7規定加重其刑至二分之一，較一般公務員犯同一罪名之刑度更重。\n\n結語：檢察官A收賄並為有利被告之違法不起訴處分，成立貪污治罪條例§4Ⅰ⑤違背職務收受賄賂罪，並因具追訴職務人員身分，依§7規定應加重其刑至二分之一。"},
  {a:"貪污治罪條例§14、§4Ⅰ③", q:"政風人員A於執行政風查核業務時，發現工程監造人員B向廠商收取回扣之具體事證，惟A因與B私交甚篤，隱匿不予舉發。", problem:"問：政風人員A明知B涉貪卻隱匿不報之行為該當何罪？", body:"依貪污治罪條例§4Ⅰ③，建築或經辦公用工程或購辦公用器材、物品，浮報價額、數量、收取回扣或有其他舞弊情事者，處無期徒刑或十年以上有期徒刑，本案工程監造人員B向廠商收取回扣，其行為核屬本款所定經辦公用工程收取回扣之典型舞弊態樣，B應論以本罪。另依§14，辦理監察、會計、審計、犯罪調查、督察、政風人員，因執行職務，明知貪污有據之人員，不為舉發者，處一年以上七年以下有期徒刑，此為特定身分人員之不為舉發罪，其適用主體限於監察、會計、審計、犯罪調查、督察、政風六類人員，一般人事人員或其他未列舉之人員不在此限，構成要件為行為人須具備前開特定身分、因執行職務知悉他人貪污有據之事實、且消極不予舉發，此為身分犯，課予此類負有廉政稽核職責之人員積極舉發之法定義務。本案政風人員A於執行政風查核業務時，發現工程監造人員B向廠商收取回扣之具體事證，A之身分核屬§14所列舉之政風人員，且係因執行職務而知悉B涉犯貪污有據之事實，主觀上已具備明知要件；惟A因與B私交甚篤，選擇隱匿不予舉發，核屬消極不作為之不為舉發，與§14構成要件完全相符，應論以本罪。A、B二人所犯罪名各自不同、行為分別獨立，A之不為舉發並不影響B本身圖利舞弊罪責之成立，二人應分別論罪科刑。\n\n結語：B成立貪污治罪條例§4Ⅰ③經辦公用工程收取回扣罪；A身為政風人員明知而不為舉發，另成立§14不為舉發罪，二人應分別論罪。"},
  {a:"貪污治罪條例§6Ⅰ①", q:"承辦人員A明知應發給員工之加班費業已核定完畢，竟意圖從中得利，故意以「經費尚未撥入」為由拖延數月不予撥發，實則將該筆款項暫時挪為己用，事後始補發。", problem:"問：A故意拖延撥發加班費並挪為己用之行為該當何罪？", body:"依貪污治罪條例§6Ⅰ①，意圖得利，抑留不發職務上應發之財物者，處五年以上有期徒刑，得併科新臺幣三千萬元以下罰金，本款構成要件為行為人須有意圖得利之主觀要件，客觀上並有抑留不發職務上應發財物之行為，此與刑法§129Ⅱ抑留剋扣罪之基礎規定最大差異，即在於本款須具備意圖得利之主觀要素，若行為人單純因怠惰疏失而拖延未發、查無藉此得利之具體事證者，僅論以刑法§129Ⅱ即為已足，不適用本款之加重規定，此一區辨為本類考題最核心之判斷關鍵。本案承辦人員A明知應發給員工之加班費業已核定完畢，本應依規定如期撥發，惟A竟意圖從中得利，故意以經費尚未撥入為由拖延數月不予撥發，此一拖延行為核屬抑留職務上應發之財物，而A實則將該筆款項暫時挪為己用，此正足以證明其主觀上確有意圖得利之犯意，並非單純之怠惰遲延，核與§6Ⅰ①意圖得利及抑留不發二構成要件均完全相符，應論以本款之罪。A雖事後始補發該筆款項，惟此僅屬犯後填補損害之事實，並不影響其行為於挪用之時已然既遂之認定，至多得作為量刑或自首自白減刑之審酌因素，不生阻卻犯罪成立之效果。\n\n結語：A意圖得利而故意拖延撥發加班費並暫時挪為己用，該當貪污治罪條例§6Ⅰ①抑留不發應發財物罪，處五年以上有期徒刑，事後補發不影響其既遂之認定。"},
  {a:"刑法§129Ⅱ", q:"機關承辦人A明知應發給員工之加班費已核定，卻無正當理由拖延數月不予發放，惟查無其藉此得利之具體事證。", problem:"問：A無正當理由拖延發放加班費之行為應如何論罪？", body:"依刑法§129Ⅱ，公務員對於職務上發給之款項物品，明知應發給而抑留不發或剋扣者，亦同即與同條第1項相同刑度，處一年以上七年以下有期徒刑，得併科二十一萬元以下罰金，此為抑留剋扣罪，其構成要件為公務員明知應發給之款項物品，卻抑留不發或打折發給，行為人主觀上僅須具備明知應發給仍不發之故意即足，不以另具意圖得利之主觀要件為必要，此為本罪與貪污治罪條例§6Ⅰ①之關鍵區辨所在，若行為人另具意圖得利之主觀要件，即應優先適用貪污治罪條例§6Ⅰ①之加重規定，五年以上，若查無意圖得利之具體事證，則單獨適用刑法本項規定，一年以上七年以下，二者法定刑差距甚鉅，於個案判斷時應審慎查核有無藉此得利之積極事證，不能僅因拖延發放即逕論以貪污治罪條例之重罪。本案機關承辦人A明知應發給員工之加班費已核定，本應依規定如期撥發，卻無正當理由拖延數月不予發放，其主觀上已具備明知應發給仍抑留不發之故意，客觀上亦有抑留不發之行為，核與§129Ⅱ構成要件相符；惟依題示情節，查無A藉此拖延發放而從中得利之具體事證，故不具備貪污治罪條例§6Ⅰ①意圖得利之加重主觀要件，應逕依刑法§129Ⅱ論處，不適用貪污治罪條例之加重規定。又依§129Ⅲ，本項之未遂犯亦罰之，附此敘明。\n\n結語：A明知應發加班費而無正當理由抑留不發，惟查無藉此得利之事證，應逕依刑法§129Ⅱ抑留不發罪論處，不適用貪污治罪條例§6Ⅰ①之加重規定。"},
