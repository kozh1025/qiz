<script>
const ADMIN = [
  {a:"§9", q:"消防局裁罰某工廠「未依規定進行消防安全設備複查」，承辦人僅以工廠逾期未申報之系統紀錄作為裁罰依據；工廠負責人提出當月台電線路施工導致廠區停電、系統無法連線申報之台電施工公告及維修紀錄佐證，惟承辦人員以「申報逾期為客觀事實」為由，未予調查即逕行裁處最高額罰鍰。", problem:"問：消防局未經調查逕行裁處最高額罰鍰，是否適法？", body:"依§9，行政機關就該管行政程序，應於當事人有利及不利之情形，一律注意；依§36，行政機關應依職權調查證據之必要方法，不受當事人主張之拘束，且對當事人有利及不利事項一律注意，兩者均為認定事實應遵循之基本原則。本案工廠負責人已提出台電施工公告及維修紀錄，客觀上足以佐證系統無法連線申報係因不可歸責於己之外部因素所致，屬對其有利之重要事證。承辦人員僅以「申報逾期為客觀事實」為由，未依職權查核上開佐證資料之真實性，逕行不予調查、逕依最不利之最高額罰鍰裁處，顯僅片面斟酌不利事項，未依§9規定一併注意有利情形，其事實認定亦未符合§43依論理及經驗法則判斷真偽之要求；又未區分個案情節輕重逕採法定最高額裁罰，亦有裁量怠惰、違反比例原則之虞。正確作法應係依職權查證台電公告真偽及停電期間是否確實涵蓋申報期限，再依查證結果衡酌是否構成不可歸責事由，並依情節輕重為適當之裁量。此外，倘經查證確認台電施工公告及維修紀錄屬實，該不可歸責事由亦可能構成機關行使裁量權時應予考量之因素，得依個案情節主張減輕裁罰，而非逕以最不利之最高額處斷。\n\n結語：消防局未盡職權調查義務、未斟酌有利事證逕行裁罰，於程序及裁量行使均有瑕疵，該處分應屬違法，工廠得提起訴願及行政訴訟請求撤銷。"},
  {a:"§33Ⅲ", q:"阿強向消防局申請某承辦員迴避，消防局審查後認定阿強所述純屬臆測、並無具體事證，予以駁回。阿強不服該駁回決定，遲至決定送達後第20日，始向上級機關提請覆決。", problem:"問：阿強逾20日始提請覆決，其救濟是否合法？", body:"依§33Ⅰ②，當事人得以「有具體事實，足認執行職務有偏頗之虞」為由申請迴避；依§33Ⅲ，不服行政機關之駁回決定者，得於5日內提請上級機關覆決，受理機關除有正當理由外，應於10日內為適當之處置；依§33Ⅳ，被申請迴避之公務員於准駁決定前，原則上應停止行政程序。本案阿強所提之迴避申請，經消防局審查後認定其所述純屬臆測、並無具體事證，核與§33Ⅰ②之要件未合，該駁回決定於實體上尚屬有據。惟阿強不服駁回決定，遲至決定送達後第20日始提請覆決，已逾§33Ⅲ所定5日之法定救濟期間；題示並無郵遞遲誤、天災等不可歸責於阿強之正當事由足以阻卻逾期之效果，此5日期間性質上為法定不變期間，逾期即生失權效果，並非得由上級機關依職權另行斟酌延展。縱認消防局對於是否仍有偏頗事由，本可依職權另行斟酌處理，惟此屬機關依職權自行審酌之範疇，與阿強逾期提請覆決之法律效果係屬二事，不能以機關嗣後仍得依職權處理為由，補正阿強逾期救濟之瑕疵。\n\n結語：阿強提請覆決已逾§33Ⅲ所定5日期限，其覆決之申請於程序上不合法，上級機關應為不受理之處置，原駁回決定即告確定。"},
  {a:"§135", q:"消防局為強化轄區防救災量能，與民間救護車公司簽訂契約，約定由消防局提供部分經費補助及無線電設備，救護車公司則負有於轄區發生重大災害時接受消防局指揮調度出勤之義務，雙方就此公法上權利義務關係，以書面契約明定之。", problem:"問：消防局與救護車公司間之書面契約，是否為合法之行政契約？", body:"依§135，公法上法律關係得以契約設定、變更或消滅之，但依其性質或法規規定不得締約者，不在此限；此條為行政契約合法性之基礎規範，也是行政機關得以合意方式取代單方處分處理公法事務的依據。本案消防局與民間救護車公司間之約定，一方由消防局提供經費補助及無線電設備，他方救護車公司則負有於轄區發生重大災害時接受消防局指揮調度出勤之義務，此等指揮調度出勤義務涉及災害防救公權力之運作，並非單純之私法承攬或買賣關係，性質上核屬公法上權利義務關係，依§135原則上得以契約設定之。又觀諸災害防救指揮調度事項，其性質尚非專屬機關高權、不得由契約置換之事項，亦查無其他法規明文禁止締約之情形，故雙方合意以契約方式明定權利義務，於法尚無不合。雙方並已以書面契約明定內容，形式要式性亦無疑義。惟仍應注意，此類契約性質上屬雙方互負給付義務之型態，其給付內容仍應維持相當性並具正當合理關聯，避免流於機關以補助換取業者過度負擔而生不當聯結之疑慮，惟依現有事實觀之，尚無顯失均衡情形。\n\n結語：消防局與救護車公司間之書面契約標的為公法上權利義務關係，依§135屬合法有效之行政契約。"},
  {a:"§92Ⅱ", q:"消防局於某工廠火警搶救現場，對於現場圍觀之不特定民眾以擴音器公告「本管制區域即日起禁止進入，違者依法處罰」，該公告之相對人雖非特定個人，惟依「進入管制區域者」之特徵可得確定其範圍，並對外直接發生禁止進入之法律效果。", problem:"問：消防局此項擴音公告之法律性質為何？", body:"依§92Ⅰ，行政處分係指行政機關就公法上具體事件所為之決定或其他公權力措施，而對外直接發生法律效果之單方行政行為，須具備行政機關行為、公法行為、單方行為、具體事件、對外直接發生法律效果五要素，缺一即非行政處分而可能僅屬觀念通知或行政指導。本案消防局以擴音器公告禁止進入管制區域，係就火警搶救此一具體公法事件所為之公權力措施，具備前述機關行為、公法行為、單方行為、具體事件四要素；其相對人雖非特定個人，惟依「進入管制區域者」之特徵已可得確定其範圍，並直接對外發生禁止進入、違者依法處罰之法律效果，並非單純之勸導或警示，核與§92Ⅱ前段「相對人雖非特定，而依一般性特徵可得確定其範圍」之一般處分要件相符。至若消防局僅係以口頭勸導方式提醒民眾注意安全、未表明違反將受處罰之法律效果，則性質上僅屬行政指導，尚非行政處分，此為本案與單純勸導性質行為之關鍵區辨所在。\n\n結語：本件擴音公告屬對人之一般處分，依§92Ⅱ準用行政處分之相關規定，於公告時即對外發生法律效果，違反者得依法處罰，相對人如有不服，得依訴願及行政訴訟程序尋求救濟。"},
  {a:"§15Ⅰ、Ⅲ", q:"某市政府未經任何法規授權，直接以「內部行政規則」將原屬其本身之違規裁罰權限，下放給所屬消防局及各消防大隊，由各大隊自行以自己名義開單裁罰，亦未將委任事項及法規依據公告或刊登政府公報。阿明收到某消防大隊開立之裁處書後提出質疑。", problem:"問：某市政府以內部行政規則下放裁罰權限予消防局及各大隊之作法，是否合法？", body:"依§15Ⅰ，行政機關得依法規將其權限之一部分，委任所屬下級機關執行之；依§15Ⅲ，委任情形應將委任事項及法規依據公告之，並刊登政府公報或新聞紙。本案某市政府欲將其違規裁罰權限下放予所屬消防局及各消防大隊，屬機關對下級機關之權限移轉，性質上為委任，依§15Ⅰ本應「依法規」為之，亦即須有法律或法規命令等外部法規範作為授權依據，而非機關自行以內部行政規則逕予處理即可完成；蓋內部行政規則僅拘束機關內部下級機關與屬官，不具對外發生法律效果之效力，無從變更法定管轄權之歸屬。本案市政府未經任何法規授權，逕以內部行政規則下放裁罰權限，已與§15Ⅰ「依法規」之要件不符。此外，縱令有適法之委任依據，依§15Ⅲ仍應將委任事項及法規依據公告並刊登政府公報或新聞紙，本案市政府亦未踐行此項公告義務，程序上同有欠缺。又委任與委託性質有別，委任限於有隸屬關係之下級機關，本案雖僅屬委任而非委託，仍應遵守相同之依法規及公告要件，二者程序保障要求並無二致。從而各消防大隊本於欠缺合法依據之委任而自行以自己名義開單裁罰，其管轄權基礎即屬有疑，阿明自得對此提出質疑。\n\n結語：市政府未依法規委任亦未公告，各大隊裁處書欠缺合法管轄權基礎，於法不合。"},
  {a:"§168、§46Ⅱ①", q:"阿明發現鄰居場所疑似違規堆置易燃物，向消防局陳情請求查處，消防局派員查察後認定屬實並已裁罰。阿明其後基於後續民事求償需要，向消防局申請閱覽該案調查卷宗，消防局僅提供部分現場照片，就承辦人員內部研擬之簽稿部分予以拒絕。", problem:"問：阿明陳情查處及嗣後申請閱覽卷宗遭部分拒絕之處理，是否合法？", body:"依§168，人民對於行政興革之建議、行政法令之查詢、行政違失之舉發或行政上權益之維護，得向主管機關陳情；阿明發現鄰居場所疑似違規堆置易燃物，向消防局陳情請求查處，核屬行政違失之舉發，其陳情門檻甚低，不以具有法律上利害關係為必要，消防局受理並派員查察後裁罰，程序並無不合。其後阿明基於後續民事求償需要申請閱覽該案調查卷宗，此時應轉依§46判斷：依§46Ⅰ，當事人或利害關係人得向行政機關申請閱覽有關資料或卷宗，惟以主張或維護其法律上利益有必要者為限，阿明因該場所違規行為擬提起民事求償，具有主張法律上利益之必要，原則上得申請閱覽。惟依§46Ⅱ①，行政決定前之擬稿或其他準備作業文件，機關得拒絕提供，本案承辦人員內部研擬之簽稿，性質上屬裁罰決定作成前之內部準備作業文件，核與該款要件相符，消防局得拒絕提供；至於已提供之現場照片，則屬事實認定之客觀證據，非屬準備作業文件，本應准許閱覽。又閱覽卷宗之保護範圍應以必要為度，機關拒絕提供時僅得就內部研擬簽稿部分予以遮掩，不得以此為由概括拒絕閱覽全部卷證，否則反有違保障人民程序參與權之立法本旨。\n\n結語：消防局受理陳情合於§168，拒絕提供內部簽稿部分則合於§46Ⅱ①之例外，處理並無違誤。"},
  {a:"§111①、§117", q:"消防局同一年度對甲、乙兩工廠分別開立裁處書：對甲工廠之裁處書完全未記載作成機關名稱；對乙工廠之裁處書則因承辦人員援引法條錯誤，屬得撤銷之違法瑕疵，惟乙工廠並無信賴不值得保護之情事。", problem:"問：甲、乙兩工廠之裁處書，法律效力分別為何？", body:"依§111①，行政處分不能由書面處分中得知處分機關者，無效；此為無效事由中最典型之類型，因處分機關為何攸關人民辨識其救濟對象及管轄機關之基礎資訊，一旦完全欠缺，即屬重大明顯瑕疵。本案對甲工廠之裁處書完全未記載作成機關名稱，核與§111①要件相符，該處分應屬自始、當然、確定不生效力之無效處分，不因日後任何補正行為而治癒。至於對乙工廠之裁處書，因承辦人員援引法條錯誤，此屬程序內容之瑕疵，尚未達重大明顯之程度，性質上為得撤銷之違法處分，應依§117判斷：違法行政處分於法定救濟期間經過後，原處分機關得依職權撤銷之，但受益人有§117但書第2款所稱無第119條所列信賴不值得保護之情形，而信賴利益顯然大於撤銷所欲維護之公益者，不得撤銷。本案乙工廠既無信賴不值得保護之情事，若其信賴利益顯然大於撤銷所欲維護之公益，消防局即不得依職權撤銷該裁處書，僅能任其存續。至若日後查明乙工廠受益人確有信賴不值得保護之情形，例如明知法條援引錯誤或因重大過失而不知，消防局仍得依§117本文於法定救濟期間經過後撤銷該裁處書，兩者判斷結果並非一成不變。\n\n結語：甲工廠裁處書因欠缺處分機關記載而無效，乙工廠裁處書則屬得撤銷之違法處分，惟視信賴利益權衡結果，未必得撤銷。"},
  {a:"§5", q:"消防局對甲君之工廠開立限期改善通知單，通知單上僅記載「請將廠內不安全之處全數改善完畢，並比照法規要求辦理」，未具體指明應改善之項目、地點或內容為何。甲君詳閱後仍無法確認究竟應更換滅火器、改善逃生動線，抑或修繕警報系統，遂向消防局申請釋疑，惟承辦人員僅重申前開文字，未進一步說明。", problem:"問：消防局所發之限期改善通知單，是否違反行政行為明確性原則？", body:"依§5，行政行為之內容應明確，此即明確性原則，其規範意旨在於使人民得以由行政行為之內容預見其法律效果，進而決定其因應之道，不論行政處分、法規命令或行政契約，內容均應使受規範對象能夠清楚理解機關要求為何。本案消防局對甲君工廠所開立之限期改善通知單，僅泛稱請將廠內不安全之處全數改善完畢並比照法規要求辦理，並未具體指明應改善之項目、地點或內容，致甲君無從確認究竟應更換滅火器、改善逃生動線抑或修繕警報系統，客觀上已使受處分人陷於無所適從之狀態，顯與§5要求內容明確之意旨相悖。尤有甚者，甲君於困惑之際主動向消防局申請釋疑，承辦人員猶僅重申前開空泛文字而未進一步具體說明，益證原通知單之記載確有不明確之瑕疵，且機關未把握補正機會使內容明確化。此外，明確性原則之落實與後續執行及救濟之可能性密切相關，內容欠明確者，人民難以判斷是否已履行義務，亦難據以尋求救濟。倘消防局嗣後仍堅持沿用空泛用語而拒絕具體說明，甲君除得請求機關重為明確之處分外，亦得於後續執行或救濟程序中主張其無從遵循，機關就此應承擔相應之不利益。\n\n結語：本件限期改善通知單內容過於空泛抽象，違反§5明確性原則，於法有間。"},
  {a:"§22Ⅱ", q:"16歲之小明未經父母同意，自行前往消防局申請核發其住家之消防安全檢查合格證明，並於申請書上自行簽名，承辦人員發現小明尚未成年，依規定告知應由其法定代理人代為辦理該項申請。", problem:"問：消防局要求由小明之法定代理人代為申請，是否於法有據？", body:"依§22Ⅰ，行政程序行為能力原則上以依民法規定有行為能力之自然人為限；依§22Ⅱ，無行政程序行為能力者，應由其法定代理人代為行政程序行為。此項規定與民法行為能力制度相呼應，旨在保護未成年人或無行為能力人，避免其獨立為具有法律效果之程序行為而承受不利益。本案小明年僅16歲，依民法規定尚未成年，除有特別規定之例外情形外，原則上不具完全行為能力，於行政程序上自亦不具完全之行政程序行為能力，其自行前往消防局申請核發住家消防安全檢查合格證明，並於申請書上自行簽名，即屬未具行政程序行為能力之人獨立為程序行為之情形。消防局承辦人員發現小明尚未成年，依§22Ⅱ告知應由其法定代理人代為辦理該項申請，核屬正確適用法律之處理方式，非屬刁難或拒絕受理，而係要求由適格之人重新提出申請，以確保申請行為之法律效力無虞，避免嗣後衍生申請人資格不適格之爭議。又依§22Ⅲ，外國人依其本國法律雖無行政程序行為能力，惟依我國法律有行為能力者，仍視為有行政程序行為能力，此為涉外案件行為能力認定之特別規定，與本案未成年人情形雖屬不同層面，然均展現本條兼顧程序安定與當事人實質保護之精神。\n\n結語：消防局要求由小明之法定代理人代為申請，係正確適用§22Ⅱ之結果，於法有據。"},
  {a:"§123③、§127Ⅰ", q:"消防局核准甲君之危險物品儲放場所設立許可，並附加「三年內不得變更為其他用途，否則應繳回全額補助款」之負擔。甲君其後一年即將場所變更為其他營業用途，消防局依法廢止原許可，並要求甲君返還已受領之補助款項。", problem:"問：消防局廢止許可並請求返還補助款之處分，是否合法？", body:"依§123③，授予利益之合法行政處分，附負擔者，受益人未履行該負擔時，原處分機關得依職權為全部或一部之廢止。本案消防局核准甲君危險物品儲放場所設立許可，並附加三年內不得變更為其他用途、否則應繳回全額補助款之負擔，此屬對甲君課予特定不作為義務之負擔約款；甲君於核准後一年即將場所變更為其他營業用途，顯已違反前開負擔內容，消防局自得依§123③依職權廢止原許可，於法有據。至於補助款之返還，應依§127Ⅰ判斷：授予利益之行政處分，其內容係提供一次或連續之金錢給付者，經撤銷、廢止而有溯及既往失效之情形時，受益人應返還因該處分所受領之給付。本案許可係因甲君未履行負擔而遭廢止，其效果應溯及既往失其效力，甲君先前已受領之補助款即失所附麗，消防局依§127Ⅰ請求返還，於法有據；惟依§127Ⅲ，機關請求返還時仍應以書面行政處分確認返還範圍並限期命其返還，非可逕予強制執行。又縱使甲君嗣後主張其變更用途係出於不可歸責之事由，仍不影響負擔未履行之客觀事實，蓋負擔之履行與否本以客觀結果為判斷標準，不因受益人主觀是否可歸責而異其效果。\n\n結語：消防局廢止許可合於§123③，請求返還補助款則應依§127Ⅰ及相關程序踐行，結論上尚屬合法。"},
  {a:"§154Ⅰ", q:"消防署擬訂新版《各類場所消防安全設備設置標準》，承辦人員認為僅屬技術性規範調整，遂逕行簽請長官核定後即予發布施行，未先於政府公報或新聞紙公告草案內容，亦未開放外界於一定期間內陳述意見，且非屬情況急迫顯然無法事先公告周知之情形。", problem:"問：消防署逕行發布該設置標準之程序是否合法？", body:"依§150Ⅰ、Ⅱ，法規命令係指行政機關基於法律授權，對多數不特定人民就一般事項所作抽象之對外發生法律效果之規定，其內容應明列法律授權依據，並不得逾越授權範圍；《各類場所消防安全設備設置標準》對外規範不特定場所所有人應遵循之設備設置義務，性質上屬法規命令，而非僅具內部效力之行政規則。依§154Ⅰ，行政機關擬訂法規命令時，除情況急迫顯然無法事先公告周知者外，應於政府公報或新聞紙公告草案，並給予任何人於一定期間內陳述意見之機會，此為法規命令之「預告制度」，係民主參與原則之具體落實。本案承辦人員逕以「僅屬技術性規範調整」為由，未經公告及徵詢意見程序即逕行簽請核定發布施行，且題示並無情況急迫、顯然無法事先公告周知之例外事由，其判斷標準亦非機關得逕行自行認定免除預告義務之正當理由。縱該設置標準之實質內容確屬單純技術性調整、未增加人民新義務，仍不影響其須踐行預告程序之判斷，蓋預告制度之要求繫諸法規命令之形式定性，而非個案內容之實質影響程度。\n\n結語：消防署未依§154Ⅰ踐行預告及陳述意見程序，逕行發布之法規命令於制定程序上違法，應予補正預告程序後重新發布。"},
  {a:"§111①③", q:"消防局核發之裁處書上完全未記載作成處分之機關名稱及首長署名，且其主旨要求受處分人「應於一日內將廠內一百噸危險化學物質全數銷毀完畢」，客觀上顯然不能實現。", problem:"問：本件裁處書之效力如何？", body:"依§111①，行政處分不能由書面處分中得知處分機關者，無效；依§111③，內容對任何人均屬不能實現者，亦屬無效。此二款均為列舉之無效事由，性質上均屬重大明顯瑕疵，處分自始、當然、確定不生效力，不因期間經過或未經爭訟而治癒或補正。本案消防局核發之裁處書完全未記載作成處分之機關名稱及首長署名，人民無從得知係何機關作成本處分，亦無從確認救濟之受理機關，核與§111①要件相符，應屬無效。此外，該裁處書主旨要求受處分人應於一日內將廠內一百噸危險化學物質全數銷毀完畢，衡諸危險化學物質之銷毀作業涉及專業處理程序、安全管制及相當時間，客觀上顯非任何人於一日內所能完成，此非僅對甲君個人不能實現，而係對任何理性之受處分人均屬不能實現，核與§111③內容對任何人均屬不能實現之要件亦屬相符，同構成無效事由。兩款事由縱僅具備其一，即足使處分無效，本案同時具備兩款，無效之結論更為明確。又本件縱使機關嗣後於訴願程序中欲以補正方式治癒上開瑕疵，因無效事由本非得依補正治癒之範疇，補正僅適用於違反程序或方式規定而未達無效程度之處分，本件已無適用餘地。\n\n結語：本件裁處書同時具備§111①、③之無效事由，應屬自始、當然、確定不生效力之無效處分。"},
  {a:"§10", q:"某法規就特定違規行為授權機關得裁處新臺幣1萬元至10萬元罰鍰，消防局承辦人員因與當事人先前有陳情糾紛、素有嫌隙，未依個案情節輕重及一般裁量基準衡酌，逕行裁處15萬元，已逾法規所定裁量上限。", problem:"問：承辦人員逕行裁處15萬元罰鍰之決定，是否合法？", body:"依§10，行政機關行使裁量權，不得逾越法定之裁量範圍，並應符合法規授權之目的；裁量瑕疵可分為裁量逾越、裁量濫用及裁量怠惰三種類型，其中裁量逾越係指裁量結果超出法規明定之上下限範圍，裁量濫用則指雖未逾越範圍，惟其裁量係基於與授權目的無關之考量因素或違反一般法律原則而為。本案法規就特定違規行為授權機關得裁處新臺幣1萬元至10萬元罰鍰，此為法定裁量框架之上下限，承辦人員逕行裁處15萬元，已客觀超出法規所定裁量上限，構成典型之裁量逾越，違反§10前段之規定。尤有甚者，承辦人員裁處之動機並非本於違規情節輕重之衡酌，而係因與當事人先前有陳情糾紛、素有嫌隙，將與立法目的無關之個人恩怨納入裁量考量，此更屬裁量濫用之情形，違反§10後段符合法規授權目的之要求，裁量處分縱有裁量空間，仍非機關恣意行使公權力之藉口，更非發洩私人情緒之工具。又縱使承辦人員主張其係基於維護公益或嚇阻效果始為較重之裁處，此等說明仍非法規授權目的所涵蓋之考量因素，無從解免裁量濫用之評價，機關仍應於裁量權限內依個案情節輕重妥為衡酌。\n\n結語：承辦人員逕行裁處15萬元，既逾越法定裁量上限復摻雜與授權目的無關之因素，違反§10，該裁處為違法之裁量處分。"},
  {a:"§74Ⅰ", q:"甲君因工作關係出國一個月，郵務人員多次前往其住所均未獲會晤本人，亦查無同居人、受僱人可代為收領，遂將裁處書寄存於當地警察機關，並將送達通知書一份黏貼於甲君住居所門首，另一份置於信箱。", problem:"問：郵務人員以寄存送達方式完成之送達，是否合法？", body:"依§74Ⅰ，送達不能依補充送達或留置送達等前二條規定為之者，得將文書寄存送達地之地方自治或警察機關，並作送達通知書兩份，一份黏貼於應受送達人住居所、事務所、營業所或其就業處所門首，另一份交由鄰居轉交或置於該送達處所信箱或其他適當位置，以為送達。此即寄存送達之要件與操作方式，性質上屬於通常送達方式窮盡而不能為之後之補充手段。本案甲君因出國一個月，郵務人員多次前往其住所均未獲會晤本人，亦查無同居人、受僱人可代為收領，已符合不能依補充送達方式送達之前提；郵務人員遂將裁處書寄存於當地警察機關，並將送達通知書一份黏貼於甲君住居所門首，另一份置於信箱，其寄存機關為警察機關、通知書一份黏貼門首、另一份置於信箱之處理方式，均與§74Ⅰ所定要件相符。應注意者，寄存文書之寄存機關依§74Ⅲ應保存三個月，逾期未領取者，仍不影響送達已生效力之結果，僅涉及甲君能否實際領取文書而已，不影響送達合法性之判斷。又寄存送達與公示送達不同，前者係應受送達人處所已知但一時無法會晤，後者則係處所根本不明，兩者要件及生效方式均有差異，本案甲君住所明確、僅一時不在，核屬前者而非後者之適用範疇。\n\n結語：本件寄存送達之作業方式核與§74Ⅰ要件相符，送達合法有效。"},
  {a:"§15、§19Ⅳ②", q:"消防局將轄內某類小型場所之消防安全檢查裁罰權限，依法規委任所屬分隊辦理，並依規定公告委任事項及法規依據；同一時期，消防局另就一起跨機關之化學品鑑定案件，行文請求環保局提供人力協助，環保局評估後認為抽調人力將嚴重影響其本職稽查工作，遂予拒絕。", problem:"問：消防局委任分隊辦理裁罰及環保局拒絕提供人力協助，是否均屬合法？", body:"依§15，行政機關得依法規將其權限之一部分，委任所屬下級機關執行之，並應將委任事項及法規依據公告之，並刊登政府公報或新聞紙。本案消防局將轄內某類小型場所之消防安全檢查裁罰權限，依法規委任所屬分隊辦理，並依規定公告委任事項及法規依據，其委任對象為所屬下級機關，委任依據及公告程序均已踐行，核與§15要件完全相符，屬合法之委任。另就化學品鑑定案件請求環保局提供人力協助部分，應依§19Ⅳ②判斷：被請求機關於如提供協助將嚴重妨害其自身職務之執行者，應拒絕之，此為法定應拒絕事由，而非單純裁量拒絕。本案環保局評估後認為抽調人力將嚴重影響其本職稽查工作，核與§19Ⅳ②所定要件相符，環保局依法本應拒絕，其拒絕行為非但不違法，反係履行法定義務之表現；消防局如對此有異議，僅得循共同上級機關決定之途徑處理，不得逕行指摘環保局違法。又環保局作成拒絕決定後，仍應將其認無提供協助義務之理由通知消防局，程序上不得逕予沉默不理，此為職務協助制度中維護請求機關程序知悉權之配套設計。\n\n結語：消防局委任分隊辦理裁罰合於§15，環保局依§19Ⅳ②拒絕提供人力協助亦屬依法行政，均無違誤。"},
  {a:"§101Ⅰ", q:"消防局對阿明工廠開立裁處書，內容記載裁罰金額為新臺幣3萬元，惟因承辦人員繕打疏失，將阿明身分證統一編號末碼「8」誤植為「3」。阿明發現後，主張此為足以影響其身分同一性之重大瑕疵，該處分應屬無效。", problem:"問：裁處書因誤植身分證統一編號末碼之瑕疵，是否使該處分無效？", body:"依§101Ⅰ，行政處分如有誤寫、誤算或其他類此之顯然錯誤者，處分機關得隨時或依申請更正之。此制度係針對處分內容顯然錯誤但非涉及實質內容爭議之情形所設，性質上僅屬技術性瑕疵之治癒機制，不須循撤銷或廢止程序即得逕行更正，亦不影響處分之效力存續。本案消防局對阿明工廠開立之裁處書，內容記載裁罰金額為新臺幣3萬元，此為處分之核心實質內容，並無錯誤；僅因承辦人員繕打疏失，將阿明身分證統一編號末碼8誤植為3，此屬單純之筆誤性質，客觀上仍可依裁處書之其他記載事項如姓名、地址、裁罰事實及金額等綜合辨識該處分之相對人確為阿明本人，並無致人誤認相對人身分同一性之虞，核屬§101Ⅰ所稱誤寫之顯然錯誤，消防局得隨時或依阿明申請更正之，不涉及無效之問題。阿明主張此為足以影響身分同一性之重大瑕疵而應屬無效，尚屬對法律效果之誤解。又更正之效力應溯及至原處分作成時，不生另一新處分之問題，阿明就更正結果如仍有不服，僅得針對裁罰金額等實質內容部分依通常救濟程序處理，而非以編號誤載作為爭執處分效力之基礎。\n\n結語：本件僅屬§101Ⅰ之顯然錯誤，得逕行更正，尚不致使該裁處書無效。"},
  {a:"§48Ⅳ", q:"消防局對甲君之場所作成「文到次日起20日內完成改善」之限期改善通知，甲君於通知送達後開始計算改善期限，發現第20日恰逢星期日，且次日星期一又適逢國定假日。", problem:"問：本件限期改善期限之末日應如何認定？", body:"依§48Ⅳ，期間之末日為星期日、國定假日或其他休息日者，以該日之次日為期間之末日；期間之末日為星期六者，以其次星期一上午為期間末日。此為期間計算之通則規定，用以避免人民因假日休息致無法辦理相關程序行為而受不利益。本案消防局對甲君之場所作成文到次日起20日內完成改善之限期改善通知，依§48Ⅱ，期間以日計算者，其始日不計算在內，即自送達次日起算，20日後之期日即為原定改善期限末日；惟本案第20日恰逢星期日，依§48Ⅳ前段規定，應以該星期日之次日即星期一作為期間之末日。然本案情形較為特殊，該星期一又恰逢國定假日，此時仍應依§48Ⅳ之規範意旨，末日遇休息日應順延至次一非休息日，繼續順延至再次一日即該國定假日之次日，通常為星期二，以該日作為改善期限之末日，方符合本條保障人民得於非休息日完成相關行政程序行為之立法目的，甲君之改善期限應以此原則重新計算末日。又此一末日順延原則同樣適用於行政救濟期間之計算，例如訴願、行政訴訟等法定不變期間，倘末日逢連續假期，均應依同一法理逐日順延至最近一個非休息日，以確保人民有完整之法定期間可資運用。\n\n結語：本件改善期限末日應依§48Ⅳ順延，逐日順延至第一個非休息日方為期間末日。"},
  {a:"§43", q:"某場所火警調查案中，消防局雖已蒐集現場照片、監視器畫面及多名證人陳述，惟承辦人員最終僅憑報案人單方臆測之說法作成調查結論，未依論理及經驗法則綜合斟酌全部證據，亦未於結論中說明其認定理由並告知當事人。", problem:"問：消防局此項調查結論之作成方式是否適法？", body:"依§43，行政機關為處分或其他行政行為，應斟酌全部陳述與調查事實及證據之結果，依論理及經驗法則判斷事實之真偽，並將其決定及理由告知當事人，此為行政法上自由心證原則之具體展現，機關認定事實不得恣意為之。本案消防局雖已蒐集現場照片、監視器畫面及多名證人陳述等完整證據資料，惟承辦人員於作成調查結論時，僅憑報案人單方臆測之說法為據，未綜合全部證據資料、未依論理及經驗法則權衡各項證據之憑信性及證明力，其事實認定方式顯有恣意、率斷之虞，難謂已盡§43所要求之調查與判斷義務；且結論未說明認定理由並告知當事人，亦與§43後段及§96Ⅰ④處分應記載事實、理由之意旨有違，將使當事人難以判斷是否提起救濟及如何攻防。又行政機關認定事實所憑之證據，應綜合全部卷證資料整體判斷，不得僅擷取對特定結論有利之片段證據逕予論斷，否則即與自由心證原則下「依論理及經驗法則」之要求相悖，此為證據評價之基本界限。\n\n結語：消防局未依§43規定綜合全部證據判斷事實真偽，其調查結論之作成程序違法，據此所為之後續處分應認有重大瑕疵，得依法請求撤銷或重為調查。"},
  {a:"§93Ⅱ①④", q:"消防局核准甲君設立液化石油氣儲放場所之許可，並於許可函中同時載明「本許可以3年為限，屆期失其效力」及「本局保留日後得因情事變更廢止本許可之權利」兩項要求。", problem:"問：消防局於許可函中同時附加期限及廢止權保留兩項要求，是否於法有據？", body:"依§93Ⅰ，行政機關作成行政處分有裁量權時，得為附款；依§93Ⅱ，附款包括期限、條件、負擔、保留行政處分之廢止權、保留負擔之事後附加或變更等五種類型。本案消防局核准甲君設立液化石油氣儲放場所之許可，屬有裁量權之授益處分，機關依法本得為附款。許可函中所載本許可以3年為限、屆期失其效力，其效果為以確定到來之期日限制處分效力存續之終期，核屬§93Ⅱ①所稱期限之附款類型，處分於期限屆至時當然失效，無待另為廢止之意思表示。至於本局保留日後得因情事變更廢止本許可之權利部分，其性質係機關保留於將來一定條件成就時得單方廢止該授益處分之權能，核屬§93Ⅱ④保留行政處分之廢止權之附款類型，與單純之廢止處分本身有別，係於原處分作成時即一併表明保留權能。兩項附款分屬不同款次，消防局於同一許可函中併列二者，於法尚屬有據。應注意者，此類附款仍應與行政處分之目的具有正當合理之關聯，不得逾越必要限度而增加與許可目的無關之負擔，倘消防局日後復另行增訂與液化石油氣儲放無關之其他附款，即有可議之處。\n\n結語：許可函所附3年期限及保留廢止權兩項要求，分別合於§93Ⅱ①、④之附款類型，於法有據。"},
  {a:"§33Ⅳ、§36", q:"阿強向消防局申請承辦員迴避，惟該承辦員在消防局就迴避申請作成准駁決定前，未停止行政程序，仍依阿強片面陳述作成調查結論，並未依職權另行蒐集現場證據或兼顧阿強有利之情形，逕自完成調查報告。", problem:"問：承辦員未停止程序逕行完成調查報告之處理方式，是否合法？", body:"依§33Ⅳ，被申請迴避之公務員，在其所屬機關就該申請事件為准許或駁回之決定前，應停止行政程序，但有急迫情形，仍應為必要處置。此規定之目的在於避免公務員於其迴避與否尚未確定前繼續執行職務，致程序公正性遭受質疑。本案阿強已向消防局申請該承辦員迴避，惟消防局尚未就迴避申請作成准駁決定前，該承辦員仍持續進行調查並完成調查結論，並無資料顯示存在急迫情形足以正當化此一作為，核與§33Ⅳ應停止行政程序之要求相悖，程序上已有瑕疵。另就調查方法而言，依§36，行政機關應依職權調查證據，不受當事人主張之拘束，對當事人有利及不利事項一律注意；本案承辦員僅依阿強片面陳述作成調查結論，未依職權另行蒐集現場證據，亦未兼顧阿強有利之情形，顯然未落實職權調查主義及有利不利一體注意之要求，違反§36規定，其調查結論之可信度及正當性均堪虞。又縱使該承辦員嗣後經機關依§33Ⅴ命其迴避，其於迴避決定作成前所為之調查行為，仍因程序違法而存有得撤銷之瑕疵，消防局後續處理本案時，宜重新指派承辦人員完整調查，以袪除程序瑕疵之疑慮。\n\n結語：承辦員未依§33Ⅳ停止程序、復未依§36善盡職權調查義務，其調查報告之作成程序具重大瑕疵。"},
  {a:"§8", q:"甲君擬投資設立三溫暖場所，事前檢附完整設計圖說向消防局書面諮詢，消防局承辦人明確以正式公文回覆「設計圖說完全符合現行消防法規，可安心施工」。甲君信賴該回覆，隨即斥資裝潢並購置相關設備。完工申請查驗時，消防局卻改稱「先前審查有誤，設計實屬不合規定」，拒絕發給查驗合格證明，亦未提出任何補救或過渡措施。", problem:"問：消防局事後推翻先前正式回覆之行為，是否違反行政法上之原則？", body:"依§8，行政行為應以誠實信用之方法為之，並應保護人民正當合理之信賴。信賴保護原則之成立，須具備信賴基礎（機關之表示行為，足使人民信其將繼續存在）、信賴表現（人民已因信賴而為財產上之處置行為）、信賴值得保護（人民無詐欺、脅迫或提供不實資料等§119所定不值得保護之情事）三要件，三者均須具備始受保護。本案消防局以正式公文明確回覆甲君設計圖說完全符合現行消防法規，甲君據此信賴並隨即斥資裝潢購置相關設備，已具備信賴基礎與信賴表現二要件；甲君申請諮詢時並無提供不實資料或明知違法之情事，其信賴應屬值得保護。消防局嗣後僅以「先前審查有誤」為由片面推翻承諾、逕予拒發合格證明，且未提出任何補救措施或合理過渡期間，使甲君已投入之裝潢成本全歸落空，顯已違反誠信原則及信賴保護原則之精神。又消防局承辦人係以正式公文書面回覆，性質上非僅止於單純之口頭意見交換，其表示內容具體明確，已足以構成使甲君產生正當信賴之基礎，縱事後發現審查有誤，亦不得逕以行政行為應合法為由，全然免除其應負之信賴保護責任。\n\n結語：消防局應本於誠信原則就甲君信賴利益予以妥適保護，如給予合理改善過渡期間或財產上之合理補償，逕予拒發證明有違行政法上原則，甲君得循行政救濟途徑請求救濟。"},
  {a:"§128Ⅱ", q:"阿明兩年前申請火災受災戶特別救助金，因無法提出居住事實證明遭消防局駁回，阿明當時並未提起訴願，該駁回處分已確定。半年前阿明整理舊家廢墟時意外尋獲關鍵證明文件，遂持該文件申請消防局重新審查，惟距原處分之法定救濟期間經過已逾5年6個月。", problem:"問：阿明得否依新尋獲之證明文件申請重新審查原駁回處分？", body:"依§128Ⅱ，程序重開之申請，應自法定救濟期間經過後三個月內為之；其事由發生在後或知悉在後者，自發生或知悉時起算；但自法定救濟期間經過後已逾五年者，不得申請。此五年之絕對上限，係為兼顧法安定性與人民救濟權利之調和，縱使新證據發現在後，逾此期限者，法律仍不允許再開已確定之行政處分。本案阿明二年前申請火災受災戶特別救助金遭消防局駁回，因未提起訴願，該駁回處分已告確定；半年前阿明始意外尋獲關鍵證明文件，固可能構成發現新證據、如經斟酌可受較有利益之處分之重開事由，且阿明自知悉新證據時起算尚未逾三個月申請期間，形式上似符合§128Ⅱ前段之規定。惟本案距原處分之法定救濟期間經過已逾5年6個月，已逾§128Ⅱ但書所定五年絕對期限，此一五年上限之計算與新事由知悉在後與否無涉，縱阿明知悉新證據在後亦不因此延展。又此一五年除斥期間之設計與其他放寬期間之救濟機制性質不同，均展現法安定性與人民權益保護間之立法權衡，不能任意比附援引而無限延展救濟機會。\n\n結語：阿明因已逾§128Ⅱ所定五年絕對期限，縱有新證明文件，仍不得申請重新審查原確定處分。"},
  {a:"§166Ⅱ", q:"消防人員前往老舊社區逐戶建議住戶自費安裝住警器，某住戶當場明確表示拒絕安裝。消防人員見狀不悅，遂告知該住戶：「你不裝沒關係，以後我們會把你家列為高風險場所，每個月都排定人力來做嚴格複查。」", problem:"問：消防人員對拒絕安裝住警器住戶之言詞警告，是否合法？", body:"依§166Ⅰ，行政機關為行政指導時，應注意有關法規規定之目的，不得濫用；依§166Ⅱ，相對人明確拒絕指導時，行政機關應即停止，並不得據此對相對人為不利之處置。行政指導之本質為非權力性行為，不具法律上強制力，其正當性即建立在相對人得自由決定是否配合之基礎上，一旦相對人拒絕，機關即應尊重其意思並停止指導，此為§166Ⅱ最核心之規範精神。本案消防人員前往社區建議住戶自費安裝住警器，性質上屬典型之行政指導，住戶當場明確表示拒絕安裝，依§166Ⅱ前段，消防人員本應即停止該項指導行為。惟消防人員見狀不悅，竟告知該住戶將把其列為高風險場所，每個月排定人力嚴格複查，此等以增加稽查頻率、加重複查負擔之方式回應住戶之拒絕，客觀上已構成因相對人拒絕指導而對其為不利處置，核與§166Ⅱ後段不得據此對相對人為不利處置之明文規定直接相悖，已逾越行政指導應有之界限。又縱使消防人員主張其言論僅屬善意提醒而非脅迫，然客觀上仍足使受規範對象心生畏懼而被迫接受指導，其效果與直接為不利處置無異，仍應為§166Ⅱ所禁止之範疇。\n\n結語：消防人員以提高複查頻率回應住戶拒絕安裝之言論，違反§166Ⅱ後段規定，於法不合。"},
  {a:"§95Ⅱ", q:"消防人員於某場所稽查時，發現有明火表演嚴重違反消防法規，情況危急，遂當場以言詞命令業者立即停止表演並清場。業者當場質疑「口頭講講不算數」，並要求消防人員立即開立書面文件，消防人員因未攜帶公文用紙，遂以「稍後補發」為由暫時拒絕。", problem:"問：消防人員以稍後補發為由暫不立即開立書面文件，是否違反§95Ⅱ不得拒絕之規定？", body:"依§95Ⅰ，行政處分除法規另有要式規定外，得以書面、言詞或其他方式為之；依§95Ⅱ，以書面以外方式所為之行政處分，其相對人或利害關係人有正當理由要求作成書面時，處分機關不得拒絕。本案消防人員發現明火表演嚴重違規、情況危急，遂以言詞當場命令業者立即停止表演並清場，依§95Ⅰ，此一言詞處分於情況急迫之情形下本屬合法之處分方式，不因未以書面為之而影響其效力。業者質疑口頭講講不算數並要求開立書面文件，其請求書面確認之目的具有正當理由，俾利遵循及日後爭議舉證，依§95Ⅱ，消防人員原則上不得拒絕。惟消防人員係因未攜帶公文用紙，以稍後補發暫時回應，其真意並非永久拒絕提供書面，而係因客觀條件所限先為口頭執行、承諾嗣後補正書面，此與條文所禁止之拒絕即完全不提供書面尚有區別，只要消防局其後確實補發書面文件，即不生違反§95Ⅱ之問題；反之，若嗣後藉故不再補發，方構成實質拒絕而違法。又倘消防人員嗣後確有攜帶公文用紙之可能而仍拒絕提供，或藉詞拖延遲遲不予補發，即難謂有正當理由，應認已構成實質拒絕，業者除得請求機關立即補發外，亦得就此一程序瑕疵於後續救濟程序中一併主張之。\n\n結語：消防人員暫以稍後補發回應，尚非§95Ⅱ所禁之拒絕，惟後續仍應確實補發書面方為適法。"},
  {a:"§24Ⅱ、Ⅲ", q:"甲君因與消防局間同時有多起裁罰案件進行中，一次委任5名代理人代為處理相關行政程序事務，其中一名代理人並欲代甲君撤回其中一件申請案，惟甲君並未就撤回申請一事，另外對該代理人為特別授權。", problem:"問：甲君委任5名代理人及其中一人代為撤回申請案之效力如何？", body:"依§24Ⅱ，每一當事人委任之代理人，不得逾三人；依§24Ⅲ，代理權之授與，及於該行政程序有關之全部程序行為，但申請之撤回，非受特別授權，不得為之。此二項規定分別自代理人人數上限及特別授權事項二面向，限制當事人委任代理人之範圍與代理權限之界限。本案甲君因與消防局間同時有多起裁罰案件，一次委任5名代理人代為處理相關行政程序事務，已逾§24Ⅱ所定每一當事人不得逾三人之上限，就超逾人數部分之委任，於法尚有未合，消防局或機關得僅承認其中三人之代理人資格。另就撤回申請部分，代理權之效力原則上及於該行政程序有關之全部程序行為，惟依§24Ⅲ但書，申請之撤回涉及當事人重大程序利益之處分，非經特別授權不得為之；本案甲君並未就撤回申請一事對該代理人另為特別授權，該代理人縱在委任範圍內，仍不得代甲君撤回該申請案，其擅自為之之撤回意思表示，對甲君不生效力。又代理人人數與撤回申請特別授權二者性質有別，前者屬形式資格之限制，逾越部分不生代理效力，後者則屬代理權範圍之實質限制，縱代理人具備合法資格，仍不得逾越授權範圍代為撤回申請，二者均應分別審查，不可混為一談。\n\n結語：甲君委任代理人已逾§24Ⅱ人數上限，且未特別授權撤回申請，該代理人代為撤回不生效力。"},
  {a:"§7②", q:"轄內某社區公園日前舉辦大型園遊會，因主辦單位申請之瓦斯鋼瓶使用未依規定辦理，消防局稽查人員到場後，未區分違規與未違規之攤位，逕行下令封鎖整座公園、強制驅離現場全部約200組合法擺攤之攤商及上千名遊客，園遊會被迫全面終止，未考慮僅要求違規攤位撤除鋼瓶或劃設安全距離等侵害較小之替代手段。", problem:"問：消防局逕行封鎖整座公園並驅離全部合法攤商及遊客之處置，是否合法？", body:"依§7，行政行為應依比例原則為之，其中第②款規定：有多種同樣能達成目的之方法時，應選擇對人民權益損害最少者，此即必要性原則，又稱最小侵害原則之明文化。行政機關為達成一定行政目的，若有多種手段均能達成同等效果時，應選擇對人民權益侵害最輕者，不得逕採侵害程度較大之手段。本案消防局稽查人員發現主辦單位申請之瓦斯鋼瓶使用未依規定辦理，其違規主體應為特定違規攤位，消防局本可採取要求違規攤位撤除鋼瓶、劃設安全距離、暫時停止該攤位營業等侵害較小之替代手段，即足以排除該違規行為所生之危險，並達成維護公共安全之行政目的。惟消防局稽查人員未區分違規與未違規之攤位，逕行下令封鎖整座公園，強制驅離約200組合法擺攤攤商及上千名遊客，使整場園遊會被迫全面終止，其手段所造成之損害範圍及程度，明顯逾越排除該違規行為所必要之限度，核與§7②必要性原則之要求不符。又倘消防局主張其係基於稽查當下人力有限、難以逐一辨識違規攤位為由，仍應優先嘗試較小侵害之措施，僅於確有急迫且別無他法時，方得例外採取全面驅離之手段，否則即難認已窮盡侵害較小之替代方案。\n\n結語：消防局未區分違規與否逕行全面封鎖驅離，違反§7②必要性原則，其處置手段違法。"},
  {a:"§98Ⅲ、§99", q:"消防局於裁處書上完全漏未記載救濟期間及受理機關，阿明因而誤以為任何機關均可受理，遂於期間內將訴願書逕行寄至無管轄權之當地區公所，區公所收文後始發現此屬消防局業務。", problem:"問：阿明因裁處書漏未記載救濟期間而誤向區公所提起訴願，其法律效果如何？", body:"依§98Ⅲ，處分機關未告知救濟期間或告知錯誤未為更正，致相對人或利害關係人遲誤者，如自處分書送達後一年內聲明不服時，視為於法定期間內所為。本案消防局於裁處書上完全漏未記載救濟期間及受理機關，違反教示制度之要求，阿明因而誤以為任何機關均可受理，其後續之遲誤自屬可歸責於消防局教示義務之欠缺；依§98Ⅲ，只要阿明於處分書送達後一年內已為聲明不服之行為，即視為於法定期間內所為，不因逾越通常訴願法定期間而喪失救濟機會。另就阿明誤向無管轄權之區公所提起訴願部分，應依§99判斷：對於行政處分聲明不服，因處分機關未為告知或告知錯誤致向無管轄權之機關為之者，該機關應於十日內移送有管轄權之機關，並通知當事人，且視為自始向有管轄權之機關聲明不服。區公所收文後既已發現此屬消防局業務，即應依§99於十日內將訴願書移送有管轄權之機關並通知阿明，且該訴願仍視為自始已合法提出，不生逾期之問題。又阿明將訴願書逕行寄至無管轄權之區公所，性質上係因消防局教示義務違反所致之誤送，與人民自行判斷錯誤而誤送之情形有別，其法律效果依§99逕視為自始合法聲明不服，不生逾期或程序不合法之疑慮。\n\n結語：阿明因消防局教示不足而生之遲誤及誤送，依§98Ⅲ、§99均視為合法救濟，其訴願權益不受影響。"},
  {a:"§174", q:"甲君於行政機關調查程序進行中，聲請調閱相關卷證資料遭機關駁回，甲君欲於實體處分作成前，就此駁回決定單獨提起訴願。", problem:"問：甲君得否於實體處分作成前，就調閱卷證遭駁回一事單獨提起訴願？", body:"依§174，當事人或利害關係人不服行政機關於行政程序中所為之決定或處置，僅得於對實體決定聲明不服時一併聲明之，但行政機關之決定或處置得強制執行，或本法或其他法規另有規定者，不在此限。此規定之立法目的在於避免行政程序進行中，當事人就機關所為之各項程序性決定逐一單獨提起救濟，致程序延宕、行政效率受損，故原則上程序中決定應待實體決定作成後一併聲明不服，僅於例外情形方許單獨救濟。本案甲君於行政機關調查程序進行中，聲請調閱相關卷證資料遭機關駁回，此一駁回決定性質上屬行政程序進行中所為之程序性處置，並非對外發生確定法律效果之終局實體決定；該駁回決定本身既不具強制執行力，亦查無本法或其他法規特別規定得就此類駁回決定單獨提起救濟之明文，核與§174但書之例外情形不符，仍應回歸本文原則處理。從而甲君尚不得於實體處分作成前，就此駁回決定單獨提起訴願，僅得於嗣後消防局作成實體處分時，一併就此程序決定聲明不服。又若甲君嗣後就實體處分不服提起訴願，仍得就此一調閱卷證遭駁回之程序瑕疵一併主張，並非因未能單獨救濟而喪失其對該程序瑕疵之爭執機會，僅係救濟時點應與實體決定合併處理而已。\n\n結語：甲君不得單獨就調閱卷證遭駁回一事提起訴願，僅得於實體處分作成後一併聲明不服。"},
  {a:"§6", q:"消防局訂有「違反消防法事件裁罰基準表」，明定同類輕微違規之裁罰下限為新臺幣2萬元。某日稽查人員同時查獲阿華與阿強之店面均有滅火器逾期未檢修之相同違規情事，且兩人均無前科紀錄；惟承辦人員僅因阿強稽查當日態度較為冷淡，便捨棄基準表，逕對阿強裁處基準表上限之10萬元，對阿華則仍依基準表下限裁處2萬元。", problem:"問：承辦人員對阿華與阿強為不同金額之裁罰，是否違反平等原則？", body:"依§6，行政行為非有正當理由，不得為差別待遇；此即平等原則，其內涵並非機械式之齊頭平等，而係相同事件應為相同處理、不同事件應為不同處理之實質平等，行政機關若已訂有裁罰基準表並對外公布適用，即應受其自我拘束，非有正當理由不得任意背離。本案消防局訂有裁罰基準表，明定同類輕微違規之裁罰下限為新臺幣2萬元，作為機關行使裁量權之一致性標準；某日稽查人員同時查獲阿華與阿強之店面均有滅火器逾期未檢修之相同違規情事，且兩人均無前科紀錄，其違規情節及背景條件實質上並無差異，依平等原則本應為相同或相近之處理。惟承辦人員僅因阿強稽查當日態度較為冷淡，此與違規情節輕重、公益考量等法定裁罰因素均屬無關之主觀好惡因素，即捨棄基準表對阿強裁處基準表上限之10萬元，對阿華則仍依基準表下限裁處2萬元，兩者裁罰金額相差懸殊，卻無任何與違規情節相關之正當理由可資說明。又倘阿強確有其他違規情節較重之客觀事實，例如逾期情形較嚴重或曾有相同違規紀錄，消防局非不得依基準表另訂加重事由而為不同處理，惟本案並無此等與違規本身相關之正當理由，僅憑主觀觀感為之，自難通過平等原則之檢驗。\n\n結語：承辦人員僅因主觀態度好惡為顯著不同之裁罰，欠缺正當理由，違反§6平等原則。"},
  {a:"§51Ⅱ", q:"甲君向消防局申請「防焰物品認證」，該項申請之處理期間，消防局既未依法規訂定並公告，法規亦未另有規定。甲君送件後等候2個月又10日，消防局仍未作成決定，亦未曾通知延長期間之事由。", problem:"問：消防局逾期未就防焰物品認證申請作成決定，是否合法？", body:"依§51Ⅰ，行政機關對於人民依法規之申請，除法規另有規定外，應按各事項類別，訂定處理期間公告之；依§51Ⅱ，未依前項規定訂定處理期間者，其處理期間為二個月。此為填補機關未訂處理期間空窗之補充規定，避免人民之申請案因機關怠於訂定處理期間而無限期懸置。本案甲君向消防局申請防焰物品認證，該項申請之處理期間，消防局既未依法規訂定並公告，法規亦未另有規定，依§51Ⅱ，其處理期間應以法定之二個月為準。甲君送件後等候2個月又10日，已逾§51Ⅱ所定之二個月法定期間，消防局仍未作成決定。機關固得於原處理期間限度內延長一次，惟延長者應於原期間屆滿前將延長事由通知申請人，本案消防局並未曾通知延長期間之事由，可見其逾期未決並非合法延長之結果，而係單純怠於處理；亦查無天災或其他不可歸責事由致處理受阻而停止計算期間之情形。又縱使消防局嗣後主張案件複雜致需較長時間審查，仍應於原處理期間屆滿前踐行延長通知義務，不得於期限經過後始事後補行說明，否則即無從阻卻其已構成怠於處理之違法評價。\n\n結語：消防局逾越§51Ⅱ所定二個月法定處理期間仍未作成決定且未通知延長，其怠於處理已屬違法。"},
  {a:"§154Ⅰ、§150Ⅱ", q:"消防署訂定新版《防焰物品認證作業要點》（性質上屬法規命令），未依法先行公告草案並開放陳述意見，內容並逕行限制人民營業自由，惟查無任何法律明文授權消防署訂定此類限制規定。", problem:"問：消防署訂定之《防焰物品認證作業要點》是否合法有效？", body:"依§150Ⅰ，法規命令係指行政機關基於法律授權，對多數不特定人民就一般事項所作抽象之對外發生法律效果之規定；依§150Ⅱ，法規命令之內容應明列其法律授權之依據，並不得逾越法律授權之範圍與立法精神。本案消防署所訂新版《防焰物品認證作業要點》，內容逕行限制人民營業自由，對多數不特定業者發生對外法律效果，性質上核屬法規命令，依§150Ⅰ本應以法律授權為前提，惟本案查無任何法律明文授權消防署訂定此類限制人民營業自由之規定，該要點顯然欠缺§150Ⅱ所要求明列之法律授權依據，已違反§150Ⅱ之要求。另就訂定程序而言，依§154Ⅰ，行政機關擬訂法規命令時，除情況急迫顯然無法事先公告周知者外，應於政府公報或新聞紙公告草案全文或主要內容，並使任何人得於一定期間內陳述意見。本案消防署訂定該要點時，未依§154Ⅰ先行公告草案並開放陳述意見，逕行訂定發布，程序上亦有重大欠缺，未落實法規命令訂定應遵循之民主參與程序。又本案縱屬情況急迫而得例外免除預告義務，仍不能解免其應具備法律授權依據之要求，二者為各自獨立之合法性要件，不容互相替代。\n\n結語：該要點欠缺法律授權依據且未依法預告陳述意見，同時違反§150Ⅱ及§154Ⅰ，於法不合。"},
  {a:"§11Ⅱ", q:"某年度組織改造，消防局原轄之危險物品儲存場所管制業務，依新修正之組織法規劃歸環保局管轄，惟環保局相關作業辦法尚未同步修正配套。甲君向消防局申請該類場所之設立許可，消防局承辦人員以「業務已依組織法規劃出」為由逕行拒絕受理，亦未協調公告後續處理方式。", problem:"問：消防局以業務已劃出為由逕行拒絕受理甲君申請之處理方式，是否合法？", body:"依§11Ⅱ，行政機關之組織法規變更管轄權之規定，而相關行政法規所定管轄機關尚未一併修正時，原管轄機關得會同組織法規變更後之管轄機關公告或逕由其共同上級機關公告變更管轄之事項。此規定之立法目的在於處理組織法規變更與個別行政法規修正時程不一致所生之管轄權空窗，避免人民因機關間管轄權交接不周全而求助無門。本案某年度組織改造後，消防局原轄之危險物品儲存場所管制業務，依新修正組織法規劃歸環保局管轄，惟環保局相關作業辦法尚未同步修正配套，核屬§11Ⅱ所定相關行政法規所定管轄機關尚未一併修正之典型情形。依§11Ⅱ規定意旨，此時消防局作為原管轄機關，應會同環保局公告，或由消防局與環保局之共同上級機關公告變更管轄之事項，以利銜接過渡期間之受理作業，而非置人民申請於不顧。本案消防局承辦人員僅以業務已依組織法規劃出為由逕行拒絕受理甲君之申請，亦未協調公告後續處理方式，未依§11Ⅱ踐行公告銜接義務，其處理方式難謂合法。又縱使消防局主張其業務確已依組織法規移轉予環保局，於相關作業辦法完成修正前，仍不得逕以移轉為由完全拒絕受理，而應本於銜接期間之協力義務，妥為處理過渡期間之申請案件，以免人民權益因機關間權限交接而受影響。\n\n結語：消防局未依§11Ⅱ會同公告銜接管轄，逕自拒絕受理甲君申請，於法不合。"},
  {a:"§46Ⅱ①", q:"民眾甲君於消防局對其作成裁罰處分後，向該局申請閱覽相關卷宗，並特別指明欲閱覽承辦人簽核裁罰金額前之內部簽呈及研議簽稿。消防局同意提供裁罰事實認定所依據之現場照片及檢測紀錄，惟就內部簽呈及簽稿部分則予以拒絕。", problem:"問：消防局拒絕提供內部簽呈及簽稿之部分，是否合法？", body:"依§46Ⅰ，當事人或利害關係人得向行政機關申請閱覽、抄寫、複印或攝影有關資料或卷宗；甲君為受裁罰處分之當事人，具申請閱覽資格，其請求原則上應予准許。惟依§46Ⅱ①，行政決定前之擬稿或其他準備作業文件，行政機關得拒絕提供，此係為維護機關內部意見形成過程之自由與完整性，避免影響機關獨立決策。本案甲君所指名欲閱覽之「承辦人簽核裁罰金額前之內部簽呈及研議簽稿」，性質上屬機關內部人員於作成裁罰決定前，彼此往來研議、尚未對外正式確定之準備作業文件，核與§46Ⅱ①之要件相符，消防局得拒絕提供；至消防局已提供之現場照片及檢測紀錄，屬裁罰事實認定所依據之客觀證據資料，並非行政決定前之準備作業文件，甲君本得依§46Ⅰ請求閱覽，機關亦不得任意拒絕。又縱使甲君主張其閱覽目的係為後續行政救濟預作準備，亦不因此擴大§46Ⅱ①之例外範圍，蓋內部準備作業文件之保護，重在維護機關內部意思形成過程之獨立性，與閱覽人主觀請求目的無涉。\n\n結語：消防局同意提供事實認定之證據資料、拒絕提供內部簽呈簽稿之處理方式，於法有據，並無違誤。"},
  {a:"§32①", q:"消防局指派承辦員小陳處理某工廠消防安全檢查複查案件，事後發現該工廠負責人恰為小陳配偶之兄長。小陳認為雙方僅為姻親關係，且自己執法一向公正，故未主動陳報迴避，逕行完成複查並簽准合格證明。", problem:"問：小陳未自行迴避而逕行完成複查之處理方式，是否合法？", body:"依§32①，公務員本人或其配偶、前配偶、四親等內之血親或三親等內之姻親或曾有此關係者為事件之當事人時，應自行迴避。此為法定自行迴避事由之一，凡符合列舉之親屬關係者，公務員即負有主動迴避之義務，無待當事人申請，亦不容公務員自行以其個人主觀公正與否作為是否迴避之判斷標準，蓋迴避制度所欲維護者為外觀上之公正性及人民對行政程序之信賴，而非取決於承辦人員實際上是否確有偏頗。本案消防局指派承辦員小陳處理某工廠消防安全檢查複查案件，該工廠負責人恰為小陳配偶之兄長，依親等計算，配偶之兄長屬配偶之二親等血親，依姻親親等從配偶之血親親等計算之原則，核屬三親等內之姻親，已落入§32①所列舉之法定自行迴避事由範圍。小陳雖認為雙方僅為姻親關係、且自己執法一向公正，然此等主觀認知不足以排除§32①之強制適用，其未主動陳報迴避，逕行完成複查並簽准合格證明，已違反自行迴避之法定義務。又縱使小陳主觀上確能公正執法，依迴避制度設計，仍不能取代法定應自行迴避事由之強制效力，蓋制度目的除防止實際偏頗外，尚在杜絕外觀上使人民對程序公正性產生合理懷疑之可能。\n\n結語：小陳與工廠負責人具三親等內姻親關係，依§32①應自行迴避，未迴避逕行複查於法不合。"},
  {a:"§93Ⅱ②", q:"消防局為讓工廠儘速開始生產，提前核發某工廠籌設許可，並附加「應於開始生產前完成消防安全設備竣工查驗，否則本許可失其效力」之條件。", problem:"問：消防局於籌設許可中附加消防安全設備竣工查驗之要求，屬何種附款類型？", body:"依§93Ⅰ，行政機關作成行政處分有裁量權時，得為附款；依§93Ⅱ②，附款之一種為條件，即以將來客觀不確定是否成就之事實，作為行政處分效力發生或消滅之依附事項。條件與期限之區別在於，期限所繫之事實必然到來，僅遲早問題，條件所繫之事實則未必發生，具有不確定性；條件又可分為停止條件，成就時處分始生效力，與解除條件，成就時處分失其效力。本案消防局為使工廠儘速開始生產，提前核發某工廠籌設許可，並附加應於開始生產前完成消防安全設備竣工查驗、否則本許可失其效力之要求，其效果繫於開始生產前是否完成竣工查驗此一將來客觀不確定之事實，若屆期未完成查驗，籌設許可即失其效力，此一未完成查驗即失效之構造，核屬以將來不確定事實之不成就作為處分失效原因之解除條件類型。與單純負擔相較，負擔則僅課予受益人一定作為義務，縱未履行負擔，處分本身仍屬有效，尚須由機關另為廢止之意思表示，二者於法律效果上顯有不同，此為區辨條件與負擔之實益所在，應歸類為§93Ⅱ②之條件附款。\n\n結語：本件未完成查驗即失效之要求，性質上屬§93Ⅱ②之條件附款，而非單純負擔。"},
  {a:"§135、§142③", q:"消防局與甲君間就一起火災原因無法查明之案件，雙方雖仍可透過進一步鑑識查明真相，惟消防局承辦人員為求儘速結案，逕與甲君締結和解契約，約定雙方各自承擔一半責任並繳納罰鍰了事。", problem:"問：消防局與甲君就無法查明之火災原因案件所締結之和解契約，是否有效？", body:"依§135，公法上法律關係得以契約設定、變更或消滅之，但依其性質或法規規定不得締約者，不在此限，此為行政契約合法性之基礎規範，行政機關就特定公法事件本得以契約方式處理，惟仍應受相關法定要件之拘束，其中和解契約即為適例。依§142③，代替行政處分之行政契約，其締結之和解契約未符合第136條之規定者，無效；而依第136條，行政機關對於行政處分所依據之事實或法律關係，經依職權調查仍不能確定者，為有效達成行政目的並解決爭執，得與人民和解，締結行政契約以代替行政處分，此即和解契約合法之核心要件，限於事實或法律關係經依職權調查仍不能確定之情形，方得締約。本案消防局與甲君間就火災原因無法查明之案件締結和解契約，惟雙方仍可透過進一步鑑識查明真相，可見事實真相並非依職權調查仍不能確定，僅係承辦人員為求儘速結案而未窮盡調查即逕行和解，核與第136條所定要件不符，依§142③，該和解契約應屬無效。又和解契約與雙務契約性質有別，前者著重於事實真偽不明時之效率解決，後者則著重雙方互負對待給付之相當性，本案性質上屬前者，應以事實或法律關係是否不能確定為判斷核心，而非給付相當性之問題。\n\n結語：本件事實仍可查明卻逕行和解，未符第136條要件，依§142③，該和解契約應屬無效。"},
  {a:"§78Ⅰ①", q:"某瓦斯行因重大違規遭裁處鉅額罰鍰，惟負責人於裁處前已攜眷遷離原址、戶籍亦一併遷出，行蹤不明，消防局多次派員查訪均無法查得其新址，郵寄裁處書亦遭退回，致無法依通常方式完成送達。", problem:"問：消防局得否對本案裁處書為公示送達？", body:"依§78Ⅰ①，對於當事人之送達，應為送達之處所不明者，行政機關得依申請，准為公示送達。此為公示送達之法定要件之一，性質上屬於通常送達方式，如自行送達、補充送達、留置送達、寄存送達，均無從實現時之最後手段，其成立須以應為送達之處所不明為前提，亦即機關已窮盡合理調查方式仍無法查得應受送達人之確實處所。本案某瓦斯行負責人於裁處前已攜眷遷離原址、戶籍亦一併遷出，行蹤不明，消防局多次派員查訪均無法查得其新址，郵寄裁處書亦遭退回，致無法依通常方式完成送達，可見消防局已窮盡合理之查訪及郵寄途徑，客觀上確已符合應為送達之處所不明之要件，核與§78Ⅰ①相符。消防局得依申請辦理公示送達；縱無人申請，機關為避免行政程序遲延，亦得依職權命為公示送達。公示送達完成後，自公告之日起或最後刊登之日起，經二十日發生送達效力，屆時裁處書即對該負責人發生合法送達之效果。又公示送達係於通常送達方式均無法達成後之最後手段，性質上具補充性，消防局於採行公示送達前，仍應確實踐行查訪、郵寄等通常送達方式並保留相關紀錄，以備日後就送達合法性發生爭議時得以舉證。\n\n結語：本案負責人行蹤不明致無法依通常方式送達，消防局符合§78Ⅰ①要件，得依法辦理公示送達。"},
  {a:"§16", q:"消防局為提升防火標章核發效率，將標章之現場勘查及核發作業，依法規委託某民間專業機構辦理，並公告委託事項及法規依據，委託所需費用亦依規定由消防局支付，該民間機構並依委託範圍以自己名義完成勘查及核發作業。", problem:"問：消防局將防火標章核發作業委託民間機構辦理，是否合法？", body:"依§16Ⅰ，行政機關得依法規將其權限之一部分，委託民間團體或個人辦理；依§16Ⅱ，應將委託事項及法規依據公告之，並刊登政府公報或新聞紙；依§16Ⅲ，委託所需費用，除另有約定外，由行政機關支付之。委託民間辦理與委任下級機關不同，其相對人為不具隸屬關係之民間團體或個人，惟受託行使公權力之個人或團體，於委託範圍內視為行政機關，其所為之行為仍具公法性質。本案消防局為提升防火標章核發效率，將標章之現場勘查及核發作業依法規委託某民間專業機構辦理，其委託對象為民間專業機構，核與§16Ⅰ所定委託對象相符；消防局並依規定公告委託事項及法規依據，符合§16Ⅱ公告義務之要求；委託所需費用亦依規定由消防局支付，與§16Ⅲ原則相符；該民間機構並依委託範圍以自己名義完成勘查及核發作業，其行為於委託範圍內視為消防局之行政行為，具有行政處分之效力。又受託之民間機構於委託範圍內雖視為行政機關，惟其權限來源仍受委託範圍之拘束，不得逾越委託事項另行作成其他行政行為，倘有逾越，該部分行為即非屬視為行政機關所為，而應另行判斷其法律性質。\n\n結語：消防局委託民間機構辦理防火標章核發作業之各項程序均合於§16規定，屬合法之委託。"},
  {a:"§114Ⅰ③、Ⅱ", q:"消防局於裁罰阿強之工廠前，依法應給予陳述意見之機會，惟承辦人員疏未通知，逕行作成裁處書。阿強不服提起訴願，消防局於訴願機關作成決定前，發現此一程序疏失，遂補行通知阿強到局陳述意見，聽取其說明後仍維持原裁罰決定。", problem:"問：消防局訴願程序中補行陳述意見之作法，能否治癒原有瑕疵？", body:"依§102，行政機關作成限制或剝奪人民權利之行政處分前，除已依§39通知陳述意見或決定舉行聽證外，應給予處分相對人陳述意見之機會，此係正當法律程序之核心要求；消防局裁罰阿強前疏未通知其陳述意見，原處分具有程序瑕疵，屬得撤銷之違法事由。惟依§114Ⅰ③，應給予當事人陳述意見之機會已於事後給予者，得補正該程序瑕疵；依§114Ⅱ，第2款至第5款之補正行為，僅得於訴願程序終結前為之，得不經訴願程序者，僅得於向行政法院起訴前為之，逾此時點即不得再行補正。本案消防局於阿強提起訴願後、訴願程序終結前，主動補行通知阿強到局陳述意見，聽取其說明後仍維持原裁罰決定，其補正之時點合於§114Ⅱ之限制，程序瑕疵已於適法時點內完成補正。倘消防局遲至訴願程序終結後，甚至遲至行政訴訟程序中始行補正陳述意見程序，則已逾§114Ⅱ所定之補正時點限制，該補正即不生治癒瑕疵之效力，原處分仍應認屬違法而得予撤銷，此一時點限制不容任意寬認。\n\n結語：消防局之補正行為時點合法、要件相符，原裁罰處分之程序瑕疵已依§114Ⅰ③、Ⅱ規定合法治癒，處分實體效力不受影響，阿強不得再以此程序瑕疵為由請求撤銷原處分。"},
  {a:"§102、§103②", q:"消防局於稽查中發現某餐廳消防安全設備嚴重違反規定，現場情況已達危及公共安全之急迫程度，決定即時強制歇業，未及依通常程序事先通知該餐廳負責人到場陳述意見。", problem:"問：消防局未經事先通知陳述意見即命餐廳即時強制歇業，是否合法？", body:"依§102，行政機關作成限制或剝奪人民自由或權利之行政處分前，除已依第39條通知陳述意見或決定舉行聽證者外，應給予該處分相對人陳述意見之機會，此為正當程序原則於行政處分作成前之具體展現，旨在使受處分人有事前表達意見、影響機關決定之機會。惟依§103②，情況急迫，如予陳述意見之機會，顯然違背公益者，行政機關得不給予陳述意見之機會，此為§102原則之法定例外事由之一。本案消防局於稽查中發現某餐廳消防安全設備嚴重違反規定，屬限制、剝奪該餐廳營業權利之不利處分，依§102原則上應先給予餐廳負責人陳述意見之機會。惟本案現場情況已達危及公共安全之急迫程度，若仍依通常程序事先通知該餐廳負責人到場陳述意見，將因程序延宕而使公共安全風險持續存在，顯然違背維護公共安全之公益考量，核與§103②所定情況急迫、如予陳述意見之機會顯然違背公益之要件相符，消防局得逕予援用該款例外。又縱使日後該餐廳負責人對歇業處分不服提起救濟，仍得於救濟程序中就處分之實體合法性為完整之爭執，僅係於作成處分當下，機關依§103②得例外不先行給予陳述意見機會，二者屬不同層次之問題，不可混淆。\n\n結語：本案情況急迫危及公安，消防局依§103②例外規定不給予陳述意見逕行歇業處分，於法有據。"},
  {a:"§19Ⅳ②", q:"消防局調查某化工廠火災原因時，因欠缺特殊化學品鑑定設備與專業人力，行文請求環保局協助進行成分鑑定；環保局評估後認為，若抽調專業人員協助鑑定，將導致該局當週排定之多場重大違法傾倒廢棄物稽查勤務全數無法出勤，嚴重影響其本職工作之執行。", problem:"問：環保局得否以嚴重妨害自身職務為由拒絕消防局之職務協助請求？", body:"依§19Ⅰ，行政機關為發揮共同一體之行政機能，應於其權限範圍內互相協助；依§19Ⅱ②，機關執行職務因人員、設備不足等事實上原因不能獨自執行職務者，得向無隸屬關係之機關請求協助，本案消防局因欠缺特殊化學品鑑定設備與專業人力，行文請求環保局協助鑑定，核屬適例。惟依§19Ⅳ②，被請求機關於「如提供協助，將嚴重妨害其自身職務之執行」之情形，應拒絕之，此為法定應拒絕事由，機關並無裁量餘地。本案環保局評估後認為，若抽調專業人員協助鑑定，將導致該局當週排定之多場重大違法傾倒廢棄物稽查勤務全數無法出勤，已非僅生輕微不便，而係嚴重影響其法定稽查本職之執行，核與§19Ⅳ②要件相符，環保局依法負有拒絕之義務，並非單純裁量事項。應與§19Ⅴ「認有正當理由不能協助者，得拒絕」相區辨：第4項為義務性應拒絕規定，第5項則屬機關裁量權限，效果強度不同。又依§19Ⅵ，被請求機關認無提供協助義務或有拒絕事由時，應將理由通知請求協助機關，請求機關如有異議，由共同上級機關決定，無共同上級機關者，由被請求機關之上級機關決定。\n\n結語：環保局得依§19Ⅳ②拒絕本次職務協助，惟應依§19Ⅵ敘明理由通知消防局，消防局如有異議得循共同上級機關決定機制救濟，另尋其他鑑定管道。"},
  {a:"§165", q:"消防局推動「住宅用火災警報器安裝」宣導專案，消防人員前往老舊社區，逐戶「建議」住戶自費安裝住警器，並說明其提升居家安全之效益，惟未以任何強制力要求住戶配合，住戶亦可自由決定是否採納。", problem:"問：消防人員逐戶勸導安裝住警器之行為性質為何？", body:"依§165，行政指導謂行政機關在其職權或所掌事務範圍內，為實現一定行政目的，以輔導、協助、勸告、建議或其他不具法律上強制力之方法，促請特定人為一定作為或不作為之行為。其要件可拆解為：須為機關於職權範圍內所為、目的在實現一定行政目的、手段限於輔導協助勸告建議等非權力性方法、效果不具法律上強制力、相對人得自由決定是否配合。本案消防局推動住警器安裝宣導專案，消防人員逐戶以「建議」方式向住戶說明裝設住警器提升居家安全之效益，全程未動用任何強制手段要求配合，住戶亦保有完全自主決定權，核與上開要件悉數相符，性質上應屬行政指導，而非行政處分或其他具強制力之行政行為。應與具強制力之行政處分明確區辨：倘消防局係依法律明文限期命住戶裝設，逾期並得裁罰，即屬課予義務之行政處分，適用§92以下規定；反之本案純屬柔性勸說，人民縱不採納亦不生任何不利之法律效果，機關亦不得因住戶拒絕而為不利處置，此觀諸§166Ⅱ規定甚明。又依§167，機關為行政指導仍應明示指導目的、內容及負責指導者，相對人請求交付文書時，除有特別困難外，應以書面為之，此為行政指導之附隨義務，非謂全然無任何程序拘束。\n\n結語：本案消防人員之逐戶勸導行為核屬行政指導，性質上不具法律強制力，住戶得自由決定是否配合，機關亦不得因其拒絕而為任何不利處置。"},
  {a:"§117、§119", q:"消防局承辦人員因計算錯誤，誤發新臺幣5千元之消防設備補助款予不符資格之甲君，甲君已持該核准函前往特約器材行購買並安裝相關設備。半年後消防局內部稽核發現核發有誤，經查甲君並無詐欺、脅迫、賄賂，或提供不正確資料，亦無明知違法或因重大過失而不知之情事。", problem:"問：消防局得否逕行撤銷原核發補助處分並命甲君全額返還？", body:"依§117，違法行政處分於法定救濟期間經過後，原處分機關得依職權為全部或一部之撤銷，惟有二款除外情形不得撤銷：一為撤銷對公益有重大危害者；二為受益人無§119所列信賴不值得保護情形，而其信賴授予利益處分之信賴利益顯然大於撤銷所欲維護之公益者。依§119，信賴不值得保護限於受益人有詐欺脅迫賄賂、對重要事項提供不正確資料或不完全陳述、明知違法或因重大過失而不知等三款情形之一。本案核發補助款之錯誤純係消防局承辦人員自身計算錯誤所致，甲君並無任何詐欺脅迫賄賂之不正手段，申請過程亦查無提供不正確資料或不完全陳述之情事，亦無明知違法或因重大過失而不知之情形，核與§119三款事由均不相符，其信賴應屬值得保護。甲君既已持核准函向特約器材行購買並安裝相關設備，客觀上已有具體信賴表現，倘逕行撤銷並命全額返還，將使其已支出之財產損失無從填補。惟信賴值得保護並非阻卻撤銷本身，消防局仍得依§117撤銷該違法補助處分，僅係撤銷後應依§120給予甲君合理補償，補償額度以其因信賴致生之財產損失、且不得超過因處分存續可得之利益為限。\n\n結語：消防局得依§117撤銷原補助處分，惟因甲君信賴值得保護，依§120應就其財產上損失給予合理補償，尚不得逕命其全額返還已受領之補助款。"},
  {a:"§73Ⅰ", q:"郵務人員將消防局裁處書送達甲君住所時，甲君外出不在，經確認後，郵務人員將該裁處書交由與甲君同住、就讀大學二年級且具相當辨別事理能力之表妹簽收。", problem:"問：由甲君之表妹代為簽收裁處書，是否發生合法送達之效力？", body:"依§73Ⅰ，於應送達處所不獲會晤應受送達人時，得將文書付與有辨別事理能力之同居人、受雇人或應送達處所之接收郵件人員，此即補充送達制度。其要件可拆解為：須於應送達處所實際實施送達行為、不獲會晤應受送達人本人、受領人須為同居人受雇人或接收郵件人員之一、該受領人須具備辨別事理能力。所謂同居人，不以具親屬關係為必要，凡與應受送達人事實上同住一處、共同生活者均屬之。本案郵務人員係於甲君住所實施送達，因甲君外出不獲會晤本人，經確認後改由與甲君同住之表妹簽收，該表妹已就讀大學二年級，客觀上顯具備相當辨別事理能力，足以理解文書性質並妥善轉交甲君，核與同居人及辨別事理能力二要件均屬相符，應認已生合法補充送達之效力，送達生效日以表妹實際簽收之日為準，非俟甲君實際閱讀文書之日。惟須注意§73Ⅱ設有除外規定，倘受領人與應受送達人在該行政程序上利害關係相反者（例如互為對造、檢舉人與被檢舉人），即不得為補充送達，應另尋其他合法送達方式，如寄存送達（§74）。本案表妹與甲君純屬親屬同居關係，並無利害相反情事，自無該除外規定之適用。\n\n結語：本案由表妹代為簽收裁處書已合法生效，裁處書所定之救濟期間即自簽收之日起算，甲君嗣後不得以未親自收受為由主張送達不合法。"},
  {a:"§96Ⅰ④", q:"消防局核發某工廠裁處書，其上詳載裁罰金額、違規事實及所依據之法條，惟通篇未記載作成該處分之機關名稱，亦未見機關首長署名。", problem:"問：本件裁處書未載明處分機關名稱及首長署名，其效力如何？", body:"依§96Ⅰ，行政處分以書面為之者，應記載六款事項，其中第四款明定：處分機關及其首長署名、蓋章，該機關有代理人或受任人者，須同時於其下簽名；但以自動機器作成之大量行政處分，得不經署名，以蓋章為之。此一記載事項之目的，在使人民得以辨識係何機關本於何等權責作成該處分，並確認處分作成程序之正式性與可歸責主體，屬書面處分不可或缺之形式要件。本案裁處書雖已詳載裁罰金額、違規事實及所依據之法條，形式上似已滿足§96Ⅰ②之要求，惟通篇未記載作成處分之機關名稱，亦未見機關首長署名或蓋章，核與§96Ⅰ④之要件顯不相符，屬書面行政處分之記載瑕疵。此瑕疵性質上屬程序或方式之欠缺，惟依§114Ⅰ所列①至⑤得補正事由觀之，機關名稱與首長署名之欠缺並非該條所明文列舉之補正類型，能否比附援引補正尚有疑義，實務上多認為此類重大形式欠缺應由機關另行補行署名蓋章程序方能治癒。應與§111①區辨：若係不能由書面處分中得知處分機關者，方屬無效事由；本案僅係漏未記載機關名稱及署名，尚非「不能得知」之程度，故宜認屬得補正之瑕疵，而非當然無效。\n\n結語：本件裁處書因違反§96Ⅰ④記載義務而具形式瑕疵，消防局應速補行機關名稱記載及首長署名程序，該工廠亦得於救濟程序中一併主張此項程序瑕疵。"},
  {a:"§131Ⅰ", q:"阿明經營之KTV於民國103年間因重大消防違規遭消防局裁處10萬元罰鍰，阿明始終拒不繳納。消防局承辦人員因職務交接疏漏，遲未將案件移送行政執行，直到民國114年清查舊案時才發現此筆呆帳，隨即發函要求阿明限期繳納。", problem:"問：消防局114年始發函催繳10萬元罰鍰，該公法上請求權是否已罹於時效而消滅？", body:"依§131Ⅰ，公法上之請求權，於請求權人為行政機關時，除法律另有規定外，因五年間不行使而消滅；於請求權人為人民時，則因十年間不行使而消滅，二者期間並不對稱，須特別留意。依§131Ⅱ，公法上請求權因時效完成而當然消滅，不待義務人主張時效抗辯，亦不同於民法上時效完成僅生抗辯權之效果。本案消防局對阿明所享有之10萬元罰鍰繳納請求權，其請求權人為行政機關，依§131Ⅰ前段應適用五年時效，時效起算點原則上應自處分確定、得請求給付（即得為強制執行）之時起算。阿明自103年遭裁罰後即拒不繳納，消防局承辦人員因職務交接疏漏，長達約十年間均未行使該請求權，亦未移送行政執行以中斷時效，其間顯已逾五年時效期間，依§131Ⅱ規定，該罰鍰請求權應已因時效完成而當然消滅。惟依§131Ⅲ，時效因行政機關為實現該權利所作成之行政處分而中斷，倘消防局於五年期間內曾有移送行政執行等足生中斷效果之行為，時效即應重行起算（§133、§134），本案並無此情事。又此與§121撤銷權除斥期間（知有撤銷原因起2年）性質不同，不可混淆。\n\n結語：消防局對阿明之罰鍰繳納請求權已因逾五年不行使而依§131當然消滅，114年始發函催繳於法無據，阿明得以時效抗辯拒絕繳納。"},
  {a:"§98Ⅱ", q:"消防局於裁處書上誤載「如不服本處分，應於送達後60日內提起訴願」，惟該類事件之法定救濟期間實為30日。甲君信賴裁處書上之記載，遲至送達後第45日始提起訴願。", problem:"問：甲君遲至第45日始提起訴願，其訴願是否仍應認為合法？", body:"依§98Ⅱ，處分機關告知之救濟期間較法定期間為長者，處分機關雖以通知更正，如相對人或利害關係人信賴原告知之救濟期間，致無法於法定期間內提起救濟，而於原告知之期間內為之者，視為於法定期間內所為，此係教示錯誤下之信賴保護特別規定。其要件可拆解為：機關告知之救濟期間須較法定期間長、相對人須信賴該較長期間、因信賴致未能於法定期間內提起救濟、然仍於原告知期間內提起。本案消防局裁處書教示應於送達後60日內提起訴願，較該類事件法定30日之訴願期間為長，甲君信賴裁處書上之記載，遲至送達後第45日始提起訴願，雖已逾法定30日期間，然仍在機關原告知之60日期間內提出，核與§98Ⅱ要件悉數相符，依法應視為於法定期間內所為，其訴願應予受理，不得以逾期為由駁回。此與§98Ⅰ機關「主動以通知更正」之情形不同：第1項處理機關發現告知錯誤後應如何更正並重新起算期間之機制，第2項則保障人民於機關尚未更正前、已信賴原錯誤教示所為救濟行為之效力，二者適用時點與規範對象並不相同，作答時應注意勿混淆援引。\n\n結語：甲君之訴願雖逾法定30日期間，惟因信賴消防局教示之60日期間而於其內提出，依§98Ⅱ應視為於法定期間內所為，訴願機關不得以逾期駁回。"},
  {a:"§123③", q:"消防局核准甲君之危險物品儲放場所設立許可，並於許可函中附加「應每半年辦理一次自衛消防編組演練」之負擔，甲君其後連續逾一年半均未依約履行該項演練義務。", problem:"問：消防局得否廢止甲君之原許可處分？", body:"依§93Ⅱ②，行政機關作成裁量性之授益處分時，得於處分內容中附加負擔，要求受益人為一定之作為、不作為或給付義務。本案消防局核准甲君設立危險物品儲放場所許可時，附加「應每半年辦理一次自衛消防編組演練」之負擔，屬合法附款，甲君自應依約履行。依§123③，授予利益之合法行政處分，有「附負擔之行政處分，受益人未履行該負擔者」情形，原處分機關得依職權為全部或一部之廢止。甲君連續逾一年半均未依約履行演練義務，核與§123③要件相符，消防局得逕依職權廢止原許可。又此項負擔未履行純屬可歸責於甲君自身之事由，並非§123④⑤所定因法規事實變更或防止公益重大危害等不可歸責於受益人之公益事由，依§126第1項僅適用於依§123④⑤廢止之情形，甲君就此不得主張信賴補償。又消防局依§123③廢止原許可後，該廢止原則上僅向後發生效力（§125），甲君於廢止前已合法保有補助款項及演練期間之利益不受影響，僅係自廢止時起喪失繼續持有補助之法律上原因，尚非須全額溯及既往返還。\n\n結語：消防局得依§123③依職權廢止原許可處分，甲君因自身違反負擔在先，不得依§126請求信賴補償。"},
  {a:"§9", q:"消防局裁罰某餐廳「未依規定維護逃生設備」，僅蒐集逃生門遭上鎖之現場照片作為裁罰依據，對於業者提出「該日因裝修臨時封閉逃生門並已張貼公告」之說明及照片，未予調查即逕行裁處。", problem:"問：消防局未調查業者提出之有利說明逕行裁處，是否違法？", body:"依§9，行政機關就該管行政程序，應於當事人有利及不利之情形，一律注意，此為有利不利一體注意原則，機關辦案不能僅片面蒐集對人民不利之事證，對於人民所提出、客觀上足以影響事實認定之有利事證，亦應本於職權一併查證斟酌，方符合依法行政及正當程序之要求。此原則並與§36職權調查主義相互呼應，機關調查證據不受當事人主張範圍之拘束，對當事人有利及不利事項均應一律注意。本案消防局僅蒐集逃生門遭上鎖之現場照片作為裁罰依據，對於業者已具體提出「該日因裝修臨時封閉逃生門並已張貼公告」之說明及照片此一足以阻卻違規故意過失或減輕情節之有利事證，未予任何調查查證即逕行裁處，顯僅片面斟酌不利事項，未依§9規定一併注意有利情形，其事實認定程序即有瑕疵，亦未符合§43依論理及經驗法則判斷事實真偽之要求。正確作法應係就業者所稱裝修封閉及公告等情，本於職權查證其真實性，再依查證結果決定是否構成免責或減輕裁罰之事由，倘經查證屬實，該臨時性、已公告之封閉行為是否仍符合「未依規定維護逃生設備」之裁罰要件，亦有重新評價之必要，尚非得逕以照片顯示上鎖之外觀事實即認定違規成立。\n\n結語：消防局未依§9及§36調查業者提出之有利事證即逕行裁處，於事實認定程序顯有瑕疵，該處分應屬違法，餐廳得提起訴願及行政訴訟請求撤銷或發回重新調查。"},
  {a:"§36", q:"消防局於審理甲君申請之「防火避難設施改善計畫」時，甲君於申請書中信誓旦旦聲稱廠房周邊淨空無障礙物，惟承辦人透過空拍及實地勘查，發現周邊全被違建搭滿，根本不符規定。甲君抗議機關「只能根據我提交的書面資料審查，不能自己跑去查其他證據反駁我」。", problem:"問：消防局得否自行調查空拍及實地勘查資料以推翻甲君申請書之陳述？", body:"依§36，行政機關應依職權調查證據，不受當事人主張之拘束，對當事人有利及不利事項一律注意，此即職權調查主義，為行政程序法調查事實及證據一節之核心原則。其要件可拆解為：機關調查證據之範圍及方法不受當事人聲明或主張之限制、機關得依職權主動蒐集當事人未提出甚或不利於當事人之證據、且應兼顧有利不利事項。此與民事訴訟採辯論主義、法院原則上僅得就當事人提出之證據為判斷者迥異，行政程序著重公益維護及事實真相之發現，機關自負有主動查證之義務與權限。本案甲君雖於申請書中自行聲稱廠房周邊淨空無障礙物，然此僅為當事人單方之陳述，並不當然拘束機關之事實認定；消防局承辦人依職權透過空拍及實地勘查等方式，主動查證申請書所載內容與客觀事實是否相符，核屬§36所賦予機關之法定職權，並非法所不許，甲君主張機關「只能根據書面資料審查」云云，於法尚有誤會。又此職權調查亦與§40得要求提供文書資料物品、§42得實施勘驗等具體調查方法條文相互配合運用，機關發現申請書內容與實地勘查結果不符時，自應依查證所得之客觀事實而非逕採當事人片面陳述，作為准駁該改善計畫申請之依據。\n\n結語：消防局依§36主動實施空拍及實地勘查以查核甲君申請書內容，於法有據，其查證結果如與申請書陳述不符，機關應以查證所得客觀事實為准駁依據，甲君之抗辯尚非有理。"},
  {a:"§2Ⅲ", q:"內政部消防署依法規將防火管理人講習訓練之測驗業務，委託民間「甲訓練機構」辦理；某學員測驗未通過，甲機構逕行核發「測驗不合格」通知，該學員主張甲機構僅為私法人，其所為之通知不具公權力性質，非屬行政處分。", problem:"問：甲訓練機構核發之測驗不合格通知是否具行政處分性質？", body:"依§2Ⅲ，受託行使公權力之個人或團體，於委託範圍內，視為行政機關，此為行政程序法擬制行政機關範圍之重要規定，目的在使人民之權益保障不因機關將公權力事務委託民間辦理而受影響。其要件可拆解為：須有合法之委託、受託人得為個人或團體、僅於委託範圍內視為行政機關，逾越委託範圍之行為則不生此擬制效果。依§92Ⅰ，行政處分係指行政機關就公法上具體事件所為之決定或其他公權力措施而對外直接發生法律效果之單方行政行為，其中「行政機關」概念即應併同§2Ⅲ擴張解釋，涵蓋受託行使公權力之個人或團體。本案內政部消防署依法規將防火管理人講習訓練之測驗業務委託甲訓練機構辦理，甲機構受託辦理測驗並就學員是否通過為判斷，此屬公權力性質之判斷行為，於受託範圍內依§2Ⅲ視為行政機關；其核發之「測驗不合格」通知，對外直接發生該學員不具防火管理人資格之法律效果，核與§92Ⅰ行政處分五要素相符，應認屬行政處分，並非單純私法上之意思表示。學員主張甲機構僅為私法人、非公權力主體云云，顯係誤解§2Ⅲ受託行使公權力擬制規定之意旨，於法尚無可採。學員如對該不合格通知不服，仍得依法提起訴願及行政訴訟，救濟對象仍以委託機關內政部消防署為被告機關。\n\n結語：甲訓練機構於受託範圍內依§2Ⅲ視為行政機關，其核發之測驗不合格通知具行政處分性質，該學員得依法提起訴願及行政訴訟請求救濟。"},
  {a:"§3Ⅱ①", q:"某縣議會審議消防局年度預算案時，僅由議員內部討論決議刪減部分經費項目，並未依行政程序法之相關規定通知受影響之消防局承辦人員到場陳述意見；消防局事後主張議會審議程序違反行政程序法規定。", problem:"問：縣議會刪減預算之審議程序是否應適用行政程序法？", body:"依§3Ⅱ①，各級民意機關之行政行為，不適用本法之程序規定，此為本法明文排除適用之機關類型之一，與§3Ⅱ②司法機關、§3Ⅱ③監察機關併列。其立法理由在於民意機關本身依其組織法規及議事規則自有一套審議程序，性質上屬權力分立下之自治領域，不宜再以行政程序法之陳述意見、聽證等程序要求加以拘束，避免與其固有議事程序疊床架屋、扞格不入。本案某縣議會係屬地方民意機關，其審議消防局年度預算案、決議刪減部分經費項目，核屬議會行使預算審議權之議事行為，依§3Ⅱ①明文，該審議程序不適用行政程序法之程序規定，議會自無須依本法通知受影響之消防局承辦人員到場陳述意見。消防局主張議會審議程序違反行政程序法規定云云，於法尚無理由。應予辨明者，§3Ⅱ僅排除民意機關「行政行為」適用本法之程序規定，倘議會本身以行政機關地位另為行政行為，仍應回歸判斷是否該當§2Ⅱ行政機關定義及是否有其他排除事由；本案預算審議屬議會核心議事權限之行使，並非此種例外情形。消防局如對預算刪減結果有意見，應循預算法及地方立法機關相關議事程序表達意見或申覆，而非援引行政程序法主張程序瑕疵。\n\n結語：縣議會審議預算之行為依§3Ⅱ①不適用行政程序法程序規定，消防局尚不得以未依行政程序法給予陳述意見機會為由，主張該審議程序違法。"},
  {a:"§3Ⅲ⑦", q:"某消防員因年度考績遭評定為丙等，深感不服，主張機關於作成考績決定前，未依行政程序法給予其陳述意見之機會，逕行評定顯有程序瑕疵。", problem:"問：消防員得否以未依行政程序法給予陳述意見機會為由主張考績評定違法？", body:"依§3Ⅲ⑦，對公務員所為之人事行政行為，不適用本法之程序規定，此為本法明文排除適用之事項類型之一，與同項其他七款事項併列。其立法理由在於人事行政事項具高度特殊性及內部管理性質，另有公務人員考績法、公務人員保障法等特別法規範其權利救濟機制，不宜再重複適用行政程序法之陳述意見、聽證等程序規定，以免程序疊加、延宕人事作業效率。本案該消防員因年度考績遭評定丙等，考績評定核屬機關對其所屬公務員所為之人事行政行為，依§3Ⅲ⑦明文，其作成程序不適用行政程序法之程序規定，機關於評定前無須依本法給予該消防員陳述意見之機會，其主張機關未給予陳述意見致程序有瑕疵云云，於法尚無理由。惟應說明者，人事行政行為雖不適用行政程序法之程序規定，但仍應受公務人員考績法等特別法所定評擬程序及一般法律原則之拘束，該消防員如對考績結果不服，仍得依公務人員保障法規定提起復審或申訴等特別救濟程序，僅非援引行政程序法之陳述意見規定為爭執依據。此與§3Ⅱ排除民意機關、司法機關、監察機關整體適用者不同，§3Ⅲ係針對特定「事項」而非特定「機關」整體排除，縱屬一般行政機關，就人事行政事項亦不適用本法程序規定。\n\n結語：消防員之年度考績評定屬人事行政行為，依§3Ⅲ⑦不適用行政程序法程序規定，其應循公務人員保障法所定復審或申訴程序尋求救濟，而非主張違反行政程序法之陳述意見規定。"},
  {a:"§4", q:"某消防局為增闢財源，未經任何法律或法規命令授權，逕行公告對轄內營業場所每年徵收「消防安全維護費」，並對屆期未繳納者予以列管催繳。", problem:"問：消防局逕行公告徵收消防安全維護費，是否合法？", body:"依§4，行政行為應受法律及一般法律原則之拘束，此為依法行政原則之總則性條文，可再細分為法律優位原則（行政行為不得牴觸法律）及法律保留原則（於一定事項，若無法律或法律授權之依據，行政機關不得作成行政行為，尤其涉及限制人民權利或課予人民義務之事項，須有法律或法規命令之明確授權依據）。徵收費用性質上屬對人民財產權之侵益措施，依相關司法解釋意旨，屬應以法律或法律具體明確授權之法規命令定之之事項，機關不得自行創設收費名目及徵收依據。本案消防局為增闢財源，並未經任何法律或法規命令授權，逕行以公告方式對轄內營業場所每年徵收「消防安全維護費」，此一徵收行為顯欠缺法律或法規命令之授權基礎，核與§4依法行政原則中法律保留原則之要求不符，該公告徵收行為應屬違法，對屆期未繳納者所為之列管催繳措施，因欠缺合法徵收依據，亦失所附麗，一併違法。與行政指導（§165）不同，行政指導不具強制力、人民得自由決定是否配合，尚無須法律授權；然本案消防局係以「列管催繳」之方式促使業者繳納，實質上已具有促其負擔金錢給付義務之強制或準強制性質，更彰顯其欠缺法律授權而逕行課予人民財產上負擔之違法性。\n\n結語：消防局逕行公告徵收消防安全維護費之行為，因欠缺法律或法規命令授權，違反§4依法行政原則中之法律保留原則，該公告及後續列管催繳措施均屬違法，業者得拒絕繳納並循行政爭訟途徑救濟。"},
  {a:"§11Ⅴ", q:"甲、乙兩消防分隊為減輕彼此工作負荷，未經任何法規變更程序，僅由兩隊長口頭協議互相調換轄內部分里別之管轄範圍，並自行依此新劃分受理後續案件。", problem:"問：甲乙兩分隊隊長口頭協議互換管轄範圍，是否發生合法變更管轄之效力？", body:"依§11Ⅰ，行政機關之管轄權，依其組織法規或其他行政法規定之；依§11Ⅴ，管轄權非依法規不得設定或變更，此即管轄恆定原則，係管轄制度之基本鐵律，目的在維持行政組織權責分工之安定性與可預見性，避免機關間任意私下協議、變更法定管轄範圍，致人民無所適從，亦防止機關藉調整管轄規避應盡之職責。其要件可拆解為：管轄權之設定或變更須有法規依據、非依法規不得任意為之，縱使相關機關間彼此同意亦不生變更管轄之效力。本案甲、乙兩消防分隊隊長僅因減輕工作負荷之便宜考量，未經任何法規變更程序，逕以口頭協議互相調換轄內部分里別之管轄範圍，此種調整純屬機關內部便宜措施，並非依組織法規或其他行政法規所為之合法變更，核與§11Ⅴ管轄恆定原則顯不相符，該口頭協議在法律上不生變更管轄權之效力，兩分隊仍應依原法定管轄範圍受理案件。應與§18區辨：§18規範管轄權因法規或事實變更而嗣後喪失時之處理方式，前提仍須先有合法之管轄權變更依據，與本案隊長逕行協議變更管轄之情形不同。若兩分隊依此非法變更之範圍受理案件並作成行政處分，該處分即有管轄權違法之瑕疵，仍應視具體情形依§115判斷是否須撤銷。\n\n結語：甲、乙兩分隊隊長口頭協議互換管轄範圍，因違反§11Ⅴ管轄恆定原則而不生效力，兩分隊應回歸原法定管轄範圍受理案件，已依新劃分受理之案件亦有管轄權瑕疵之虞。"},
  {a:"§15Ⅱ", q:"某消防局因轄內特殊場所之消防安全設備性能鑑定業務所需專業儀器與人力不足，依法規將該部分鑑定權限，委託與其不相隸屬之經濟部標準檢驗局執行，並公告委託事項及法規依據。", problem:"問：消防局委託不相隸屬之標準檢驗局辦理鑑定業務，是否符合法定程序？", body:"依§15Ⅱ，行政機關因業務上之需要，得依法規將其權限之一部分，委託不相隸屬之行政機關執行之；依同條第3項，前二項情形，應將委任或委託事項及法規依據公告之，並刊登政府公報或新聞紙。此即「委託」制度，須與同條第1項「委任」（對所屬下級機關）相區辨：委任係對上下隸屬關係之下級機關，委託則係對不相隸屬之平行機關，二者於權限移轉對象上性質不同，惟均須具備法規依據並踐行公告程序此一共通要件。本案某消防局因轄內特殊場所之消防安全設備性能鑑定業務所需專業儀器與人力不足，依法規將該部分鑑定權限，委託與其不相隸屬之經濟部標準檢驗局執行，其委託對象為不相隸屬之平行機關，核屬§15Ⅱ所稱之「委託」而非「委任」；消防局並已公告委託事項及法規依據，形式上已踐行§15Ⅲ所要求之公告義務，程序上應認合法有效。委託生效後，標準檢驗局於委託範圍內即取得該鑑定業務之權限，得以自己名義對外作成相關鑑定結果或處分，其性質仍為機關對機關之公權力移轉，與§2Ⅲ委託民間團體或個人辦理僅視為行政機關而非取得獨立管轄權之效果並不完全相同，應予區辨。倘消防局後續就受託事項再為干預或逕行處理，即可能構成越權，應避免之。\n\n結語：消防局依§15Ⅱ、Ⅲ將鑑定權限委託標準檢驗局並依法公告，程序核屬合法，標準檢驗局於委託範圍內即取得該業務之管轄權限，得以自己名義作成鑑定結果。"},
  {a:"§18", q:"某消防安全檢查案件審理過程中，因行政區劃調整，原受理之A消防局喪失該轄區管轄權，改由B消防局管轄；惟當事人及B消防局均同意仍由已進行大半審查程序之A消防局繼續處理該案件。", problem:"問：A消防局於喪失管轄權後，得否經同意繼續處理本案？", body:"依§18，行政機關因法規或事實之變更而喪失管轄權時，應將案件移送有管轄權之機關，並通知當事人；但經當事人及有管轄權機關之同意，亦得由原管轄機關繼續處理該案件。其要件可拆解為：原則為原機關因法規或事實變更喪失管轄權者，應移送有管轄權機關並通知當事人，此為原則性規範，目的在確保案件回歸法定管轄機關處理；例外則於當事人及有管轄權機關均同意之情形下，得由原管轄機關繼續處理，兼顧程序經濟與已進行程序之延續性，避免因管轄權變動而使既有審查成果盡付東流。本案因行政區劃調整，原受理之A消防局喪失該轄區管轄權，依§18本文原應將案件移送現有管轄權之B消防局並通知當事人；惟本案當事人已表示同意，現有管轄權之B消防局亦同意由A消防局繼續處理，二項同意要件均已具備，核與§18但書規定相符，A消防局自得繼續處理該已進行大半審查程序之案件，無須移送，亦不因管轄權嗣後喪失而使先前已進行之程序歸於無效。此規定與§13管轄競合、§14管轄權爭議之處理機制有別，§18處理的是單一機關於程序進行中嗣後喪失管轄權之情形，而非數機關同時有管轄權之競合或爭議問題，作答時應注意條文適用情境之差異。\n\n結語：本案A消防局經當事人及B消防局同意，依§18但書得繼續處理本案，該同意應以明確方式表示，A消防局所作成之後續處分於管轄權上核屬合法。"},
  {a:"§19Ⅱ⑤", q:"消防局為查明某地處偏遠山區場所是否違規使用瓦斯設備，因自行派員前往需耗費大量交通與人力成本，而與其無隸屬關係之當地鄉公所人員經常在地巡查，消防局遂請求鄉公所代為赴現場初步查核並回報結果。", problem:"問：消防局請求鄉公所代為赴現場查核，是否符合職務協助之要件？", body:"依§19Ⅱ，行政機關執行職務時，有六款情形之一者，得向無隸屬關係之其他機關請求協助，其中第五款規定：由被請求機關協助執行，顯較經濟者。此款事由著重於行政效能與資源整合之考量，機關雖非因法律上或事實上不能獨自執行職務，然若由其他機關協助執行顯較自行辦理節省成本、提升效率，亦得依此款請求職務協助。本案消防局為查明地處偏遠山區場所是否違規使用瓦斯設備，若自行派員前往，需耗費大量交通與人力成本，而與其無隸屬關係之當地鄉公所人員因業務性質經常在地巡查，對當地地形及場所狀況較為熟悉，若由鄉公所代為赴現場初步查核並回報結果，顯較消防局自行派員辦理更為經濟有效率，核與§19Ⅱ⑤「顯較經濟」之要件相符，消防局得據以向鄉公所請求職務協助。依§19Ⅲ，此項請求除緊急情形外，應以書面為之，消防局仍須注意以書面方式提出請求，並敘明協助事項及理由。應與§19Ⅱ②「因人員設備不足等事實上原因不能獨自執行職務」相區辨：本案消防局並非全然無法自行派員前往，僅係成本較高，故較宜歸類於第五款「顯較經濟」，而非第二款「不能獨自執行」，惟二者於具體個案有時亦可能競合。鄉公所受請求後，除有§19Ⅳ應拒絕或§19Ⅴ得拒絕之事由外，原則上應予協助。\n\n結語：消防局依§19Ⅱ⑤請求鄉公所協助現場查核，於法有據，鄉公所除有法定拒絕事由外，應本於§19Ⅰ機關互助義務予以協助配合。"},
  {a:"§19Ⅴ", q:"A消防局請求B警察機關於特定時段協助戒護某場所安全檢查現場秩序，惟B警察機關轄內當日適逢重大治安事件，全體警力已調派一空，實無餘裕人力可供支援，遂函復婉拒並說明理由。", problem:"問：B警察機關以無餘裕警力為由婉拒協助，是否於法有據？", body:"依§19Ⅴ，被請求機關認有正當理由不能協助者，得拒絕之。此為職務協助被請求機關之裁量性拒絕事由，與§19Ⅳ①②所定應拒絕之義務性事由不同：後者係被請求機關無裁量餘地，一旦符合非其權限範圍或依法不得為之、或將嚴重妨害其自身職務之執行，即負有拒絕義務；前者則賦予被請求機關依個案情形審酌是否具有正當理由而裁量決定是否協助，其認定標準較有彈性，惟仍須有客觀合理之正當事由，不得恣意拒絕。本案A消防局請求B警察機關於特定時段協助戒護安全檢查現場秩序，屬適法之職務協助請求；惟B警察機關轄內當日適逢重大治安事件，全體警力已調派一空，實無餘裕人力可供支援，此一情形客觀上確屬人力調度困難之正當事由，核與§19Ⅴ認有正當理由不能協助之要件相符，B警察機關得依法婉拒協助，其拒絕於法有據，並非違法。B警察機關並已函復婉拒並說明理由，亦與§19Ⅵ被請求機關認有拒絕事由時應將理由通知請求協助機關之程序要求相符。倘A消防局對此拒絕有異議，得依§19Ⅵ後段，向共同上級機關請求決定，無共同上級機關者，向被請求機關之上級機關請求決定，而非逕自認定B機關違反協助義務。\n\n結語：B警察機關依§19Ⅴ以重大治安事件致警力調派一空為由婉拒協助，於法有據，A消防局如有異議，應循§19Ⅵ規定之共同上級機關決定機制處理。"},
  {a:"§22Ⅰ③", q:"某未辦理法人登記、僅設有主任委員之社區管理委員會，就轄區內消防安全改善事宜向消防局提出陳情，全程均由該委員會選任之主任委員出面代表提出陳情並與機關聯繫。", problem:"問：該社區管理委員會由主任委員代表出面陳情，是否具行政程序行為能力？", body:"依§21③，非法人之團體設有代表人或管理人者，具有行政程序之當事人能力，得為行政程序之當事人；依§22Ⅰ③，非法人之團體由其代表人或管理人為行政程序行為者，具有行政程序之行為能力。二者須合併觀察：前者決定誰能當當事人，後者決定誰能自己實際進行程序行為。本案社區管理委員會雖未依法辦理法人登記，然已依規約選任主任委員為代表人，依§21③已具備當事人能力，得以該委員會名義作為行政程序之當事人；又依§22Ⅰ③，該委員會既已設有代表人，即由該代表人為行政程序行為，全程由主任委員出面代表提出陳情並與消防局承辦人員聯繫，核與§22Ⅰ③要件相符，應認具備合法之行政程序行為能力，其陳情行為合法有效，消防局不得以委員會非法人、無登記為由拒絕受理其陳情。此與自然人依§22Ⅰ①須具備完全行為能力、法人依§22Ⅰ②由其代表人為行政程序行為之規範精神相互呼應，均係以代表人或本人具行為能力作為判斷行為能力之基準。應注意者，非法人團體若未設代表人或管理人，則依§21③即不具當事人能力，更遑論行為能力，消防局於受理陳情或申請時，宜先查核該團體是否已選任代表人並得提出相關證明文件。\n\n結語：本案社區管理委員會已依規約選任主任委員為代表人，依§21③、§22Ⅰ③兼具當事人能力及行政程序行為能力，由主任委員代表提出之陳情合法有效，消防局應予受理。"},
  {a:"§23", q:"消防局就某工廠設備變更是否符合消防安全規定進行審查，該審查結果可能影響毗鄰廠房承租人之營業權益；該承租人雖未主動提出申請，消防局仍依職權通知其參加程序表示意見。", problem:"問：消防局依職權通知承租人參加程序，是否於法有據？", body:"依§23，因程序之進行將影響第三人之權利或法律上利益者，行政機關得依職權或依申請，通知其參加為當事人。此係賦予機關裁量權，得將程序進行中可能受影響之利害關係第三人納入程序參與，保障其陳述意見等程序上權利，避免其權益因未參與程序而在不知情之情況下受影響，亦有助於機關更周延地掌握相關事實及利益衝突狀況。其要件可拆解為：須有第三人、其權利或法律上利益因程序之進行有受影響之可能、機關得依職權或依該第三人之申請通知其參加，是否通知繫諸機關之合理裁量，尚非第三人所得請求機關必為通知之義務性規定。本案消防局就某工廠設備變更是否符合消防安全規定進行審查，其審查結果可能影響毗鄰廠房承租人之營業權益，該承租人核屬因程序進行而可能受影響法律上利益之第三人；縱該承租人未主動提出參加申請，消防局仍得依§23本於職權主動通知其參加程序表示意見，於法有據，並非法所不許或逾越權限之行為。此一制度設計與§20當事人範圍第六款其他依本法規定參加行政程序之人相互呼應，該承租人一經機關通知參加，即取得當事人地位，享有陳述意見、閱覽卷宗等相應之程序上權利，機關並應依§9兼顧其有利不利情形。\n\n結語：消防局依§23依職權通知毗鄰承租人參加程序，於法有據，該承租人經通知後即取得當事人地位，得於程序中陳述意見以維護自身權益。"},
  {a:"§32②", q:"承辦某場所消防安全設備改善裁罰案件之公務員，其配偶恰與該場所負責人就該場所之營業登記為共同經營人，兩人對該場所負有共同義務；該公務員明知此一關係，仍繼續承辦本案而未自行迴避。", problem:"問：該公務員未自行迴避繼續承辦本案，是否違反迴避規定？", body:"依§32②，公務員在行政程序中，本人或其配偶、前配偶，就該事件與當事人有共同權利人或共同義務人之關係者，應自行迴避，此為自行迴避四款法定事由之一，屬強制迴避事由，不待當事人申請，公務員本人即負有主動迴避之法定義務，一旦客觀上符合該款事由，其繼續承辦即屬違法，不因公務員主觀上自認公正而阻卻。其要件可拆解為：迴避事由主體包含公務員本人及其配偶、前配偶、須與當事人有共同權利人或共同義務人之關係、該關係須存在於本案所涉之具體事件。本案承辦裁罰案件之公務員，其配偶恰與該場所負責人就該場所之營業登記為共同經營人，兩人對該場所負有共同義務，其配偶與當事人間顯已具備共同義務人之關係，核與§32②要件相符，該公務員即應自行迴避，不待負責人或機關主動要求。該公務員明知此一關係卻仍繼續承辦本案，顯已違反§32自行迴避之法定義務，其承辦程序即有重大瑕疵可指摘，恐使裁處結果之公正性受質疑。此時依§33Ⅴ，公務員有前條所定情形不自行迴避，而未經當事人申請迴避者，應由該公務員所屬機關依職權命其迴避，機關發覺後應主動介入命其迴避，不待負責人提出申請，以維護行政程序之公正性與人民對機關之信賴。\n\n結語：該公務員依§32②應自行迴避而未迴避，其承辦程序具重大瑕疵，機關發覺後應依§33Ⅴ依職權命其迴避並改分他人辦理，以確保裁處程序之公正。"},
  {a:"§32④", q:"某公務員於甲場所火災原因調查程序中，曾以證人身分到場陳述其所目睹之火災發生經過；嗣後該公務員調任至裁罰業務單位，該場所後續之消防法令裁罰案件又指派由其承辦。", problem:"問：曾任證人之公務員嗣後承辦同一場所之裁罰案件，是否違反迴避規定？", body:"依§32④，公務員在行政程序中，於該事件曾為證人、鑑定人者，應自行迴避，此為自行迴避四款法定事由之一，其立法意旨在於曾任證人或鑑定人者，因已就該事件之事實有一定之認知或立場，若再參與作成處分之程序，難期公正客觀，且可能出現球員兼裁判之外觀疑慮，有損程序公正性及人民對行政之信賴，故課予其自行迴避之義務。其要件可拆解為：須為同一事件、公務員曾以證人或鑑定人身分參與該事件之調查或陳述程序、嗣後又參與該事件後續行政程序之作成。本案該公務員於甲場所火災原因調查程序中，曾以證人身分到場陳述其所目睹之火災發生經過，其後雖調任至裁罰業務單位，然該場所後續之消防法令裁罰案件，實質上與先前火災原因調查程序屬同一事件脈絡下之延續，該公務員曾為該事件之證人，依§32④即應自行迴避該裁罰案件之承辦，機關竟又指派由其承辦，核與§32④之規範意旨顯不相符，應認該公務員負有自行迴避之義務而未履行。若機關未察覺此一情形而仍由其承辦並作成裁處，該裁處程序即存有應迴避而未迴避之重大瑕疵，日後如經當事人或機關發覺，依§33Ⅴ，機關應依職權命其迴避，並改分他人重新辦理，以免裁處結果受其先前證人身分所形成之預斷或立場影響而失其公正性。\n\n結語：該公務員曾為本案證人，依§32④應自行迴避裁罰業務之承辦，機關指派其承辦已有違反迴避規定之瑕疵，發覺後應依§33Ⅴ命其迴避並改分他人辦理。"},
  {a:"§33Ⅰ②", q:"某場所負責人發現承辦本案裁罰事宜之公務員，與其為同一間健身房之長期會員，兩人經常一同運動、往來密切，惟並無親屬或代理等關係；負責人以此具體事實為由，向該公務員所屬機關申請其迴避。", problem:"問：負責人得否以承辦人與其私交甚篤為由申請該公務員迴避？", body:"依§33Ⅰ，公務員有二款情形之一者，當事人得申請迴避：第一款為有§32所定之情形而不自行迴避者；第二款為有具體事實，足認其執行職務有偏頗之虞者。第二款屬概括性條款，與§32列舉式之四款自行迴避事由不同，其適用範圍較廣，凡足以使一般人客觀上懷疑承辦公務員執行職務公正性之具體事實，縱未達親屬、共同權利義務人等§32列舉關係之程度，仍可能構成本款所稱有偏頗之虞。其要件可拆解為：須有具體事實、該事實客觀上足認公務員執行職務有偏頗之虞、由當事人向該公務員所屬機關提出申請並敘明原因事實、機關應為適當之釋明審查。本案該場所負責人發現承辦裁罰事宜之公務員與其為同一間健身房之長期會員，兩人經常一同運動、往來密切，雖並無親屬或代理等§32所列舉之法定關係，然此私交密切之具體事實，客觀上已足以使一般人合理懷疑該公務員執行職務之公正性，核與§33Ⅰ②有具體事實足認執行職務有偏頗之虞之要件相符，負責人依法得向該公務員所屬機關申請其迴避。依§33Ⅱ，申請應舉其原因及事實並為適當之釋明，被申請迴避之公務員得提出意見書；依§33Ⅳ，於機關為准駁決定前，該公務員應停止行政程序，但有急迫情形仍應為必要處置。\n\n結語：本案負責人依§33Ⅰ②具體事實足認偏頗之虞，得申請該公務員迴避，機關受理後應依§33Ⅱ、Ⅳ規定審查並於決定前命其停止行政程序。"},
  {a:"§33Ⅴ", q:"機關內部分派案件時發現，承辦人與當事人具有四親等內血親關係，惟當事人對此並不知情、亦未提出任何迴避申請；機關主管察覺後，依職權命該承辦人迴避，改分由他人辦理。", problem:"問：機關主管依職權命承辦人迴避，是否於法有據？", body:"依§32①，公務員本人或其配偶、前配偶、四親等內之血親或三親等內之姻親或曾有此關係者為事件之當事人時，應自行迴避，此屬公務員應自行迴避之法定事由，不待任何人申請即當然發生迴避義務。依§33Ⅴ，公務員有前條所定情形不自行迴避，而未經當事人申請迴避者，應由該公務員所屬機關依職權命其迴避，此為機關依職權介入迴避機制之明文依據，其要件可拆解為：須客觀上具備§32所列之自行迴避事由、公務員未依法自行迴避、亦未經當事人提出申請迴避，此時機關本身即負有主動察覺並依職權命其迴避之義務，不待任何人提出申請。本案機關內部分派案件時發現，承辦人與當事人具有四親等內血親關係，客觀上已符合§32①應自行迴避之法定事由，惟承辦人並未自行迴避，當事人對此關係亦不知情、自無從提出迴避申請，此正屬§33Ⅴ所規範之典型情形；機關主管察覺後，依職權命該承辦人迴避，改分由他人辦理，核與§33Ⅴ規定要件完全相符，於法有據，且屬機關應盡之法定義務，並非單純之裁量事項。此一設計彰顯迴避制度並非全然仰賴當事人主動發現、申請，機關本身對其所屬公務員是否具備法定迴避事由，亦負有內部把關及主動糾正之義務，以確保程序公正性不因當事人資訊不對等而受影響。\n\n結語：機關主管依§33Ⅴ依職權命承辦人迴避，於法有據，此屬機關為確保程序公正應盡之主動把關義務，不待當事人知情或申請即應為之。"},
  {a:"§32③、§33Ⅰ①", q:"甲君三年前另案曾委任乙擔任其代理人處理相關事宜；乙其後轉任消防機關公務員，現又承辦甲君本次消防安全裁罰案件，明知自己曾任甲君之代理人卻未自行迴避；甲君發現後，具體舉出乙曾任其代理人之事實，向機關申請乙迴避。", problem:"問：甲君得否以乙曾任其代理人為由申請迴避，機關應如何處理？", body:"依§32③，公務員現為或曾為該事件當事人之代理人、輔佐人者，應自行迴避，此為自行迴避法定事由之一；本案乙於轉任消防機關公務員前，曾受甲君委任擔任其代理人處理另案相關事宜，該委任關係與本次消防安全裁罰案件雖非完全同一事件，然乙既明知自己曾任甲君之代理人，本於迴避制度避免公正性受質疑之精神，仍應自行迴避以杜爭議，惟乙未自行迴避，逕行承辦甲君本次裁罰案件。依§33Ⅰ①，公務員有前條所定情形而不自行迴避者，當事人得申請迴避，此款係以§32所列事由為前提，當公務員違反自行迴避義務時，當事人即取得申請迴避之權利，與§33Ⅰ②概括性具體事實足認偏頗之虞之獨立事由性質不同，二者可分別單獨援引。本案甲君具體舉出乙曾任其代理人之事實，核與§33Ⅰ①要件相符，甲君得向乙所屬機關申請其迴避。機關受理後，依§33Ⅱ應命乙就此提出意見書並為適當之釋明審查，如經查證乙確有§32③自行迴避事由而未迴避，機關應依§33Ⅱ、Ⅲ程序處理其申請，准許迴避並改分他人承辦，以維護裁處程序之公正性及甲君對機關之信賴，倘機關駁回申請，甲君不服，依§33Ⅲ得於五日內提請上級機關覆決。\n\n結語：甲君依§32③、§33Ⅰ①得申請乙迴避，機關經查證乙確曾任甲君代理人而未自行迴避者，應准許迴避申請並改分他人承辦本案。"},
  {a:"§9、§10", q:"消防局就某場所違反消防安全設備規定案件進行調查裁罰，承辦人僅調查該場所違規之不利事證，對業者提出其已委請專業廠商積極改善之有利事證置之不理；作成裁罰決定時，並將業者曾與承辦人發生口角之私人恩怨一併納入裁罰輕重之考量。", problem:"問：承辦人裁罰時納入私人恩怨考量，是否構成裁量瑕疵？", body:"依§9，行政機關就該管行政程序，應於當事人有利及不利之情形，一律注意；依§10，行政機關行使裁量權，不得逾越法定之裁量範圍，並應符合法規授權之目的，裁量瑕疵可再細分為裁量逾越、裁量濫用（違反授權目的、一般法律原則，或納入不相關因素）、裁量怠惰三種類型。本案承辦人僅調查該場所違規之不利事證，對業者已提出其委請專業廠商積極改善之有利事證置之不理，顯已違反§9有利不利一體注意原則，其事實認定程序即有瑕疵；更甚者，承辦人於作成裁罰決定時，竟將業者曾與其發生口角之私人恩怨一併納入裁罰輕重之考量，此私人恩怨顯與消防法令裁罰目的毫無關聯，核屬納入不相關因素之典型裁量濫用情形，違反§10裁量權應符合法規授權目的之要求，亦有違§6平等原則之虞。承辦人已完成改善之有利事證未受斟酌，亦可能構成裁量怠惰。本案事實認定瑕疵與裁量濫用二者併存，均足以構成該裁罰處分之違法事由，業者得於訴願或行政訴訟中一併主張，請求撤銷原處分，並促請機關重新於排除私人恩怨等不相關因素、並充分斟酌有利事證後，另為適法之裁量。\n\n結語：本案承辦人事實認定未依§9兼顧有利事證，裁量復摻入與立法目的無關之私人恩怨，違反§10禁止裁量濫用之要求，該裁處處分應屬違法，業者得提起行政爭訟請求撤銷。"},
  {a:"§6、§8", q:"消防局對轄內同類場所違反消防安全設備規定之案件，歷年來均依內部慣例從輕處以警告並給予改善期限，業者均已依此慣例信賴並安排場所營運計畫；某日消防局無正當理由，獨對其中一家場所改採從重裁罰且未給予改善期限，其餘同類場所仍依慣例從輕處理。", problem:"問：消防局無正當理由對單一場所改採從重裁罰，是否違法？", body:"依§6，行政行為非有正當理由，不得為差別待遇，此為平等原則，並非機械式齊頭平等，而係相同事件同樣處理、不同事件不同處理之實質平等；依§8前段，行政行為應以誠實信用之方法為之，並應保護人民正當合理之信賴，此即誠信原則與信賴保護原則，機關長期一貫之行政慣例本身雖非法規，然若已形成行政自我拘束，人民因信賴該慣例而為財產上或營業上之安排，其信賴即應受保護。本案消防局對轄內同類場所違反消防安全設備規定案件，歷年來均依內部慣例從輕處以警告並給予改善期限，業者均已依此慣例信賴並安排場所營運計畫，此一長期一貫之慣例已足以構成人民信賴之基礎，且業者已有信賴表現，其信賴應屬值得保護。惟消防局竟無正當理由，獨對其中一家場所改採從重裁罰且未給予改善期限，其餘同類場所仍依慣例從輕處理，此一差別待遇缺乏正當理由，核與§6平等原則顯不相符，構成違法之差別待遇；同時亦使該業者長期信賴之慣例遭無端推翻，未見任何過渡措施或合理說明，亦違反§8誠信及信賴保護原則之精神。此與機關基於個案特殊違規情節加重裁罰之情形不同，本案並無任何個案特殊事由為差別待遇之正當化基礎。\n\n結語：消防局無正當理由對單一場所改採從重裁罰，違反§6平等原則及§8信賴保護原則，該處分應屬違法，業者得提起訴願及行政訴訟請求撤銷，並要求依慣例重為適法之裁量。"},
  {a:"§34", q:"甲君依相關法規規定，向消防局提出場所使用執照變更之申請，消防局承辦人員以案件不具急迫性、機關人力不足為由，逾三個月仍未開始受理審查程序。", problem:"問：消防局得否以案件不具急迫性為由，遲不開始審查程序？", body:"依§34，行政程序之開始，原則上由行政機關依職權定之，此為職權主義之基本原則；但但書規定，依本法或其他法規之規定有開始行政程序之義務，或當事人已依法規之規定提出申請者，不在此限，此時機關即不得再自由裁量是否受理，而負有開始程序之法定義務，此為申請主義對職權主義之限制。本案甲君係依相關法規規定，就場所使用執照變更事項向消防局提出申請，核屬「當事人已依法規提出申請」之情形，依§34但書，消防局即負有開始審查程序之法定義務，不得再以案件是否具急迫性、機關另有其他優先處理事項等內部行政資源分配之考量為由，恣意延宕不開始程序；倘消防局怠於開始審查，甲君得依法提起課予義務訴願及訴訟，請求機關應為特定之行政行為。又機關內部案件優先次序之安排，屬其行政資源分配之裁量事項，固非全然不得考量，惟此僅得作為程序進行快慢之參考，不得作為完全不啟動法定應辦程序之正當理由，二者分際應予釐清。\n\n結語：消防局遲未開始審查程序，已違反§34但書所課予之程序開啟義務，甲君得請求消防局儘速依法開始審查，並得於必要時循行政救濟途徑主張權利。"},
  {a:"§35", q:"阿明識字有限，親自至消防局櫃檯以言詞方式提出防火管理人變更之申請，承辦人員僅口頭聽取內容後即逕行結案，未作成紀錄向阿明朗讀確認，亦未經其簽名或蓋章。", problem:"問：承辦人員未依規定作成紀錄並經確認簽章，該申請程序是否合法？", body:"依§35，當事人依法向行政機關提出申請者，除法規另有規定外，得以書面或言詞為之；以言詞為申請者，受理之行政機關應作成紀錄，經向申請人朗讀或使閱覽，確認其內容無誤後由其簽名或蓋章。其要件可拆解為：申請方式原則上書面言詞皆可、以言詞申請時機關負有作成紀錄之義務、須向申請人朗讀或使閱覽以確認內容無誤、最終應由申請人簽名或蓋章，此一程序設計目的在確保言詞申請之內容經雙方確認無誤，避免事後產生爭議，兼顧識字有限或不諳書寫之民眾亦能便利行使申請權，體現行政程序對弱勢族群之照顧。本案阿明識字有限，親自至消防局櫃檯以言詞方式提出防火管理人變更之申請，屬§35所容許之言詞申請方式，然承辦人員僅口頭聽取內容後即逕行結案，未依§35規定作成紀錄向阿明朗讀確認，亦未經其簽名或蓋章，顯已違反§35所定言詞申請應踐行之法定程序，其受理程序即有瑕疵。此一瑕疵尤其對識字有限之阿明影響甚鉅，因其無從以書面自行確認申請內容是否經正確記載及處理，若嗣後就申請內容之真意產生爭執，將因欠缺書面紀錄而舉證困難，機關應速補正作成紀錄並經其確認簽章，以確保其申請內容獲得正確處理。\n\n結語：承辦人員未依§35作成紀錄並經阿明朗讀確認簽章，其受理程序具有瑕疵，消防局應速補行紀錄作成及確認程序，以保障阿明之申請權益。"},
  {a:"§39", q:"消防局為查明某工廠負責人是否知悉場所違規使用情事，以書面通知該負責人到場陳述意見，惟通知書僅記載到場之時間及地點，並未載明詢問目的，亦未敘明不到場所生之效果。", problem:"問：消防局所發通知書漏未記載詢問目的及不到場效果，是否合法？", body:"依§39，行政機關基於調查事實及證據之必要，得以書面通知相關之人陳述意見，通知書中應記載詢問目的、時間、地點、得否委託他人到場及不到場所生之效果。此係機關為調查事實而通知相關人到場陳述意見之通知書應記載事項，其要件可拆解為五項：詢問目的、時間、地點、得否委託他人到場、不到場所生之效果，五項均應記載，目的在使受通知人能充分知悉到場陳述之緣由及未到場之法律上不利益，以決定是否到場及如何準備陳述內容，屬正當程序保障之具體展現。本案消防局為查明工廠負責人是否知悉場所違規使用情事，以書面通知該負責人到場陳述意見，性質上屬本於§39調查事實及證據必要所為之通知，然通知書僅記載到場之時間及地點，並未載明詢問目的，亦未敘明不到場所生之效果，顯然欠缺§39所要求應記載事項中之重要部分，核與該條規定不符，該通知書之記載即有瑕疵。此瑕疵可能影響負責人是否到場及如何準備陳述之判斷，倘負責人因不知詢問目的或不到場後果而未到場，機關逕依現有事證為不利認定，即可能構成程序保障不足之違法。應與§104陳述意見通知相區辨：§39係調查事實階段之通知，§104則係處分作成前給予陳述意見機會之通知，§102並明文已依第39條規定通知陳述意見者，得毋庸再依§104另行通知。\n\n結語：消防局所發通知書漏未記載詢問目的及不到場效果，違反§39規定，該通知程序具有瑕疵，消防局應予補正並重新通知該負責人到場陳述意見。"},
  {a:"§41Ⅱ", q:"鑑定人受消防局委託，就某倉庫火災是否起因於電氣設備老化以書面提出鑑定報告，消防局審閱後認報告內容仍有未盡明確之處，遂通知該鑑定人到場說明。", problem:"問：消防局通知鑑定人到場說明鑑定報告內容，是否於法有據？", body:"依§41Ⅰ，行政機關得選定適當之人為鑑定；依§41Ⅱ，以書面為鑑定者，必要時，得通知鑑定人到場說明。其要件可拆解為：鑑定人係機關依§41Ⅰ選定就專業事項提供意見之人、鑑定結果得以書面方式提出、機關審閱書面鑑定報告後，若認有必要，得通知該鑑定人到場說明，此為書面鑑定之補充機制，兼顧鑑定程序之經濟性與必要時之周延性。本案鑑定人受消防局委託，就某倉庫火災是否起因於電氣設備老化，以書面提出鑑定報告，核屬§41Ⅰ機關選定鑑定人並以書面方式為鑑定之典型情形；消防局審閱該書面鑑定報告後，認報告內容仍有未盡明確之處，遂通知該鑑定人到場說明，核與§41Ⅱ以書面為鑑定者必要時得通知鑑定人到場說明之要件完全相符，於法有據，並非法所不許或增加鑑定人不必要之負擔。此一制度設計有助於機關進一步釐清鑑定報告中未盡明確之專業判斷依據，使機關嗣後依§43依論理及經驗法則判斷事實真偽時，有更充分完整之證據基礎，亦有助於保障當事人程序上之知悉及參與利益。鑑定人到場說明後，其陳述內容宜依§38製作書面紀錄附卷，以資查考；依§53，鑑定人並得就此請求相當之日費、旅費及報酬，機關亦得預行酌給。\n\n結語：消防局依§41Ⅱ通知鑑定人到場說明鑑定報告未盡明確之處，於法有據，鑑定人到場陳述內容應予紀錄附卷，作為機關認定火災原因之補充依據。"},
  {a:"§46Ⅰ", q:"與甲君受裁罰案件全然無關之路人丙君，因單純好奇該案裁處內容，向消防局申請閱覽甲君受裁罰案件之相關卷宗，惟丙君無法說明其與該案有何法律上利益。", problem:"問：消防局得否拒絕丙君閱覽甲君裁罰案卷宗之申請？", body:"依§46Ⅰ，當事人或利害關係人得向行政機關申請閱覽、抄寫、複印或攝影有關資料或卷宗，但以主張或維護其法律上利益有必要者為限。其要件可拆解為：申請人須為當事人或利害關係人、申請目的須在主張或維護自己之法律上利益、且該閱覽須具有必要性，二者缺一即不符本條要件。此一資格限制之立法目的在於平衡人民卷宗閱覽權之保障與個人資料保護、行政效能及第三人隱私等公益之維護，避免卷宗閱覽制度遭浮濫利用，成為單純滿足好奇心或蒐集他人隱私資訊之管道。本案路人丙君與甲君受裁罰案件全然無關，其申請閱覽該案卷宗之動機純係單純好奇該案裁處內容，並無任何得主張或維護之法律上利益，其亦無法說明其與該案有何法律上利益，核與§46Ⅰ當事人或利害關係人及主張或維護其法律上利益有必要二項要件均不相符，消防局自得依法拒絕丙君之閱覽申請，並非違反資訊公開或程序參與之精神。此與已依§20、§23取得當事人或利害關係人地位者不同，該等人閱覽卷宗係為主張或維護自身受影響之權益，性質上與丙君單純好奇之情形迥異。倘丙君欲知悉一般性之消防裁罰統計或原則性資訊，宜另循政府資訊公開法相關規定申請一般政府資訊，而非援引§46申請閱覽特定個案卷宗。\n\n結語：丙君非本案當事人或利害關係人，亦無法律上利益之主張，消防局依§46Ⅰ得拒絕其閱覽申請，丙君如欲知悉相關資訊，應另循政府資訊公開法途徑處理。"},
  {a:"§46Ⅱ③、§46Ⅲ", q:"甲君申請閱覽某同業場所公共安全檢查案卷宗，其中部分內容記載該場所消防安全設備之詳細配置圖，依法規屬應保密之營業秘密，消防局遂將整份卷宗均予拒絕閱覽，未區分卷宗中無保密必要之其餘部分逕予准許閱覽。", problem:"問：消防局逕將整份卷宗均予拒絕閱覽，是否合法？", body:"依§46Ⅱ③，行政機關對於卷宗閱覽之申請，除有列舉事由外不得拒絕，其中第三款為涉及個人隱私、職業秘密、營業秘密，依法規規定有保密之必要者，機關得就此部分拒絕閱覽。惟依§46Ⅲ，前項第二款及第三款無保密必要之部分，仍應准許閱覽，此即卷宗閱覽權之部分准駁原則，要求機關就具保密必要與無保密必要之內容予以區分處理，不得僅因卷宗中夾雜部分應保密事項，即概括拒絕閱覽全部卷宗，以兼顧當事人閱覽權與第三人營業秘密保護二者之平衡。本案甲君申請閱覽某同業場所公共安全檢查案卷宗，其中固然部分內容記載該場所消防安全設備之詳細配置圖，依法規屬應保密之營業秘密，消防局就此部分依§46Ⅱ③拒絕閱覽，於法有據；惟消防局竟將整份卷宗均予拒絕閱覽，未區分卷宗中無保密必要之其餘部分逕予准許閱覽，顯已違反§46Ⅲ所定應區分處理之義務，其全部拒絕閱覽之處置於法尚有未合。正確作法應係就涉及營業秘密之配置圖部分予以遮蔽或另行抽離後拒絕該部分，其餘無保密必要之卷宗內容仍應准許甲君閱覽、抄寫、複印或攝影，不得以卷宗中存有部分應保密內容，作為拒絕全部卷宗閱覽之正當事由。\n\n結語：消防局就涉及營業秘密之配置圖部分得依§46Ⅱ③拒絕閱覽，惟未依§46Ⅲ區分其餘無保密必要部分逕予准許，其全部拒絕閱覽之處置違法，應予補正。"},
  {a:"§46Ⅳ", q:"甲君閱覽其自身受裁罰案件之卷宗後，發現卷宗中關於其住居所地址之記載有誤，乃檢具戶籍謄本向消防局請求更正該項記載。", problem:"問：甲君得否請求消防局更正卷宗中關於其住居所地址之錯誤記載？", body:"依§46Ⅳ，當事人就第1項資料或卷宗內容關於自身之記載有錯誤者，得檢具事實證明，請求相關機關更正。其要件可拆解為：須為當事人本人、卷宗內容確有關於其自身之錯誤記載、當事人須檢具事實證明文件、向相關機關提出更正請求，此為卷宗閱覽權之延伸配套機制，使當事人於行使閱覽權後，若發現卷宗記載有誤，得進一步請求更正，以確保機關所持有關於己身之資料正確完整，避免因錯誤記載而影響後續行政處分之作成或其他權益。本案甲君閱覽其自身受裁罰案件之卷宗後，發現卷宗中關於其住居所地址之記載有誤，此屬關於甲君自身之記載錯誤，甲君並已檢具戶籍謄本此一足資證明正確地址之事實證明文件，向消防局請求更正該項記載，核與§46Ⅳ之要件悉數相符，消防局應予受理並依查核結果為適當之更正。此與§101顯然錯誤更正制度應予區辨：§101係針對行政處分本身之誤寫誤算等顯然錯誤所為之更正機制，而§46Ⅳ則係針對機關持有卷宗內容關於當事人自身記載錯誤之更正請求，二者規範對象及發動主體雖有部分相似，惟適用範圍及性質仍有不同，倘該地址記載錯誤已影響原裁處書上之記載，仍應併依§101處理處分書本身之更正。\n\n結語：甲君依§46Ⅳ檢具戶籍謄本請求更正卷宗中之地址記載錯誤，於法有據，消防局應予查核並更正，如裁處書本身亦有相同錯誤，並應併依§101辦理更正。"},
  {a:"§47Ⅲ", q:"消防局承辦人員因調查所需，於非正式場合以電話與當事人聯繫並談及案情細節，惟事後僅憑記憶處理，並未將通話之對象、時間、地點及內容作成書面紀錄附卷。", problem:"問：承辦人員未就電話聯繫作成書面紀錄，是否違反程序外接觸之規定？", body:"依§47Ⅰ，公務員在行政程序中，除基於職務上之必要外，不得與當事人或代表其利益之人為行政程序外之接觸；依§47Ⅲ，前項接觸非以書面為之者，應作成書面紀錄，載明接觸對象、時間、地點及內容。此係規範公務員與當事人程序外接觸透明化義務之條文，其要件可拆解為：須為公務員與當事人或代表其利益之人於行政程序外之接觸、該接觸非以書面方式進行者、公務員負有作成書面紀錄之義務、紀錄內容應載明接觸對象、時間、地點及內容四項要素，目的在防止程序外接觸可能產生之遊說、關說或資訊不對等疑慮，確保程序之公正性與可受公評性，並使其他當事人得依§47Ⅱ知悉並對相關往來書面公開查閱。本案消防局承辦人員因調查所需，於非正式場合以電話與當事人聯繫並談及案情細節，此一電話聯繫核屬§47Ⅰ所稱行政程序外之接觸，依§47Ⅲ本應作成書面紀錄載明接觸對象、時間、地點及內容，惟承辦人員事後僅憑記憶處理，並未將該通話內容作成書面紀錄附卷，顯已違反§47Ⅲ所定之紀錄義務，該次程序外接觸即欠缺應有之透明化保障，日後亦可能因欠缺書面紀錄而生舉證及公正性存疑之爭議。\n\n結語：承辦人員以電話與當事人為程序外接觸卻未依§47Ⅲ作成書面紀錄，已違反本條規定，消防局應要求承辦人員盡速補行紀錄並附卷，以確保程序公正透明。"},
  {a:"§48Ⅱ", q:"甲君於3月10日收受消防局裁罰處分書，處分書載明應於收受後20日內提起訴願，承辦人員於計算期間時，將3月10日當日一併計入該20日期間之內。", problem:"問：承辦人員將送達當日一併計入20日期間之計算方式，是否合法？", body:"依§48Ⅱ，期間以日、星期、月或年計算者，其始日不計算在內，但法律規定即日起算者，不在此限。此為期間計算始日不計入之基本原則，與民法期間計算原則相仿，其要件可拆解為：期間以日星期月年計算者為適用範圍、原則上始日不計入期間、例外法律另有即日起算規定者從其規定。本案甲君於3月10日收受消防局裁罰處分書，該20日訴願期間應自3月11日起算，始日3月10日不計入，依序計算至第20日屆滿，即應以3月30日為期間末日，如遇例假日則依§48Ⅳ順延；惟承辦人員於計算期間時，竟將3月10日當日一併計入該20日期間之內，此一計算方式顯已違反§48Ⅱ始日不計入之基本原則，將導致期間末日提前一日計算，若因此使甲君實際得行使救濟權利之期間縮短，對甲君之訴願權益顯有不利影響。此期間計算原則亦適用於處分機關教示救濟期間之計算基準，倘因承辦人員錯誤計算而導致機關誤認甲君逾期未提起訴願，甲君得援引§48Ⅱ規定主張正確之期間起算方式，並得請求機關重新核算，如因機關計算錯誤致其權益受損，亦可能涉及§98教示錯誤相關規定之適用。\n\n結語：承辦人員將送達當日一併計入20日期間，違反§48Ⅱ始日不計入之原則，正確期間應自3月11日起算，甲君得據以主張其訴願期間應重新核計。"},
  {a:"§48Ⅴ", q:"消防局對甲君違規使用場所處以限期改善之處分，改善期間之末日恰逢國定假日，消防局仍以該日為期間之末日，未依一般期間計算方式順延至次一工作日。", problem:"問：改善期間末日逢國定假日未予順延，是否合法？", body:"依§48Ⅳ，期間之末日為星期日、國定假日或其他休息日者，以該日之次日為期間之末日；期間之末日為星期六者，以其次星期一上午為期間末日，此為一般期間計算之順延原則。惟依§48Ⅴ，期間涉及人民之處罰或其他不利行政處分者，其始日不計時刻以一日論，其末日為星期日、國定假日或其他休息日者，照計，但依第2項、第4項規定計算，對人民有利者，不在此限，此為涉及不利處分期間計算之特別規定，其要件可拆解為：須為涉及人民處罰或其他不利行政處分之期間、末日遇假日者原則上照計、但若依第2項、第4項計算方式對人民較為有利者，則例外仍適用該有利之計算方式。本案消防局對甲君違規使用場所處以限期改善之處分，此屬對甲君課予改善義務、限制其場所使用權利之不利行政處分，其改善期間之計算應優先適用§48Ⅴ，末日遇國定假日者原則上照計，不予順延，消防局仍以該日為期間末日之作法，核與§48Ⅴ本文規定相符，並非違法。惟仍須注意但書規定，若依§48Ⅱ、Ⅳ一般計算方式順延至次日對甲君較為有利，依§48Ⅴ但書，仍應適用該對人民有利之計算方式，此時消防局逕行照計而不順延，即與§48Ⅴ但書相違。\n\n結語：本案改善期間性質上屬不利處分之期間計算，原則依§48Ⅴ照計不順延，惟若順延對甲君較有利，依同項但書仍應順延，消防局宜審酌兩種計算方式何者對甲君有利後妥適處理。"},
  {a:"§49", q:"甲君於訴願法定期限之最後一日，以掛號郵寄方式將訴願書寄交消防局，惟消防局實際收受該訴願書時，已逾法定期限三日。", problem:"問：甲君之訴願是否因消防局逾期收受而視為逾期提起？", body:"依§49，基於法規之申請，以掛號郵寄方式向行政機關提出者，以交郵當日之郵戳為準，此係採發信主義而非到達主義之明文規定，其要件可拆解為：須為基於法規之申請、須以掛號郵寄方式向機關提出、判斷是否於法定期間內提出之基準，以交郵當日之郵戳日期為準，而非機關實際收受之日期，此一規定目的在保障偏遠地區或郵寄過程較長之人民，不因郵政作業所需時日而喪失於法定期間內行使權利之機會，避免因郵寄在途期間不可歸責於申請人之因素而剝奪其救濟權。本案甲君於訴願法定期限之最後一日，以掛號郵寄方式將訴願書寄交消防局，其交郵當日之郵戳日期即為判斷是否於法定期間內提起訴願之基準日，依§49規定，甲君已於法定期限最後一日交郵，應視為已於法定期間內合法提起訴願；消防局實際收受該訴願書時雖已逾法定期限三日，然此僅係郵政遞送在途所需之時間，並非甲君遲誤法定期間，依§49發信主義之規定，不影響甲君訴願提起之合法性，消防局不得以其實際收受已逾期為由，逕認甲君之訴願為逾期提起而不予受理。此一發信主義規定，與意思表示須到達相對人始生效力之一般原則有所不同，屬立法者特別考量郵寄申請特性所設之例外；甲君仍應保有郵戳證明或掛號收據以備查證，機關審查時應以郵戳日期為準，而非以文件到達機關之日期論斷是否逾期。\n\n結語：甲君已於法定期限內交郵，依§49發信主義，應以交郵日郵戳為準，視為合法提起訴願，消防局不得以實際收文已逾期為由拒絕受理。"},
  {a:"§50Ⅰ", q:"某地區因颱風來襲導致郵路及通信中斷數日，甲君因而未能於法定期間內提出證照展延申請，於郵路及通信恢復後第8日，甲君向消防局申請回復原狀，並同時補提展延申請。", problem:"問：甲君得否於通信恢復後第8日申請回復原狀並補提展延申請？", body:"依§50Ⅰ，因天災或其他不應歸責於申請人之事由，致基於法規之申請不能於法定期間內提出者，得於其原因消滅後十日內，申請回復原狀，如該法定期間少於十日者，於相等之日數內得申請回復原狀；依§50Ⅱ，申請回復原狀，應同時補行期間內應為之行政程序行為。其要件可拆解為：須有天災或其他不應歸責於申請人之事由、致無法於法定期間內提出申請、應於原因消滅後十日內申請回復原狀、且申請回復原狀時應同時補行原應為之行政程序行為。本案某地區因颱風來襲導致郵路及通信中斷數日，此屬天災事由，甲君因而未能於法定期間內提出證照展延申請，核與不應歸責於申請人之事由相符；甲君於郵路及通信恢復即原因消滅後第8日，向消防局申請回復原狀，並同時補提展延申請，其申請時點未逾§50Ⅰ所定十日之期限，且已依§50Ⅱ同時補行應為之展延申請行為，核與§50規定要件悉數相符，消防局應予准許回復原狀之申請，並就其同時補提之展延申請依法審查處理，視同甲君已於原法定期間內合法提出申請。應注意依§50Ⅲ，遲誤法定期間已逾一年者，不得申請回復原狀，本案甲君顯在此一年除斥期間內提出申請，並無適用該除外規定之疑慮。\n\n結語：甲君因颱風天災事由未能於法定期間內申請，於原因消滅後第8日申請回復原狀並同時補提展延申請，核與§50Ⅰ、Ⅱ要件相符，消防局應予准許並受理其展延申請。"},
  {a:"§51Ⅲ、§51Ⅳ", q:"消防局受理甲君場所使用許可申請，因案情複雜，於原處理期間屆滿後第3日，消防局始通知甲君展延處理期間，且此為該案第二次展延處理期間，先前已展延一次。", problem:"問：消防局本次展延處理期間之作法，是否合乎法定程序？", body:"依§51Ⅲ，行政機關未能於法定或公告之處理期間內處理終結者，得於原處理期間之限度內延長之，但以一次為限；依§51Ⅳ，前項情形，應於原處理期間屆滿前，將延長之事由通知申請人。其要件可拆解為：延長以一次為限、延長幅度不得超過原處理期間之限度、且應於原處理期間屆滿前將延長事由通知申請人，逾原期間屆滿後才通知者，已違反法定通知時點之要求。本案消防局受理甲君場所使用許可申請，因案情複雜，本欲第二次展延處理期間，惟依§51Ⅲ延長以一次為限之明文規定，該案先前既已展延一次，已達法定展延次數之上限，消防局竟再度展延，核與§51Ⅲ以一次為限之要件顯不相符，已屬違法之展延，逾越法定裁量範圍；縱使暫不論次數之違法，消防局係於原處理期間屆滿後第3日，始通知甲君展延處理期間，亦已違反§51Ⅳ應於原處理期間屆滿前通知之時點要求，屬程序上之另一重瑕疵。本案消防局之展延處理，於展延次數及通知時點二項要件均有違反，均構成處理期間展延程序之違法，甲君得主張機關應儘速處理終結其申請，如機關遲未作成決定，甲君亦得考慮提起課予義務訴訟等相關救濟途徑。\n\n結語：消防局第二次展延違反§51Ⅲ以一次為限規定，通知時點復已逾§51Ⅳ所定原期間屆滿前之要求，本次展延於程序及次數上均屬違法，甲君得請求機關儘速處理終結。"},
  {a:"§54", q:"某地方政府依都市計畫法規定舉行都市計畫變更公聽會，因該法就聽證應踐行之通知方式、預備程序及主持人職權等細節未有規定，主辦機關遂援引聽證程序共通規範辦理。", problem:"問：都市計畫法未規定聽證細節時，得否援引行政程序法聽證章節辦理？", body:"依§54，依本法或其他法規舉行聽證時，適用本節規定，是聽證程序之一般適用依據，本節（§54至§66）乃所有聽證之共通規範，不論係依本法本身或依其他法規舉行聽證，均應適用，性質上具有補充及統一各該不同法規聽證程序不備規定之功能，避免各別法規各自為政、程序保障寬嚴不一，致人民之聽證權益因所適用法規不同而有所差異。其要件可拆解為：須為依法規舉行之聽證、該其他法規就聽證程序事項未設規定或設有不備之處者，即應回歸適用本節通知事項、主持人、預備聽證、開始程序、陳述詰問權、主持人職權、聽證紀錄等共通規範。本案某地方政府依都市計畫法規定舉行都市計畫變更公聽會，性質上核屬依其他法規舉行之聽證程序，惟該法就聽證應踐行之通知方式、預備程序及主持人職權等程序細節並未設有規定，屬法規欠缺具體聽證程序規範之情形，主辦機關依§54援引行政程序法聽證程序共通規範辦理，於法有據，並非法所不許，亦有助於確保該都市計畫變更聽證程序符合正當法律程序之基本要求，保障受影響民眾之程序參與權，避免因都市計畫法本身規定不備而使聽證程序保障流於形式。\n\n結語：都市計畫法未規定聽證程序細節，依§54，主辦機關應援引行政程序法第十節聽證程序共通規範辦理，以補充該法之不足並確保聽證程序合法周延。"},
  {a:"§60Ⅱ", q:"某聽證案件開始時，主持人僅簡短宣布聽證開始，未由主持人或其指定之人說明該事件之內容要旨，即逕行進入當事人陳述程序。", problem:"問：主持人未說明事件內容要旨即進入陳述程序，是否合乎聽證程序規定？", body:"依§60Ⅰ，聽證以主持人說明案由為始；依§60Ⅱ，聽證開始時，由主持人或其指定之人說明事件之內容要旨。二項規定共同構成聽證程序啟動之形式要件，其要件可拆解為：聽證之開始須由主持人先行說明案由、於聽證開始時，並應由主持人本人或其指定之人就該事件之內容要旨為說明，此一說明義務之目的在使到場之當事人及利害關係人於聽證程序正式進入陳述、詰問等實質程序前，先行充分知悉本次聽證所欲處理之事件內容及爭點所在，以利其後續有效行使§61陳述意見、提出證據及發問之權利，屬聽證程序正當性之基礎前提。本案某聽證案件開始時，主持人僅簡短宣布聽證開始，並未由主持人或其指定之人依§60Ⅱ說明該事件之內容要旨，即逕行進入當事人陳述程序，顯已欠缺§60Ⅱ所要求之內容要旨說明程序，核與該項規定不符，屬聽證程序踐行上之瑕疵。此一瑕疵可能影響當事人及利害關係人對聽證事件範圍及爭點之掌握，進而影響其陳述、詰問等實質權利之有效行使，性質上非僅屬無關宏旨之技術性疏漏，而係聽證程序公正性及周延性之重要環節；倘嗣後依此有瑕疵之聽證程序作成處分，依§108應斟酌全部聽證結果作成處分，該項瑕疵是否影響處分效力，仍應視其對當事人程序權利之實際影響程度而定。\n\n結語：主持人未依§60Ⅱ說明事件內容要旨即逕行進入陳述程序，該聽證程序踐行有瑕疵，宜由主持人補行說明或依§66再為聽證，以確保程序正當性完整。"},
  {a:"§67", q:"甲君接獲消防局通知須至機關說明其違規使用瓦斯設備一事，遂主動詢問承辦人員後續之裁處書應由其本人提出何種申請才能收到送達；承辦人員告知毋須由甲君提出任何申請，機關將主動辦理送達相關文書。", problem:"問：承辦人員告知甲君無須申請、機關將主動送達，是否正確？", body:"依§67，送達，除法規另有規定外，由行政機關依職權為之，此為送達制度之基本原則，明文揭示送達係機關依職權主動進行之事務，不待人民申請，此為行政程序與民事訴訟送達制度之重要差異之一，蓋民事訴訟原則上多由當事人聲請法院送達，行政程序則因涉及公權力之行使及對人民權利義務發生法律效果，機關本於依法行政及照顧義務，自應主動將相關文書送達當事人，不應課予人民另行申請送達之負擔。其要件可拆解為：送達原則上由行政機關依職權主動為之、除法規另有規定外均適用此一原則。本案甲君主動詢問承辦人員後續之裁處書應由其本人提出何種申請才能收到送達，承辦人員告知毋須由甲君提出任何申請，機關將主動辦理送達相關文書，此一說明核與§67送達由行政機關依職權為之之規定意旨完全相符，承辦人員之答覆正確無誤，甲君無須另行提出任何申請，消防局於作成裁處書後，即負有依職權主動將該裁處書送達甲君之法定義務，並應依§68以下規定選擇適當之送達方式妥善辦理，倘有送達不能之情形，仍應依§85製作報告書並另尋合法送達方式，非謂甲君須自行催告機關送達。\n\n結語：承辦人員告知甲君無須申請、機關將依職權主動送達，核與§67規定相符，消防局於裁處書作成後應主動依法送達甲君，甲君無須另為任何申請行為。"},
  {a:"§68Ⅱ", q:"某工廠因消防安全設備複查不合格，機關依相關法規以傳真方式將複查結果通知傳送至該廠登記之傳真號碼，全程未另以紙本郵寄方式送達。", problem:"問：機關僅以傳真方式送達複查結果通知，是否已生合法送達之效力？", body:"依§68Ⅰ，送達由行政機關自行或交由郵政機關送達；依§68Ⅱ，行政機關之文書依法規以電報交換、電傳文件、傳真或其他電子文件行之者，視為自行送達。其要件可拆解為：須依法規許可以傳真等電子方式行文、該傳真等電子送達方式視為機關自行送達之一種型態，與自行以人員親送或交由郵政機關送達併列為合法送達方式之一，並非傳真僅屬事實通知而非法律上之送達。本案機關依相關法規以傳真方式將複查結果通知傳送至該工廠登記之傳真號碼，若該傳真送達方式確有法規明文依據許可為之，即核與§68Ⅱ依法規以傳真行之者視為自行送達之要件相符，該傳真送達應認已發生合法送達之效力，機關全程未另以紙本郵寄方式送達，亦非法所要求，蓋§68Ⅱ既已將合法之傳真送達視為自行送達，即毋庸再重複以其他方式送達，二者屬擇一而非併行之關係。惟仍應注意，若相關法規並未明文許可以傳真方式送達此類複查結果通知，機關逕以傳真行之而無法規依據，即不符§68Ⅱ依法規之前提要件，該傳真送達即難認已生合法送達效力，仍應以其他合法方式另行送達，方能使送達生效並使後續救濟期間得以起算。\n\n結語：機關依法規以傳真方式送達複查結果通知，依§68Ⅱ視為自行送達，於法有據且已生合法送達效力，無須另以紙本郵寄方式重複送達。"},
  {a:"§68Ⅲ", q:"機關就甲君違規儲放公共危險物品一案作成高額罰鍰裁處書，因內容對甲君權利義務有重大影響，卻疏未辦理掛號，逕以一般平信交由郵政機關寄發。", problem:"問：機關以平信方式寄發高額罰鍰裁處書，是否合乎送達之規定？", body:"依§68Ⅲ，由郵政機關送達者，以一般郵遞方式為之，但文書內容對人民權利義務有重大影響者，應為掛號。此係就郵政送達方式所設之強制性規定，其要件可拆解為：郵政送達原則上得以一般郵遞方式為之、但例外於文書內容對人民權利義務有重大影響者，應改以掛號方式送達，此一區分之目的在於，掛號郵件因具備簽收憑證及送達證明，得以較高之確定性證明送達之事實及時點，對於影響人民權利義務重大之文書，自應以較嚴謹之送達方式為之，以確保送達生效時點明確可考，並保障人民救濟期間起算之正確性。本案機關就甲君違規儲放公共危險物品一案作成高額罰鍰裁處書，此一裁處書內容對甲君財產權益顯有重大影響，依§68Ⅲ但書規定，本應以掛號方式送達，惟機關卻疏未辦理掛號，逕以一般平信交由郵政機關寄發，核與§68Ⅲ但書之強制規定顯不相符，該送達方式即有違法之瑕疵。此一瑕疵可能導致送達生效之時點及是否確實送達甲君均欠缺確實之證明依據，倘甲君嗣後否認曾收受該裁處書，機關將因欠缺掛號簽收憑證而難以舉證證明合法送達已完成，連帶影響救濟期間之起算及該裁處書效力之確定。\n\n結語：機關以平信寄發對甲君權利義務有重大影響之高額罰鍰裁處書，違反§68Ⅲ但書應掛號之強制規定，送達程序具有瑕疵，機關應另以掛號方式重新完成合法送達。"},
  {a:"§68Ⅳ", q:"機關就某處分書決定自行送達，遂指派機關內部專責辦理送達事務之人員（並非本案承辦人）持送處分書予甲君簽收，機關認為此舉並無不合。", problem:"問：機關指派非本案承辦人之送達事務人員親送處分書，是否合法？", body:"依§68Ⅳ，文書由行政機關自行送達者，以承辦人員或辦理送達事務人員為送達人；其交郵政機關送達者，以郵務人員為送達人。此係就自行送達之送達人資格所設之規定，其要件可拆解為：自行送達之送達人，並不限於本案承辦人員本人，凡機關內部辦理送達事務之人員，均得作為合法之送達人，二者於條文中並列為擇一之關係，並非僅限承辦人親自送達方為合法。本案機關就某處分書決定自行送達，並指派機關內部專責辦理送達事務之人員（並非本案承辦人）持送處分書予甲君簽收，該送達人雖非本案承辦人，然其身分核屬辦理送達事務人員，依§68Ⅳ規定，此類人員本即得作為自行送達之合法送達人，機關之作法核與§68Ⅳ規定相符，並無不合，甲君不得以送達人非本案承辦人為由，主張送達不合法。此一規定之立法考量在於行政實務上，各機關多設有專責之文書送達單位或人員，統一辦理各業務單位之送達事務，倘要求必須由本案承辦人員親自送達，將徒增行政成本並影響送達效率，故明文放寬送達人資格，僅須具備辦理送達事務之身分即可，兼顧行政效率與送達之正式性、可歸責性。\n\n結語：機關指派內部專責辦理送達事務之人員送達處分書予甲君，核與§68Ⅳ規定相符，屬合法之自行送達，甲君不得以送達人非本案承辦人為由否認送達之效力。"},
  {a:"§69Ⅰ", q:"甲(6歲)於自家騎樓玩弄打火機，不慎引燃堆置之雜物，經消防局查明後認應發函促請其改善；機關擬送達該函文，遂將文書送達甲之父母。", problem:"問：機關將函文送達甲之父母，是否合乎送達對象之規定？", body:"依§69Ⅰ，對於無行政程序之行為能力人為送達者，應向其法定代理人為之。其要件可拆解為：送達對象須為無行政程序行為能力之人、此時送達不得逕向本人為之，而應向其法定代理人為送達，方能生合法送達之效力。所謂無行政程序行為能力人，依§22Ⅰ①反面解釋，即不具民法上行為能力之自然人，未滿七歲之未成年人依民法規定為無行為能力人，自屬無行政程序行為能力人之列。本案甲君年僅6歲，依民法規定屬無行為能力人，核屬§69Ⅰ所稱之無行政程序之行為能力人，消防局擬將促請改善之函文送達，本即不應逕向甲本人為送達，而應依§69Ⅰ向其法定代理人即甲之父母為送達，機關將該文書送達甲之父母，核與§69Ⅰ規定要件完全相符，於法有據，應認已生合法送達之效力。應注意者，依§69Ⅲ，法定代理人有二人以上者，送達得僅向其中之一人為之，無須同時送達雙親，機關僅送達其中一方即已足生合法送達效力。又本案甲雖為肇事之直接行為人，然因其年幼欠缺責任能力，機關發函促請改善之對象及法律效果實際上應歸屬其法定代理人負責監督處理。\n\n結語：甲為無行政程序行為能力之未成年人，機關依§69Ⅰ將函文送達其法定代理人即父母，於法有據，已生合法送達效力，無須逕向甲本人送達。"},
  {a:"§69Ⅱ", q:"某消防設備保養股份有限公司因保養紀錄造假遭機關裁處罰鍰，機關擬送達裁處書，遂將文書送達該公司登記之代表人。", problem:"問：機關將裁處書送達該公司登記代表人，是否合乎送達對象之規定？", body:"依§69Ⅱ，對於機關、法人或非法人之團體為送達者，應向其代表人或管理人為之。其要件可拆解為：送達對象須為機關、法人或非法人團體、此時送達應向其代表人或管理人為之，蓋法人本身為法律上擬制之權利義務主體，欠缺自然人般之意思能力，須透過其代表人或管理人代為受領送達，方能使送達實際發生使受送達人知悉文書內容之效果。本案某消防設備保養股份有限公司因保養紀錄造假遭機關裁處罰鍰，該公司性質上屬§21②所稱之法人，具行政程序當事人能力，機關擬送達該裁處書，依§69Ⅱ規定，應向該公司之代表人為送達，機關遂將文書送達該公司登記之代表人，核與§69Ⅱ規定要件完全相符，於法有據，應認已生合法送達之效力。應注意者，依§69Ⅲ，法定代理人、代表人或管理人有二人以上者，送達得僅向其中之一人為之，倘該公司登記有二位以上代表人，機關僅送達其中一人已足生合法送達效力，無須逐一送達全部代表人。又此與§72Ⅱ送達處所之規定相互配合，對於機關法人團體代表人之送達，原則應向其機關所在地、事務所或營業所行之，例外必要時得於會晤處所或其住居所行之。\n\n結語：機關依§69Ⅱ將裁處書送達該公司登記代表人，核與規定相符，已生合法送達效力，該公司不得以送達對象錯誤為由否認送達之合法性。"},
  {a:"§71", q:"甲君因違反消防法規遭裁罰，已委任律師乙君為訴願代理人，委任狀並未記載限制乙律師受送達之權限；機關作成訴願決定後，遂逕行將決定書送達乙律師。", problem:"問：機關將訴願決定書逕行送達乙律師，是否合乎送達之規定？", body:"依§71，行政程序之代理人受送達之權限未受限制者，送達應向該代理人為之，但行政機關認為必要時，得送達於當事人本人。其要件可拆解為：當事人須有合法委任之代理人、該代理人之受送達權限未經委任狀特別限制、此時送達原則上應向該代理人為之，例外機關認有必要時，仍得選擇送達當事人本人。此一規定係考量代理人既受當事人委任處理程序事務，本於代理制度之基本法理，送達代理人即應與送達本人生同一效力，且代理人尤其律師通常較能即時掌握文書內容之法律意義並為當事人妥善處理後續事宜，向代理人送達更能確保程序資訊有效傳遞。本案甲君已委任律師乙君為訴願代理人，委任狀並未記載限制乙律師受送達之權限，核與§71代理人受送達之權限未受限制之前提要件相符，機關作成訴願決定後，依§71本文規定，應向該代理人即乙律師為送達，機關逕行將決定書送達乙律師，核與規定意旨完全相符，於法有據，該送達應認已對甲君發生合法送達之效力，救濟期間即自乙律師收受決定書之日起算，非俟甲君本人另行知悉之日起算。依§24Ⅲ，代理權之授與及於該程序有關之全部程序行為，除非委任狀已特別限制乙律師之受送達權限，機關逕向代理人送達即已足生合法效力，毋須另行確認甲君本人是否知悉；倘委任狀確已限制受送達權限，機關仍得依§71但書選擇改向甲君本人送達。\n\n結語：機關依§71將訴願決定書送達受送達權限未受限制之代理人乙律師，於法有據，已生合法送達效力，甲君之後續救濟期間應自乙律師收受之日起算。"},
  {a:"§72Ⅱ", q:"機關擬送達裁處書予某餐飲股份有限公司之登記代表人，因未能於該公司登記之營業處所會晤代表人本人，機關審酌後改前往代表人之自家住居所，當場會晤本人並完成送達。", problem:"問：機關改於代表人自家住居所完成送達，是否合乎送達處所之規定？", body:"依§72Ⅰ，送達於應受送達人之住居所、事務所或營業所為之，但在行政機關辦公處所或他處會晤應受送達人時，得於會晤處所為之；依§72Ⅱ，對於機關、法人、非法人之團體之代表人或管理人為送達者，應向其機關所在地、事務所或營業所行之，但必要時亦得於會晤之處所或其住居所行之。其要件可拆解為：對法人團體代表人送達，原則應於該機關所在地、事務所或營業所為之、例外於必要時得改於會晤之處所或代表人之住居所為送達，此一彈性規定目的在提高送達成功率，避免因原則性處所無法會晤即須反覆嘗試或改採其他送達方式，徒增行政成本及程序延宕。本案機關擬送達裁處書予某餐飲股份有限公司之登記代表人，本應依§72Ⅱ本文優先於該公司登記之營業處所送達，惟機關未能於該處所會晤代表人本人，經審酌後改前往代表人之自家住居所，當場會晤本人並完成送達，核與§72Ⅱ但書必要時亦得於其住居所行之之要件相符，於法有據，該送達應認已合法生效，此與應受送達人拒絕收領時始考慮補充送達或寄存送達之情形不同，本案係直接於代表人住居所會晤本人並完成送達，程序上更為直接確實。\n\n結語：機關依§72Ⅱ但書改於代表人自家住居所會晤本人完成送達，於法有據，已生合法送達效力，該公司不得以非於登記營業處所送達為由否認送達之合法性。"},
  {a:"§73Ⅱ、§74Ⅰ", q:"消防局承辦人員攜帶違規使用爆竹煙火之裁處書前往甲公司登記地址送達，未獲負責人本人在場，僅有一名員工在場，惟經查該員工即為本案檢舉人，與甲公司立場明顯相反；承辦人員遂改將文書寄存於送達地之地方警察機關，並依規定將送達通知書一份黏貼於該處門首。", problem:"問：承辦人員改以寄存送達方式送達裁處書，是否合法？", body:"依§73Ⅰ，於應送達處所不獲會晤應受送達人時，得將文書付與有辨別事理能力之同居人、受雇人或應送達處所之接收郵件人員；惟依§73Ⅱ，前項規定於前項人員與應受送達人在該行政程序上利害關係相反者，不適用之，此為補充送達之除外規定。依§74Ⅰ，送達不能依前二條規定為之者，得將文書寄存送達地之地方自治或警察機關，並作送達通知書兩份，一份黏貼於應受送達人住居所、事務所、營業所或其就業處所門首，另一份交由鄰居轉交或置於該送達處所信箱或其他適當位置，以為送達，此即寄存送達制度，屬送達不能依補充送達完成時之補充機制。本案消防局承辦人員攜帶裁處書前往甲公司登記地址送達，未獲負責人本人在場，雖有一名員工在場，然經查該員工即為本案檢舉人，與甲公司立場明顯相反，核與§73Ⅱ利害關係相反者不適用補充送達之除外規定相符，即不得將文書交由該員工代為簽收，本案已無從依§73Ⅰ完成補充送達；承辦人員遂依§74Ⅰ改將文書寄存於送達地之地方警察機關，並依規定將送達通知書一份黏貼於該處門首，另一份依規定交由鄰居轉交或置於信箱等適當位置，核與§74Ⅰ寄存送達之要件完全相符，於法有據，該送達應認已合法完成。\n\n結語：本案員工與甲公司利害關係相反，依§73Ⅱ不得補充送達，承辦人員改依§74Ⅰ辦理寄存送達並黏貼公告，程序合法，寄存機關並應保存文書三個月。"},
  {a:"§75", q:"某社區因地下室化學品外洩有爆炸疑慮，消防局須緊急通知周邊不特定之路人與流動攤販立即疏散，惟因對象不特定、人數眾多無法逐一確認身分，機關遂於周邊明顯處張貼公告，代替逐一送達通知。", problem:"問：消防局以張貼公告方式代替逐一送達，是否於法有據？", body:"依§75，行政機關對於不特定人之送達，得以公告或刊登政府公報或新聞紙代替之。此係規範對象係不特定之多數人之送達方式，機關得以公告或刊登方式代替逐一送達，其要件可拆解為：受通知對象須為不特定之人、人數眾多或對象確實無從逐一確認、機關得選擇以公告或刊登政府公報新聞紙之方式代替個別送達。本案某社區因地下室化學品外洩有爆炸疑慮，消防局須緊急通知周邊不特定之路人與流動攤販立即疏散，此類受通知對象核屬典型之不特定多數人，人數眾多且流動性高，客觀上顯無從逐一確認身分並個別送達，機關遂於周邊明顯處張貼公告，代替逐一送達通知，核與§75規定要件完全相符，於法有據，該公告方式應認已對周邊不特定路人及流動攤販發生合法通知之效力。應與§78以下公示送達制度區辨：公示送達係針對特定人但其應為送達之處所不明或境外送達困難等情形，經申請或依職權為之，其生效尚須經一定期間；而§75規範之對象係不特定人，公告本身即發生通知效力，毋須另經§81所定之生效期間，二者規範情境、對象及生效機制均有不同，作答時應予嚴格區辨勿混用。\n\n結語：消防局面對地下室化學品外洩此一緊急疏散情形，依§75以張貼公告方式通知周邊不特定路人及流動攤販，於法有據，該公告即已發生合法通知效力，毋須逐一送達或適用公示送達生效期間。"},
  {a:"§78Ⅰ③、§81", q:"甲君為旅居A國之僑民，因國內房屋消防安全檢查未合格遭裁罰，機關評估縱依第86條規定辦理囑託送達仍預料無法完成，甲君遂委由其在國內之代理人向機關申請公示送達；該公示送達之公告於同年3月1日刊登政府公報，為最後一次刊登，機關遂以此計算裁處書送達生效及後續訴願期間起算之日。", problem:"問：本案公示送達應自何時起發生送達效力？", body:"依§78Ⅰ③，於外國或境外為送達，不能依第86條之規定辦理或預知雖依該規定辦理而無效者，行政機關得依申請，准為公示送達，此為公示送達要件之一，其要件可拆解為：應受送達人在外國或境外、依§86囑託外國機關或駐外機構送達之方式不能辦理或預知辦理無效、經當事人或利害關係人申請，機關始得准為公示送達。依§81，公示送達自公告之日起，其刊登政府公報或新聞紙者，自最後刊登之日起，經二十日發生效力，於依§78Ⅰ③為公示送達者，經六十日發生效力。本案甲君為旅居A國之僑民，機關評估縱依§86辦理囑託送達仍預料無法完成，核與§78Ⅰ③要件相符，甲君委由其在國內之代理人向機關申請公示送達，程序上亦符合依申請為之之要求，機關應予准許；該公示送達之公告於同年3月1日刊登政府公報為最後一次刊登，因本案係依§78Ⅰ③境外送達困難事由所為之公示送達，依§81後段，應自最後刊登之日即3月1日起，經六十日始發生送達效力，而非一般公示送達之二十日，機關如逕以20日計算裁處書送達生效及後續訴願期間起算之日，即有適用期間錯誤之違法，應予更正。\n\n結語：本案屬§78Ⅰ③境外送達困難之公示送達，依§81應經六十日始生送達效力，機關應以3月1日起算滿60日之翌日為送達生效及訴願期間起算之基準，不得逕依一般20日計算。"},
  {a:"§69Ⅳ、§73Ⅲ", q:"甲(17歲)因住處增設之消防安全設備遭裁罰，逕自具狀向機關提出陳述意見，惟未於書面中載明其法定代理人為何人；機關於補正前，仍依址將復函送達甲本人，甲在場卻拒絕收領，送達人員遂將文書留置於該處以為送達。", problem:"問：機關於補正前逕向甲本人送達，甲拒絕收領後留置送達，是否合法？", body:"依§69Ⅳ，無行政程序之行為能力人為行政程序之行為，未向行政機關陳明其法定代理人者，於補正前，行政機關得向該無行為能力人為送達，此為§69Ⅰ應向法定代理人送達原則之例外規定，其要件可拆解為：無行政程序行為能力人自行為程序行為、未向機關陳明其法定代理人為何人、於此補正欠缺之前，機關例外得逕向該無行為能力人本人為送達，以避免因當事人自身未陳明法定代理人致機關無從送達、程序陷於停滯之窘境。本案甲君17歲，未滿18歲，依民法規定屬限制行為能力人，其逕自具狀提出陳述意見卻未載明法定代理人為何人，核與§69Ⅳ要件相符，機關於補正前仍依址將復函送達甲本人，於法有據，並非違法。又依§73Ⅲ，應受送達人或其同居人、受雇人、接收郵件人員無正當理由拒絕收領文書時，得將文書留置於應送達處所，以為送達，此為留置送達制度，本案甲雖在場，惟無正當理由拒絕收領該復函，送達人員依§73Ⅲ將文書留置於該處，核與規定要件相符，應認已生合法送達之效力，甲不得以拒絕收領為由，主張未受合法送達。\n\n結語：機關依§69Ⅳ於甲未補正法定代理人前逕向甲本人送達，並依§73Ⅲ於甲無正當理由拒絕收領時留置送達，均於法有據，該送達應認已合法生效。"},
  {a:"§83Ⅰ", q:"甲君向機關提起訴願，並於訴願書內載明指定其配偶乙君為送達代收人；機關嗣後作成訴願決定，遂將決定書送達乙君。", problem:"問：機關將訴願決定書送達甲君所指定之送達代收人乙君，是否合法？", body:"依§83Ⅰ，當事人或代理人經指定送達代收人，向行政機關陳明者，應向該代收人為送達。此為送達代收人制度，其要件可拆解為：當事人或代理人須已指定特定之人為送達代收人、並已向行政機關陳明、機關其後即應向該送達代收人為送達，不得再逕向當事人本人為送達。此一制度之設計目的在使當事人得自主選任信賴之人統一代為收受相關文書，避免因當事人本人行蹤不定、外出頻繁等因素致送達困難，兼顧程序經濟與當事人程序上之便利性。本案甲君向機關提起訴願，並已於訴願書內明確載明指定其配偶乙君為送達代收人，核與§83Ⅰ經指定送達代收人並向機關陳明之要件完全相符，機關嗣後作成訴願決定，依§83Ⅰ本文規定，應向該代收人即乙君為送達，機關遂將決定書送達乙君，核與規定意旨完全相符，於法有據，應認已對甲君發生合法送達之效力，甲君後續之行政訴訟起訴期間即應自乙君收受決定書之日起算。此與§83Ⅱ規範郵寄申請人無住居所等情形機關命指定送達代收人之情形不同，本案係甲君主動指定，非機關依§83Ⅱ命其指定。\n\n結語：機關依§83Ⅰ將訴願決定書送達甲君所指定之送達代收人乙君，於法有據，已生合法送達效力，甲君後續救濟期間應自乙君收受之日起算。"},
  {a:"§83Ⅱ、§83Ⅲ", q:"甲君以郵寄方式向機關提出申請，其交郵地並無住居所、事務所及營業所；機關乃通知甲君於10日內指定送達代收人，惟甲君屆期仍未指定亦未陳明，機關遂將文書註明甲君原提出申請時之住居所地址，交郵政機關掛號發送，並以交付文書之時視為送達時。", problem:"問：機關逕以掛號發送並視為送達之作法，是否合乎規定？", body:"依§83Ⅱ，郵寄方式向行政機關提出者，以交郵地無住居所、事務所及營業所者，行政機關得命其於一定期間內，指定送達代收人；依§83Ⅲ，如不於前項期間指定送達代收人並陳明者，行政機關得將應送達之文書，註明該當事人或代理人之住居所、事務所或營業所，交付郵政機關掛號發送，並以交付文書時，視為送達時。其要件可拆解為：當事人以郵寄方式提出申請、其交郵地並無住居所事務所營業所、機關得命其於一定期間內指定送達代收人、屆期未指定亦未陳明者，機關得逕將文書註明其原有之住居所事務所或營業所地址，交郵政機關掛號發送，並以交付文書之時視為送達時，此為擬制送達生效時點之特別規定，有別於一般送達須以受送達人實際收受或合法之補充寄存送達完成為準。本案甲君以郵寄方式向機關提出申請，其交郵地並無住居所、事務所及營業所，核與§83Ⅱ前提要件相符，機關通知甲君於10日內指定送達代收人，甲君屆期仍未指定亦未陳明，機關遂依§83Ⅲ將文書註明甲君原提出申請時之住居所地址，交郵政機關掛號發送，並以交付文書之時視為送達時，核與§83Ⅲ規定要件完全相符，於法有據，應認已生合法送達之擬制效力。\n\n結語：甲君逾期未指定送達代收人，機關依§83Ⅲ將文書掛號發送並以交付之時視為送達時，於法有據，甲君不得以未實際收受文書為由，主張送達尚未生效。"},
  {a:"§136", q:"甲工廠內部管線配置複雜，消防局經職權調查仍無法確定其是否達到應設置自動撒水設備之標準，為解決此項爭執並有效達成行政目的，消防局與甲工廠負責人締結契約，由廠方分階段完成設備改善，以代替裁處與否之行政處分。", problem:"問：消防局與甲工廠締結和解契約以代替行政處分，是否於法有據？", body:"依§136，行政機關對於行政處分所依據之事實或法律關係，經依職權調查仍不能確定者，為有效達成行政目的，並解決爭執，得與人民和解，締結行政契約，以代替行政處分，此即和解契約制度。其要件可拆解為：須為行政處分所依據之事實或法律關係不明確、機關已依職權調查仍不能確定、締約目的須在有效達成行政目的並解決爭執、以契約代替原應作成之行政處分。此一制度設計係考量若干個案事實或法律關係經機關窮盡調查方法後仍屬真偽不明，若強行依片面認定作成處分，恐生舉證困難或處分事後遭撤銷之風險，透過和解契約由雙方合意解決爭執，兼顧行政效率與爭議實質解決之彈性。本案甲工廠內部管線配置複雜，消防局經職權調查仍無法確定其是否達到應設置自動撒水設備之標準，核與§136經依職權調查仍不能確定之要件相符，消防局為有效達成督促消防安全設備改善之行政目的並解決此一事實認定上之爭執，與甲工廠負責人締結契約，由廠方分階段完成設備改善，以代替裁處與否之行政處分，核與§136規定要件完全相符，於法有據。惟依§139，行政契約之締結應以書面為之，消防局仍應注意依法以書面方式訂立該和解契約。\n\n結語：消防局經職權調查仍無法確定甲工廠是否應設置撒水設備，依§136與其締結和解契約以代替處分，於法有據，惟締約仍應依§139以書面為之，並明確載明雙方權利義務。"},
  {a:"§137Ⅰ③、§142④", q:"消防局對甲君所有場所核發消防安全設備檢查合格證明，屬機關有裁量權之處分。消防局改以締結行政契約代替該處分，契約載明甲君應繳納之款項係供消防局辦理年度設備汰換之用，惟其金額高達甲君原應繳納檢查規費之十倍，與消防局所為之查驗給付顯不相當，亦欠缺正當合理之關聯。", problem:"問：本案代替處分之雙務契約是否有效？", body:"依§137Ⅰ，行政機關與人民締結行政契約，互負給付義務者，應符合三款規定：一、契約中應約定人民給付之特定用途；二、人民之給付有助於行政機關執行其職務；三、人民之給付與行政機關之給付應相當，並具有正當合理之關聯。此三款要件須同時具備，方為合法之雙務契約，其中第三款顯不相當及欠缺正當合理關聯之審查，本質上係不當聯結禁止原則於契約領域之具體化。依§142④，代替行政處分之行政契約，締結之雙務契約未符合第137條之規定者，無效。本案消防局對甲君所有場所核發消防安全設備檢查合格證明，屬機關有裁量權之處分，消防局改以締結行政契約代替該處分，其性質核屬§137所規範代替裁量處分之雙務契約，契約雖已載明甲君應繳納款項供消防局辦理年度設備汰換之特定用途，形式上似已符合§137Ⅰ①，然其金額高達甲君原應繳納檢查規費之十倍，與消防局所為之查驗給付顯不相當，亦欠缺正當合理之關聯，核與§137Ⅰ③要件顯不相符，依§142④明文，該代替行政處分之雙務契約應屬無效。契約無效後，消防局仍應回歸原應作成之行政處分程序，就甲君場所是否符合消防安全設備檢查標準逕行核發合格證明或另為適法處分。\n\n結語：本案雙務契約給付顯不相當且欠缺正當合理關聯，違反§137Ⅰ③，依§142④應屬無效，消防局應退還溢收款項並回歸原行政處分程序另為適法處理。"},
  {a:"§139", q:"消防局與某社區管理委員會口頭約定，由消防局提供防災器材，委員會協助辦理住戶防火宣導，雙方未簽署任何書面文件，相關法規亦未就此類契約另定其他方式。事後委員會否認曾有此項約定。", problem:"問：消防局與管理委員會間僅以口頭達成之約定，是否發生行政契約之效力？", body:"依§139，行政契約之締結，應以書面為之，但法規另有其他方式之規定者，依其規定。此為行政契約要式性之明文規定，與私法契約原則上不要式者有所不同，其要件可拆解為：行政契約原則上須以書面為之，此為法定要式行為、例外法規另有規定其他方式者，從其規定，惟本案並無此類特別規定之情形。此一要式性要求之立法目的在於，行政契約涉及公權力主體與人民間權利義務之設定，內容應力求明確以杜爭議，且便於日後查證履約情形及爭議處理，若容許行政契約得以口頭方式成立，將使契約內容及是否成立本身均陷於舉證困難之狀態，有損法安定性。本案消防局與某社區管理委員會僅以口頭約定，由消防局提供防災器材，委員會協助辦理住戶防火宣導，雙方並未簽署任何書面文件，而相關法規亦未就此類契約另定其他方式，核與§139原則規定之情形相符，即應以書面為之方能有效成立；本案既未踐行書面締約之法定要式，該口頭約定應難認已合法成立生效之行政契約，事後委員會否認曾有此項約定，消防局亦難以此口頭約定為據，請求委員會履行協助辦理住戶防火宣導之義務。\n\n結語：本案消防局與管理委員會僅為口頭約定，未依§139以書面締約，該行政契約因欠缺法定要式而不成立生效，委員會得否認該約定之拘束力，消防局如欲使雙方協力關係發生效力，應另補行書面締約程序。"},
  {a:"§152Ⅰ、Ⅱ", q:"某消防安全設備商業同業公會以書面敘明訂定「防火材料檢測基準」法規命令之目的、依據及理由，並檢附相關技術資料，向消防主管機關提議訂定該法規命令。", problem:"問：該同業公會得否以書面向消防主管機關提議訂定法規命令？", body:"依§152Ⅰ，法規命令之訂定，除由行政機關自行草擬者外，並得由人民或團體提議為之；依§152Ⅱ，前項提議，應以書面敘明法規命令訂定之目的、依據及理由，並附具相關資料。此係賦予人民或團體對法規命令訂定得主動提議之權利，體現行政程序民主參與精神之具體展現，其要件可拆解為：提議主體得為人民或團體、須以書面為之、書面應敘明訂定之目的、依據及理由三項要素、並應附具相關資料以供機關參考審酌。本案某消防安全設備商業同業公會屬§21②所稱之法人或依§21③非法人團體性質之團體，具行政程序當事人能力，其以書面敘明訂定防火材料檢測基準法規命令之目的、依據及理由，並檢附相關技術資料，向消防主管機關提議訂定該法規命令，核與§152Ⅰ、Ⅱ規定要件完全相符，於法有據，消防主管機關應予受理該提議。消防主管機關受理後，依§153規定，應視情形分別處理：非其主管之事項，依§17移送有管轄權機關；依法不得以法規命令規定或無須訂定者，應附述理由通知原提議者；認有訂定必要者，則應著手研擬草案，機關不得對該同業公會之合法提議置之不理而不作任何回應。\n\n結語：該同業公會依§152Ⅰ、Ⅱ以書面提議訂定法規命令，程序合法，消防主管機關應依§153規定妥為處理並回覆該公會，不得置之不理。"},
  {a:"§154Ⅱ", q:"消防局於政府公報公告某法規命令草案後，另於機關官方網站及轄內各分隊公布欄張貼該草案內容摘要，以擴大周知範圍，使更多民眾得以知悉並表示意見。", problem:"問：消防局於政府公報公告後另以其他方式擴大周知，是否於法有據？", body:"依§154Ⅰ，行政機關擬訂法規命令時，除情況急迫顯然無法事先公告周知者外，應於政府公報或新聞紙公告，載明訂定機關名稱、依據、草案全文或主要內容、任何人得於所定期間內陳述意見之意旨；依§154Ⅱ，行政機關除依前項規定辦理外，並得以適當方法將公告內容廣泛周知。此為法規命令預告制度中之補充周知機制，其要件可拆解為：機關已依§154Ⅰ完成政府公報或新聞紙之公告、機關並得依§154Ⅱ另以其他適當方法將公告內容廣泛周知，此屬機關得為而非應為之補充性、任意性規定，目的在使法規命令草案之訂定資訊觸及更多可能受影響或有意見表達意願之民眾，強化法規命令訂定過程之民主參與及透明度。本案消防局於政府公報公告某法規命令草案後，已踐行§154Ⅰ所定之法定公告程序，另於機關官方網站及轄內各分隊公布欄張貼該草案內容摘要，以擴大周知範圍，使更多民眾得以知悉並表示意見，核屬§154Ⅱ所容許機關以適當方法廣泛周知之補充措施，於法有據，並非法所不許，亦非法定義務外之逾越行為，此舉更有助於提升該法規命令訂定程序之透明度與人民實質參與之機會，值得肯定。\n\n結語：消防局於政府公報公告後另於網站及公布欄張貼摘要以廣泛周知，依§154Ⅱ於法有據，屬機關得為之補充性周知措施，有助強化法規命令訂定之民主參與。"},
  {a:"§155", q:"消防主管機關於訂定某項涉及大量民眾權益之法規命令時，考量該草案爭議性高，雖法規並未要求必須舉行聽證，機關仍基於職權決定召開聽證會，廣泛聽取各方意見。", problem:"問：消防主管機關於法規未強制要求下自行決定舉行聽證，是否於法有據？", body:"依§155，行政機關訂定法規命令，得依職權舉行聽證。此為法規命令訂定聽證之發動要件，其要件可拆解為：機關訂定法規命令時，是否舉行聽證原則上繫諸機關之裁量權限，不若§107行政處分聽證之發動尚可能因法規明文規定應舉行聽證而成為義務性規定，法規命令聽證性質上通篇僅有依職權舉行一途，機關認為有必要即得舉行，無強制舉行之情形。本案消防主管機關於訂定某項涉及大量民眾權益之法規命令時，考量該草案爭議性高，雖法規並未要求必須舉行聽證，機關仍基於職權決定召開聽證會，廣泛聽取各方意見，核與§155規定要件完全相符，於法有據，機關本於職權裁量認為該草案影響層面廣泛、爭議性高，主動決定舉行聽證，非法所不許，亦有助於在法規命令正式訂定前，更周延地蒐集各方意見、降低施行後之爭議與抗拒。機關舉行聽證時，仍應依§156公告訂定機關名稱、依據、草案全文或主要內容、聽證日期場所及主要程序等事項，並依§54適用聽證程序共通規範，確保聽證程序本身之正當性與周延性，不因法規命令聽證非強制舉行，即降低對聽證程序本身應恪遵之規範要求。\n\n結語：消防主管機關依§155基於職權決定舉行聽證，於法有據，機關舉行聽證時仍應依§156公告相關事項並適用聽證程序共通規範，確保程序正當周延。"},
  {a:"§157Ⅰ、Ⅲ", q:"某法規命令依法應經上級機關核定，訂定機關於報請上級機關核定後，始將該法規命令刊登於政府公報公告發布，於核定前並未對外發布。", problem:"問：訂定機關於上級機關核定後始刊登公報發布，是否合乎程序？", body:"依§157Ⅰ，法規命令依法應經上級機關核定者，應於核定後始得發布；依§157Ⅲ，法規命令之發布，應刊登政府公報或新聞紙。其要件可拆解為：若法規命令依法須經上級機關核定，則發布之前提要件為須先取得該上級機關之核定，未經核定者不得逕行發布、法規命令之發布方式應以刊登政府公報或新聞紙為之，此為法規命令對外生效及公示之法定要式要求。此一先核定後發布之程序設計，目的在確保具有較高位階效力或涉及重大政策之法規命令，於正式對外發布拘束人民前，先經上級機關把關審查其合法性及妥當性，避免下級訂定機關逾越權限或牴觸上位規範而逕行對外公布造成人民無所適從。本案某法規命令依法應經上級機關核定，訂定機關於報請上級機關核定後，始將該法規命令刊登於政府公報公告發布，於核定前並未對外發布，核與§157Ⅰ應於核定後始得發布及§157Ⅲ發布應刊登政府公報或新聞紙之要件完全相符，其踐行程序合法，並無先發布後核定或未經核定逕行發布之違法情事。此一程序如有疏漏，例如訂定機關於核定前即逕行公告發布，即屬違反§157Ⅰ之強制規定，該法規命令之發布程序即有瑕疵。\n\n結語：本案訂定機關依§157Ⅰ於上級機關核定後始依§157Ⅲ刊登政府公報發布，程序合法，於核定前未對外發布之作法，符合法定先核定後發布之程序要求。"},
  {a:"§159Ⅱ②、§160Ⅱ", q:"消防局為使所屬各分隊對違反消防法案件之罰鍰裁處金額一致，訂頒「違反消防法罰鍰裁量基準表」，供分隊承辦人統一認定事實及行使裁量權之用。該基準表僅由業務科長核章後即下達各分隊使用，未經局長簽署，亦未登載於政府公報。", problem:"問：本案裁量基準表僅由科長核章、未經局長簽署及公報登載，其發布程序是否合法？", body:"依§159Ⅱ②，行政規則包括為協助下級機關或屬官統一解釋法令、認定事實、及行使裁量權，而訂頒之解釋性規定及裁量基準，此類行政規則雖形式上仍屬機關內部規範，然因實質上支配公務員行使裁量權之方向，對人民產生間接對外效力，故立法者就其發布程序課予較一般行政規則更嚴格之要求。依§160Ⅱ，行政機關訂定前條第2項第2款之行政規則，應由其首長簽署，並登載於政府公報發布之。其要件可拆解為：須為解釋性規定或裁量基準類型之行政規則、發布程序須由機關首長本人簽署、並應登載於政府公報，此二項要件均屬強制規定，缺一即不合法定發布程序。本案消防局訂頒違反消防法罰鍰裁量基準表，供分隊承辦人統一認定事實及行使裁量權之用，核屬§159Ⅱ②所稱之裁量基準類型行政規則，依§160Ⅱ本應由消防局局長本人簽署並登載於政府公報，惟該基準表僅由業務科長核章後即下達各分隊使用，未經局長簽署，亦未登載於政府公報，核與§160Ⅱ之強制規定要件顯不相符，其發布程序即有重大瑕疵，應認尚未依法完成合法發布程序。\n\n結語：本案裁量基準表未經局長簽署亦未登載政府公報，違反§160Ⅱ強制規定，發布程序具重大瑕疵，消防局應補行局長簽署及公報登載程序，方得作為合法有效之裁量基準。"},
  {a:"§159Ⅰ", q:"消防局訂定一份「值班勤務輪替原則」，僅規範局內各科室排班作業方式及內部溝通流程，並非直接對外發生法規範效力，亦未對外公告。", problem:"問：該值班勤務輪替原則之法律性質為何？", body:"依§159Ⅰ，行政規則，係指上級機關對下級機關，或長官對屬官，依其權限或職權為規範機關內部秩序及運作，所為非直接對外發生法規範效力之一般、抽象之規定。其要件可拆解為：訂定主體須為上級機關對下級機關或長官對屬官、規範目的須在規範機關內部秩序及運作、性質上非直接對外發生法規範效力、內容須具一般性及抽象性。本案消防局訂定值班勤務輪替原則，僅規範局內各科室排班作業方式及內部溝通流程，此純屬機關內部之組織及事務分配、業務處理方式之一般性規定，核與§159Ⅰ、§159Ⅱ①關於機關內部之組織、事務之分配、業務處理方式、人事管理等一般性規定之要件完全相符，並非直接對外發生法規範效力，性質上應認屬行政規則，而非法規命令或行政處分。依§160Ⅰ，一般行政規則僅須下達下級機關或屬官即生效，毋須如§159Ⅱ②解釋性規定及裁量基準般須經首長簽署並登載政府公報，本案該輪替原則性質上核屬一般性內部規定而非裁量基準或解釋性規定，故消防局未對外公告，亦不違反§159、§160規定，僅須依§160Ⅰ有效下達所屬科室即可，依§161即對訂定機關及其下級機關屬官發生拘束力。\n\n結語：該值班勤務輪替原則性質上屬§159Ⅰ規定之一般性行政規則，僅須依§160Ⅰ下達所屬科室即生效，無須對外公告，亦不拘束一般人民。"},
  {a:"§161", q:"甲君對消防局依內部「安全檢查作業要點」所為之現場檢查方式表示不服，主張該要點並非法規命令，不能直接拘束身為一般民眾之甲君。消防局說明該要點僅經有效下達所屬各分隊使用。", problem:"問：甲君主張該作業要點不能拘束其本人，有無理由？", body:"依§161，有效下達之行政規則，具有拘束訂定機關、其下級機關及屬官之效力。此係明定行政規則之拘束力範圍，其要件可拆解為：行政規則須經有效下達、其拘束力範圍限於訂定機關本身、下級機關及所屬公務員，並不及於一般人民，此與§150法規命令對多數不特定人民就一般事項直接發生對外法規範效力之情形明顯不同，二者於拘束對象及效力範圍上存有本質差異，亦係區辨法規命令與行政規則之重要判準之一。本案消防局內部安全檢查作業要點，依消防局說明僅經有效下達所屬各分隊使用，核屬§159所稱之行政規則，依§161規定，其拘束力範圍僅及於消防局本身及所屬各分隊承辦人員，並不直接對外拘束一般民眾甲君；甲君主張該要點並非法規命令，不能直接拘束身為一般民眾之甲君云云，核與§161規定意旨相符，應屬有理由。惟應說明者，該作業要點雖不直接對外拘束甲君，然消防局所屬人員依該要點執行現場檢查，倘其實質執行內容及方式本身合乎相關法律或法規命令之授權及要求，仍非全然對甲君無任何法律上意義，僅係甲君不得逕以該內部要點本身之規定內容，作為對其直接發生拘束力之法源依據。\n\n結語：甲君主張該安全檢查作業要點性質上僅為行政規則、不能直接拘束一般民眾之其本人，依§161規定為有理由，惟消防局所屬人員依該要點執行檢查仍應符合相關法律及法規命令之實體要求。"},
  {a:"§92Ⅰ", q:"某工廠未依規定設置滅火器，消防局承辦人以正式函文通知該工廠負責人，限期於三十日內完成改善並接受複查，該函文並敘明屆期未改善將另予處分。", problem:"問：消防局所發限期改善函文之法律性質為何？", body:"依§92Ⅰ，行政處分係指行政機關就公法上具體事件所為之決定或其他公權力措施而對外直接發生法律效果之單方行政行為，其構成須同時具備五項要素：須為行政機關之行為、須為公法上之行為、須為單方行政行為、須針對具體事件、須對外直接發生法律效果，五者缺一即非屬行政處分，可能僅為觀念通知或準備行為。本案消防局承辦人以正式函文通知該工廠負責人，限期於三十日內完成改善並接受複查，其性質應逐項檢驗：函文係由消防局本於消防法令所為、以單方公權力措施命工廠負責人於三十日內完成改善之特定作為義務、針對該特定工廠未設滅火器此一具體違規事件、且對該工廠負責人課予限期改善之法律上作為義務並使其負有配合複查之義務，核與§92Ⅰ五要素悉數相符，應認該函文本身即屬課予義務之行政處分，而非僅係處分作成前之準備行為或觀念通知。至於函文末段所敘明屆期未改善將另予處分，此則屬對後續可能另行作成裁罰處分之預告，與本次限期改善命令本身之行政處分性質並不衝突，二者性質應分別評價。又消防局於作成本件課予義務之行政處分前，依§102、§103規定，原則上仍應給予工廠負責人陳述意見之機會，除非合於§103所列各款例外事由，否則縱處分內容之公益目的正當，仍不得規避正當程序之踐行，此屬本件處分作成程序上另應審查之重點。\n\n結語：消防局所發限期改善函文已具行政處分五要素，性質上屬課予義務之行政處分，工廠負責人如不服，得於法定期間內提起訴願及行政訴訟請求救濟，非俟後續裁罰處分作成後始得爭執。"},
  {a:"§93Ⅱ⑤", q:"消防局核准某民眾申請設立公眾使用場所之消防安全查驗合格證明，並於核准文件中明訂機關得依日後安全檢查結果，另行追加或變更本處分之附款負擔；半年後因法規修正，消防局據此通知業者須加裝新式警報設備，作為原核准處分之追加負擔。", problem:"問：消防局依原核准文件所載追加負擔約款，事後追加負擔之作法是否合法？", body:"依§93Ⅱ，前條所稱之附款包括五種類型：期限、條件、負擔、保留行政處分之廢止權、保留負擔之事後附加或變更，其中第五款保留負擔之事後附加或變更，係指機關於作成原處分時，即於處分內容中預先聲明保留日後得再追加或變更負擔之權限，屬於附款之一種特殊類型，其功能在使機關得因應日後情事變化，毋須另行撤銷或廢止原處分，逕於保留之範圍內追加或變更負擔內容，兼顧原處分之存續與後續彈性調整之需要。依§93Ⅰ，機關作成行政處分有裁量權時，得為附款，本案消防局核准設立公眾使用場所消防安全查驗合格證明，性質上屬機關有裁量權之授益處分，得依§93Ⅰ附加各類附款；消防局於核准文件中明訂機關得依日後安全檢查結果，另行追加或變更本處分之附款負擔，核屬§93Ⅱ⑤保留負擔之事後附加或變更之附款類型，合於§93規定。半年後因法規修正，消防局據此原保留條款通知業者須加裝新式警報設備，作為原核准處分之追加負擔，核與該保留條款之預定內容相符，於法有據，惟依§94，該追加負擔仍不得違背原處分之目的，並應與該處分之目的具有正當合理之關聯，本案加裝警報設備核與原查驗合格證明所欲確保之消防安全目的具有密切關聯，應認合於§94之限制。\n\n結語：消防局依§93Ⅱ⑤原核准處分中保留之負擔追加條款，因法規修正追加加裝警報設備之負擔，於法有據，惟該追加負擔仍須符合§94不當聯結禁止之限制。"},
  {a:"§94", q:"消防局核准某KTV業者變更營業場所用途登記，卻於核准函中要求業者須先捐贈一批消防器材予地方消防分隊，方予核准，該項要求與本件變更登記之實質內容並無關聯。", problem:"問：消防局要求業者捐贈消防器材作為核准變更登記之附款，是否合法？", body:"依§94，前條之附款，不得違背行政處分之目的，並應與該處分之目的具有正當合理之關聯。此係規範行政處分附款界限之條文，性質上為不當聯結禁止原則於附款制度之具體化，其要件可拆解為：附款不得違背原處分本身之目的、附款內容應與該處分之目的具有正當合理之關聯，二者若有一不符，該附款即屬違法。本案消防局核准某KTV業者變更營業場所用途登記，該處分之目的在於審查並確認該場所變更用途後是否仍符合消防安全等相關法令要求；然消防局於核准函中要求業者須先捐贈一批消防器材予地方消防分隊，方予核准，此一捐贈器材之要求與變更營業場所用途登記本身之實質審查內容並無關聯，該項附款要求核與§94應與該處分之目的具有正當合理之關聯之要件顯不相符，構成違法之附款，屬藉核准處分之機會，要求業者為與處分目的無關之給付，已違反不當聯結禁止原則。業者如因此項違法附款受有不利益，得就該附款部分單獨或一併對原處分提起爭訟，主張撤銷該違法附款，機關就變更登記申請本身如已符合法定要件，仍應予以核准，不得以業者拒絕捐贈為由拒絕核准變更登記。\n\n結語：消防局要求捐贈消防器材與變更登記處分目的欠缺正當合理關聯，違反§94不當聯結禁止原則，該附款應屬違法，業者得請求撤銷該附款並逕予核准變更登記。"},
  {a:"§95Ⅰ", q:"消防稽查人員於夜市稽查現場，以言詞當場命令某攤商立即撤除違規增設之瓦斯炊具，該命令未以任何書面作成，相關法規就此類稽查命令並無要式規定。", problem:"問：消防稽查人員以言詞當場命令撤除瓦斯炊具，是否合法有效？", body:"依§95Ⅰ，行政處分除法規另有要式之規定者外，得以書面、言詞或其他方式為之。此係明定行政處分方式之基本原則，其要件可拆解為：行政處分之作成方式原則上不限於書面，亦得以言詞或其他方式為之、例外於法規另有要式規定者，從其規定，本案並無此類法規特別要求之情形。本案消防稽查人員於夜市稽查現場，以言詞當場命令某攤商立即撤除違規增設之瓦斯炊具，該命令具有命攤商為一定作為之單方公權力性質，對外直接發生法律效果，核屬§92Ⅰ行政處分之範疇，其作成方式係以言詞為之，相關法規就此類稽查命令並無要式規定，核與§95Ⅰ除法規另有要式規定者外得以言詞為之之要件相符，該言詞命令應認合法有效，並非須以書面作成方為有效之行政處分。惟依§95Ⅱ，以書面以外方式所為之行政處分，其相對人或利害關係人有正當理由要求作成書面時，處分機關不得拒絕，攤商如有正當理由，得要求消防稽查人員或消防局提供書面文件，機關不得拒絕，此為對言詞處分相對人之補充保障機制，兼顧行政效率與人民舉證及後續救濟之需要。\n\n結語：消防稽查人員以言詞當場命令撤除瓦斯炊具，依§95Ⅰ於法有效，惟攤商如有正當理由要求作成書面，依§95Ⅱ機關不得拒絕提供書面文件。"},
  {a:"§96Ⅰ②", q:"消防局核發之裁處書上僅記載「經查違反消防法相關規定，處罰鍰新臺幣六萬元」，並未敘明具體違規事實經過，亦未載明所適用之法令條項。", problem:"問：本件裁處書僅載罰鍰金額而未記載違規事實及法令依據，是否合法？", body:"依§96Ⅰ②，行政處分以書面為之者，應記載主旨、事實、理由及其法令依據，此為書面行政處分應記載事項六款中之核心事項，其要件可拆解為：須記載處分之主旨、事實、理由及法令依據，四者均應完整記載，缺一即與本款規定不符，其目的在使處分相對人得以知悉機關作成處分之具體事實基礎及法律依據，以判斷是否服從、如何準備救濟。本案消防局核發之裁處書上僅記載「經查違反消防法相關規定，處罰鍰新臺幣六萬元」，並未敘明具體違規事實經過，亦未載明所適用之法令條項，顯然僅記載處分主旨，完全欠缺事實、理由及法令依據之記載，核與§96Ⅰ②規定要件顯不相符，該裁處書之記載即有重大瑕疵。此瑕疵性質上非僅屬輕微技術疏漏，因欠缺事實及法令依據之記載，將使受處分人完全無從知悉其究竟違反何項具體規定、有何具體違規事實，嚴重影響其判斷是否服從及如何準備救濟之權益，亦與§43機關應將決定及理由告知當事人之要求不符。此瑕疵得否依§114第2款必要記明之理由已於事後記明補正，仍須視補正時點及是否確實已完整補正事實與法令依據而定，尚非當然無效，惟原處分之記載瑕疵應予指摘。\n\n結語：本件裁處書漏未記載違規事實及法令依據，違反§96Ⅰ②規定，該處分之記載具有重大瑕疵，受處分人得於救濟程序中主張此項瑕疵，機關並應儘速依§114補正。"},
  {a:"§97③", q:"消防局對轄內數百家營業場所同步辦理年度消防安全檢查，就全數合格場所以電腦系統自動列印同一格式之合格通知書，並未逐一敘明各場所檢查合格之具體理由。", problem:"問：消防局以電腦自動列印同一格式合格通知書未逐一敘明理由，是否合法？", body:"依§97③，書面之行政處分有下列各款情形之一者，得不記明理由：大量作成之同種類行政處分或以自動機器作成之行政處分依其狀況無須說明理由者。此為§96Ⅰ②記明理由義務之例外規定，其要件可拆解為：須為大量作成之同種類行政處分或以自動機器作成之行政處分、依其狀況無須說明理由，此一例外之立法考量在於，此類大量、同種類、格式化之處分，若逐一要求敘明具體理由，將徒增行政負擔且對相對人助益有限。本案消防局對轄內數百家營業場所同步辦理年度消防安全檢查，就全數合格場所以電腦系統自動列印同一格式之合格通知書，此一情形核屬大量作成之同種類行政處分並以自動機器作成，依其狀況（合格通知性質上屬授益性質、對受通知場所並無不利益，且係大量標準化作業），客觀上應認無須逐一說明具體理由，核與§97③規定要件相符，消防局未逐一敘明各場所檢查合格之具體理由，於法有據，並非違法。惟倘其中部分場所嗣後對合格與否之認定產生爭執，機關仍應本於§43規定，依調查事實及證據之結果提出具體判斷依據以資佐證，不得僅以本條為由拒絕說明。\n\n結語：消防局就大量合格場所以電腦自動列印同一格式通知書未逐一敘明理由，依§97③於法有據，屬合法之簡化程序，惟嗣後如有爭執仍應提出具體判斷依據。"},
  {a:"§99", q:"甲君收受某分局之裁處書，因裁處書教示記載錯誤，誤將不服聲明書逕行提出於毫無管轄權限之鄉公所，鄉公所收受後於七日內將全案移送有管轄權之消防局，並通知甲君。", problem:"問：甲君誤向無管轄權之鄉公所聲明不服，是否仍生合法救濟之效力？", body:"依§99Ⅰ，對於行政處分聲明不服，因處分機關未為告知或告知錯誤致向無管轄權之機關為之者，該機關應於十日內移送有管轄權之機關，並通知當事人；依§99Ⅱ，前項情形，視為自始向有管轄權之機關聲明不服。其要件可拆解為：須因處分機關未告知或告知錯誤致向無管轄權機關聲明不服、該無管轄權機關應於十日內移送有管轄權機關並通知當事人、法律效果上視為自始已向有管轄權機關合法聲明不服，不因誤向錯誤機關而生逾期或不合法之後果。本案甲君收受某分局之裁處書，因裁處書教示記載錯誤，致其誤將不服聲明書逕行提出於毫無管轄權限之鄉公所，此一錯誤之發生可歸責於處分機關之教示錯誤，而非甲君自身之疏失，核與§99Ⅰ因處分機關未為告知或告知錯誤之前提要件相符；鄉公所收受後於七日內將全案移送有管轄權之消防局，並通知甲君，其移送時點亦在§99Ⅰ所定十日期限內，程序合法。依§99Ⅱ，本案應視為甲君自始即已向有管轄權之消防局合法聲明不服，其提出時點應以原向鄉公所提出之時點為準，而非以消防局實際收受移送案件之時點認定是否逾期，甲君之救濟權益不因此一教示錯誤及誤送而受影響。此與§17一般管轄移送規定係不同條文，作答時應直接援引§99完整文字，避免混淆。\n\n結語：甲君因裁處書教示錯誤而誤向鄉公所聲明不服，鄉公所已於十日內合法移送，依§99Ⅱ視為甲君自始已向有管轄權機關合法聲明不服，其救濟權益不受影響。"},
  {a:"§101Ⅱ", q:"消防局發現某裁處書上受處分人身分證統一號碼誤繕一碼，屬誤寫之顯然錯誤，惟原處分書正本已送達當事人，無法於書面上加註更正，機關遂另行製作一份更正書，以書面通知受處分人及已知之利害關係人。", problem:"問：消防局另行製作更正書通知受處分人之作法，是否合乎更正程序之規定？", body:"依§101Ⅰ，行政處分如有誤寫、誤算或其他類此之顯然錯誤者，處分機關得隨時或依申請更正之；依§101Ⅱ，前項更正，附記於原處分書及其正本，如不能附記者，應另行製作更正書，以書面通知相對人及已知之利害關係人。其要件可拆解為：處分內容有誤寫誤算等顯然錯誤、更正方式原則上附記於原處分書及其正本、例外於不能附記之情形，應另行製作更正書，以書面通知相對人及已知之利害關係人，此為更正制度之補充機制，確保縱使原本已送達而無法直接加註，受處分人仍能以另行製作之更正書獲悉更正內容。本案消防局發現某裁處書上受處分人身分證統一號碼誤繕一碼，此屬單純之誤寫，核屬§101Ⅰ誤寫之顯然錯誤事由，機關得隨時依職權更正；惟因原處分書正本已送達當事人，客觀上已無法於該正本書面上直接加註更正，核與§101Ⅱ不能附記之情形相符，機關遂依§101Ⅱ後段，另行製作一份更正書，以書面通知受處分人及已知之利害關係人，此一處理方式核與§101Ⅱ規定要件完全相符，於法有據，該更正書一經送達，即發生更正原處分內容之效力，毋須循撤銷或廢止程序另為處理，亦不影響原處分之同一性及其他部分之效力。\n\n結語：消防局因原處分正本已送達而無法附記更正，依§101Ⅱ後段另行製作更正書並書面通知受處分人及利害關係人，程序合法，該更正書送達後即發生更正效力。"},
  {a:"§103①", q:"消防局對轄內一千二百戶住宅同步核發限期改善老舊電線之同種類處分，基於作業量能考量，未逐戶個別給予陳述意見之機會即逕行核發處分書。", problem:"問：消防局未逐戶給予陳述意見機會即逕行核發處分書，是否合法？", body:"依§102，行政機關作成限制或剝奪人民自由或權利之行政處分前，除已依第39條規定通知處分相對人陳述意見或決定舉行聽證者外，應給予該處分相對人陳述意見之機會，此為原則性規定；惟依§103①，有下列各款情形之一者，行政機關得不給予陳述意見之機會，其中第一款為大量作成同種類之處分。此係§102陳述意見原則之法定例外事由之一，其要件可拆解為：須為大量作成之處分、且該等處分須為同種類，符合此二項要件者，機關即得例外不給予個別陳述意見之機會，其立法考量在於，若要求機關對每一相對人均個別踐行陳述意見程序，於大量同種類處分之情形將造成行政效能上難以負荷之沉重負擔，且處分事實通常已臻明確，逐一陳述意見之實益相對有限。本案消防局對轄內一千二百戶住宅同步核發限期改善老舊電線之同種類處分，其處分對象人數眾多且處分內容、事由高度一致，核屬大量作成同種類之處分之典型情形，核與§103①要件相符，消防局基於作業量能考量，未逐戶個別給予陳述意見之機會即逕行核發處分書，依§103①規定，於法有據，並非違反§102正當程序保障之要求。\n\n結語：消防局對一千二百戶同步核發同種類限期改善處分，核屬§103①大量作成同種類處分之例外事由，未逐戶給予陳述意見機會，於法有據，並不構成程序違法。"},
