<head>

<title>法條速判練習｜行政程序法・貪污治罪條例與刑法</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#f5f4f0; --card:#ffffff; --ink:#2b2a28; --sub:#6b6a66;
    --accent:#6a4a8a; --accent2:#8a3b3b; --line:#e5e2da;
    --good:#2f7d4f; --good-bg:#eaf5ee;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:880px;margin:0 auto;padding:40px 20px 100px;}
  h1{font-size:1.5rem;margin:0 0 6px;}
  .subtitle{color:var(--sub);font-size:.9rem;margin-bottom:20px;line-height:1.7;}
  .note{background:#fbf9f5;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 16px;font-size:.85rem;color:#55524c;line-height:1.8;margin-bottom:24px;}

  .tabs{display:flex;gap:8px;margin-bottom:18px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:10;border-bottom:1px solid var(--line);}
  .tab-btn{flex:1;padding:12px 10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:.92rem;font-weight:600;cursor:pointer;color:var(--sub);transition:.15s;}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tab-btn:nth-child(2).active{background:var(--accent2);border-color:var(--accent2);}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;font-size:.82rem;color:var(--sub);}
  .toolbar button{font-size:.8rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);}
  .toolbar button:hover{background:var(--line);}
  .progress{margin-left:auto;font-size:.8rem;color:var(--sub);}

  .tab-pane{display:none;}
  .tab-pane.active{display:block;}

  .q-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s;}
  .q-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .q-head{display:flex;align-items:flex-start;gap:10px;}
  .q-num{flex-shrink:0;width:26px;height:26px;border-radius:7px;background:var(--line);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;}
  .q-text{flex:1;font-size:.93rem;line-height:1.9;}
  .q-text b{color:var(--ink);}
  .q-answer{display:none;margin-top:12px;padding:10px 14px;background:var(--good-bg);border-radius:8px;font-size:.9rem;color:var(--good);font-weight:700;letter-spacing:.02em;}
  .q-card.revealed .q-answer{display:block;}
  .q-card.revealed{border-color:var(--good);}
  .hint{font-size:.75rem;color:#a09d95;margin-top:2px;}
  .q-card.revealed .hint{display:none;}

  footer{margin-top:40px;text-align:center;color:#b3b0a8;font-size:.76rem;}
</style>
</head>

<div class="wrap">
  <h1>法條速判練習｜看情境、判法條</h1>
  <div class="subtitle">行政程序法50題＋貪污治罪條例與刑法50題，共100題。每次開啟頁面題序皆隨機打亂，其中約20%為複合式情境（單題需列出2條以上法條）。點卡片展開答案，僅列條號、不附解釋。</div>
  <div class="note">出題方式：先選定課本／法條對照已收錄之條文，反推設計情境，並參考歷屆考題之情境敘述風格撰寫。此頁為獨立練習頁面，未與其餘筆記頁面互相連結。</div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="admin">行政程序法（50題）</button>
    <button class="tab-btn" data-tab="corrupt">貪污治罪條例與刑法（50題）</button>

    <button id="revealAll">全部顯示</button>
    <button id="hideAll">全部隱藏</button>
    <button id="shuffleBtn">重新隨機排序</button>
    <span class="progress" id="progressText"></span>
  </div>

  <div class="tab-pane active" id="pane-admin"></div>
  <div class="tab-pane" id="pane-corrupt"></div>

  <footer>柯醒翰製作・考前衝刺練習用</footer>
</div>

  {a:"§111①、§117", q:"消防局同一年度對甲、乙兩工廠分別開立裁處書：對甲工廠之裁處書完全未記載作成機關名稱；對乙工廠之裁處書則因承辦人員援引法條錯誤，屬得撤銷之違法瑕疵，惟乙工廠並無信賴不值得保護之情事。"},

  {a:"§123③、§127Ⅰ", q:"消防局核准甲君之危險物品儲放場所設立許可，並附加「三年內不得變更為其他用途，否則應繳回全額補助款」之負擔。甲君其後一年即將場所變更為其他營業用途，消防局依法廢止原許可，並要求甲君返還已受領之補助款項。"},
  {a:"§154Ⅰ", q:"消防署擬訂新版《各類場所消防安全設備設置標準》，承辦人員認為僅屬技術性規範調整，遂逕行簽請長官核定後即予發布施行，未先於政府公報或新聞紙公告草案內容，亦未開放外界於一定期間內陳述意見，且非屬情況急迫顯然無法事先公告周知之情形。"},
  {a:"§111①③", q:"消防局核發之裁處書上完全未記載作成處分之機關名稱及首長署名，且其主旨要求受處分人「應於一日內將廠內一百噸危險化學物質全數銷毀完畢」，客觀上顯然不能實現。"},
  {a:"§10", q:"某法規就特定違規行為授權機關得裁處新臺幣1萬元至10萬元罰鍰，消防局承辦人員因與當事人先前有陳情糾紛、素有嫌隙，未依個案情節輕重及一般裁量基準衡酌，逕行裁處15萬元，已逾法規所定裁量上限。"},
  {a:"§74Ⅰ", q:"甲君因工作關係出國一個月，郵務人員多次前往其住所均未獲會晤本人，亦查無同居人、受僱人可代為收領，遂將裁處書寄存於當地警察機關，並將送達通知書一份黏貼於甲君住居所門首，另一份置於信箱。"},
  {a:"§15、§19Ⅳ②", q:"消防局將轄內某類小型場所之消防安全檢查裁罰權限，依法規委任所屬分隊辦理，並依規定公告委任事項及法規依據；同一時期，消防局另就一起跨機關之化學品鑑定案件，行文請求環保局提供人力協助，環保局評估後認為抽調人力將嚴重影響其本職稽查工作，遂予拒絕。"},
  {a:"§101Ⅰ", q:"消防局對阿明工廠開立裁處書，內容記載裁罰金額為新臺幣3萬元，惟因承辦人員繕打疏失，將阿明身分證統一編號末碼「8」誤植為「3」。阿明發現後，主張此為足以影響其身分同一性之重大瑕疵，該處分應屬無效。"},
  {a:"§48Ⅳ", q:"消防局對甲君之場所作成「文到次日起20日內完成改善」之限期改善通知，甲君於通知送達後開始計算改善期限，發現第20日恰逢星期日，且次日星期一又適逢國定假日。"},

  {a:"§33Ⅳ、§36", q:"阿強向消防局申請承辦員迴避，惟該承辦員在消防局就迴避申請作成准駁決定前，未停止行政程序，仍依阿強片面陳述作成調查結論，並未依職權另行蒐集現場證據或兼顧阿強有利之情形，逕自完成調查報告。"},
  {a:"§8", q:"甲君擬投資設立三溫暖場所，事前檢附完整設計圖說向消防局書面諮詢，消防局承辦人明確以正式公文回覆「設計圖說完全符合現行消防法規，可安心施工」。甲君信賴該回覆，隨即斥資裝潢並購置相關設備。完工申請查驗時，消防局卻改稱「先前審查有誤，設計實屬不合規定」，拒絕發給查驗合格證明，亦未提出任何補救或過渡措施。"},
  {a:"§128Ⅱ", q:"阿明兩年前申請火災受災戶特別救助金，因無法提出居住事實證明遭消防局駁回，阿明當時並未提起訴願，該駁回處分已確定。半年前阿明整理舊家廢墟時意外尋獲關鍵證明文件，遂持該文件申請消防局重新審查，惟距原處分之法定救濟期間經過已逾5年6個月。"},

  {a:"§95Ⅱ", q:"消防人員於某場所稽查時，發現有明火表演嚴重違反消防法規，情況危急，遂當場以言詞命令業者立即停止表演並清場。業者當場質疑「口頭講講不算數」，並要求消防人員立即開立書面文件，消防人員因未攜帶公文用紙，遂以「稍後補發」為由暫時拒絕。"},

  {a:"§7②", q:"轄內某社區公園日前舉辦大型園遊會，因主辦單位申請之瓦斯鋼瓶使用未依規定辦理，消防局稽查人員到場後，未區分違規與未違規之攤位，逕行下令封鎖整座公園、強制驅離現場全部約200組合法擺攤之攤商及上千名遊客，園遊會被迫全面終止，未考慮僅要求違規攤位撤除鋼瓶或劃設安全距離等侵害較小之替代手段。"},

function render(paneId, data){
  const pane = document.getElementById(paneId);
  pane.innerHTML = data.map((item, i) => `
    <div class="q-card" data-idx="${i}">
      <div class="q-head">
        <div class="q-num">${i+1}</div>
        <div style="flex:1;">
          <div class="q-text">${item.q}</div>
          <div class="hint">點擊查看適用法條</div>
          <div class="q-answer">${item.a}</div>
        </div>
      </div>
    </div>
  `).join("");
  pane.querySelectorAll(".q-card").forEach(card => {
    card.addEventListener("click", () => {
      card.classList.toggle("revealed");
      updateProgress();
    });
  });
}

function shuffleArr(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

shuffleArr(ADMIN);
shuffleArr(CORRUPT);
render("pane-admin", ADMIN);
render("pane-corrupt", CORRUPT);

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("pane-" + btn.dataset.tab).classList.add("active");
    updateProgress();
  });
});

function activePane(){
  return document.querySelector(".tab-pane.active");
}
function updateProgress(){
  const pane = activePane();
  const total = pane.querySelectorAll(".q-card").length;
  const done = pane.querySelectorAll(".q-card.revealed").length;
  document.getElementById("progressText").textContent = `已顯示 ${done} / ${total} 題`;
}

document.getElementById("revealAll").addEventListener("click", () => {
  activePane().querySelectorAll(".q-card").forEach(c => c.classList.add("revealed"));
  updateProgress();
});
document.getElementById("hideAll").addEventListener("click", () => {
  activePane().querySelectorAll(".q-card").forEach(c => c.classList.remove("revealed"));
  updateProgress();
});
document.getElementById("shuffleBtn").addEventListener("click", () => {
  const isAdmin = document.getElementById("pane-admin").classList.contains("active");
  const arr = isAdmin ? ADMIN : CORRUPT;
  shuffleArr(arr);
  render(isAdmin ? "pane-admin" : "pane-corrupt", arr);
  updateProgress();
});

updateProgress();
</script>
